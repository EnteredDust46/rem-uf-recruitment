g an internship, and ultimately a full time consulting career where I can apply these skills everyday.","position":"Junior Consulting Strategist","skills":"Business Strategy","accommodations":"N/A","other":"N/A","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a119_b506b885","timestamp":"9/4/2026 16:33:54","name":"Alex Niehaus","email":"alexniehaus@ufl.edu","phone":"+33744773424","gender":"Male","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/alexniehausalves","resume":"https://drive.google.com/open?id=1wmU-MKEv7ALEOnrQBk6iZQu8_owuT3yX","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"","gpa":"4","whyRem":"I want to join Rem because I think it would give me a chance to learn outside of the classroom and actually apply what I learn. As a finance student, I enjoy mathematics and business, and I want to keep developing those interests through hands-on experiences. I also like being around people who approach problems differently than I do, since I can learn a lot from how other people think.\n\nFurthermore, having lived in Barcelona, France, Brazil, and now the United States, I've had to adapt to a lot of different environments. That has taught me to learn quickly, be open to different perspectives, and figure things out when I am in a new situation. I think I could bring that perspective to Rem while also learning from the people around me.\n\nI want to become better at taking what I know and applying it to real problems, while gaining experience working with different people and ideas. I think Rem would be the ideal place for me to do that.","coreValue":"Resilience","valueEssay":"Resilience stands out to me because adapting to change has been a big part of my life. When I moved to France, I did not know a single word of French, so I had to learn a completely new language while adjusting to a new environment. When I moved to Brazil, I had to do it all over again, this time learning Portuguese and adjusting to a different culture and way of life. Now, living in the United States, I am facing another new environment while adapting to college life and building my future here.\n\nThese experiences taught me that being in an unfamiliar situation does not mean I cannot succeed. I have learned to keep pushing forward, learn what I need to, and adjust when things do not go as planned. I try to carry that same mindset into school and work. Whether I am working on a consulting project, starting a new job, or putting myself in a completely new environment, I know there will be challenges, but I also know I can figure things out along the way.\n\nTo me, resilience means not letting a challenging situation stop me, but finding a way to move forward and grow from it.","careerInterests":"Consulting, Investment Banking / Finance","howRemHelps":"Joining Rem on Campus would help me explore and develop my interests in both consulting and finance through experiences that go beyond the classroom. During my consulting project in Japan, I especially enjoyed the financial side of developing our strategy. I helped build financial models across different scenarios, researched commercial rental costs, incorporated taxes, and calculated ROI to understand the financial viability of our recommendation. That experience showed me how much I like using financial analysis to support larger business decisions.\n\nThrough Rem, I hope to continue developing both sides of that interest: the analytical and financial skills needed to understand a business, as well as the ability to use that analysis to solve larger strategic problems. I also hope to learn from people pursuing different career paths and gain experiences that will help me better understand where I want to take these interests after college.","position":"Junior Consulting Strategist, Consulting Strategist","skills":"Statistics and modelling, Data analysis, Fluent in four languages: Portuguese, French, English, and Spanish","accommodations":"No","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a120_d5d4e584","timestamp":"9/4/2026 16:44:34","name":"Helen Chen","email":"helenchen@ufl.edu","phone":"9292062342","gender":"Female","race":"Asian or Asian American","linkedin":"https://www.linkedin.com/in/helencchenn?utm_source=share_via&utm_content=profile&utm_medium=member_ios","resume":"https://drive.google.com/open?id=10WwYBhSWqTEKnlDnlPUZ3eYRD90wkQhL","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Accounting","minor":"","gpa":"3.77","whyRem":"I want to be a member of REM because I want to be a part of something that is bigger than myself. After speaking with members during coffee chats, I was inspired by the emphasis on service and giving back to the community. It was touching to see the passion behind the initiative of lifting everyone in the community up together. I can see the community that REM has built, and it inspires me to do more. I know that I also have the skills and the passion to contribute to the community that REM has built.","coreValue":"Empathy","valueEssay":"Growing up, my parents owned a small business, and our income relied on the success of the business. There were many ups and downs, and those ups and downs are all I can think about when the topics of childhood are brought up. My background has allowed me to experience firsthand how the prosperity of a business can impact individuals and families. This connects to both my personal and professional journey, because now that I am older and more equipped, I'd like to bring the life that I have lived to better provide empathy for the companies that I would work for. I think that having lived that life, I have more of a passion and connection to genuinely want these businesses to thrive.","careerInterests":"Consulting, Entrepreneurship / Startups, Public Policy / Government, Law","howRemHelps":"My ultimate goal is to become a corporate lawyer which is why I want to be more personable to the clients that I will work for, and I want to understand their perspectives better from the side that is helping them. I believe that working with REM will allow me to expose myself to these opportunities. After speaking to people in REM, I realize that these are the people that I trust to mentor me, and also to show me different career paths that I would have never considered before. I know that with REM’s network, I can better utilize my technical and soft skills to succeed in the professional workplace.","position":"Junior Consulting Strategist","skills":"Business Strategy, Social media management, Microsoft Office Suite, Ads (Facebook/Instagram)","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/1/2026 19:22:29","spokeTo":"Sachin Mario, Hannah Lockwood, Max Kaplan, Terrence Smith"}],"infoSession":{"timestamp":"9/3/2026 22:01:18","session":"09/03","appliedBefore":"No"},"meetMembers":null}},{"id":"a121_890dd34a","timestamp":"9/4/2026 16:45:18","name":"Mary Ann Marcinek","email":"mary.ann727@outlook.com","phone":"727460321","gender":"Female","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/maryannmarcinek/","resume":"https://drive.google.com/open?id=1vdqx28bykiAJE4euJF7uWltWFmP4BDI_","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Business Administration, Political Science / Public Policy","minor":"","gpa":"4","whyRem":"Junior year of high school, I remember my boss calling me in the middle of class and asking if I could come to work immediately after school. Hurricane Milton was approaching, and we needed to prepare the boutique. That moment made me realize how much goes into keeping a small business running, especially when something unexpected happens.\n\nWorking at the boutique has become one of the most meaningful parts of my high school experience.Because it was such a small circle involved, I had the opportunity to gain real business insight, rather than just being another employee. I worked directly with customers, helped drive sales, managed our social media presence and grew an audience of more than 5,000 followers. I learned how to understand what customers respond to, how to present a product in a way that catches their attention, and how small decisions can make a difference for a business. I became genuinely interested in what happens behind the scenes and started thinking less about just selling a product and more about why people buy it and what makes them come back. \n\nThat is why I believe that Rem on Campus is the best fit for me. I have experienced what it is like to work for a small business, but I have never had the opportunity to step into the role of a consultant and help a business think through its challenges. I want to learn how to take the instincts I developed working at the boutique and turn them into a more analytical approach to solving business problems. The opportunity to work directly with a local business and know that the recommendations I make could actually affect someone’s livelihood is especially meaningful to me.\n\nI also want to join Rem because I know I would bring a perspective that comes from actually working on the other side of a business. I understand how important it is for recommendations to be realistic and useful, not just sound good on paper. I would be excited to learn from my team, contribute what I already know, and challenge myself to become a stronger problem solver and business professional. Rem feels like the next step between the experience I have already gained throughout my highschool experience and the kind of work I hope to do in the future.","coreValue":"Community","valueEssay":"Community stands out to me because I know what it feels like to need one. The high school I attended was not the school my parents originally wanted me to go to, and when I first got there, I barely knew anyone. I remember feeling nervous about where I would fit in and whether I would ever really feel like I belonged. Some of the first people who changed that were the Student Ambassadors. They showed me around, answered all of my questions, invited me to get involved, and made an unfamiliar school feel a lot more comfortable. To them, those things probably felt small. To me, they were not. They made a real difference in how I experienced high school.\n\nThat experience is a big reason why I became so involved in Student Ambassadors myself. I wanted to give other students the same feeling I had been given, and eventually, I became President of the organization. That was one of the most meaningful full-circle moments of my high school experience. I went from being the new student who needed someone to make her feel welcome to being the person responsible for making sure other students felt that way. I learned that community is not something you just find. It is something you create for other people.\n\nThat is what I hope to find at Rem. UF is a huge university, and I am excited by that, but I also know how important it will be for me to find a smaller group of people who know each other, support each other, and genuinely enjoy being around one another. What has stood out to me about Rem is that the community goes beyond just working together. Through the information sessions and coffee chats I have attended, I have gotten to see how members actually interact with each other. I remember talking with Max about how, yes, consulting is a huge part of Rem, but so is grabbing meals together, hanging out, and building friendships. That is the kind of community I want to be part of.\nI also love that Rem’s sense of community extends beyond its own members. The organization is focused on helping Gainesville businesses grow and succeed, which means the community you build within Rem is ultimately used to give back to the community around you. That feels very familiar to me because that is exactly what Student Ambassadors taught me.\n\nI want to be part of Rem because I want a community that challenges me, supports me, and gives me people I can genuinely grow alongside. I also want to be someone who contributes to that community, whether that means showing up for a teammate, helping a Gainesville business, or simply being the person others can count on. Student Ambassadors gave me a place where I found my people and grew into a leader, and I am excited about the possibility of finding that same sense of belonging at Rem while bringing my own train of thinking, and energy.","careerInterests":"Consulting","howRemHelps":"I want to pursue a career in consulting, and Rem stands out to me because it would allow me to begin developing those skills through real experience rather than just learning about them in a classroom. The opportunity to work directly with businesses is especially exciting to me. In a real client setting, our recommendations are not just part of a hypothetical case; they have the potential to influence actual decisions. Knowing that would push me to take ownership of my work, pay attention to the smallest details, and make sure the solutions I develop are both thoughtful and practical.\n\nI am also drawn to the variety of businesses Rem works with because I know that strong consultants cannot rely on the same approach for every client. Each business has different goals, challenges, and circumstances, and I want to learn how to adapt my thinking accordingly. Rem would give me the chance to strengthen my problem-solving and analytical skills while learning alongside students who are just as motivated to grow. I know that rem is the stepping stone I need to ensure I am setting myself up for a successful career.","position":"Junior Consulting Strategist","skills":"Social media management, Canva Skills","accommodations":"None, Thank you!","other":"I grew up hearing that effort beats ability every time, and it is something I have carried with me throughout my life. I know I will not always be the quickest person to understand something or have the answer first, but I know that when I commit myself to something, I will see it through. I take a lot of pride in my work ethic, and I am not afraid to put in the time to get something right. I would bring that same drive to Rem. I know I still have a lot to learn, but I am willing to work for it, take feedback, and keep pushing myself. If I am given the opportunity to be part of Rem, I will show up ready to work and give my best to every team and client I am a part of.","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/2/2026 16:34:57","spokeTo":"I just had the opportunity to speak to Max!"}],"infoSession":{"timestamp":"9/3/2026 23:59:05","session":"09/03","appliedBefore":"No"},"meetMembers":null}},{"id":"a122_b780952a","timestamp":"9/4/2026 16:47:24","name":"Johan Eldho","email":"johan.eldho@ufl.edu","phone":"754-302-6546","gender":"Male","race":"Asian or Asian American","linkedin":"https://www.linkedin.com/in/johan-eldho/","resume":"https://drive.google.com/open?id=1Z-l7ZbD81VWKd77oH4X1vcGT41YN2wrE","university":"University of Florida","gradYear":"2028","classYear":"Junior","major":"Business Administration","minor":"Other","gpa":"3.8","whyRem":"I want to be a member of REM on Campus because after having the opportunity to shadow the GBMs last year, I was able to truly see how great of an organization it is. What stood out to me most was not just the professional experience but the real impact REM has on people and communities. Seeing that impact made REM feel truly meaningful rather than just another student organization.\n\nREM genuinely helps small business owners who may not have strong knowledge in certain areas of their business. For example, last year the owner of Life in a Bottle did not even know how to use something as simple as Zoom. His client team didn’t just help him learn that tool, but also supported him across multiple aspects of his business. They took the time to teach, explain, and guide him rather than simply doing the work for him, which made the support far more valuable and long lasting.\n\nAfter visiting him at the farmers market, it was clear how much the help meant to him. You could see how happy and appreciative he was because of the knowledge and confidence he gained through REM’s support. That experience was extremely impactful to me and showed me how powerful REM’s mission truly is.\n\nIn fact, that impact inspired me to help start REM at USF with my roommate. Even after I transferred, I continued to support him throughout the process because I genuinely believed in the mission and wanted others to have access to an organization like REM. I also helped identify another candidate for a co president role so that they could build something meaningful and sustainable and have been staying involved even after transferring.\n\nSeeing the combination of real client impact, strong leadership, and a supportive community made it clear to me that REM is an organization I truly want to be part of and continue contributing to.","coreValue":"Community","valueEssay":"The value of community stands out to me because I have experienced it firsthand through REM. After meeting Sachin, I quickly saw how much he genuinely cares about helping others. There have been so many times where I was around him and he took time out of his day to help anyone who reaches out to him even if he hasn’t even met them before. He has played a huge role in my professional development journey by consistently offering guidance, advice, and support, and that has meant a lot to me. Having someone who is so willing to invest their time and energy into helping others grow made a lasting impression on me\n\nWhat makes this value even more meaningful is that it goes far beyond one person. Every member I have met in REM has been extremely welcoming, kind, and easy to talk to. From my first interactions and also talking with them during the coffee chats, it was clear that people genuinely enjoy helping one another and creating connections. That sense of openness makes REM feel less like a typical club and more like a true community where everyone wants to see each other succeed.\n\nI have also seen this value reflected through the many events REM hosts, both professional and social. These events create opportunities for members to build relationships while still making an impact. One experience that stood out to me was the dog walking event REM hosted with a client last semester where I also joined them. It showed that REM cares about building meaningful relationships with clients beyond just business. That event made the community aspect of REM feel very real, as members came together to support a client while also enjoying each other’s company.\n\nThis value strongly connects to my own goals for the future. I hope to one day give back to the community in the same way, just like the members who have completed their mission, achieved placement at the companies they worked toward, and continue to return to support others. Seeing people come full circle and still make time to help those who come after them is incredibly inspiring to me. That cycle of support is what makes the value of community so important to me and so closely tied to both my personal and professional journey.","careerInterests":"Consulting, Investment Banking / Finance, Wealth Management","howRemHelps":"Joining REM on Campus will help me reach my career goals because it matches the kind of work I want to do in the long run. I want to work in a field like consulting, where I can interact directly with clients to build strong relationships and communicate in a way that creates real value. Highly technical paths like investment banking just aren’t for me and during the coffee chats I also realized that other members like Ava had the same realization, when they discovered consulting they realized it's something they are passionate about. I am much more motivated by work that focuses on people and the chance to connect with individuals from different backgrounds, also just like in REM understanding a client’s needs and helping them solve real problems excites me most about my future career.\n\nREM allows me to start developing these skills early in a real and meaningful setting. By working directly with small business owners, I can gain experience communicating with clients who have different levels of experience and face various challenges. This is going to be something I deal with in the real world where some clients I have may be super thoughtful and easy while others maybe even give me a hard time and I will know how to deal with that. This hands on exposure helps me learn how to listen effectively, ask the right questions, and explain ideas in a clear and approachable way. These skills are essential for consulting and are also useful in any professional setting.\n\nAlso during the REM information session, I was inspired by the executive board sharing their own experiences within the organization. They talked about how working with clients challenged them and really helped them grow professionally by pushing them out of their comfort zones. Hearing how much they developed through REM showed me that this organization truly prepares its members for real world careers rather than just offering skills like other student organizations. \n\nThis hands on experience directly supports my long term goals. Being part of an organization where growth comes from experience, reflection, and practical application is exactly what I want. REM will help prepare me for a consulting career where trust, communication, and meaningful relationships are key. This makes it an ideal environment for my personal and professional development.","position":"Junior Consulting Strategist, Consulting Strategist","skills":"Business Strategy, Data analysis, Search Engine Optimization (SEO), Finance and accounting, HTML","accommodations":"","other":"Before I transferred to UF I founded REM on Campus at USF. I helped with client acquisition, met with Camryn and the national board, and interviewed to select the executive board.","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/2/2026 15:39:32","spokeTo":"Max and Annabella"}],"infoSession":{"timestamp":"9/3/2026 22:02:11","session":"09/03","appliedBefore":"Yes"},"meetMembers":null}},{"id":"a123_0fa78448","timestamp":"9/4/2026 16:48:58","name":"Karissa Grant","email":"karissagrant@ufl.edu / karissagrntt@gmail.com","phone":"8502185557","gender":"Female","race":"Black or African American","linkedin":"https://www.linkedin.com/in/karissa-a-grant/?lipi=urn%3Ali%3Apage%3Ad_flagship3_profile_view_base_contact_details%3BK6CBpuxsRa%2BLswxdlRBJbQ%3D%3D","resume":"https://drive.google.com/open?id=18ApphKiMtRtyav1TJ3wRbMP3skTfYM2b","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Engineering (various disciplines)","minor":"","gpa":"3.74","whyRem":"When asked to describe me, I might say loyal, resilient, hilarious, and cool, but if I were to be completely honest, a key trait of mine is my nosiness. Everyone who knows me is aware that hearing everyone's gossip and opinions feeds my soul. In a PR-correct way, I would say that I have an insatiable curiosity about everything around me. When I was younger, I wanted to know why Meghan Markle and Prince Harry moved to the US, but as I grew older, my questions have grown more complicated. Why do stock market crashes happen? Are people born evil? This curiosity has pushed me to learn constantly, broadening my skills across different areas. Now, as I want to learn about consulting, joining an organization that feeds my curiosity is very important to me. Rem on Campus demonstrates that I will be surrounded by people who will challenge me while giving me the freedom to learn, make mistakes, and try again. I wouldn’t need to have all the answers about consulting because I would be given the tools to succeed during my time at Rem. Talking with members like Hannah Lockwood and Eli Koon has given me confidence that Rem will challenge me to grow and that the community will lift me up during my learning curve. Already feeling a part of the community by bonding over traveling abroad and adidas Spezial shoes, I am confident that I am making the right choice to apply to Rem on Campus. Rem on Campus is more than just an organization here at UF; it is a home for minds like mine: curious, ambitious, and a little too nosy.","coreValue":"Empathy","valueEssay":"My passion in life is making people who feel invisible to everyone around them feel seen. Fulfilling this passion means using empathy to guide how I live. Being empathic isn’t about knowing exactly what to say but having the courage to try to understand someone else's feelings. Last semester, I was going through several life-changing events in my family. Feeling isolated and frozen became my new normal. My friends' constant support, even when they didn’t understand me, allowed me to slowly heal. While I might still be healing, the empathy I received during this time has given me the courage to continue living my life to the fullest. Empathy isn’t just a value to me; I’ve learned firsthand that being empathic can give people the strength to thrive even when they think they can’t. These experiences showed me how I should show up for the people in my life, both personal and professionally. Whether it's noticing unspoken cues when talking with my friends or asking the right questions to help my team, I let my curiosity drive my empathy so that even if I don’t understand, I can still try to help them. At Rem, I hope to bring my mindset to both our consulting and community by helping people feel heard and seen.","careerInterests":"Consulting, Marketing, Brand Strategy, Data Analytics / Business Intelligence, Non-Profit / Social Impact, Undecided / Exploring Options","howRemHelps":"I've always been a person with too many questions, but now I want to find the answers and have the knowledge to apply them to make an impact. Joining Rem on Campus won’t just prepare me for a specific career goal, but also give me exposure to the problems I want to solve and the skills to deliver meaningful solutions. I will develop skills to prepare me for professional environments, such as professional emailing and networking through Rem's internal professional events. Additionally, I will gain hands-on experience helping companies and tackling real-world problems. Even without being in Rem on Campus (yet), I have seen and heard about the impact Rem has. Learning how Rem helped a husband-and-wife food business by creating a more consistent social media presence and placing the brand where their potential customers would be, like at a football game. Additionally, reading about how Rem improved a non-profit by helping them expand their literacy program through potential partnerships with schools and revamp their sponsorship structure/tracking system. These impacts give me the confidence that I can learn practical techniques for improving marketing, using data analytics to improve a company, or having a social impact. The constant learning of new skills at Rem will allow me to adapt to successfully complete any project I’m given. This is also evident from speaking with Hannah Lockwood, who shared how she secured a job at McKinsey & Company as an ISE major, demonstrating that the skills gained at Rem can propel you to new heights in your career. This organization will challenge me with different problems and perspectives to help me with my goals. Rem on Campus will give me the tools to turn my curiosity into a means of discovering my path.","position":"Junior Consulting Strategist","skills":"User Experience (UX), Business Strategy, Data analysis, Social media management, Communications and copy-writing, Python","accommodations":"N/A","other":"During my freshman year at UF, I was going through especially difficult family matters, both medically and personally. Due to those developments, when they came, I was not able to continue my leadership skills here in any UF clubs/organizations. With that being said, I still believe I would be a great asset to Rem on Campus and that any skills I developed before then will remain applicable to this organization.","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/3/2026 19:03:20","spokeTo":"Today I had amazing conversations with Terrance Smith, Hannah Lockwood, and Eli Koon "}],"infoSession":{"timestamp":"9/3/2026 22:02:17","session":"09/03","appliedBefore":"No"},"meetMembers":null}},{"id":"a124_8d4e979d","timestamp":"9/4/2026 16:49:12","name":"Jack Landt","email":"jlandt@ufl.edu","phone":"4075796422","gender":"Male","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/jacklandt/","resume":"https://drive.google.com/open?id=1Oukygf5SOi-y17ERHjZ0Q0PqnIpqHmU2","university":"University of Florida","gradYear":"2028","classYear":"Junior","major":"Economics","minor":"Accounting","gpa":"2.7","whyRem":"Rem does a lot of good for the local Gainesville community by helping small businesses and I want to be a part of the process. Additionally, the experience that I could gain from working with local businesses would help sharpen my professional skills with regards to communication and my use of software like powerpoint. Finally, the connections with students in Rem is also something that I valued highly when deciding whether to apply.","coreValue":"Resilience","valueEssay":"Resilience means a lot to me because I have been through hard times my first two years at UF. I had to medically drop my first two years. It was extremely hard when I had to leave for those two Springs and I felt like I let everyone down around me. I remember feeling hopeless and that my friends up in Gainesville would forget me. I also had classes that I took over summer while I was dealing with my condition that I could not drop, which made me feel even worse. Despite how hopeless my situation felt I worked extremely hard over the last year and a half and got back into UF. Once I got back in I did worked hard and networked until I got the opportunity to work directly under the managing director of a wealth management firm this summer in New Jersey. The reason I value resilience so much is because that is what keeps me going no matter how hard the road ahead may seem.","careerInterests":"Consulting, Investment Banking / Finance, Product Management","howRemHelps":"Rem will give me the chance to practice casing for a career in consulting. While I am unfamiliar with consulting compared to many in Rem, I have many older friends that have pursued jobs at McKinsey & Company. This has lead me to open myself up to exploring what consulting is and what they do along with what casing is. If I have the opportunity to be a member here I am sure I will dive into casing and bring those skills to my next internship this summer.","position":"Junior Consulting Strategist","skills":"Back-end web development, Finance and accounting, Python","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":{"timestamp":"9/3/2026 22:02:13","session":"09/03","appliedBefore":"No"},"meetMembers":null}},{"id":"a125_8ad31d0a","timestamp":"9/4/2026 16:55:44","name":"Amandine Denis-Laroque","email":"a.denislaroque@ufl.edu","phone":"2062471836","gender":"Female","race":"White or Caucasian","linkedin":"www.linkedin.com/in/adenislaroque","resume":"https://drive.google.com/open?id=1ySD0Cc5P1y2bDpb5SJx9MIshkelw_J6W","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"","gpa":"High School: 4.0 (Freshman; no college GPA yet)","whyRem":"Rem on Campus is not like the other consulting organizations at UF as it specializes in small businesses and nonprofit organizations. Being from Europe, I am used to the emphasis on local family-owned business compared to the emphasis put on large corporate organizations here in the United States. I remember walking down the street to the local bakery that had been there for generations. A business like that isn’t just a business open purely for profit, but one that carries purpose and memories. It is businesses like these ones that sometimes require the most support. Throughout high school, I have had experience supporting local organizations and communities in a more hands-on way. For example, as a board member of the National Honor Society chapter at my school, I was able to organize a food drive that collected over 1,180 cans of food. When giving these cans of food to the local food bank, they were beyond grateful as it was after the holiday season, and they usually have a deficit in food around that time. I see this act of bringing a community together to help another as an important purpose in life. After this experience, I’m ready to grow by learning the proposal-based consulting approach that Rem focuses on. It is a different method aimed at the same goal of strengthening local small businesses. Once these businesses are helped, it creates a ripple effect across the community helping many more. I want to be a part of creating that same effect through Rem.","coreValue":"Community","valueEssay":"Community stands out to me because without community most people, including myself, would not be where they are today. As a French-American citizen, the French community has always been so important to me as it has been a place where I had something in common with everyone else. I could share part of who I am with everyone in that community. French culture is so important to me that I planned events at my school to celebrate it and form a bond over it with others. However, my high school experience was very diverse and I often found myself with a very different community: the Indian community. This reshaped my definition of community and made me realize that you do not have to be so similar to everyone else, but rather have a shared interest. I soon started attending Indian holidays, learning to dance at Garba, and watching Hindi movies to celebrate that culture. Rem and Company shares the same value of community as it is an organization that brings people who have the same interest in helping small businesses grow. This shared interest of helping others forms a community even if we are all diverse in our own ways. At Rem, these different perspectives, skills, and backgrounds are what allow for continuous learning, improvement, and greater reach.","careerInterests":"Investment Banking / Finance","howRemHelps":"Corporate finance and wealth management are what interest me the most currently, but I am still exploring all the career paths available to me. Rem on Campus works with a different industry focus from my career interests, but the analytical process is the same. In corporate finance or wealth management, understanding current economic circumstances, conducting internal research or research into clients, and evaluating a company’s or a person’s financial position are key technical skills. In Rem on Campus projects, members are required to understand the market conditions affecting a small business's operations, be able to analyze the business’s current and past situations and come to a conclusion to help the business succeed. The critical thinking skills used to complete these tasks in consulting projects are very similar to the skills required in finance and wealth management. The similarity in skills required is not limited to the thinking process, but also applied to the professional communication skills used. Being able to pitch a proposed solution to a small business about how they can move forward is very similar to proposing the next steps a company or a client needs to take to ensure financial success. Rem would give me a place to build and practice these exact skills before I need them in an internship or other professional environment.","position":"Junior Consulting Strategist","skills":"Business Strategy, Finance and accounting, Communications and copy-writing, Microsoft Office Suite","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a126_9dc90280","timestamp":"9/4/2026 17:06:05","name":"Maddie Sakalo","email":"maddiesakalo@ufl.edu","phone":"7868089820","gender":"Female","race":"White or Caucasian","linkedin":"www.linkedin.com/in/maddie-sakalo-46330931b","resume":"https://drive.google.com/open?id=1wdTN0f__xC8_635sBsLOSvPrWoWmA7b2","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"","gpa":"3.81","whyRem":"My experiences in GSCO, Finance Professional Development, coursework, and my internships have confirmed my passion for consulting and, more importantly, shown me that I want to use strategy as a form of service and impact in the communities around me. I am drawn to Rem because it offers the opportunity to develop that purpose through hands-on strategy, meaningful client work, and a community that values both growth and impact in Gainesville. I am most engaged when I can take an ambiguous problem, understand the people and priorities behind it, collaborate with others, and turn analysis into an actionable solution that can make a difference. GSCO has shown me what service-oriented consulting looks like. On a project for I Support the Girls, my team addressed fundraising challenges by developing a Greek Life partnership strategy, financial model, CRM model, and implementation playbook for its 64 affiliates. Beyond developing a recommendation, I learned the importance of understanding a client’s mission and building trust, listening to the challenges they face, and creating a solution that empowers them to expand their own impact. Rem’s hands-on work with Gainesville organizations is an opportunity I am especially excited about because it would allow me to bring that same mindset to the community I now call home. My commitment to service has also been shaped by experiences beyond consulting. At Legal Services of Greater Miami, I supported clients navigating housing and food stamp issues and saw firsthand how gaps in public services can shape people’s everyday lives. Through Made by Maddie, a service project I founded that has raised over $3,500 for children with limb differences such as myself, I learned that meaningful change often begins with one person choosing to turn their own experience into action. These experiences have strengthened my belief that lasting impact requires empathy and initiative that address immediate needs as well as the systems and structures behind them. That is why Rem’s “learning, applying, leading” model resonates so strongly with me. I want to learn from mentors and peers who will challenge me to think differently, apply those lessons through meaningful work as a Junior Strategist, and ultimately lead with greater confidence and purpose. I see Rem as an opportunity to learn how to pair rigorous strategy with genuine service and empower my community while enhancing professionally and personally.","coreValue":"Community","valueEssay":"Community is the core value I identify with most deeply because I have learned that belonging is not simply about being accepted but it is about creating spaces where people feel comfortable showing up as their fullest selves. My own experiences have taught me the importance of finding people who meet you as you are and becoming someone who creates that same sense of belonging for others. On our I Support The Girls project, my team developed fundraising and growth recommendations for an organization whose work directly supports people in vulnerable circumstances. The experience reinforced my belief that strategy is most meaningful when it understands the people behind the problem. It also showed me how collaboration and different perspectives can make a team’s work stronger. Additionally, I have found that sense of community through Phi Mu sisterhood. Through new member education, I have helped create an environment where members feel supported, valued, and confident enough to grow into themselves. I have learned that strong communities are not built by making everyone the same, but by creating space for each person’s individuality. GSCO has shown me community through shared purpose. My experience as a law clerk at Legal Services of Greater Miami further shaped this perspective. Working with clients navigating housing and food insecurity showed me how communities can become tangible support systems through advocacy, service, and access to resources. These experiences have made me passionate about investing in the communities I join through Rem, I hope to find a community that empowers individuals to grow together while supporting their passions and individuality.","careerInterests":"Consulting, Public Policy / Government","howRemHelps":"Joining Rem on Campus would help me build on the consulting experience I already have and prepare intentionally for consulting recruiting. As a sophomore, I want to use this stage of college to develop the skills, experience, and relationships that will allow me to pursue consulting opportunities with confidence. I am particularly interested in public-sector and government consulting because of the opportunity to apply strategic problem-solving to challenges that affect organizations, institutions, and communities with global impact. At Coutours in London, I deepened my ability to take initiative and work through ambiguity, two skills vital to consulting. Working in a small, founder-led organization, I was often not given a defined path forward. I had to identify opportunities, conduct competitor research, develop marketing and operational initiatives, and determine how my work could create value. Rem would allow me to apply those skills to Gainesville businesses by analyzing real client challenges, developing strategy plans, communicating recommendations, and learning directly from mentors. Just as importantly, Rem would help me prepare for recruiting. I want to strengthen my interviewing, communication, and professional skills while building relationships with people who can challenge my thinking and provide insight into the industry. Rem on Campus would allow me to combine my prior consulting experiences with the opportunity to develop my technical skills further and practice my strategic problem-solving and planning skills.","position":"Junior Consulting Strategist","skills":"Business Strategy, Marketing and analytics, Social media management, Communications and copy-writing","accommodations":"N/A","other":"I want Rem to know that I am someone who is driven by passion, curiosity, and ambition. I approach opportunities with the belief that being fully present and engaged is what allows me to grow.  My curiosity defines me and has inspired me to pursue consulting as I strive for a career that continually challenges me to learn, adapt, and incorporate various perspectives and ways of thinking. As a sophomore, I am eager to be intentional about recruiting and building the strongest foundation possible. I would approach Rem ready to learn and ready to contribute my energy, leadership, and perspective.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":{"timestamp":"9/2/2026 0:21:20","session":"09/01","appliedBefore":"No"},"meetMembers":null}},{"id":"a127_eb90eaf3","timestamp":"9/4/2026 17:07:07","name":"Kush Vania","email":"kush.vania@ufl.edu","phone":"6467090149","gender":"Male","race":"Indian or Indian American","linkedin":"https://www.linkedin.com/in/kush-vania-aba252272/","resume":"https://drive.google.com/open?id=1SRTbj5Wtkrv5AfJiSDxQyGQvxJ1OUSWC","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"Other","gpa":"3.95 unweighted; 4.07 weighted (High School, UF Gpa not yet given)","whyRem":"“If you do what you love, you’ll never work a day in your life.”\n\nWe’ve all heard this quote before, and it’s completely true: a passion for your work makes it personal, and that feeling transforms the effort you bring to each task. For me, what I love doing is helping others: whether it be a close friend asking for advice, a stranger asking for directions, or my Dad asking for help with the family business, my passion lies with providing for others. At the same time, business and strategy have always been my strong suit: creating plans, executing, leading teams, and problem-solving give me endless opportunities to explore and grow; in the past, I explored those skills through extracurriculars and hands-on experience in my community. Coming into UF, I knew I wanted to combine these passions: it isn’t just what I’m good at, it’s what I love, and REM provides the best opportunity to explore that passion.\n\nAt REM, I’ll be able to make a real-world impact, transforming the lives of people who truly need the help: working with smaller, local, struggling businesses gives me the chance to give back to a loving community while experiencing personal and professional growth in the process. The opportunity to work alongside companies that have such a personal connection to REM is what makes REM stand out for me: hearing the members’ stories about puppy yoga, or free popsicles with past clients makes consulting for REM feel like a hobby, not a task. I’m excited by the ability to make genuine connections while also experiencing professional development: eventually, I’d love to have these skills transfer to my career, taking my abilities into healthcare consulting or other industries in which I’d be able to make a positive impact in a productive and professional manner. \n\nFor me, REM represents more than a consulting club: it’s a family dedicated to improving the lives of others. By being a member of REM, I’m hoping to both contribute and learn from that community: it’s what I love doing, and if I do what I love, I’ll never work a day in my life.","coreValue":"Empathy","valueEssay":"15 cultures. A massive community. 0 cooperation.\n\nAs SASA President, I realized culture at my school was divided: with clubs from around the world, opportunity was endless. But competition was real and cooperation was nonexistent.\n\nWe needed to collaborate. I decided I’d make that happen.\n\nSmall persuasive presentations turned into massive group meetings; after months of planning,  “Cultural Night” was astonishingly successful, showcasing diversity to over 2000 attendees. After weeks and weeks of meeting with the Board of Education, serving as the liaison between our clubs and the administrative boards, I was finally able to coordinate a spectacular event: clubs performed, danced, sang, and shared the foods of their culture with thousands of attendees. Elegant music from live performers, diverse aromas of fresh food, and beautiful artwork and dancing filled the air with an energy like no other. Finally, students had a platform to share their culture, and the community had a mesmerizing event to experience that diversity in a fun way. In high school, I took part in several leadership positions: through my roles as Class and SASA President, I was in charge of planning, executing, and fundraising for dozens of community-wide events like “Cultural Night.”\n\nIn these positions, I learned all about community and resilience, growth and innovation. But most of all, I learned passion: my experiences taught me to use my passion to motivate others; eventually, it felt not like I was leading teams, but like I was part of a family. I slowly came to learn that impact isn’t just about a goal and a plan, it’s about empathy: without communication, trust, and genuine connection, no vision can ever be realized.\n\nEmpathy isn’t just about feeling what others feel, or connecting with the people around you, it’s a way of life: empathy shows in every action you take, from the smallest moments as you hold the door open with a smile on your face for a complete stranger, to the biggest experiences, where you’re deeply connecting and communicating with the people around you. Without empathy, community; resilience; intellectual growth; and innovation can never fully thrive: to truly make an impact, you need to empathize, with the people you’re working for, as well as the people you’re working with. I learned this firsthand through my past leadership experiences, and those lessons have stuck with me ever since: I had to deeply empathize with others in order to unite my teams and make an impact for my communities; without that empathy, none of our goals could have ever been met, and our creativity, productivity, and collaboration would have been greatly diminished.\n\nThat same empathy is what makes consulting and REM so special for me: as a consultant, I’d have the chance to communicate and connect with a variety of people in a variety of industries; empathizing with clients to understand their problems, needs, and how to communicate with them is a skill like no other. REM takes that even further, giving members the chance to empathize with clients from their own community: working with people where you can truly see a tangible impact is beautiful, and what makes both REM and consulting so special for me. Through consulting, I hope to use my empathy to work for industries and clients that truly make a positive impact: healthcare and public health are massive worlds of opportunities, and with empathy I’ll be able to make a real difference.\n\nEmpathy isn’t just a value that stands out for me, it’s a way of life I embody: empathy is part of everything I do. Consulting and REM are the perfect opportunity to contribute that empathy towards my career, and most importantly, my community.","careerInterests":"Consulting, Marketing, Brand Strategy, Entrepreneurship / Startups, Product Management, Non-Profit / Social Impact","howRemHelps":"My interests and career goals span a broad variety of topics: there’s just so much to learn and explore, and I hope to navigate it all. For me, REM feels like the best path to explore that endless world of opportunity that lies ahead of me, helping me grow both personally, and professionally. \n\nREM provides the best hands-on experience, while making a real impact too: not only will I explore and improve on consulting skills as a career, but I’ll meet real people and real scenarios, with real stakes. At REM, I’ll have endless opportunity to work with real-life situations and navigate this journey: I’ll work with a team, expanding my own communication skills; I’ll find mentorship in my leaders, taking away as much technical knowledge and real-world application; and I’ll have the chance to work with real clients, seeing firsthand what businesses and people truly need for me to make an impact. \n\nThrough all of my experiences, opportunities, and leadership experiences, I’ve found a love for strategy and management. Helping navigate difficult environments and situations, or think creatively to market, expand, or revive a business are beautiful fields of study, and I’m eager to apply these skills on a larger, more impactful scale. At REM, I'll have the chance to explore consulting throughout all of those situations: whether it be exploring marketing, or helping a local business transform their distribution process, or making a social impact by building community with real clients, REM is extremely diverse, and that openness to industry excites me. Industries like Healthcare and Health Administration also excite me: combining my passion for health alongside my passion for business is an exciting opportunity. With consulting, especially at REM, I’ll find a network, opportunities, and people that can help me find and do what I love. The opportunity with consulting is endless, and REM truly embodies that vision: I can work in a multitude of industries, and learn so much, all while never leaving behind my passion for business.\n\nBut REM is much more than just a consulting club: it’s a community centered around providing its members and its clients the absolute best. At REM, I’ll find so many likeminded people that are so intensely devoted to helping each other grow: I won’t find just peers, I’ll be exploring mentorship, friendship, and genuine connections that can last a lifetime. I felt the extent to which those connections last at several of the REM events I’ve attended; my hope is that being part of REM will allow me to be a part of that community, explore my interests, and contribute my own passions and devotion, while learning from others’ too.","position":"Junior Consulting Strategist","skills":"Business Strategy, Search Engine Optimization (SEO), Communications and copy-writing, Ads (Facebook/Instagram), E-commerce, Brand Development","accommodations":"No","other":"Having the opportunity to apply for REM and be introduced to consulting is something I’m incredibly grateful for. Coming into Warrington, I wasn’t sure exactly which career path would suit me best, but speaking to the members at REM, attending so many coffee chats, and even just going through this application has shined some light on my path. Consulting feels right and I’m grateful to finally have some direction and be able to explore this industry. Thank you!","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/2/2026 21:18:19","spokeTo":"Mackenzie, Anjali"}],"infoSession":{"timestamp":"9/2/2026 0:21:33","session":"09/01","appliedBefore":"No"},"meetMembers":null}},{"id":"a128_d54921d6","timestamp":"9/4/2026 17:10:45","name":"Parker Tan","email":"qingzhi.tan@gmail.com","phone":"513-926-6826","gender":"Male","race":"Asian or Asian American","linkedin":"https://www.linkedin.com/in/parker-tan/","resume":"https://drive.google.com/open?id=1edxRUVZZ7RJd_9huX7M4zpFJaeH1XUlQ","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance, Statistics","minor":"","gpa":"N/A","whyRem":"As I stood before Ohio Attorney General Dave Yost, I realized our real work would begin once the applause faded. As Ranking Member of the Youth Civic Engagement and Education Subcommittee on the Teen Ambassador Board, I helped shape an initiative focused on civic education, digital citizenship, and community awareness. Presenting our vision was just the start; I was eager to see if our ideas could truly make a difference. By adapting the initiative for schools, I watched it grow to reach eight schools across Columbus. That journey showed me how much I thrive on tackling unfamiliar challenges, collaborating with others, and turning ideas into practical solutions.\n\nThis is exactly what draws me to Rem on Campus. I am energized by problems without ready-made answers and by the chance to create recommendations that genuinely shape a business. Rem’s focus on partnering with real businesses facing real-world constraints is especially compelling. I am eager to dive into research, sift through information, and craft solutions that are not just insightful, but practical enough for clients to put into action.\n\nAs a Finance and Statistics student, I am drawn to the analytical challenges of consulting, but I know that numbers alone are not enough. True consulting means listening deeply, communicating with clarity, adapting as new information emerges, and uncovering what clients truly need. I bring leadership, teamwork, public speaking, and project management experience, along with a drive to take ownership and see projects through to completion. I am also eager to learn from more experienced peers and push myself in an environment that will help me sharpen these skills.\n\nWhat excites me most about Rem is the chance to grow: first by learning, then by applying, and ultimately by leading. I see Rem as a place to become a more disciplined thinker, a more reliable teammate, and someone who tackles ambiguity with confidence and purpose. I hope to bring my curiosity, analytical mindset, and leadership experience, along with a strong work ethic, while developing the judgment to create solutions that strengthen both the client and the team.","coreValue":"Community","valueEssay":"When I arrived at Buckeye Boys State, I knew almost no one. I was placed into Jordan City with students from across Ohio, and within a matter of days, we were expected to campaign, debate, solve problems, and build a functioning government together. At first, everyone came in with their own goals and ambitions, but what stood out to me was how quickly those individual goals became something larger. People began helping each other prepare speeches, talking through ideas late at night, and supporting one another after both wins and losses.\n\nThat experience changed the way I understood community. I had always thought of community as something you naturally belonged to because of where you lived, went to school, or grew up. Boys State showed me that community can also be built intentionally. It comes from people choosing to listen to one another, contribute their strengths, and care about the success of the group. Even as I campaigned for Auditor of State, my experience was shaped by the people around me who challenged my ideas, gave me advice, and encouraged me throughout the week. Winning the election was meaningful, but the relationships and sense of shared purpose behind it mattered even more.\n\nAs the week continued, I learned that leadership also depends on community. No one succeeds alone, especially in an environment where every decision requires collaboration. I had to communicate with people who approached problems differently than I did, earn their trust, and understand what mattered to them. That experience taught me that strong groups are not built by everyone thinking the same way. They are built when people feel comfortable contributing different perspectives while still working toward a common goal.\n\nThat is why Rem’s value of community stands out to me. I am drawn to environments where people challenge one another, learn from one another, and use their different strengths to create something better together. At Rem, I would hope to contribute to that same type of culture while working with a team to support local businesses. Boys State taught me that the strongest communities are not simply the ones you join. They are the ones you help build.","careerInterests":"Public Policy / Government, Law","howRemHelps":"My interest in law and public policy comes from wanting to understand how decisions are made and how those decisions affect businesses, communities, and individuals. In the future, I hope to attend law school and pursue a career where I can work at the intersection of business, law, and government. Whether that ultimately means practicing business law, working in public policy, or moving between the private and public sectors, I know I will need to be able to take complicated problems, understand the interests of different stakeholders, and develop solutions that are both thoughtful and practical.\n\nRem on Campus would help me build those skills in a setting where the consequences of my work are real. Working with a small business would require me to research an unfamiliar problem, ask the right questions, analyze information, and understand what a client actually needs before recommending a solution. Those same skills are central to both law and public policy. An attorney has to understand a client’s goals and communicate a strong argument, while someone working in government has to consider data, competing viewpoints, and the real effects a decision may have on a community.\n\nI am also interested in developing the ability to communicate complex ideas clearly. Through my experiences in civic engagement and government programs, I have seen that even a strong idea can fall short if it is not presented in a way that other people can understand and act on. Rem would challenge me to turn research and analysis into recommendations that are clear, persuasive, and useful, while also teaching me how to collaborate with people who may approach a problem very differently than I do.\n\nUltimately, I see Rem as an opportunity to develop a way of thinking that will serve me regardless of where my career takes me. I want to become someone who can enter an unfamiliar situation, listen carefully, identify what matters most, and help move people toward a solution. Those are skills I will need in a courtroom, a boardroom, or a government office, and Rem would give me the chance to begin developing them now.","position":"Junior Consulting Strategist, Consulting Strategist","skills":"Statistics and modelling, Data analysis, Social media management, Finance and accounting, Communications and copy-writing, Microsoft Office Suite","accommodations":"N/A","other":"N/A","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a129_1d92ca46","timestamp":"9/4/2026 17:20:37","name":"Irene Santiago","email":"irene.santiagoba@ufl.edu","phone":"786-945-0373","gender":"Female","race":"Hispanic or Latino","linkedin":"www.linkedin.com/in/irene-santiago-30a95a279","resume":"https://drive.google.com/open?id=1njEsTINW29wv_rpIAZz47ARb42N-MVPN","university":"University of Florida","gradYear":"2028","classYear":"Junior","major":"Economics and Public health","minor":"","gpa":"3.91","whyRem":"I want to be a member of REM on Campus because I am excited about the opportunity to gain real, hands-on consulting experience, make an impact in the Gainesville community, and grow both professionally and personally. As I enter my junior year at the University of Florida, I am eager to find a community of students who share similar interests and goals as me, who I can learn from, and most importantly, who I can form meaningful connections with.\n\nAt the recruitment events this past week, it was evident to me how tight-knit the REM community is. I value that while the organization is focused on professional growth, you can tell that its members also genuinely enjoy being a part of the organization and supporting one another. That sense of community is something I would be excited to be a part of.\n\nAs a double major in Economics and Public Health, I have previously felt unsure about what I wanted to do professionally, since it feels like there are so many possibilities. More recently, I have become interested in healthcare consulting because it brings together my interests in healthcare, economics, and business. I see REM on Campus as an opportunity to step outside of my comfort zone, meet new people, gain hands-on experience, and develop transferable skills that are valuable for any career, not just one in consulting. I hope to bring my curiosity, eagerness to learn, and unique perspective as an Economics and Public Health student to the REM community.","coreValue":"Community","valueEssay":"The value that stands out the most to me is community. Although I have formed very meaningful friendships during my time at the University of Florida so far, I’d love to form more connections with people who share similar professional goals as me. I believe being surrounded by motivated and supportive people is the push I need as I get closer to entering the professional world. I am excited by the idea of being part of a community where I can learn from others, gain a better understanding of the consulting field, and challenge myself to grow.\n\nThroughout college, I have learned that the communities I become a part of can significantly impact my growth. As my interest in consulting grows, I want to surround myself with people who are willing to share their experiences and offer their perspectives. I value communities where everyone encourages one another to grow, learn, and contribute, and I can tell that this is the type of community that REM fosters. Not a community that is centered around competition, but one where its members genuinely want to see each other succeed.","careerInterests":"Consulting, Tech, Data Analytics / Business Intelligence","howRemHelps":"I believe joining REM on Campus would help me develop practical, transferable skills that could be applicable to any of the careers I am interested in, whether that be healthcare consulting, health analytics, or health tech. By engaging in hands-on consulting projects, I hope to strengthen my skills in complex problem solving, as well as my ability to collaborate and communicate efficiently with a team and with clients. These are skills that I have already started to develop through my coursework and experiences. However, applying these skills in a real-world setting would allow me to strengthen them further while gaining valuable experience that will prepare me for the future.\n\nI am particularly interested in healthcare because of how interdisciplinary the field is. REM would give me the opportunity to explore how healthcare intersects with other fields by learning from members who have experiences and interests similar to mine. I also believe that working on projects with students from different academic backgrounds and with diverse professional goals would challenge my way of thinking by providing me with perspectives different from my own.\n\nUltimately, I hope REM will give me the experience, mentorship, and confidence to pursue my future career goals, while also allowing me to become more well-rounded professionally.","position":"Junior Consulting Strategist","skills":"Statistics and modelling, Data analysis, R","accommodations":"N/A","other":"N/A","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":{"timestamp":"9/3/2026 22:02:29","session":"09/03","appliedBefore":"No"},"meetMembers":null}}],"reviewers":[{"id":"aya","name":"Aya Aldorri","email":"aya.aldorri@ufl.edu","role":"Co-President"},{"id":"max","name":"Max Kaplan","email":"kaplanmax@ufl.edu","role":"Co-President"},{"id":"eli","name":"Eli Koon","email":"elikoon@ufl.edu","role":"VP of Membership"},{"id":"adam","name":"Adam Kamenetsky","email":"adam.kamenetsky24@gmail.com","role":"VP of Consulting"},{"id":"maria","name":"Maria Lopez","email":"maria.lopez3@ufl.edu","role":"VP of Communications"},{"id":"christian","name":"Christian Fox","email":"ca.fox@ufl.edu","role":"VP of Alumni Engagement"},{"id":"hannah","name":"Hannah Lockwood","email":"h.lockwood@ufl.edu","role":"Recruitment Chair"},{"id":"terrence","name":"Terrence Smith","email":"terrence.smith@ufl.edu","role":"Recruitment Chair"}],"defaultGroups":[{"id":"grp_foxmaria","name":"Fox & Maria","members":["christian","maria"],"weight":0.26},{"id":"grp_maxterrence","name":"Max & Terrence","members":["max","terrence"],"weight":0.26},{"id":"grp_ayaadam","name":"Aya & Adam","members":["aya","adam"],"weight":0.22},{"id":"grp_hannaheli","name":"Hannah & Eli","members":["hannah","eli"],"weight":0.26}],"rubrics":{"screen":{"dims":[{"key":"academics","label":"Academics","scale":[0,4],"bands":{"Freshman":["GPA ≥ 3.9 or strong upward trend","GPA 3.7–3.89","GPA 3.5–3.69","GPA < 3.5 or not listed"],"Sophomore":["GPA ≥ 3.8 or strong upward trend","GPA 3.6–3.79","GPA 3.4–3.59","GPA < 3.4 or not listed"],"Junior":["GPA ≥ 3.7 or strong upward trend","GPA 3.6–3.69","GPA 3.4–3.59","GPA < 3.4 or not listed"]}},{"key":"resume","label":"Resume","scale":[0,4],"bands":{"Freshman":["Consulting-ready formatting, strong bullets","Mostly polished with minor issues","Inconsistent structure or vague bullets","Below professional standard"],"Sophomore":["Consulting-ready formatting, strong bullets","Mostly polished with minor issues","Inconsistent structure or vague bullets","Below professional standard"],"Junior":["Fully consulting-ready, no errors","Minor issues only","Below consulting standard","Unprofessional"]}},{"key":"experience","label":"Experience & Involvement","scale":[0,4],"bands , and motivation for wanting to be a part of Rem on Campus. Then, introduce yourself and provide a brief overview of Rem on Campus to set the stage for the interview."},{"title":"2. Behavioral Questions","minutes":20,"body":"Ask targeted behavioral and situational questions that assess the candidate’s leadership style, experiences, and alignment with Rem’s values. Focus on how they’ve handled challenges, motivated team members, driven growth, and sustained impact within their current or past roles."},{"title":"3. Q&A and Next Steps","minutes":5,"body":"Invite the candidate to ask questions about REM, chapter operations, expectations, or anything else. Wrap up by outlining the next steps, providing encouragement, and explaining how you’ll follow up."}],"fit":[{"q":"Can you provide an explanation of your current extracurricular/academic commitments? How will this commitments impact your ability to execute your role at Rem on Campus?","crit":{"1":{"label":"Unacceptable","text":"Provides little to no clarity on current commitments and makes no effort to address how they would impact their role at Rem on Campus."},"2":{"label":"Not a good fit but showing promise","text":"Lists commitments but does not clearly connect them to the ability to fulfill the role; response feels unstructured or uncertain."},"3":{"label":"Satisfactory fit","text":"Clearly outlines commitments and provides at least one reasonable explanation of how they will manage their time to meet role expectations."},"4":{"label":"Exceeding Expectations","text":"Provides a thoughtful, well-structured explanation of commitments and multiple clear strategies for balancing responsibilities, demonstrating strong time management and foresight."}}},{"q":"Please provide us with further detail about your personal vision: What are your professional/academic goals, and how will Rem fit into these goals? Where do you see yourself in 5 years? (Be sure they answer both parts!! If they do not, re-ask what they haven't answ
