":"9/2/2026 0:21:19","session":"09/01","appliedBefore":"No"},"meetMembers":null}},{"id":"a102_cafd611c","timestamp":"9/4/2026 14:29:55","name":"Andrew Glushanok","email":"andrew.glushanok@ufl.edu","phone":"2015743010","gender":"Male","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/andrew-glushanok-209130379?utm_source=share_via&utm_content=profile&utm_medium=member_ios","resume":"https://drive.google.com/open?id=1r7hCpZfKlOhI0gu67kaGg-IclX6hDITnBXxUjm1vx2c","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Data Science","minor":"","gpa":"3.95","whyRem":"I want to be a member of Rem on Campus because I would cherish the opportunity to gain hands-on experience, helping real businesses and working with motivated students. I’m especially interested in the community aspect of Rem and the opportunity to learn from my peers and to work with local businesses would allow me to apply what I’ve learned in a setting where the results can make a positive impact on a growing business. Rem specifically appeals to me because of its emphasis on community impact, learning through experience, and building professional relationships. I also want to improve skills that are difficult to develop just through classwork, such as communicating with clients, working in a team, and presenting recommendations in a professional setting. I think Rem would give me the chance to learn from students with different backgrounds while also contributing my own experience and skills with problem-solving. Overall, I believe I can provide value to Rem by being a reliable team member who brings a strong work ethic and a willingness to contribute in whatever way is needed.","coreValue":"Empathy","valueEssay":"Empathy stands out to me because the ability to understand perspective is essential to building meaningful relationships and achieve the results. Through my past experiences in a team setting, I have learned that situations are significantly easier to navigate when you first try to understand where others are coming from. I think empathy is especially important in consulting because the best solution is not always just the most technically efficient one. You also have to understand the client’s goals, concerns, limitations, and the people affected by each decision you make. All of these things can only be done if I am able to see a problem from more than one perspective. Being empathetic has helped me communicate better, stay calm in whatever situation I am put in, and work more effectively with people who may have different ideas than me. I would bring this mindset to Rem engagements by carefully listening to both clients and my peers, considering different perspectives, and making sure our recommendations reflect the needs of the people they affect.","careerInterests":"Consulting, Tech, Data Analytics / Business Intelligence","howRemHelps":"Joining Rem on Campus would help me advance in my interests in consulting and data analytics by allowing me to gain experience applying those skills in the real-world. I want to become better at taking a broader problem and using data and analysis to recommend a solution that is practical for the client. I also see Rem as an opportunity to develop my skills in communication. I believe it is important to be able to explain your ideas clearly, present my findings with confidence, and work effectively with a team. Those are skills I want to strengthen through hands-on project experience. Because I am studying data science, I am especially interested in opportunities where technology and analytics can support business decision-making. Working with other students and real companies would help me learn how those technical skills , such as analyzing data and identifying trends, translate into creating value for a business. I think Rem would give me valuable experience and exposure to the type of work I hope to pursue after college.","position":"Junior Consulting Strategist, Consulting Strategist","skills":"User Experience (UX), Business Strategy, Statistics and modelling, Web design, Data analysis, Python, R","accommodations":"No","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a103_cf801e8e","timestamp":"9/4/2026 14:45:07","name":"Unsh Majithia","email":"unshmajithia@ufl.edu","phone":"7692343432","gender":"Male","race":"Indian or Indian American","linkedin":"https://www.linkedin.com/in/unsh-majithia-055238311/","resume":"https://drive.google.com/open?id=13rYLGN7XQvBN604byo7BLeLhKvX9tGqj","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Business Administration, Management","minor":"Economics, Political Science / Public Policy","gpa":"4","whyRem":"I want to join Rem on Campus because I think it would be a great opportunity to learn more about consulting while contributing to work that supports small businesses. I am interested in business, law, and public policy, but I am still exploring how those interests might shape my career. I feel that working with an actual client would help me better understand how teams identify problems, conduct research, and develop practical recommendations. I am especially interested in learning from more experienced members, receiving feedback, and gradually becoming more confident in a professional environment.","coreValue":"Community","valueEssay":"Community stands out to me because I think people can accomplish much more when they genuinely listen to and support one another. Some of my most meaningful experiences have come from volunteering with special-needs organizations and helping lead a student service club. Those experiences showed me that making a difference does not always require having every answer. It often begins with being dependable, understanding what people actually need, and being willing to help. I feel that this connects closely to consulting because a good consultant should listen to the client and work collaboratively before suggesting a solution. I hope to bring that mindset to Rem and continue learning how to contribute positively to a team and its community.","careerInterests":"Consulting, Non-Profit / Social Impact, Public Policy / Government, Law","howRemHelps":"I think Rem on Campus would help me develop skills that could be useful across all of these career paths. Consulting, law, public policy, and social-impact work each require careful research, teamwork, problem-solving, and clear communication. I have started developing some of these skills through classes and extracurricular activities, but I feel that I still have a lot to learn about applying them in a professional setting. Working with a small-business client would give me valuable experience with real challenges and responsibilities. I also hope the program will help me learn more about my strengths, improve in areas where I have less experience, and make a more informed decision about my future career.","position":"Junior Consulting Strategist","skills":"Business Strategy, Data analysis, Communications and copy-writing, Microsoft Office Suite, Research & Project Coordination","accommodations":"","other":"I am still early in my college experience, so I know there is a great deal that I have not learned yet. However, I think I would bring curiosity, reliability, and a willingness to accept feedback. My experiences in research, service, leadership, and speech and debate have helped me become more comfortable working with others and communicating ideas clearly. If selected, I would be grateful for the opportunity to learn from my team, contribute wherever I can, and hopefully grow into greater responsibilities over time.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a104_9e3a64f4","timestamp":"9/4/2026 14:47:41","name":"Angela Yu Qing Yang","email":"angelayang@ufl.edu","phone":"(646)627-8265","gender":"Female","race":"Asian or Asian American","linkedin":"www.linkedin.com/in/angela-yang-411400359","resume":"https://drive.google.com/open?id=1BbWJRHCknNvAluPwsb_y_fvmwvjULzpw","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Economics","minor":"Computer Science / Information Systems","gpa":"3.9","whyRem":"I want to be a member of Rem on Campus because it gives me the opportunity to provide consulting services to local businesses. Small businesses resonate with me deeply as I grew up working at Asian Express, my parents’ restaurant. During my time at Asian Express, I’ve noticed the impacts small businesses have on individuals in my community. Small businesses play an important role in preserving culture and forming tight-knit communities. Growing up in an environment where changes in inflation and ingredient prices can heavily impact a business, I became drawn to the field of consulting. \n\nAt Rem on Campus, I will use my interpersonal skills to develop trust with clients and apply my analytical skills to develop strategic recommendations for businesses. Being a consulting organization that emphasizes hands-on experience and collaboration, I am eager to ask questions such as “how do consultants efficiently work with clients?\" and “what is the process behind each tailored recommendations?”. Having the opportunity to work alongside a group of goal-driven students excites me because I can receive constructive feedback that helps me grow professionally and personally. By joining Rem on Campus, I aspire to develop client  communication skills and quantitative analysis skills that can be applied to various social enterprises.","coreValue":"Community","valueEssay":"The core value of “community” stands out to me because it reflects my commitment to serving others. English was not my first language, but during my time at Asian Express—my parents’ restaurant—many customers took the time to help me learn English. Their selfless support has inspired me to give back to my community to empower others with the same kindness. Through that experience, I created Ready4ESOL, an English-learning platform featuring flashcards, interactive games, and worksheets for young English learners. Initially, technical development was my greatest weakness but I decided to teach myself on how to code because I wanted to create an accessible resource for low-income families. In the process, I learned that community is about recognizing the support you have once received and finding meaningful ways to extend that support to others. Community is the foundation to my commitment in service and I hope to continue using my experiences and skills to continuously help others.","careerInterests":"Consulting, Investment Banking / Finance, Entrepreneurship / Startups","howRemHelps":"By joining Rem on Campus, I’ll gain practical skills such as performing market analysis, developing strategic recommendations, and creating professional deliverables, which are valuable in the field of consulting and investment banking. Additionally, being a member of Rem will connect me with mentors and industry professionals who provide guidance as I pursue my career goals. With my goal of becoming a consultant, I will need exposure to client communication and hands-on experience working on real-world projects. By becoming a Rem on Campus member, I will receive the necessary support needed to become a consultant while being involved in a community that values intellectual curiosity and empathy. The combination of values Rem on Campus embodies will push me to become someone who is insightful, coachable, and empathic towards others. These are all qualities that are transferable in fields beyond finance.","position":"Consulting Strategist","skills":"Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Business Strategy, Web design, Data analysis, Marketing and analytics, Photography, Social media management, HTML, Python, Microsoft Office Suite","accommodations":"N/A","other":"Thank you for reviewing my application!","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a105_2af553ec","timestamp":"9/4/2026 15:05:35","name":"Andrew Lasserre","email":"andrewlasserre@ufl.edu","phone":"(904) 775-8833","gender":"Male","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/andrew-lasserre/","resume":"https://drive.google.com/open?id=1MlXBLap0YxOe7MbPFwUY1_wFMz2qDZGt","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Data Science, Engineering (various disciplines)","minor":"Marketing, Mathematics","gpa":"3.82","whyRem":"I want to join Rem on Campus because I am looking for opportunities to take what I am learning academically and apply it to real problems that affect real businesses. As an Industrial and Systems Engineering student, I enjoy analyzing how systems work and finding ways to improve them, but I am equally interested in the communication and relationship-building needed to turn an idea into a solution people can actually use. What stands out to me about Rem is the opportunity to work directly with a local business and contribute to solving a challenge that matters to them. I want experience conducting research, working through a problem with a team, and presenting recommendations to a client. At the same time, I would bring an engineering perspective grounded in structured problem-solving, process improvement, and data-driven decision-making. Through my campus involvement, I have learned how to communicate with different groups, build relationships, and follow through on ideas which are skills I could use to support both my project team and our client. I would contribute reliability and a willingness to listen with empathy while helping the team turn research and analysis into recommendations a business can act on. I also like that Rem gives members the opportunity to take on greater responsibility over time. I see it as a chance to develop the analytical and client-facing skills I want to carry into my future career while giving my own perspective and effort back to Rem and the small businesses it serves.","coreValue":"Community","valueEssay":"Community is that value that mainly stands out to me because some of the most meaningful parts of my college experience have come from being involved in organizations that connect people to one another and to this university. Through my campus involvement, I have had the opportunity to work with students, alumni, university leaders, and members of the Gainesville community, and those experiences have shown me how much stronger an organization can be when people feel connected to something larger than themselves. I have learned that leadership requires listening to what people care about, working with different perspectives, and creating experiences or opportunities that are important to them. That is something I want to carry into my professional life as well. Whether I am working with a client, a team, or a customer, I want to understand the people behind the problem instead of treating every challenge as purely technical. Rem’s work with local businesses especially appeals to me because it would allow me to grow professionally while contributing to the community I am currently a part of. Attending the coffee chats and speaking with members from a variety of academic backgrounds also introduced me to a side of Rem I had not previously seen. It was especially meaningful to connect with members outside of traditional business majors who, like me, were looking for a way to explore an interest in business alongside their primary field of study. Those conversations showed me that Rem is a place where different perspectives are valued and where I could bring my engineering background, deepen my interest in business, and build relationships with people who share that curiosity.","careerInterests":"Consulting, Marketing, Data Analytics / Business Intelligence, Product Management","howRemHelps":"My goal is to pursue a career in business analytics, where I can use data to understand problems, guide decisions, and create practical value for an organization. Joining Rem would let me develop those skills in a real client environment rather than only learning about them in the classroom. Working with a local business would teach me how to define an open-ended problem, gather relevant information, identify patterns, and turn my analysis into recommendations that address a client’s actual needs. Those steps closely reflect the work of a business analyst, who must connect data and business context instead of treating analysis as an isolated technical exercise. Presenting recommendations would also strengthen my ability to explain findings clearly to people with different backgrounds, while collaborating with a project team would help me learn how to incorporate multiple perspectives into a solution. Rem would therefore help me build both sides of the skill set I will need in business analytics: the technical judgment to reach a sound conclusion and the communication skills to make that conclusion useful.","position":"Junior Consulting Strategist","skills":"Data analysis, Marketing and analytics, Python, Microsoft Office Suite","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/1/2026 16:08:53","spokeTo":"Hannah, Maria, Terren, and Christian "},{"timestamp":"9/2/2026 16:43:51","spokeTo":"Max Kaplan, Reese Bienstock, and Brody Power"},{"timestamp":"9/3/2026 17:58:39","spokeTo":"Terren Smith, Robert Madden, Hannah Lockwood, Adam Kamenetsky"}],"infoSession":{"timestamp":"9/4/2026 1:00:32","session":"09/03","appliedBefore":"Yes"},"meetMembers":null}},{"id":"a106_2e5088c1","timestamp":"9/4/2026 15:06:16","name":"Riley Cero","email":"cero.riley@ufl.edu","phone":"6059884309","gender":"Male","race":"White or Caucasian","linkedin":"www.linkedin.com/in/riley-cero","resume":"https://drive.google.com/open?id=17iEnURATBrmgdN9idNWy6ywoYbkImg0V","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"","gpa":"3.78","whyRem":"I want to join Rem on Campus because consulting is something I am extremely interested in pursuing, especially the process of taking an unclear problem, breaking it down, and creating a solution that produces measurable results. What makes Rem stand out to me is the opportunity to build those skills while actually using them to help small businesses and nonprofits in Gainesville. I have already had an introduction to this type of work through building websites for Corson Storage and ChristaClean. I worked directly with both owners to understand what they wanted, turning their general ideas into a clear plan, and creating something that fit their businesses. I really enjoyed finding the best solution without being given exact steps, and that experience made me want to pursue consulting even more. After speaking with a current member and learning about Rem’s Learning, Applying, Leading model, I feel like it offers exactly the kind of hands-on experience I am looking for. I would be able to contribute my background in finance, research, and client communication while learning how to approach problems more strategically.","coreValue":"Resilience","valueEssay":"I chose resilience because it has been important every time I have taken on something unfamiliar. Coming to UF from South Dakota meant leaving what I knew and learning how to build a new community for myself. That experience taught me the importance of putting myself in situations where adaptation is necessary. Carrying that mindset with me has helped recharter Phi Delta Theta. Rebuilding a chapter takes consistent outreach, even when not every conversation works out. Building websites for small-business owners also taught me the importance of resiliency because I had to learn unfamiliar tools to solve technical problems. My finance internship also taught me to stay patient and retrace my work when I found discrepancies rather than rushing past them. To me, resilience is not ignoring setbacks or acting like they do not affect you. It is being willing to adjust, learn from mistakes, and keep working until you find a better answer. This mindset has helped me grow, and it is how I would approach challenges while working with a Rem team and client.","careerInterests":"Consulting, Tech, Entrepreneurship / Startups, Law","howRemHelps":"Joining Rem would give me the opportunity to move from being interested in consulting to understanding what the work is actually like. I want to learn by working through real business problems with a team and being accountable to a client, not only by studying cases. This experience would show me how strong outcomes are developed when there is no obvious answer. It would also give me a stronger foundation as I pursue consulting internships, and eventually a career helping businesses make meaningful improvements.","position":"Junior Consulting Strategist","skills":"Business Strategy, Web design, Data analysis, Finance and accounting, Microsoft Office Suite, Machine Learning","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a107_a3ddaf07","timestamp":"9/4/2026 15:06:29","name":"Benjamin Friedman","email":"friedmanb1@ufl.edu","phone":"561-900-4364","gender":"Male","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/benjaminfriedman123/","resume":"https://drive.google.com/open?id=1yitwM8GkNMbk7M4zAc2knj0Fs5M1VW4c","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Engineering (various disciplines), Finance","minor":"","gpa":"3.9","whyRem":"I want to join Rem because I've learned that giving is a two way street. In high school, I became President a nonprofit called SeniorTech, helping senior citizens across south Florida with their technological needs. What I gained was not an extra chord at graduation, but a community and an appreciation for both the knowledge I had given, but also the knowledge I had gained. I can see the similarities clearly between my experience at SeniorTech and what I hope will be my experience at Rem: The same help, hard work, and learning, this time applied to a real business. I'm excited to be able to offer my grit and knowledge to help a local small business owner, to give back to the town of Gainesville. In the process, I'm looking forward to learning more about the businesses and the people I support. Yes, I look forward to learning how to be a better consultant, but more than that, I look forward to that feeling of accomplishment, feeling like I made a positive impact and was able to gain a community along the way.","coreValue":"Empathy","valueEssay":"\"If you want to make this world a better place, take a look at yourself and make a... change.\" -Michael Jackson. \n\nThis quote by the King of Pop is at the core of what I find so attractive about leveraging the strong network of business minds inside of Rem. I think its an overlooked fact though, that without empathy, without a desire or an ability to understand the issues of others, we couldn't even start to enact positive change. As consultants, our job is to be able to break down a large problem, work through messy data sets and tangled feuds to find the underlying issues with a business and help them perform to the best of their abilities. Without the ability to be empathic to the owner's issues, there is no starting that process. The very definition of community would change. \nResilience would be meaningless because there wouldn't be any actions to fail at. \nInnovation would seize without first being able to empathize and recognize the issues at hand. \nIntellectual growth would stunt as people care only about the issues pressuring them. \n\nOverall, without empathy, not only would our job as consultants be meaningless, it would be impossible to function in any capacity without being able to identify, understand from another perspective, and implement with an empathetic touch.","careerInterests":"Consulting, Investment Banking / Finance, Tech, Data Analytics / Business Intelligence, Entrepreneurship / Startups","howRemHelps":"Rem at its core will help me achieve my career goals by allowing me to branch out, build a strong network, and work on fundamental technicals useful in life. Having worked on professional projects before, I understand the landscape of startups/small businesses in a suburban area. However, the new companies I will be able to help with my position at Rem would widen my horizon to issues I didn't even knew existed, and help me find novel solutions which will push the boundaries of my creativity. Rem has one of the strongest networks I know of in the club space at the University of Florida. My intention will always be to reach out, find likeminded people, and help them achieve their goals in any way I possibly can. In turn, I'm sure the community of Rem at UF will do the same to me, benefiting us both symbiotically. Finally, working on fundamental skills such as problem solving, communication, and financial analysis will be helpful for me later in life no matter what career path I go down. \nIn recent years, I've really started to enjoy the entrepreneurial path for my future. In working with small businesses I'll be able to get a brief insight into how day to day and larger time horizon operations feel in that environment, potentially being a guiding light to my journey as an entrepreneur some day.","position":"Junior Consulting Strategist","skills":"Business Strategy, Statistics and modelling, Data analysis, Videography, Photography, Finance and accounting, HTML, Python, Microsoft Office Suite","accommodations":"N/A","other":"I'm very excited for the opportunity to work with a group that I've followed back at my old campus of Florida Atlantic University, and that has done very well by my friends, both old and new.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a108_20e4955a","timestamp":"9/4/2026 15:12:17","name":"Liam Lecauchois","email":"liamlecauchois@ufl.edu","phone":"7085825088","gender":"Male","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/liam-lecauchois/","resume":"https://drive.google.com/open?id=1jdSx5z_F_qNPucZ4Xy-nrFVChTdTobH3","university":"University of Florida","gradYear":"2028","classYear":"Junior","major":"Finance","minor":"Other","gpa":"3.91","whyRem":"I want to be a member of Rem on Campus because it directly aligns with both what motivates me and where I want my career to go. I am deeply interested in pursuing a career in consulting because I enjoy solving complex problems and turning ideas into actionable solutions. Rem offers a hands-on way to develop those skills in a real consulting environment rather than just learning about them in theory. What excites me most is the opportunity to work with a local small business and see the tangible impact of my work. Being able to look back on my college career and say that I helped a real client grow and succeed is something I would be extremely proud of. In addition, the strong network and community within Rem is incredibly appealing to me. I enjoy meeting driven, like-minded people and learning from those who have already walked the path I hope to follow. Finally, opportunities to potentially visit firms such as Accenture, BCG, Bain, McKinsey, and Deloitte reinforce why Rem stands out. To me, Rem on Campus represents the ideal environment to prepare for a successful career in consulting.","coreValue":"Innovation","valueEssay":"Innovation is the value that stands out to me the most because it has consistently shaped both my academic and professional journey. One of the main reasons I chose to attend the University of Florida was my acceptance into the Innovation Academy, a program that aligns closely with my long-term goal of becoming a serial entrepreneur after gaining experience in the workforce. Being immersed in an environment that encourages creative thinking and experimentation has reinforced how powerful innovation can be when applied intentionally. To me, innovation is about finding better ways to solve problems and create meaningful impact. I actively try to approach challenges with a creative mindset, whether that means developing new ideas for student organizations, improving processes in my work experiences, or thinking beyond conventional solutions in the classroom. Many of the companies and products that have shaped the world exist because someone was willing to think differently and challenge the status quo. Ultimately, innovation represents progress. It is the driving force behind growth and impact, and it is a value I strive to embody as I continue building into my career.","careerInterests":"Consulting, Brand Strategy, Data Analytics / Business Intelligence, Entrepreneurship / Startups, Product Management","howRemHelps":"I believe Rem on Campus will help me achieve the career goals I listed above in a myriad of ways. First, working closely with a real business in Gainesville will allow me to apply my problem-solving and analytical skills in a formal consulting environment, which is a critical step toward pursuing a full-time role in consulting or tech strategy. Being placed in client-facing situations will push me to think structurally and deliver tangible results rather than purely theoretical work. Second, the exposure to data-driven decision making and cross-functional collaboration aligns directly with my interests in tech / data analytics. Through the weekly meetings, hands-on client work, and mentorship from experienced consultants, I will gain practical frameworks for breaking down ambiguous problems and presenting actionable recommendations. Finally, Rem on Campus represents a community of highly motivated peers who are serious about growth. Learning alongside driven students while being held to high standards will accelerate my professional development and serve as a launchpad for future opportunities in consulting, and eventually building my own ventures.","position":"Junior Consulting Strategist, Consulting Strategist","skills":"Business Strategy, Data analysis, Search Engine Optimization (SEO), Finance and accounting, Communications and copy-writing, Python, Design Thinking, Microsoft Office Suite, Ads (Facebook/Instagram)","accommodations":"N/A","other":"N/A","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a109_4f7917e7","timestamp":"9/4/2026 15:31:59","name":"Athena Corrales","email":"athenacorrales@ufl.edu","phone":"3124213955","gender":"Female","race":"Asian or Asian American","linkedin":"https://www.linkedin.com/in/athena-corrales/","resume":"https://drive.google.com/open?id=1Kp0gU4_yhuntvdI-SmOk26XMmFBfZaU8","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"","gpa":"3.78","whyRem":"Starting at age six, I played softball for about twelve years. From that, I grew a lot of interpersonal skills and learned that I love working with and meeting new people. While I grew a lot of technical skills in STEM; I loved taking classes such as AP Physics C and AP Computer Science A. I chose not to go into STEM, much to the surprise of a lot of my friends and peers, because I think my interpersonal skills in tandem with my more technical point of view could have a larger impact than one or the other alone. In learning more about the business world over the past few years, I have grown an interest in consulting. This deepened with my previous experience on my study abroad to Japan, which was focused on business consulting and cross-cultural communications. There, I had the opportunity to work with a local Japanese confectionary company. Being able to work with a local business was really meaningful to me; it was incredible to see how passionate the CEO was about keeping the company true to its roots in Japanese culture and premium products, and being able to work that into my group’s recommendation. I want to be a member of Rem on Campus because I want to continue making an impact on small and local businesses because it’s important to prioritize the community that surrounds you and it’s a wonderful way to connect and learn about others.","coreValue":"Community","valueEssay":"Community really stands out to me because I feel like I started college as a much different person than I am just a year later; I was shier and more nervous about everything. I am an out of state student from Chicago, IL at the University of Florida. While I could’ve stayed in state, gone somewhere I knew tons of people, I chose to go out of state to have my own experiences outside of my hometown friends’ and my family to learn about myself in a journey that was completely my own. Knowing absolutely no one upon my first few weeks of class, I threw myself into involvement and have continued to do so. I have found some amazing communities while doing so, but none that push me professionally. While I have grown as a person over the past year, I am looking forward to growing professionally through Rem on campus.","careerInterests":"Consulting, Marketing","howRemHelps":"In hearing from those that have been involved in Rem on Campus, I have noticed how knowledgeable and skilled they have become from becoming a member. I want to join Rem on Campus to explore my possible career choices further and grow technical and soft skills that I need to achieve them.","position":"Junior Consulting Strategist, Consulting Strategist","skills":"Business Strategy, Statistics and modelling, Mobile development, Finance and accounting, HTML, Python","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a110_4cf79dba","timestamp":"9/4/2026 15:47:00","name":"Vanessa Artuza","email":"vartuza@ufl.edu","phone":"954-531-2647","gender":"Female","race":"White or Caucasian","linkedin":"www.linkedin.com/in/vanessa-artuza","resume":"","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Marketing, Economics","minor":"","gpa":"3.96","whyRem":"I want to be a member of Rem on Campus for two main reasons.\n\nFirst, I want to turn what I learn in the classroom into something tangible. My economics major gives me an analytical perspective, while my marketing major allows me to better understand consumers, positioning, and growth. While I genuinely enjoy learning in the classroom, I want to go beyond taking an exam. I want to apply that knowledge to real problems and help businesses accomplish the goals that matter to them.\n\nSecond, I want to be able to see the impact of my work firsthand. One of my favorite parts of the coffee chats I have had throughout the recruitment process has been hearing the passion and excitement members have when talking about their projects. Nearly everyone I spoke with mentioned how rewarding it is to work with small and local businesses, where they can see the direct impact of their recommendations and the appreciation of the business owners. One story that especially stood out to me was Bushel & Peck and how Rem helped transform what began as a product sold at farmers markets into a brick-and-mortar business that continues to grow today. Hearing stories like that made me realize how meaningful this experience could be.\n\nAt the same time, I see Rem as an opportunity to learn more about myself. I want to discover where my strengths lie within consulting, identify the areas where I still need to grow, and learn from members who have already developed those skills through their own experiences. Ultimately, I want to leave Rem knowing more about the kind of professional and teammate I want to become.","coreValue":"Empathy","valueEssay":"To me, the most important core value of Rem & Company is empathy. I believe that is especially important at Rem because the work its members do has a very real impact on the people behind the businesses they serve.\n\nSomething that stood out to me during the information session was hearing the panelists discuss the importance of communication. They emphasized understanding who you are working with and adapting accordingly. To me, empathy is recognizing that there is a person behind every problem you are trying to solve, with their own experiences, concerns, and goals.\n\nI experienced the importance of this firsthand during my internship at an immigration law firm this past summer. I worked on the case of a gay man from Jamaica whose asylum claim was being challenged, potentially requiring him to return to a country where he feared harassment and persecution. I was tasked with researching country conditions and firsthand accounts to help support his case. After hearing his story and understanding what returning could mean for him, the research stopped feeling like simply another assignment. Every report and firsthand account represented circumstances that directly affected someone's future, as well as moments that had shaped his past.\n\nThat experience changed the way I approach problem-solving because it taught me that strong analysis requires more than understanding the facts in front of you. It requires understanding the person those facts affect. You never fully know what someone else may be experiencing, and I believe taking the time to understand their perspective ultimately allows you to serve them better.","careerInterests":"Consulting, Marketing, Brand Strategy, Data Analytics / Business Intelligence, Law","howRemHelps":"I believe joining Rem on Campus will help me achieve my career goals by exposing me to different industries, businesses, and areas of work. While my interests span consulting, marketing, brand strategy, data analytics, and law, they share a common foundation in strategy, analysis, and problem-solving. Rem would give me the opportunity to strengthen these skills through real-world experience and see how they can be applied across different industries and challenges.\n\nOne of the things that excites me most about Rem is the variety of problems I would have the opportunity to work on. Each client brings a different business, goal, and challenge, allowing me to develop a broader understanding of how businesses operate and how strategic decisions are made. I also want to gain experience looking at a problem from multiple perspectives, whether through data, marketing, consumer behavior, or overall business strategy.\n\nUltimately, Rem would allow me to explore the intersection of my career interests while developing skills that are valuable across all of them. Through working with clients and learning from other members, I hope to become a stronger strategic thinker and gain a better understanding of where my strengths can make the greatest impact in my future career.","position":"Junior Consulting Strategist","skills":"Marketing and analytics, Search Engine Optimization (SEO), Photography, Social media management, Microsoft Office Suite","accommodations":"N/A","other":"Every interaction I have had with Rem throughout the recruitment process has made me more excited about the possibility of joining. I especially enjoyed getting to know members during coffee chats and hearing about the different paths that brought them to Rem. My conversation with Maya particularly resonated with me because hearing about her path from economics and pre-law into consulting reflected many of the interests I am currently exploring myself. Conversations like these have made me even more excited about the opportunity to learn from and contribute to the Rem community.","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/2/2026 17:57:22","spokeTo":"day 2: anjoli, maya, aarohi, isaiah, eli"},{"timestamp":"9/2/2026 17:58:02","spokeTo":"day 1: eli, kyle, aya, terrence, christy, christian, hannah"}],"infoSession":{"timestamp":"9/2/2026 0:21:26","session":"09/01","appliedBefore":"No"},"meetMembers":{"timestamp":"9/2/2026 17:06:57","year":"Sophomore","appliedBefore":"No"}}},{"id":"a111_65e2cf9d","timestamp":"9/4/2026 15:51:34","name":"Roshan Royai","email":"roshanroyai@ufl.edu","phone":"9257863084","gender":"Female","race":"Middle Eastern","linkedin":"https://www.linkedin.com/in/roshan-royai-1b1327262?utm_source=share_via&utm_content=profile&utm_medium=member_ios","resume":"https://drive.google.com/open?id=1ThgZB2OYqZjqS-LErdcijFb--6hPkGFI","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Business Administration","minor":"","gpa":"4.5 (High School GPA). UF GPA: N/A","whyRem":"I want to be a member of REM so that I can gain hands-on experience in consulting, be challenged and grow as a critical thinker, and find a community of equally ambitious students who want to see each other succeed. When I attended the REM introduction meeting, I remember Max saying how supportive the REM team is and how much it feels like a family, or “REMily.” That specifically stood out to me because growing up in the Bay Area, I often felt like my peers were constantly competing with one another. It was really refreshing to hear about an environment where students work together as a team and genuinely want to uplift and see each other succeed. That is the type of community I want to surround myself with throughout college, while also challenging myself and growing alongside people who are just as motivated as I am. Also, I think there is something really rewarding about knowing that the work we do goes beyond just learning about consulting in a meeting and can actually help a business in Gainesville grow. Being able to address a companies challenges and see our ideas potentially make a difference is something I would be really excited to be a part of.","coreValue":"Resilience","valueEssay":"I value resilience because some of my best ideas have come after my original plan completely failed. I remember working with my high school’s equity team last school year to promote events like our Multicultural Fair. Initially, I spent a lot of time creating social media posts using Canva templates, but I was disappointed to see almost no increase in engagement. Instead of continuing with the same approach, I started looking into why it wasn’t working. I scrolled through other organizations’ Instagram pages and realized everyone was using the same generic templates that students were probably wired to scroll right past. I brought this up to the rest of my committee, and we started brainstorming ways to make our content more engaging. We decided to create videos based on trends we were actually seeing on Instagram and TikTok. I even bought a giant inflatable Triple T costume and walked around school interviewing students about their cultures to promote our upcoming events. Did I get weird looks? Of course, but it was something people remembered. Our original approach had already failed, so I would rather risk embarrassing myself trying something new than continue doing something I knew wasn’t working. I am not afraid to put myself out there or share an idea that might fail, because I know there is rarely only one path to success.","careerInterests":"Consulting, Investment Banking / Finance, Marketing, Entrepreneurship / Startups","howRemHelps":"As someone who hopes to pursue consulting but is also open to exploring other areas of business, I think REM is the perfect place for me to build consulting skills while exploring different industries. Working with different companies would allow me to develop consulting skills and also expose me to other specializations I may not have considered yet. I am also trilingual and love to travel, so one of my long-term goals is to have the opportunity to work abroad. I thought it was really interesting hearing Terrence talk about interning in Singapore this past summer. Being surrounded by people who have pursued opportunities like that would push me to explore experiences outside of what I already know and hopefully pursue something similar myself. Lastly, I am extremely outgoing, so the relationships I would build through REM are just as valuable to me as the professional experience. I can already see myself making close friends through REM who will continue to support and push each other throughout college and into our careers.","position":"Junior Consulting Strategist","skills":"Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Marketing and analytics, Videography, Photography, Social media management, Python, Brand Development","accommodations":"","other":"Although I am involved in other extracurricular activities at UF, REM would be a top priority for me. When I commit to something, I put in 110%. I would absolutely put in the work outside of meetings and make sure I am someone my team can depend on. I am confident that the leadership, communication, and people skills I already have would allow me to contribute to REM. Thank you so much for the opportunity to apply. I am extremely excited about the possibility of being a part of the REMily!","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":{"timestamp":"9/3/2026 22:01:56","session":"09/03","appliedBefore":"No"},"meetMembers":null}},{"id":"a112_916bbbda","timestamp":"9/4/2026 16:02:06","name":"Nathan Chertog","email":"nchertog@gmail.com","phone":"2127294170","gender":"Male","race":"White or Caucasian","linkedin":"www.linkedin.com/in/nathan-chertog","resume":"https://drive.google.com/open?id=1NwIQeOSLh869oCCGX7yvSGdtniUpSRWd","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"","gpa":"3.73","whyRem":"Over the past few years, I've had the opportunity to work with small businesses from several different perspectives. As a sales intern at Roth Wealth Holdings, I spoke with business owners about their funding needs and evaluated their bank statements to see whether merchant cash advances were a good fit. This summer, I gained experience filing tax returns for small businesses and sole proprietorships. These experiences exposed me to the different challenges owners face and showed me how much I enjoy helping them work through those challenges. As a member of Rem on Campus, I'll continue working with small businesses, all while building valuable professional skills and amazing friendships with other members. \nAs a Junior Strategist, I'm excited to learn from my mentor and continue developing essential skills such as communication and building trust with a client. I'll be spending a semester with a local business, whether it be a personal training startup or a popsicle company, and meeting with them weekly, communicating ideas, and solving problems across tech, marketing, and strategy. From the beginning, I'll take initiative, and that means asking questions, showing up eager to learn as much as I can, and going above and beyond. I hope to be someone my team can rely on and eventually grow into a Team Lead role where I can spearhead the project from the first meeting to the final presentation. \nBeyond client work, I want to be a part of the community that Rem offers: people who take pride in their work, are always there for each other, and build friendships that extend far beyond consulting and their time at UF. By senior year, I'll reflect on my time at Rem and see how much I have grown both professionally and personally, and how well it has prepared me for a career in consulting.","coreValue":"Community","valueEssay":"After speaking with several members of Rem, I've noticed a common trend, and that's the importance of fostering community. Consulting, and business in general, is entirely reliant on the connections you build, the trust you create, and the people and ideas you surround yourself with. My most cherished experiences have been those in which people worked towards something greater than themselves, because acts of service have a way of bringing people together. I've seen this firsthand as an officer of my high school's 4-H club, when I organized a book drive collecting over 500 books for underprivileged students in my community. More recently, I experienced that same connection through UF's Leadership Development Program, where my team and I helped maintain the grounds of a local nonprofit caring for disabled and abused animals. I hope to continue contributing to the Gainesville community through Rem by building trust and driving change with local business owners. \nCommunity at Rem stands out to me because it exists in two ways: through the solutions members bring to the Gainesville business community, but also through the incredibly close and supportive culture that exists within Rem itself. It is a group of students who constantly push each other to grow and genuinely enjoy the time they spend together, all while working towards something greater than themselves. Down the line, my fellow members will be the people I ask for advice, practice cases with, and celebrate successes with. The people make the experience, and I want to surround myself with people who make me better.","careerInterests":"Consulting, Investment Banking / Finance, Tech, Entrepreneurship / Startups, Product Management","howRemHelps":"Working on real client projects and developing my communication, problem-solving, and management skills as a Rem Strategist will give me some of the best preparation I could ask for my career.  My primary career goal is becoming a management consultant, and the experience that Rem will give me in presenting recommendations and defending my ideas will put me in a great position to recruit for competitive roles. In addition, the high-achieving Rem upperclassmen with experience at top consulting firms, along with the powerful alumni network the organization offers, will give me access to advice, mentorship, and industry exposure I couldn't get elsewhere. Through MBB firm visits in cities such as Atlanta and Miami, I'll be able to see the work firsthand and build relationships that will help me in recruiting and beyond. \nWhile consulting is my main goal, I am also interested in technology, AI, and potentially product management. Consulting and finance are already heavily impacted by the rapid development of technology, and I want to better understand how these tools are used by both businesses and consulting firms. \nAs a Rem Strategist, I'll have the opportunity to gain exposure to many different areas of consulting and business, whether it be marketing, technology, finance, strategy, or public relations. I want to learn as much as I can across all aspects of business, even those that I am not yet familiar or comfortable with. After speaking with current members, I was interested to hear that some of their most rewarding projects involved working in fields they had no experience in.  I want to keep an open mind and challenge myself in unfamiliar areas, knowing I'll come away with a better understanding of how businesses work.","position":"Junior Consulting Strategist","skills":"Business Strategy, Finance and accounting, Python, Microsoft Office Suite","accommodations":"No accommodations needed at this time","other":"","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/1/2026 18:04:45","spokeTo":"Grace"}],"infoSession":{"timestamp":"9/2/2026 0:21:29","session":"09/01","appliedBefore":"No"},"meetMembers":null}},{"id":"a113_27339615","timestamp":"9/4/2026 16:06:34","name":"Colin Olcott","email":"colinolcott@ufl.edu","phone":"(609) 618-6510","gender":"Male","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/colin-olcott/","resume":"https://drive.google.com/open?id=1C463sm1zlcppbi_k3MBwivgx0nOfxT4q","university":"University of Florida","gradYear":"2028","classYear":"Junior","major":"Accounting","minor":"","gpa":"3.9","whyRem":"I want to be a part of REM to immerse myself in a culture of impact, excellence, and community. From conversations with current members over the past few weeks, it's clear that the relationships here are authentic; members speak highly of peers who aren't in the room, and there's genuine excitement when they see each other. It is evident that REM cultivates a culture where members invest in each other's growth, both personally and professionally. That type of community is where I thrive, and where I can push myself and others to be our absolute best in all facets of life. \n\nWhat draws me even more is the capacity for impact that the organization holds. My family has owned a small business my entire life, so I've watched firsthand how small, fixable issues can stall growth for otherwise strong local operations. I want to use my personal insight and perspective to help other business owners navigate challenges and find success.  Being able to use my personal experiences to pay it forward to local businesses would be an opportunity I would be extremely grateful for and a privilege that I would not take lightly. \n\nUltimately, community impact and authentic relationships are the two largest pillars in my life. REM offers the rare platform to pursue both simultaneously, and I'm ready to show up for that work.","coreValue":"Resilience","valueEssay":"Resilience stands out to me because it resonates with the gratitude and optimism I lead my life with. One of my favorite ideals to follow is that there is no losing, only winning and learning. When I don’t perform well on an exam or interview, my shortfalling is not the end of the story. I use that experience as a learning opportunity to find the areas that I can improve on for the next assessment. This growth mindset makes me excited for feedback, even when I do fail, because it elaborates on how I can become a version of myself. A textbook example of this is my professional progression in interviews. During my freshman and sophomore year of college, I was denied a fair share of various roles in clubs, internships, and leadership positions because of my lack of structure in my interviews. However, after each one, I would ask for feedback from my interviewers to improve my performance for the next time. The small lessons I have learned from each of these have accumulated to build the confidence I now hold in interviews. This mindset has not only defined my growth and future trajectory, but has also become my identity. For REM, this mindset will translate to leading with optimism, asking hard questions when things don't work, and committing to the long game of building real impact.","careerInterests":"Consulting, Investment Banking / Finance","howRemHelps":"For my career path, I plan to pursue my CPA and begin my career in Big 4 Public Audit to develop a strong technical foundation and establish professional credibility. Long term, however, I hope to transition into a more client-facing career focused on real business impact, such as wealth management or consulting.\n\nI believe REM on Campus can be a critical step in developing the skills needed to reach those goals. As an Analyst, I would gain hands-on experience working directly with business owners, developing my analytical and problem-solving abilities while learning how to understand and communicate solutions to real business challenges. These experiences closely mirror the collaboration required in Public Audit, where professionals must work effectively with an engagement team while communicating with a company's leadership.\n\nREM would also allow me to develop the relationship-management and communication skills that are essential to my long-term goals. Both consulting and wealth management are highly relationship-driven fields, and the ability to build trust, communicate effectively, and provide meaningful value to clients is essential. Having the opportunity to develop these skills with business owners before beginning my professional career would give me a valuable advantage.\n\nREM would help me bridge the gap between the technical foundation I hope to build through Public Audit and the client-focused career I ultimately want to pursue. I believe the experiences and relationships I can gain through REM will give me a practical toolkit that I can carry throughout my career and use to create meaningful impact for both clients and the communities I serve.","position":"Junior Consulting Strategist","skills":"Business Strategy, Data analysis, Marketing and analytics, Social media management, Finance and accounting, Communications and copy-writing, Design Thinking, Microsoft Office Suite, Brand Development","accommodations":"N/A","other":"One thing I would like the team to know is that I genuinely enjoy putting myself in situations where I can learn from other people. Whether through my campus involvement, community service initiatives, or experience in the service industry, I consistently seek out environments that challenge me to communicate, adapt, and improve. I would bring that same energy and commitment to REM and would be excited to contribute not only as an Analyst, but also as a teammate and member of the REM community.","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/1/2026 17:25:39","spokeTo":"Eli Koon, Maria Lopez, Sachin Mario"}],"infoSession":null,"meetMembers":{"timestamp":"9/2/2026 17:06:48","year":"Junior","appliedBefore":"No"}}},{"id":"a114_9684b255","timestamp":"9/4/2026 16:12:06","name":"Zachary El-Assad","email":"zelassad@ufl.edu","phone":"3054313931","gender":"Male","race":"Hispanic or Latino","linkedin":"www.linkedin.com/in/zacharyzelassad","resume":"https://drive.google.com/open?id=1NqJhbUXxAwOPrYfgAuXtJpIpO5QBWEN1","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Computer Science / Information Systems","minor":"Other","gpa":"3.96","whyRem":"I want to be a member of REM because of what I have seen and heard every single time I have talked to someone in the organization. It is clear to me that REM is centered around its members and the engagements they work on. That sense of community is truly something I am chasing, and I feel like I could find it through REM. Additionally, I want to be a part of REM because of the kind of work it involves. Getting face-to-face with real businesses would be an extremely valuable experience in college. At the members panel, something that really resonated with me was one thing that stuck with me was hearing members talk about how close they got to the businesses they worked with, even doing things like puppy yoga with one of their clients, and that kind of connection is not something I expected, but it is exactly the kind of hands-on relationship I want to be part of. Everyone does their work, is accountable, and genuinely enjoys being with each other, creating this “family” that I would love to be a part of. REM is a place where I can put in real work and actually add value to the people and businesses that need it, while becoming a better version of myself along the way.","coreValue":"Community","valueEssay":"Community stands out to me because everything that I have done at the University of Florida has been about building one. Being involved in a diverse range of organizations and clubs has made me realize how important community is and how much it adds to everything else. A strong community makes an organization stronger and adds purpose to the work. If the person next to you is not accountable or responsible, the whole team falls apart. I saw that same idea play out at my internship at Mount Sinai, where the people who made the biggest difference not only did their job well, but also checked in on their coworkers, covered for each other when things got busy, and actually cared whether the person next to them was doing okay. That is what makes a hospital feel less like a place of work and more like a place of community. Every time I have talked to someone at REM, the thing that keeps coming up is that it is the people who make the place. I relate this to my childhood, growing up in a good community with good influences that helped me become the best version of myself, and I am forever grateful for that. I hope to bring that same mindset into REM, showing up for the people around me the way people have shown up for me, whether that is a fellow cohort member figuring out a project or a small business owner who just needs someone in their corner.","careerInterests":"Consulting, Data Analytics / Business Intelligence, Healthcare Administration","howRemHelps":"Joining REM on Campus will help me build the hands-on skills that consulting and healthcare admin require, not just learn about them in a classroom. Working with small businesses and nonprofits means I will get to meet people I otherwise never would have met, while also sitting down with things like their cash flow or social media performance to figure out what is actually working and what is not, which is exactly what consulting looks like day-to-day. That kind of hands-on problem-solving is something no case study can fully replicate, and it is the same skill set healthcare admin relies on, just applied to hospitals and health systems instead of small businesses. What has stuck with me even more, though, is what I have learned from the people in REM itself. Every conversation I have had with someone in REM has pointed to the same thing: community is what actually drives this org. Talking to Terren especially showed me that REM will not just sharpen my analytical skills; it will make me a better speaker and communicator, which matters in any career I end up in. Learning how to adapt to different people's communication styles, whether that is a fellow student, a client, or a company leader, is the kind of skill that shows up for people, and I think REM is where I can actually build it.","position":"Junior Consulting Strategist","skills":"Business Strategy, Data analysis, Marketing and analytics, Social media management, Microsoft Office Suite","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/2/2026 15:49:37","spokeTo":"Makenzie, Anguliy, and terren"}],"infoSession":{"timestamp":"9/2/2026 0:21:21","session":"09/01","appliedBefore":"No"},"meetMembers":{"timestamp":"9/2/2026 17:06:52","year":"Sophomore","appliedBefore":"No"}}},{"id":"a115_07c2071b","timestamp":"9/4/2026 16:13:22","name":"Aanya Patnaik","email":"aanyapatnaik24@gmail.com","phone":"7037317885","gender":"Female","race":"Asian or Asian American","linkedin":"nkedin.com/in/aanyapatnaik","resume":"https://drive.google.com/open?id=1pIEf8dwYS2uKj0w8OaturEjLH_AHCPA7","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Computer Science / Information Systems","minor":"Computer Science / Information Systems","gpa":"3.77","whyRem":"I want to be a member of Rem on Campus because I believe that its philosophy and commitment to service aligns perfectly with my values and goals. Its “Learning, Applying, Leading” model excites me because it is the very way that I approach growth and new challenges. I want the chance to be able to apply the skills I learn through Rem on real-world client projects, and leave my own impact on the community through leadership opportunities. Rem stood out to me because it focuses not only on professional development, but real impacts on our community, which is a value I have always been passionate about through my own mentorship and service work. This past summer, I was able to gain experience working with clients at ZeonAI, where I had the opportunity to understand how to deliver tangible solutions to a business and work directly with clients in order to understand their business needs. I have learned how rewarding it is to see my work play a real impact within a business, and I strive to continue this passion through Rem on Campus. I hope to be a part of a team that will push me to new strengths, and allow me to contribute my passions and skills to uplift and empower local businesses. I am eager to grow alongside peers who are equally driven, and have the opportunity to uplift each other while learning crucial skills for my professional career.","coreValue":"Community","valueEssay":"Community is the core value that is most important to me. This value stands out because I believe that a solid community is one of the most defining aspects of my life. I find it incredibly important to be a part of a community that doesn’t just support you, it pushes you to go the extra mile and step out of your comfort zone. Coming to Florida as an out-of-state student, I have made it one of my main goals to find a community that will allow me to develop both personally and professionally, and I hope this is a community in which I can give back to as much as I can learn from. As a fellow in ProductSpace last semester, I was able to understand the skills and strengths I can personally contribute within a community, which include creativity, passion, and collaboration. By contributing towards an open, growth-oriented environment, I experienced what it means to uplift others while also being uplifted by them. I hope to bring this understanding to the Rem community, and have the opportunity to continue to grow and develop this organization for the rest of my time at UF.","careerInterests":"Consulting, Product Management","howRemHelps":"I believe that joining Rem will help me achieve my career goals of consulting and product management because both roles require strategic thinking, cross-functional collaboration, and creativity. Understanding the needs of a business in order to inform new products, campaigns, and impactful solutions are crucial skills for these career paths. While I have understood how I can achieve my career goals through coursework and various clubs, I believe the opportunity to work on real client projects is an invaluable experience that Rem provides. While it is important to understand and learn technical elements of these roles, I believe the best way for me to achieve my career goals is to go out and work with businesses, and understand how every decision leaves an impact. Gaining client feedback is another critical aspect of career success, because it would leave me with a more informed view of how different industries require different solutions. Most importantly, I would be able to gain a deeper understanding of how different business decisions affect businesses and their surrounding communities. These experiences would lead me to become a more informed, adaptable, and effective product manager or consultant.","position":"Junior Consulting Strategist","skills":"User Experience (UX), Business Strategy, Statistics and modelling, Data analysis, Marketing and analytics, Social media management, Finance and accounting, Microsoft Office Suite, Brand Development","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/2/2026 18:44:53","spokeTo":"Eli, Alexandria, Parker"}],"infoSession":{"timestamp":"9/2/2026 0:21:23","session":"09/01","appliedBefore":"Yes"},"meetMembers":null}},{"id":"a116_48d4f446","timestamp":"9/4/2026 16:17:51","name":"Ronan Maxwell","email":"ronanmaxwell@ufl.edu","phone":"847-946-7116","gender":"Male","race":"White or Caucasian","linkedin":"www.linkedin.com/in/ronan-maxwell","resume":"https://drive.google.com/open?id=1n8YP6nYvh0eS47VxJg5oShKIV2HmtgzI","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"","gpa":"3.76","whyRem":"I want to join REM because it presents an unparalleled opportunity to develop professionally as I transition into a career in consulting, whether it be through my knowledge of the consulting industry or through growing my skillset. I hope that through the Learning, Applying, Leading program, along with the ability to engage with businesses, I would be able to refine my skills through actual experience, far beyond what I could learn from online resources. Additionally, REM offers an extensive and invaluable network of highly motivated students and REM alumni that I would be extremely grateful to connect with and learn from.","coreValue":"Resilience","valueEssay":"While the option didn’t allow it, both resilience and empathy are equally important to me. Resilience has been a core value within my life over the past few years. Empathy, on the other hand, is something I have been consciously trying to lead my life with, even when circumstances do not require it. Both of these values became especially important to me after losing my brother in May of 2025 following his battle with cancer. I draw on resilience for a few reasons, firstly through admiration of my brother and how despite countless setbacks and challenges he continued to fight, keeping a positive mindset despite a negative outlook. Next, I draw on resilience from the rest of my family, what we’ve been through and how we’ve been able to grow and stick together despite distance and grief. Finally, I focus on resilience because of what I have experienced personally and where I want to be in the future. No matter what challenges I encounter, I want to continue moving forward, making my family proud. The importance of empathy stems from my relationship with my brother as well as my relationships with others. My relationship with my brother was argumentative like most siblings but when I was younger, I said a lot of hurtful things due to the differences between my brother and I. Reflecting on these experiences with no ability to change some of the things I said makes me strive to be empathetic towards people who I would have viewed as being different from me. I have learned that empathy means taking the time to understand someone’s perspective before judging them and treating people with kindness even if I don’t understand or relate to them. I try to carry this into my relationships with others by being open-minded and making an effort to make people feel valued. Finally, I focus on empathy because it is sometimes impossible to know how others are struggling. Everyone carries experiences and challenges that may not be visible from the outside, and I want to be someone who makes others feel understood and not judged. Ultimately, I hope to carry both values with me by facing adversity with strength while continuing to treat others with compassion.","careerInterests":"Consulting","howRemHelps":"Joining REM on Campus will help me pursue consulting by giving me exposure to the type of work and problem-solving that I will encounter in the industry. Consulting would require me to approach unfamiliar problems, later developing clear solutions that could be acted upon. I believe REM will allow me to strengthen each of these skills in a similar environment. The experience of working with businesses would also further my ability to professionally communicate ideas while also adapting to the needs of a client. By developing these skills alongside students and professionals with similar goals, I believe REM will prepare me to contribute effectively in a consulting role while also connecting me with industry professionals who would have already transitioned into the industry.","position":"Junior Consulting Strategist","skills":"Business Strategy, Finance and accounting, E-commerce","accommodations":"No","other":"No, thank you","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a117_19ef70e3","timestamp":"9/4/2026 16:22:39","name":"Bijan Roque","email":"bijanroque@ufl.edu","phone":"7863723551","gender":"Male","race":"Hispanic or Latino","linkedin":"www.linkedin.com/in/bijanroque","resume":"https://drive.google.com/open?id=1A50ZD6R6BpPvhA0WLKy0W_Q8APlx1hCy","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"","gpa":"3.45","whyRem":"I want to become a member of Rem on Campus for two main reasons. First, I want to gain experience in an area I am interested in pursuing professionally. Consulting has always interested me, and I believe Rem on Campus will show me whether a career in this area is something I want to pursue. I enjoy problem-solving, and Rem on Campus will allow me to do this with real-world projects while helping people who need it. This brings me to the second reason, the community. Not only one that works hard and strives to improve in the area they are specializing in, but also one that wants to contribute to society and help those who need it most. These are the types of people I would want to get to know better, and eventually work on a project that will help people with any business they may have. From what I have seen, these are the values that people in Rem on Campus have, and the reason why I want to become a member.","coreValue":"Community","valueEssay":"I strongly believe that you are who you surround yourself with, which is why community is one of my most important core values in both my personal and professional life. This became clear when I was on my high school basketball team, where we all had to be there for one another no matter the situation. We had gone through long practices and tough losses together, and these experiences made me learn that loyalty is showing up when it matters most, and that is crucial when you are part of a community. That experience shaped my thinking today, and once I commit to someone, I always show up for them. I believe the same logic should apply when people are in a professional environment as well. When working with a team, there are certain things, such as collaborating, showing up reliably, and stepping into a leadership role when it is needed, that I believe are crucial to bringing as much success to the team as possible. That is why community stands out to me as such an important value; it affects not only how much help I will have in the present, but also how far I will be able to go alongside my team in the future.","careerInterests":"Consulting, wealth management","howRemHelps":"I believe that joining Rem on Campus will be good for my major interests, which are consulting and wealth management, because of the relationship aspect of both careers. I will be surrounded by people who are interested in pursuing a career that requires trust, communication, and genuine interest in benefiting the clients that we work with. Being part of a network like Rem on Campus will give me the chance to learn from members who have already navigated the recruitment process and will be able to give me honest and unfiltered advice on what steps I need to take to achieve my goals. Not only that, but I also want to find a community that will hold me accountable to the level of work that I need to do. I believe that having people who are willing to help me out and push me to succeed as much as I can is one of, if not the most valuable things someone can have.","position":"Junior Consulting Strategist","skills":"Web design, Data analysis","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/3/2026 18:54:31","spokeTo":"Eli, max, kyle"}],"infoSession":null,"meetMembers":null}},{"id":"a118_8e1437e3","timestamp":"9/4/2026 16:32:22","name":"Christopher Liantonio","email":"cliantonio16@gmail.com / cliantonio@ufl.edu","phone":"718-689-2994","gender":"Male","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/christopher-liantonio/","resume":"https://drive.google.com/open?id=1i2uVdmz95-lraxqe2OSq9Xd71q5A87L3","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"","gpa":"3.57","whyRem":"Personally, I want to be a member of Rem on Campus because it represents more than just my academic/professional interest but my desire to support the people that are at the heart of our community. To start my passion for consulting, and the critical thinking it encompasses, was ignited in the Warring Welcome case competition where I got to experience firsthand the process of presenting a recommendation. It opened my eyes to the structured and strategic framework that consultants are tasked with daily. This new found passion led me to researching and ultimately enrolling in GEB3523 (Business Case Analysis) where students are presented with the opportunity to simultaneously strengthen their strategic thinking skills while preparing for high stakes consulting style competitions. However, I feel Rem on Campus applied these very same professional skills while tying in my personal sense of responsibility to give back to the community that has shaped me. Coming from a small catholic high school in the midst of a big city, volunteering became a big part of not only my faith but my sense of community. Oftentimes seeing a small business owner or understaffed company appreciate my help filled me with an overwhelming sense of pride and purpose. The volunteering, which started as a way to fill a graduation requirement, turned into some of the most impactful experiences of my young adult life. Rem bridges the gap between my career aspirations and guiding principles. It brings a consulting mindset and approach to small businesses, giving back to the very community that serves and shapes us most.","coreValue":"Resilience","valueEssay":"Out of the five core values of Rem and Company, the one that is most important to me is resilience because it deeply resonates with me as a core foundation of my values. I have been playing hockey before I can tie my own shoes let alone lace up a skate. Learning to skate, shoot, and pass while also being a good teammate brought its fair share of trial and error. Like in life, the conditions will never be perfect and failure is bound to happen. However, it is what we choose to do after these moments of failure that defines us. Quitting or blaming someone else was never the solution in a team sport. Getting up and trying again was what time and time again led me to reach my goals. Showing resilience in the face of adversity shows much more about a person than any accolade or title. Professionally and in life, I have learned that life doesn’t always go as planned, the conditions are most likely not perfect, and challenges are inevitable. Learning resilience at a young age stretched far beyond the walls of a rink, it was a life skill I could carry with me my whole life. When the challenge ultimately arises we must find the resilience to put the pieces together to the best of our abilities, take accountability for our actions, and rise up the challenge ahead of us.","careerInterests":"Consulting","howRemHelps":"I believe joining Rem on Campus will help me achieve my career goal of becoming a consultant through Rem’s unique culture in combination with the hands-on experience it provides. To start, any good team is defined by their culture. Throughout my time at the University of Florida I have met multiple members of Rem who cannot speak highly enough of their peers and organization. Whether it is on a project or job recruiting they all push each other to be the best they can. I believe that iron sharpens iron and, to be the best you have to work with the best. While this can develop competition, it is a form of constructive competition that fosters an environment where you are motivated to improve along with your peers. Another way Rem can help me achieve my career goals is through hands-on experience. As a junior strategist I will learn the common practices within the consulting industry while being guided by senior colleagues and mentors. Learning how to structure and build deliverables will ultimately turn into facing clients within the small businesses of Gainesville, providing real world experience from theoretical ideas. Becoming a real consultant on a smaller scale now is the first step towards recruiting success, landin
