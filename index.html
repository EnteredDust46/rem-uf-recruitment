rce, I navigated pricing strategy, sourcing, ROI, SEO, and logistics, sparking my curiosity about how each can be optimized. As such, I am gaining a technical foundation in finance to better understand the questions I once had to rely on intuition alone to answer. Joining Rem would pose many more questions and grant me an opportunity to apply my background to an unfamiliar business environment. Analyzing a new business model and helping to improve it strongly coincides with my own personal and professional aspirations, and I am eager to share my perspective and have an impact on my community through Rem.","coreValue":"Intellectual Growth","valueEssay":"All of my accomplishments stem from a continuous pursuit of intellectual growth. I started my business to support my family and learned how to make it flourish through trial and error. I have worked diligently to grow my foundational business knowledge at UF through countless hours of studying. I have started learning about finance and valuation through SEO and other career programs, where I have engaged with seasoned professionals to glean as much knowledge as possible. My hope is to continue learning by facing unfamiliar problems alongside real clients through Rem. My desire to learn was sparked by necessity, and it has evolved into fuel for my professional pursuit of finance.","careerInterests":"Consulting, Investment Banking / Finance","howRemHelps":"The structure of Rem, where you are interacting with real clients, faced with nebulous problems, and tasked with completing analysis to inform a recommendation is entirely aligned with the experiences I hope to gain before launching my career in business. I am also excited to connect with similarly ambitious peers to develop my professional networking and communication abilities through contributing, volunteering and gaining insights whenever possible. Importantly, I view Rem as a rare opportunity to give back to my local community through my professional development.","position":"Junior Consulting Strategist","skills":"Business Strategy, Data analysis, Marketing and analytics, Videography, Photography, Social media management, Finance and accounting, Communications and copy-writing, Python, Microsoft Office Suite, E-commerce, Machine Learning","accommodations":"No","other":"No","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/2/2026 18:42:01","spokeTo":"Max"}],"infoSession":{"timestamp":"9/3/2026 22:01:55","session":"09/03","appliedBefore":"No"},"meetMembers":null}},{"id":"a86_305d5395","timestamp":"9/4/2026 11:28:34","name":"Kirsten Acuna","email":"acunakirsten@ufl.edu","phone":"352-300-0213","gender":"Female","race":"Asian or Asian American","linkedin":"www.linkedin.com/in/kirsten-acuna","resume":"https://drive.google.com/open?id=1mheWQ8ValW7Vw8NzO4AfYEgUrXlviJpg","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Accounting","minor":"","gpa":"3.71","whyRem":"Rem on Campus really stood out to me when Sachin Mario mentioned that he wants everyone to succeed and even do better than him. He emphasized how Rem on Campus is dedicated to serving its community and how this mission translated directly into his work at J.P. Morgan. These two pillars deeply resonated with me because I used to work at Patticakes in the Village, where I saw firsthand the incredible value a small business brings to the Gainesville Community. \n\nIt was a place for a group of retirees to hang out every morning, a daily coffee spot for local workers where their order was their name, and a go-to for kids getting ice cream after a special day at school. At the same time, I saw the struggles the owners and manager faced–like high employee turnover, keeping business steady when college students left for break, and managing employee satisfaction with wages.\n\nThrough Rem on Campus, I see a clear opportunity to help small business owners and managers navigate these challenges so their contribution to the community stays strong. Given my background at Patticakes, I am excited to give back to local businesses and support them through any struggles they encounter.","coreValue":"Community","valueEssay":"I believe life loses its meaning without community. Consider these two scenarios:\n\n1. A person who is successful on paper–they’ve reached the top of their career, own a great home, and take frequent international trips, but they have no one to share it with.\n2. A person who faces significant setbacks, but is surrounded by friends and family who offer emotional support and help them rebuild.\n\nI would much rather be the second person. Community is what draws the line between healthy independence and isolation. I pride myself on being independent. On a recent trip to New York with friends, one of my favorite moments was spending hours exploring the city on my own during the day. But what made the trip special was meeting back up with everyone later, walking across the Brooklyn Bridge and through the food markets just chatting about everything and nothing. Without people to share those moments with, independence quickly turns into loneliness.\n\nBeing part of a community is deeply fulfilling because you get to support others through their low points, be there to celebrate their successes, and create memories together. Humans are not made to operate by themselves. Having a core group of like-minded people isn’t just nice to have for me; it drives every meaningful aspect of my personal and professional life.","careerInterests":"Consulting, Deal Advisory, Mergers and Acquisitions Tax, Corporate Finance","howRemHelps":"All of the career paths I am interested in require navigating a fast-paced workplace, understanding the business environment, and thinking critically. Rem on Campus fits every single one of these criteria. From hands-on client experience with local small businesses to a powerful professional network, Rem on Campus will help me achieve my goals.\n\nWorking alongside junior consulting strategists, consulting strategists, and the team lead provides direct experience communicating with clients, submitting real deliverables, and developing actionable strategies. Through this client-facing work, I will sharpen both my problem-solving skills and my ability to collaborate effectively in a team.\n\nAdditionally, I plan to leverage the strong network of students who have secured top internships and return offers when preparing for interviews, expanding my professional connections, and learning how to stand out as an intern. Rem on Campus will not only accelerate my professional growth, but also push me personally as I surround myself with a smart, driven community.","position":"Junior Consulting Strategist","skills":"Data analysis, Finance and accounting","accommodations":"n/a","other":"n/a","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/2/2026 17:14:14","spokeTo":"Kyle and Eli on 9/2"}],"infoSession":null,"meetMembers":null}},{"id":"a87_e3a61012","timestamp":"9/4/2026 11:29:39","name":"Willa Lefkowicz","email":"lefkowiczw@gmail.com","phone":"5166807659","gender":"Female","race":"White or Caucasian","linkedin":"linkedin.com/in/willa-lefkowicz","resume":"https://drive.google.com/open?id=1r3kFfF9sVUTyPp_2TpIK0ocFdnewF5wy","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Business Administration","minor":"","gpa":"3.89","whyRem":"I’m interested in Rem because I’m seeking real-world, substantive project experience and an organization where I can grow over time. I really value structured, professional work with deliverables and clients because I like knowing that the work I contribute has a purpose. The core reasons Rem resonates with me are its close-knit club community, tangible impact on local businesses, exposure to company strategy, and invaluable client-facing experience. Ultimately, Rem would push me to grow personally and professionally and help me refine what I want my career path to look like.\n\nRem’s mission to help local Gainesville businesses is another reason the organization stood out to me. Gainesville has become so much more than just UF to me through exploring local restaurants like Florida Room and Pho Bar, shopping at thrift stores, and attending festivals downtown. These businesses and events are what make Gainesville special to me, which is why I’m excited by the opportunity to help them grow. Many of these local businesses operate without the same resources available to larger companies or aren't run as efficiently as they could be. Through Rem, I could help a client identify ways to market their company to attract new customers, expand outreach, and improve operations. Knowing that my work could contribute to the success of a business that I personally support would make the experience that much more meaningful. “Growing while giving back” is one of my favorite concepts, and I think Rem embodies that by both helping members develop professionally while also creating a real, tangible impact for Gainesville business owners. \n\nFinally, consulting intrigues me because I’m an inquisitive person and I’m always trying to understand how things work. I have always been interested in how companies make decisions and the variables that influence these choices. For instance, my friend and I were recently talking about how there were no good movies out in theaters, and my mind immediately shifted to wondering how studios determine the best time to release their films. I started thinking about the different factors that may be considered, such as competing films, the season, target audiences, marketing budgets, and projected box office performance. It’s fascinating to me how many details go into a single decision and how they truly have an impact on the movie’s success. Thinking through scenarios similar to this has made me very interested in understanding why some companies thrive while others struggle, and what strategic decisions can help companies bounce back. I want to learn how to analyze these challenges with the same analytical mindset as a consultant and develop effective recommendations that can have a positive impact on organizations.","coreValue":"Resilience","valueEssay":"Resilience is an invaluable trait that is instrumental to my personal and professional journey. I'm a strong believer that attitude is everything and that you’re defined by how you respond, not what happens to you. This value stands out to me because some of my greatest accomplishments and growth have stemmed from uncomfortable situations, rejections, or unexpected challenges. These experiences have taught me how to not take things personally while still self-reflecting and using setbacks as motivation to keep improving. This mindset guides how I approach challenges and growth in my life. \n\nResilience is something I’m looking to continue strengthening. Applying to Rem without prior consulting experience is a prime example of me stepping out of my comfort zone. I’m willing to start projects without knowing everything and ask questions when needed. I know that there’s never a “perfect” time to learn and that the best way to learn is by doing.\n\nIn my life, one of the moments that tested my resilience was when I accepted my offer to the PaCE program for my first year at UF. Being an out-of-state student who didn’t even know what PaCE was, I felt confused and disheartened. Being fully online and not living in dorms for my first year of college seemed isolating. I could have passed up on my dream school because of this obstacle or used it as an excuse to slack off my first year. Instead, I took it upon myself to make the most of this unique situation, and I made a daily habit of going to the library, which helped me keep up with schoolwork and succeed academically, which ultimately allowed me to transition into an on-campus student this fall. Additionally, I took initiative by applying to on-campus organizations even when I had to go alone to recruitment events. I applied to multiple clubs each semester, went out of my way to integrate myself into Warrington, and didn’t let rejections bring me down. For instance, I was rejected as a Business Undergraduate Mentorship Program (BUMP) mentee my fall semester, but as soon as applications opened for spring, I re-applied and was accepted. Overall, the PaCE program taught me a lot about resilience first-hand as I turned something that felt like a limitation into motivation.\n\nI admire that Rem recognizes resilience as one of their values because I feel it’s an underappreciated trait that’s fundamental to personal growth. Further, consulting undoubtedly requires a lot of resilience because you’re constantly facing new, unpredictable problems and different client personalities and expectations in this role. Resilience determines how people show up as a teammate, community member, and as a leader. This value strongly aligns with how I want to grow personally and professionally.","careerInterests":"Consulting, Marketing, Brand Strategy, Data Analytics / Business Intelligence, Entrepreneurship / Startups, Non-Profit / Social Impact","howRemHelps":"Joining Rem on Campus will directly support my career goals by providing me with an adaptable, problem-solving skill set that I need to succeed in any role I pursue. I want to be someone who can comfortably walk into an unfamiliar situation, figure out what’s going on, and add value. I’ve always believed that the only way out is through, and one of the main things that’s stood out to me from recruitment week is that Rem members learn how to jump into challenges headfirst.\n\nIn my opinion, being a part of a genuinely supportive community who wants to see you win can be a major help in achieving career goals. I learn best from mentorship and being surrounded by people who push me. Joining Rem will surround me with like-minded driven peers and accomplished alums who have successfully navigated recruiting and internships. Having a community of people to case with, review resumes, and share opportunities with will keep me motivated to work towards my goals and help me grow into who I want to be both personally and professionally. At the same time, I want to contribute to the Rem community as well. Through my experience as a Warrington Welcome Peer Leader and a counselor at a sleepaway camp for the past three summers, I would bring strong communication skills, adaptability, a collaborative mindset, and a willingness to take initiative while also learning from the people around me.\n\nCurrently, one of my biggest professional priorities is exploring different industries to figure out what I want to pursue. Rem strategists don’t always get assigned to their first choice industry, but I see this as a growth opportunity. As someone who really values adaptability (it’s actually one of my top Clifton Strengths), I see a lot of value in working on projects that initially fall outside of my comfort zone or existing knowledge. Getting hands-on experience across a range of industries will help me uncover what work I’m actually passionate about and what direction I want to take professionally. \n\nMy career goals also depend on building hard skills and gaining real-world experience I can speak to during interviews. Rem will give me the unique opportunity to learn how to meet clients where they’re at and adjust my approach accordingly. Presenting and creating slide decks, recommendations, and deliverables will give me real stories and a measurable impact I can talk about when I’m applying for a summer internship and future roles. Ultimately, I believe Rem will help me become a person who thinks strategically, can walk into any situation and feel comfortable, and serves as a valuable asset to a team and its clients.","position":"Junior Consulting Strategist","skills":"Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Business Strategy, Data analysis, Marketing and analytics, Videography, Photography, Social media management, Communications and copy-writing, Microsoft Office Suite","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/2/2026 19:10:02","spokeTo":"Max kaplan, Mackenzie Kurtz, aarohi Bali, Parker Whelan"}],"infoSession":{"timestamp":"9/2/2026 0:21:32","session":"09/01","appliedBefore":"No"},"meetMembers":{"timestamp":"9/2/2026 17:06:37","year":"Sophomore","appliedBefore":"No"}}},{"id":"a88_3978cbf0","timestamp":"9/4/2026 12:07:55","name":"Brandon Pineyro","email":"bpineyro@ufl.edu","phone":"305-607-9863","gender":"Male","race":"Hispanic or Latino","linkedin":"https://www.linkedin.com/in/brandon-pineyro-ab27aa2b4?utm_source=share_via&utm_content=profile&utm_medium=member_ios","resume":"https://drive.google.com/open?id=1Mzqq0iitmeXfJY7HoUkoMkeCJHRohBX9","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"Other","gpa":"3.95 (High School GPA)","whyRem":"I want to become a member of Rem because I believe Rem would give me the chance to grow while doing work that’s impactful. As a finance student I want to learn how to look at a business from different perspectives and develop solutions that can help the business improve. I am also still exploring what career I would want to pursue in the business field. Through Rem I will gain a clearer understanding of consulting while also learning which area of business best matches my interests and long-term goals. I have gained leadership experience in the past but I know there is always room for me to improve. Rem would help me continue building my leadership skills while teaching me how to talk with clients and solve their business problems. I also like that Rem gives its members the chance to grow over time and eventually take on leadership roles. I want to learn from people with more experience than me and later use what I have learned to help future members.","coreValue":"Resilience","valueEssay":"Resilience stands out to me because it has played a major role in my personal journey. During my freshman year of high school I had a severe speech impediment that made anchoring for my high school’s broadcast journalism club called CCNN Live extremely difficult. Even though speaking on camera did not come naturally to me I refused to give up on something I cared about. I continued practicing and worked hard to become a better public speaker. By my senior year I became the lead anchor of CCNN Live and was selected as a Helmsman finalist, one of the school’s highest distinctions for leadership and excellence in public speaking. I also became a leader for the underclassmen and helped them throughout their journey in high school. That resilience mentality that I had with my speech impediment is something I want to bring to Rem if I were to get in. When working with clients there will be times when an idea does not work or a project does not go as planned. Instead of letting that failure discourage me I want to learn from it and use it as motivation to develop an even stronger solution.","careerInterests":"Consulting, Investment Banking / Finance, Entrepreneurship / Startups, Product Management, Non-Profit / Social Impact","howRemHelps":"Although I have not chosen one specific career path yet I know that in the future I want to help organizations make better decisions and make a big impact on the business. Rem would give me the chance to begin doing that now instead of waiting until after college. Working with a local business would teach me how to understand a problem from the client’s point of view and turn my ideas into recommendations they can actually use. It would also show me how I perform when my work affects a small business rather than just a grade for a class. Through that experience Rem would help me start building the abilities I will need to take my goal of helping startups from an idea into something I can actually pursue.","position":"Junior Consulting Strategist","skills":"Marketing and analytics, Videography, Photography, Social media management, Finance and accounting, Communications and copy-writing, Microsoft Office Suite, Brand Development","accommodations":"N/A","other":"I am an Innovation Academy student so my first academic semester at UF will not begin until Spring 2027. Instead of waiting until then to become involved I want to get ahead and start building my UF journey now while I am here in the fall. Joining Rem would allow me to meet other motivated students and begin developing professionally before my first semester. If given the opportunity to join I would put my full effort into the organization and take my responsibilities seriously. I truly believe in Rem’s mission statement “to keep doors open and dreams alive.” I would be proud to support that mission by helping local businesses and making a meaningful impact in the Gainesville community.","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/2/2026 16:18:50","spokeTo":"Max & Anabella"}],"infoSession":{"timestamp":"9/2/2026 0:21:35","session":"09/01","appliedBefore":"No"},"meetMembers":{"timestamp":"9/2/2026 17:06:40","year":"Freshman","appliedBefore":"No"}}},{"id":"a89_5dea28ef","timestamp":"9/4/2026 12:14:11","name":"Daniel Espinoza","email":"despinoza2@ufl.edu","phone":"3057908012","gender":"Male","race":"Hispanic or Latino","linkedin":"https://www.linkedin.com/in/despinoza07","resume":"https://drive.google.com/open?id=1v8RsG0pNq3f66dQeo5cy62usj66r-1UU","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Engineering (various disciplines)","minor":"Engineering (various disciplines)","gpa":"3.95","whyRem":"Before attending the Rem recruitment events this week, I only wanted to join Rem on Campus because it is a successful consulting club and it would help me gain more experience with consulting and business, especially as an Industrial and Systems Engineer. However, after talking to some members and attending the events, I can tell that it is so much more than that. \n\nThe people involved with Rem all love it and don't talk about it as just another organization on their resume, but as something they would always choose to be a part of. Members work directly with local businesses solving real world problems and presenting their innovative solutions, something that very few clubs at UF offer. As an ISE student, I want to apply my problem solving and technical mindset to actual clients instead of classroom activities. In addition, the mentorship built into Rem means I would also be learning from experienced and like minded members while building important professional relationships. As much as the professional side appeals to me, it is clear that members have built genuine friendships through Rem and actually look forward to being around each other. Going out to dinner with fellow members and doing things together outside of Rem is something I would love to have from a club at UF. That is something that you cannot fake at a recruitment event and something I have rarely seen from any clubs.\n\nOn top of that, Rem's alumni network is hard to not mention. Being able to stay connected to people who are currently working in consulting or other industries is a resource that is crucial to anyone's career. As I get closer to life after UF, having a built in professional network already established through Rem feels incredibly valuable and is a benefit that many other clubs can't offer.\n\nI want to join Rem not just for what it can give me, but because I think I would give just as much back. I bring a problem solving mindset from my engineering coursework, a genuine willingness to help clients succeed, and enthusiasm for being part of the community that makes Rem so special.","coreValue":"Intellectual Growth","valueEssay":"Intellectual growth is the value that resonates with me the most because it has shaped both my time at UF and my professional experience in a direct way. Being an ISE major means constantly moving between different fields such as data analytics, programming, 3D design, and business. As I take more classes, I have realized that there is no right path to go, just different ways to solve the same kinds of problems. The more disciplines I learn, the more I grow as a whole and the more challenges I am able to overcome. This mindset has carried straight into my internship at Viron International (a small company in Michigan), where I was given ownership of building and maintaining an engineering design tracker for the company's 3D drawings. Nobody taught me a process for that, I had to read the manuals and teach myself how to pull technical data out of CAD drawings, build a system that could scale across hundreds of engineering files, and work through problems that aren't found in a classroom. Figuring something out because the answer didn't already exist is what intellectual growth means to me and it is what I want to keep building through Rem. No matter what, intellectual growth will always be a value present in me throughout my life at UF and my career.","careerInterests":"Consulting, Entrepreneurship / Startups, Product Management, Supply Chain Management","howRemHelps":"Combining Rem with my ISE curriculum directly supports each of these career goals because the club is build around solving real world business problems for real clients, which is a core skill to have for consulting, entrepreneurship, product management, and supply chain work. For consulting, having hands on projects with clients and actually consulting them gives me direct experience with problem diagnosis and client communication, which is hard to get outside of actual client work. For entrepreneurship, working with small local businesses on their challenges will show me firsthand how they actually function day to day, which will be crucial to understand if I every start something of my own. For product management, a lot of consulting work at Rem involves understanding a client's problem, creating a working solution, and communication it to the client, all of which overlap with how a project manager operates between business needs and execution. Lastly, for supply chain management, my ISE background already helps with the operations and process improvement, so getting to apply that mentality to real client problems through Rem would improve my expertise even more. Being a part of Rem and having mentors who can help me define my direction will give me a much clearer sense of what the right path is for me.","position":"Junior Consulting Strategist","skills":"Business Strategy, Statistics and modelling, Data analysis, Marketing and analytics, Photography, Communications and copy-writing, Python, Design Thinking, Microsoft Office Suite, Machine Learning","accommodations":"","other":"One more thing I wanted to mention is that I am currently planning to pursue the Operations Research and Data Analytics track within ISE, which lines up well with the data driven problem solving involved in Rem's client work. \n\nI know Rem has worked with clients such as Study Edge and Mi Apa, two thriving Gainesville businesses, and seeing how successful they have become makes me want to help other clients reach that same level.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":{"timestamp":"9/3/2026 22:01:48","session":"09/03","appliedBefore":"No"},"meetMembers":null}},{"id":"a90_5ac18597","timestamp":"9/4/2026 12:34:27","name":"Noah Weinsweig","email":"noah.weinsweig@ufl.edu","phone":"304-982-0198","gender":"Male","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/noah-weinsweig/","resume":"https://drive.google.com/open?id=1wQfj1Yux4i696V0-ToM3T2nJNtIuVPl3","university":"University of Florida","gradYear":"2028","classYear":"Junior","major":"Engineering (various disciplines)","minor":"","gpa":"3.58","whyRem":"When I came to UF in 2023, I was mostly focused on having fun, making friends, and enjoying college. I studied abroad in Florence, made more friends than I can count, and had some incredible experiences. But when I came back in the fall of 2025, something changed. I realized I had not been taking full advantage of everything UF could offer me. Now, as a fourth-year student on a five-year engineering track, I knew I needed to be much more intentional about where I wanted my life and career to go.\n\nThat eventually led me to a seven-month manufacturing engineering internship. I learned a ton, but I also realized that being purely technical is not what excites me most. My favorite part of every day was walking onto the factory floor, talking and joking with the operators, hearing what was frustrating them, and trying to help. I could tell I brightened their days when I came around, and they definitely brightened mine. That brought me more joy than any technical project I worked on.\n\nThat experience is what pushed me toward consulting and Rem. I want to combine my engineering and problem-solving background with what I believe I do best: connecting with people. Rem gives me the chance to develop those skills alongside driven students while using them to genuinely help people and businesses throughout Gainesville. Maybe I am realizing this a little later than I would have liked, but I am ready to make the most of the time I have left at UF by building the career I want, while also helping the community around me.","coreValue":"Community","valueEssay":"Coming from a small town in Ohio with a population of around 500 people, community was something I grew up with every day. Everyone knew each other, people supported local businesses, and if someone needed help, there was always somebody willing to step in. It felt like every parent, family, and local business was donating to a sports team, school event, or fundraiser because everyone wanted to see the people around them succeed. At the time, I never really thought much about it. It was normal.\n\nSince coming to UF, I have started to appreciate how much that shaped me. Gainesville is obviously a much bigger place, but I still find myself drawn to the same idea of knowing the people around you, building relationships, and finding ways to give back. That is a big part of what excites me about Rem. I would love the opportunity to use the skills I have built through engineering and my professional experiences to help people and businesses in the Gainesville community.\n\nSo maybe at 18 I was bored and absolutely frustrated by how small my hometown was, but looking back, growing up there definitely helped shape the way I think about community and the person I want to become.","careerInterests":"Consulting, Entrepreneurship / Startups, Product Management, Engineering","howRemHelps":"When you go to a school like UF, there are so many amazing things to do that it can honestly be easy to get distracted from one of the biggest reasons you came here in the first place: to get an amazing education and give yourself the best possible head start on your career. I definitely fell into the trap of getting caught up in everything else college had to offer while not spending enough time thinking about my career, and now I am much more intentional about how I use the time I have left at UF.\n\nThat is a big reason I think Rem would help me. I am still figuring out exactly where I want my career to go, but right now I am leaning heavily toward consulting or another field that lets me combine technical problem-solving while working closely with people. Being surrounded by students who are equally focused on their careers would push me to keep learning, challenging myself, and figuring out where my strengths fit best. I also have several friends in Rem, and whenever they talk about it, they always seem genuinely excited about the people, the projects, and how much they are learning. Being around that kind of energy is something I want for myself.\n\nMore importantly, Rem would give me the chance to actually apply those skills. Working on real problems with real organizations, communicating with clients, and learning how to turn an idea or analysis into something useful is exactly the kind of experience I am looking for. I may only have two years left at UF, but I genuinely believe that if I use those two years the right way, they could completely change the trajectory of my career. I want to leave UF knowing I took full advantage of everything this school had to offer, and I think Rem could be a huge part of that.","position":"Junior Consulting Strategist","skills":"Business Strategy, Statistics and modelling, Data analysis, Design Thinking, Microsoft Office Suite, Applied AI","accommodations":"No accommodations needed at this time.","other":"Nope! Just excited about the opportunity.","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/1/2026 17:48:38","spokeTo":"Adam Kamanetsky and Eli Koon"},{"timestamp":"9/2/2026 15:28:25","spokeTo":"Anjali and Eli"}],"infoSession":{"timestamp":"9/2/2026 1:16:17","session":"09/01","appliedBefore":"No"},"meetMembers":{"timestamp":"9/2/2026 17:47:00","year":"Junior","appliedBefore":"No"}}},{"id":"a91_3e1edb3a","timestamp":"9/4/2026 12:55:16","name":"Orlando Sthory","email":"orlando.sthory@ufl.edu","phone":"3052050255","gender":"Male","race":"Hispanic or Latino","linkedin":"https://www.linkedin.com/in/orlando-rafael-sthory-a17346316/","resume":"https://drive.google.com/open?id=1IpHsCF9UGzUlCd3LN1aovFUnGjRbM7lW","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"","gpa":"3.8","whyRem":"I heard of Rem on Campus during the latter half of my first fall semester at UF and immediately the organization stood out to me. I applied last spring but was no accepted, but nevertheless maintained my focus on being part of Rem on Campus. I have always wanted to help out small businesses and this summer, interning at a community bank I got the support these small businesses personally. Having friends that tell me all the work Rem does for businesses in Gainesville inspires me to learn more and be more involved in my community.","coreValue":"Intellectual Growth","valueEssay":"I believe that intellectual growth is at the center of everything both professionally and personally. Every person should be actively trying to better themselves in all facets of life and should be striving to grow as a person. Every extracurricular involvement I begin, I aim to come out of it a stronger, smarter, better person. When I started my social and event company FRESCO, I knew very little of all the logistics and planning that went into the industry. Over time and lots of trial and error, I have grown a tremendous amount. Likewise with my internship at Banesco. When I first interned there during my Junior summer of High School, I was given very elementary tasks. This summer, when I returned, I got the opportunity to fully underwrite and draft loans that got sent up to bank directors. I have undergone all of this growth and this is still just the beginning of my journey as I have so much room for improvement. That is why I want to join Rem, not just to grow intellectually but to actually use the skills that I will acquire to improve upon my other involvements and grow my community.","careerInterests":"Consulting, Investment Banking / Finance","howRemHelps":"Rem will not only help in providing the skills needed for these careers, but also will connect me with a network of dedicated students also looking to get into these careers. Getting hands on experience with small start-ups in Gainesville will teach me the hard skills needed to start these careers as well as the soft skills that may differentiate myself from other candidates. On top of that, being able to work with other talented and dedicated students from my university will give me an incredible network of people that I can rely on for help reaching these career goals.","position":"Junior Consulting Strategist","skills":"Statistics and modelling, Social media management, Finance and accounting, Microsoft Office Suite, Brand Development","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a92_e1b6e2dd","timestamp":"9/4/2026 12:58:38","name":"Hamza Qureshi","email":"hamzaqureshi@ufl.edu","phone":"8135984417","gender":"Male","race":"Asian or Asian American","linkedin":"www.linkedin.com/in/hamza-qureshi-7ab60a33a","resume":"https://drive.google.com/open?id=1jWchjm0n-M6MZrxkSbqZ09kQTImcqUh-","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Engineering (various disciplines), Industrial & Systems Engineering","minor":"","gpa":"N/A (Freshman)","whyRem":"The main reason I chose to do ISE is because I have always had a passion for optimization. Consulting and ISE are very closely related through the process of optimization. If given this opportunity, I would be able to have a first hand experience with consulting and optimization. This would do two things. Firstly, I would be able to figure out if the optionality into consulting from ISE is a pathway I would want to pursue further. Secondly, I would be able to see if optimization is still interesting to me in actual practice.","coreValue":"Intellectual Growth","valueEssay":"Intellectual growth stands out to me because in a sense, it encompasses the other values. The ability to expand your thinking and open your mind to new ideas is personally very important. In engineering, teams are usually very diversified. Chemical engineers, aerospace engineers, and Industrial engineers all learn wildly different technical aspects. However, they have to be able to communicate and work together. This diverse process requires intellectual growth among its members for success. Going back to my original point that intellectual growth encompasses the other values, you could argue that being open to new ideas is a key to building the community value. Innovation and intellectual growth are very similar in the sense that both require being open to trying new ideas. Finally, a person that is just purely resilient without the ability to intellectually grow, is just stubbornness. In summary I believe intellectual growth is the most important because it is a value that allows for all the other core values to fall into place.","careerInterests":"Consulting, Supply management","howRemHelps":"REM on campus would give me an opportunity to experience consulting. I think hands on experience is the only way to find out if you truly want to pursue a pathway, and this organization would help me determine whether consulting is something I want to full time pursue.","position":"Junior Consulting Strategist","skills":"Data analysis, Marketing and analytics, Photography, Social media management, HTML, Ads (Facebook/Instagram), Brand Development","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a93_5bb3ad62","timestamp":"9/4/2026 13:09:25","name":"Manuel Muela","email":"mmuelavalcarce@ufl.edu","phone":"3053359972","gender":"Male","race":"Hispanic or Latino","linkedin":"https://www.linkedin.com/in/manuel-muela-valcarce-2b659a2b0/","resume":"https://drive.google.com/open?id=145n8u0pzj-vFZhPDX8JIHB51TEnq4OBn","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"Other","gpa":"3.78","whyRem":"I want to join Rem on Campus because I see as a unique opportunity that aligns with my enthusiasm towards local impact and business strategy. Having supports a youth initiative that included academic tutoring with soccer classes, I truly understand how teamwork and dedication can improve local organization. Taking part in the consulting sprints will show me how to help business owners maximize their operations and learn what happens in the consulting world","coreValue":"Community","valueEssay":"Community is what matters most to me because community shows action and community support in close places. My dedication to community was built while leading a project that gave tutoring and athletic mentorship to local youth showing how community resources can change people and neighborhoods. Rem on Campus shows community in action by giving free strategy consulting to businesses that keep our local ecosystem strong. Helping these businesses is not about business analysis; it is, about building strong community resilience. I am eager to bring my grassroots service experience to Rem to create positive community impact.","careerInterests":"Consulting, Investment Banking / Finance, Data Analytics / Business Intelligence, Entrepreneurship / Startups, Non-Profit / Social Impact","howRemHelps":"Rem on Campus gives the ecosystem that turns classroom ideas into real client solutions. By joining Rem’s 6-to-8-week consulting sprints I can use data analysis and problem solving on challenges that local entrepreneurs face. Rem on Campus also helps me build client solutions that help local businesses grow. Rem’s structured 3-semester progression model, which moves from learning core strategy frameworks to giving client presentations is the place to grow communication, analytical rigor and client-management skills that are essential, for strategy consulting.","position":"Junior Consulting Strategist","skills":"Business Strategy, Statistics and modelling, Data analysis, Communications and copy-writing, Design Thinking, Microsoft Office Suite","accommodations":"N/a","other":"While looking at my profile you will notice a background in community leadership and sports through competitive soccer and weightlifting which helped me develop discipline and a team-first attitude.. When I started using LinkedIn for finance and strategy jobs I realized I need more real experience with money to be better when applying for top internships. Being part of Rem on Campus is very important for me because it gives me chances to learn about financial analysis, budgeting and helping real clients with strategies. I want to use my work with Rems client projects get better at finance and help small businesses, in Gainesville do better.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a94_ef6362fa","timestamp":"9/4/2026 13:15:35","name":"Jasraj Kaeley","email":"jskaeley1@gmail.com","phone":"9049073166","gender":"Male","race":"Indian or Indian American","linkedin":"https://www.linkedin.com/in/jasraj-kaeley-0a8a99357/","resume":"https://drive.google.com/open?id=1MmtDe7NL1WazOKRVvkFOpdqe9Lx4hyyh","university":"University of Florida","gradYear":"2027","classYear":"Senior","major":"Biological Sciences (e.g. Biology, Chemistry and Physics)","minor":"","gpa":"3.99","whyRem":"I want to work with clients in healthcare in an advisory role; to be able to learn more about the industry and gain expertise in this field, as well as make friends with like minded peers is difficult and I believe that REM provides an environment ripe for all these goals.","coreValue":"Community","valueEssay":"Personally, I have found myself growing so much as a person and learning what my values are and what I want in a career when I started to open up and learn about other people's perspectives on what they like and what they want to do. For too long I found myself tunnel visioning into one specific career, but I find myself much happier now talking to people of diverse backgrounds, interests, and skillsets. It is genuinely inspiring to learn about people's various passions.","careerInterests":"Consulting, Data Analytics / Business Intelligence, Entrepreneurship / Startups, Product Management, Non-Profit / Social Impact, Medicine","howRemHelps":"I have heard from many representatives in REM, including Maria and graduated member Vedaant that there are various opportunities to advise business in healthcare, and I am passionate about using my business acumen to assist in healthcare firms' growth.","position":"Consulting Strategist","skills":"Business Strategy, Statistics and modelling, Data analysis, R, Microsoft Office Suite","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a95_4c3308be","timestamp":"9/4/2026 13:20:29","name":"Meghna","email":"meghna.vikram@ufl.edu","phone":"3212004648","gender":"Female","race":"Asian or Asian American","linkedin":"https://www.linkedin.com/in/meghna-vikram-/","resume":"https://drive.google.com/open?id=12Yp0xyXWr_h2PnKWimNhWBULWzdJu6mN","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Computer Science / Information Systems","minor":"Other","gpa":"3.8","whyRem":"Navigating life and college, you see yourself meeting lots of “big dogs.” These are the people who are at the top of the food chain, unparalleled and achieving their dreams. These are the people you remember, often forgetting all of the “little dogs” you met along the way. Growing up, I have always felt like the “little dog.” Transferring schools seven times, it was hard for me to progress very far in anything I did. However that changed when a teacher reminded me that success is the sum of small efforts, and ever since, I have tried to live by a simple rule: any impact is better than none.\n\nWhen my grandmother fell victim to a phishing attack in early 2023 and lost over $7K, I personally took it upon myself to teach myself how to build accessible cyberbreach prevention programs with pre-deployment scans. My goal was to arm at-risk families with the knowledge and resources they needed to protect their hard-earned money and information from cyberattacks. I turned what I learned into a research project that I presented at national conferences across the country. Sharing knowledge that could help even one family protect themselves made the work feel bigger than research alone.\n\nThe following summer, me and three of my best friends booked tickets to Malaga, Spain to intern at a small school in the city. There, we worked together to build a practical STEM & robotics curriculum catered to over 30 underprivileged, orphaned, or rescued children. I watched as kids experienced breakthrough moments building their first small robot or writing their first lines of Python code, building confidence and giving power back to these kids to help brighten their entire communities.\n\nThis past summer at Brown & Brown, I saw that same principle apply in a professional setting. Working alongside the Governance, Risk, and Compliance team, I built an AI compliance bot from the ground up to address pain points that had slowed the team down for months. The experience showed me that meaningful impact does not always come from a massive transformation. Sometimes, it comes from listening closely enough to recognize an overlooked problem, then putting in the work to create a tool that gives people back time and confidence in their work. Building that bot reinforced what I hope to bring to REM, a willingness to learn the real needs behind a problem and create solutions that make the people around me feel supported rather than overlooked.\n\nWorking with these groups of people taught me just how much of an impact you can make when you take the extra steps to provide some sense of safety and empowerment to those who may not typically receive it. That’s what I love about REM on Campus at UF. I believe that “small efforts” can equal huge victories for the “little dogs” of Gainesville. Whether they’re local business owners, nonprofit startups, or just fellow community members, they all deserve the same attention and creativity you would give any large-scale client. The entire “Learning → Applying → Leading” pathway is how I want to better myself and those I aim to serve. I want to listen to my clients’ actual needs and find purpose in their problems to help build an environment within REM where every client feels empowered and capable of leadership.","coreValue":"Resilience","valueEssay":"As someone who spent a huge part of her sophomore year of high school traveling in and out of the hospital, I can confidently say that without resilience, I would not be sitting here applying to REM On Campus UF at this moment. On days where all I heard was bad news and the redundant noises of a hospital, it took resilience to pick myself up and stay caught up on schoolwork. It took resilience to keep going as friendships dwindled and life around me continued moving forward.\n\nHowever, with the help and support of the people around me, I was able to come out of that chapter of my life stronger than ever and ready to apply the lessons I learned into both my professional and personal life. Every time I felt like giving up, whether at school or at home, I reminded myself that strength is built from persistence, not chasing perfection. With this mindset, I began to see each obstacle I faced as an opportunity to reflect and learn.\n\nFreshman year at UF gave me another opportunity to practice this mindset. While I was lucky enough to get involved and move up within a few organizations, I was also rejected from some that I was genuinely excited about. At the time, those rejections crushed me and the easy option was to wallow in self pity for the rest of the semester wondering why I wasn’t good enough. Instead, I tried to look for room to grow. I continued putting myself out there, learning from every conversation, and keeping my head up even when it felt difficult. That resilience led me to earn a AI Product internship at an S&P 500 company as a freshman, an opportunity I am extremely proud of and one I do not think I would have found if I had let rejection define me.\n\nCarrying this attitude into the workforce will be one of the easiest things someone could ask me to do. Resilience is not only a skill I have learned, but also a way of life. It is the reason I continue to chase opportunities like REM On Campus UF with enthusiasm and grit. When clients begin to doubt themselves or their endeavors, I know I will be able to give them the same advice that I once received to help people feel fulfillment in their endeavors both inside and out of REM.","careerInterests":"Consulting, Tech, Data Analytics / Business Intelligence, Product Management, Sustainability","howRemHelps":"In my short time at UF so far, I have spoken to a handful of insanely enterprising Gators who have done amazing things during their time here. I have made connections with them and gotten to understand their journeys. However, meeting the people in REM specifically has led me to see that the hidden key to success for many of these people was the community that supported them. Not only did they land their dream internship or achieve their career goal, but they had a “REMily” of peers behind them cheering them on.\n\nNow that I am a sophomore, I have a much clearer understanding of what I want from my future than I did as a freshman. I know that I want a career that keeps me learning but also ends with a life being changed. I am interested in all the paths selected because each of those paths gives me the chance to use problem-solving to change a part of life as we know it. Through my GeoAI minor, I have also become especially interested in sustainability technology and innovation. Our earth is ever-changing, and preserving it’s beauty and health is something that I am extremely passionate about. I would want nothing more than to integrate these ideologies into my professional life.\n\nDuring coffee chats, I spoke with Hannah, whose background in the College of Engineering stood out to me because engineering was originally my own goal coming into UF. We connected well on that, and seeing someone with that perspective succeed in REM helped me realize just how broad the range of skills and backgrounds within the organization really is. She helped me see that it is okay not to fit perfectly into the most traditional business-oriented path. Being unique is not something that needs to be hidden. It can be something that helps you bring a different perspective to a team or a problem.\n\nThat is exactly what I am looking for as I continue narrowing down my career goals. I want to pursue work that challenges me while staying true to my interests in technology and sustainability. Through REM, I would be able to learn from people with backgrounds different from mine while gaining hands-on experience with a wide range of clients. I believe those experiences would help me find where I can make the greatest impact, while becoming a stronger, more thoughtful professional along the way.","position":"Junior Consulting Strategist","skills":"Business Strategy, Web design, Data analysis, Marketing and analytics, Videography, Social media management, HTML, Python, Microsoft Office Suite, Machine Learning, Brand Development","accommodations":"N/A","other":"If given the opportunity to join REM, I would be excited to learn so much from the people around me and make a real impact in the Gainesville community.","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/1/2026 16:28:38","spokeTo":"Sachin, Hannah and Christi"},{"timestamp":"9/1/2026 17:07:31","spokeTo":"Sachin, Hannah and Christi"},{"timestamp":"9/2/2026 17:48:01","spokeTo":"Aarohi "},{"timestamp":"9/2/2026 18:15:54","spokeTo":"Aarohi "}],"infoSession":{"timestamp":"9/3/2026 22:01:47","session":"09/03","appliedBefore":"Yes"},"meetMembers":null}},{"id":"a96_a6aa4cfe","timestamp":"9/4/2026 13:24:03","name":"Andrew Chung","email":"andrewchung@ufl.edu","phone":"561-703-6194","gender":"Male","race":"Asian or Asian American","linkedin":"www.linkedin.com/in/andrewchung526","resume":"https://drive.google.com/open?id=1e_daCgFgPFKJuGNtq72ycmDMy9a3d01k","university":"University of Florida","gradYear":"2028","classYear":"Junior","major":"Management","minor":"","gpa":"3.6","whyRem":"I want to become a member of a consulting-oriented community, working and learning alongside other aspiring students. I’m genuinely interested in learning how to think through real-world problems in a practical, team-based environment. Consulting combines strategy, communication, and creativity, and the club seems like a great way to explore that while developing skills. Being part of the consulting club would help me gain hands-on experience, grow more confident in my problem-solving abilities, and better understand how to approach complex situations beyond the classroom.","coreValue":"Community","valueEssay":"Community is the most important value in my life. Growing up in a household with fourteen family members who were either immigrants or first-generation Americans, while never providing a dull moment, was quite challenging at times. Both of my parents left everything they had in Jamaica and migrated to America to escape the violence and political unrest that plagued Jamaica. Starting over, finances were so tight that my parents moved in with my mother’s parents, her brother, and his family. Community is the reason that my family was able to stay in this country and escape rising Communism. Ever since then I knew anything was possible through community. Consulting is all about community and being able to better that community. The opportunity to be in an environment that is rooted in community is not something I want to miss out on.","careerInterests":"Consulting, Data Analytics / Business Intelligence","howRemHelps":"Joining Rem on Campus will help me achieve my career goals by giving me real, practical experience in consulting through working directly on client projects and solving real business problems — something that can’t be learned just in the classroom. Through Rem’s structured consulting curriculum and hands-on casework with small businesses and nonprofits, I’ll develop analytical, problem-solving, communication, and project management skills that are essential for the financial consulting field I want to pursue. I’ll also have the chance to learn from mentors, industry professionals, and peers who are passionate about consulting, which will expand my network and give me valuable insight into what a career in consulting really looks like. Ultimately, being part of Rem on Campus will make my transition into the consulting world smoother and help me build the confidence and experience I need to reach my long-term goals.","position":"Junior Consulting Strategist, Consulting Strategist","skills":"Business Strategy, Statistics and modelling, Data analysis, Marketing and analytics, Videography, Photography, Social media management, Finance and accounting, Microsoft Office Suite, Brand Development","accommodations":"N/A","other":"N/A","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a97_003042bd","timestamp":"9/4/2026 13:49:00","name":"Anabella Creson","email":"anabellacreson@gmail.com","phone":"407-448-2229","gender":"Female","race":"Hispanic or Latino","linkedin":"www.linkedin.com/in/anabella-creson","resume":"https://drive.google.com/open?id=1468z2IEhXf0txA9bC6sxd1zjazq6z0Ou","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Accounting","minor":"","gpa":"4","whyRem":"I want to be a member of Rem on Campus because I have always been passionate about identifying challenges, ideating solutions, and finding ways to develop things to their fullest. This interest is visible in my past experiences, from being featured on the Flipping Junkie podcast because of my interest in modernizing and improving spaces, to developing a problem-solving business proposal through my internship at Bright Minds Fresh Ideas Think Tank.\n\nMy experiences in high school as the head teller of my school's credit union also taught me the importance of communication, responsibility, and working effectively with others. Now as an accounting student at UF, I want to continue developing these professional skills while challenging myself to think beyond the numbers and approach problems from unique perspectives.\n\nWhat attracts me to REM is the opportunity to work alongside other ambitious students, gain hands-on experience, and have a space to develop my problem solving skills. I believe I can contribute my creativity, past experiences, and desire to improve things while learning from the people around me. I see REM as an opportunity to push myself to my fullest potential and become a more capable problem-solver and leader throughout my time at UF.","coreValue":"Empathy","valueEssay":"Growing up, I have always had an ability to find ways to relate to people and create harmony in social spaces. Through my love of spontaneous conversations with anyone around me to volunteer work since I was in elementary school, I have learned how to connect with people in order to make meaningful differences in their lives.\n\nSpecifically, my internship at the lending department of a local credit union allowed me to develop this empathy. From loan requests for medical insurance, to credit requests for the release an impounded car, I have recognized how finance can help people through life's challenges. There was a challenge in every application and through working with loan officers, I was able to create solutions for every one of them. \n\nI understand that their are real people behind applications and that they are not just numbers. I strive to help people to my fullest ability and believe I can use this tool of empathy to bring solutions to people and help small businesses grow. I believe empathy will help me better understand the needs of others, communicate effectively, and find solutions that genuinely help. Whether I am working with an individual or helping a small business grow, I want to approach every situation with the understanding that there is always a person behind the problem.","careerInterests":"Consulting, Investment Banking / Finance","howRemHelps":"Joining Rem on Campus will help me reach my career goals by helping me attain valuable experience in professional spheres while also allowing me to sharpen my creativity and strategic thinking. Through Rem, I can better utilize my empathy and knowledge to provide solutions to clients.\n\nThe unique skills learned through this experience could allow me to become a better communicator, learn how to derive solutions from challenges, and gain experience as a leader in my community. Through this, I hope to apply Rem's key principles of learning, applying, and leading in my future career.","position":"Junior Consulting Strategist","skills":"Finance and accounting","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a98_0a2d43c4","timestamp":"9/4/2026 14:03:08","name":"Jiayu Wang","email":"wangjiayu@ufl.edu","phone":"3527090220","gender":"Female","race":"Asian or Asian American","linkedin":"linkedin.com/in/sophie-wang-7b2833368","resume":"https://drive.google.com/open?id=1QRLCCvMyIDEhjtfTJjHoNwCEodGLqcgV","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Other Social Science (e.g. Psychology, Sociology, Anthropology)","minor":"","gpa":"N/A","whyRem":"Rem on Campus‘s \"Learning, Applying, Leading\" framework is appealing to me because of its similarity to my view of learning.\n\nThat idea was formed during my Systems Transformation - Leadership in Change course at the United World College. This is a course piloted by my high school with the International Baccalaureate Organization around the globe. While other courses provided a theoretical learning experience, this course encouraged me to work on real-life problems ranging from the integration of refugees to energy transitions. Working on a project, solving the problem of how to develop solutions for a social challenge was something that I experienced for the first time in my academic life and understood how important change can be instead of just learning about an issue. That made me eager to be involved in change-making processes in the future.\n\nFor that reason, I would like to become a member of Rem. The course helped me learn how to think, using systems thinking, design thinking, stakeholder analysis. I am now ready to implement those skills in practice by working on a client's project to develop strategic recommendations and make a local small business more successful. I would like to learn how to create data-driven deliverables, present ideas confidently, and finally lead teams.","coreValue":"Empathy","valueEssay":"One of the core values that Rem stands for is empathy, not the easiest one to practice but the one that is absolutely essential to creating change.\n\nDuring my two-year experience within the NextGen Philanthropy Program in Singapore, I realized how crucial it is to listen carefully to your audience and to know their needs in order to design projects. My project in the first year of the program was a philanthropic venture that would improve the youth's mental health by an AI platform that provides recipes and diverse healing activities. My team and I won a grant of $10,000 SGD in startup funding. What I valued most in this project was the days and nights spent talking with our future beneficiaries and understanding their issues and needs.\n\nThe second year, I became a Teaching Assistant at the program, mentoring new students from NUS(National University of Singapore) and NTU(Nanyang Technology University), top five universities in Asia. Once I met a girl from Vietnam who came to Singapore to study and showed incredible potential as well as great insights. However, she hardly ever spoke in class. I scheduled one-on-one check-ins and asked her to present her ideas in writing first. When she eventually did her presentation, her suggestions completely changed our strategy, and the team went on to win first place, and watching her confidence grow was more rewarding than the win itself.\n\nTo me, empathy isn't about being nice, it's about listening to what's unsaid, creating space for different voices, and trusting that the best solutions emerge when everyone feels heard. At Rem, I want to bring this same mindset: leading with empathy while building the practical skills to make impact real.","careerInterests":"Consulting, Investment Banking / Finance, Brand Strategy, Product Management, Non-Profit / Social Impact","howRemHelps":"I plan to start my career in investment banking, that's where my deepest interest lies. I'm drawn to the intensity, the analytical rigor, and the opportunity to work on transformative financial transactions. Long-term, I see myself moving into asset management, private equity, or investment strategy, where I can deploy capital and create sustained value. That said, I also find product management and brand strategy compelling, and I believe a finance-first mindset gives me a strong foundation to eventually pivot into those spaces, whether it's leading product innovation in fintech or advising companies on go-to-market strategy.\n\nRem on Campus is the ideal platform to accelerate this path.\n\nFirst, it develops the consulting skills necessary for success in investment banking. The work with actual small companies, analysis of their operations, and giving recommendations on strategic decisions is a close equivalent of tasks that analysts perform on a daily basis. This experience in developing data-driven presentations and financial modeling is precisely the preparation needed for work in high pressure environment of investment banking.\n\nSecondly, I have an opportunity to learn about the operations of different businesses from the first hand experience. During my time at high school I was lucky to be one of the people responsible for managing endowment fund of my school's 18 campuses that worth $61M. In the course of performing my duties I developed an understanding of how to make investments in public equities by analyzing different markets and making investment decisions based on my findings. However, I know that in order to become successful in my field I need to understand the operations of those businesses behind the numbers.\n\nAdditionally, the path Rem follows from a strategist to a team lead aligns with the path I would like to follow. Having gone through the experience of owning the results from important financial decisions, having worked with endowments, I now seek to develop skills necessary for senior positions in finance and other spheres of professional life.\n\nTo me, Rem is not only an extracurricular, it is the practice that will help me to have a successful career in finance and stay down to earth.","position":"Junior Consulting Strategist","skills":"Business Strategy, Data analysis, Marketing and analytics, Finance and accounting, Communications and copy-writing, Design Thinking, Microsoft Office Suite, Brand Development","accommodations":"No specific accommodations needed.","other":"I bring hands-on experience working with diverse clients. Most recently, I was selected by a NGO to develop a proposal for a company on understanding Gen Alpha. Specifically, how to decode their language and trends to improve communication and education strategies.\n\nI'm genuinely excited about this opportunity to present myself to Rem and look forward to contributing to the Rem community!","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a99_54ea609b","timestamp":"9/4/2026 14:08:24","name":"Seth Shaw","email":"Sethjshaw@gmail.com","phone":"610-680-7542","gender":"Male","race":"White or Caucasian","linkedin":"www.linkedin.com/in/seth-shaw-71681039a","resume":"https://drive.google.com/open?id=1b_50bKZg34oUmDinYKN9ax6MGswUk3Gg","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"Accounting","gpa":"current freshman (High school GPA was 4.77/5)","whyRem":"I want to join Rem on Campus and pursue consulting because I enjoy learning about how businesses, industries, and economics work along with their respective cultures. I've explored this by reading about the Venezuelan oil industry, learning about Shanghai’s rise on a cultural exchange, studying language and tourism in Spain, and researching the handyman industry with Flax Pond Capital, among many others. This past summer, I spent two weeks at Flax Pond Capital evaluating investment potential, and helped MM Metals USA with recruitment and improving their website and social media. Rem on Campus would allow me to build on these experiences through real-world consulting experience. I’m really inspired by the hardworking and dedicated leaders of the organization and their commitment to giving back by guiding newcomers like myself. I want to surround myself with selfless people like these, improve my skills alongside driven classmates, and bring professionalism and a powerful eagerness to learn.","coreValue":"Empathy","valueEssay":"Empathy stands out to me most because it reminds me of an old friend. In 10th grade, my friend Massi Agosti passed away from osteosarcoma, a rare form of bone cancer. Massi was the most empathetic person I have ever met. Even while going through chemo and having his leg amputated, he would still call to ask how I was doing, always thinking about others even when he was going through the worst of things. Massi started a charity, Jerseys4Kids, which raises money for osteosarcoma research and donates signed sports jerseys to pediatric cancer patients. After Massi passed away, seeking to continue his legacy, my friend and I set up a Jerseys4Kids club at our high school to raise money and awareness for the cause. Through this club, we helped organize a district-wide 4K run, ran bake and tshirt sales, held FIFA tournaments, and supported the charity’s campaign to become a recipient of our high school’s talent show fundraiser, which has so far raised over $80,000 for the charity. Running this club showed me how hard it is to coordinate teams, plan events, and keep a nonprofit moving forward, but more than anything, it taught me what it actually means to look out for other people the way Massi always did.","careerInterests":"Consulting, Investment Banking / Finance, Entrepreneurship / Startups, Public Policy / Government","howRemHelps":"My current aspirations are to become a senior finance executive at a top firm, and I believe the best way to reach that level is to build a full understanding of the financial world. I am interested in international markets because I love to travel and am originally from England. I enjoy reading about financial history, and books like The Last Kings of Shanghai and Moneyland have really increased my passion for learning about finance. I want to be part of Rem on Campus because I want to gain real exposure to client work and growth strategies. Having already worked with Flax Pond Capital and MM Metals, I want to continue working with real companies during college. I want to surround myself with dedicated students and build a solid foundation that puts me ahead. Ultimately, I want to live a life of meaning, and using my financial expertise to help businesses is a path that lets me achieve financial stability while doing what I truly enjoy.","position":"Junior Consulting Strategist","skills":"Business Strategy, Marketing and analytics, Videography, Photography, Social media management, Finance and accounting, Communications and copy-writing","accommodations":"","other":"Thank you for reviewing my application - really looking forward to the chance to contribute to REM here at UF.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a100_f4ef390e","timestamp":"9/4/2026 14:10:25","name":"Noah Gutch","email":"nr.gutch@ufl.edu","phone":"4077333879","gender":"Male","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/noah-gutch","resume":"https://drive.google.com/open?id=12ajWjvE4xRAzzA8wRODxK_XEdFSZQX4w","university":"University of Florida","gradYear":"2028","classYear":"Junior","major":"Mathematics","minor":"Other","gpa":"3.7","whyRem":"With the opportunity to join REM on Campus at the University of Florida, I believe this organization will be able to sharpen my consulting and analytical skills. In addition to enhancing my technical skills, I will also be working alongside a close community, which will continue to motivate and push me to the next level. Working within a strong community allows members to produce the best possible results for clients. Thus, with these innovative solutions, REM is able to produce real-world results for smaller companies, helping them grow in the business world.\n\nOne of the main reasons I wanted to be a part of REM's community was sparked by UF's Innovation Catalyst Competition. This competition gave me the opportunity to lead a team of five to help develop our product, the Alachua Movie Station. Within my role, I was able to build financial models and conduct customer discovery interviews to help our team present a viable, innovative solution to over 200+ attendees and five professional judges. After this competition, this entire process and project helped me discover what consulting was all about.\n\nBeyond the technical and leadership growth, I want to be a part of REM to grow professionally surrounded by a close-knit community. REM would provide that exposure while also creating long-lasting memories. This club is a place where I would love for my consulting journey to truly blossom and begin.","coreValue":"Empathy","valueEssay":"With all of REM's core values listed, I believe empathy stands out and connects with me the most. To expand upon this, empathy is one of the most valuable traits to have with friends, family, and even colleagues. The ability to fully understand and empathize with another person's emotions truly goes a long way.\n\nIn my life, I have always strived to be empathetic as you never know what's going on in someone else's life. Personally, I can attest to moments in my life where I would be sitting one on one with a friend, teammate, coworker, and/or family member to dive deep into their lives and personal stories. This personal trait builds trust and allows for people to truly connect with each other.\n\nOne example that stands out to me is an event my fraternity brothers host called Mental Health Mondays, where we all open up about vulnerable stories, moments, or thoughts we're carrying. Being part of a space like that has shown me just how powerful empathy can be, it reminds everyone in the room that none of us are ever truly alone. Moments like these have shaped how I show up for the people around me, both in and out of that setting.\n\nIn REM and consulting specifically, using empathy builds strong relationships for all members and students, which helps deliver more meaningful and impactful solutions to clients. Furthermore, that's why this core value stands out to me as we are all people who have emotions, and understanding one another goes further than anything else in life.","careerInterests":"Consulting, Tech, Data Analytics / Business Intelligence, Product Management","howRemHelps":"I'm currently a mathematics major with a minor in innovation, and my career interests center around consulting, tech, data analytics/business intelligence, and product management. I want to build a strong technical foundation, using tools like Python and SQL to interpret and clean data, while also developing the client-facing and strategic skills that come with consulting and product work. REM's three-stage development process is exactly the kind of hands-on environment that would let me grow in all of these directions at once, rather than having to pick just one lane too early.\n\nI've talked to a lot of members on REM, such as Max, Terren, Hannah, Eli, Ali, and Lexi. They all share one dynamic trait, which allows them to have such promising careers within a close community: they push one another to be better every single day. This is something I strive to look for within clubs, jobs, and even groups of friends. Hannah Lockwood shared a story with me about case prepping with my fraternity brother, Dylan Cannella, to land their current 2027 internship at McKinsey. That story really stood out to me, because I love surrounding myself with members who continue to push themselves and grow beyond what's comfortable. That mentality carries far beyond just landing a job; it shapes how you approach life as a whole.\n\nTo further expand on this, I believe REM will allow me to continue pushing myself beyond my limits while working alongside like-minded individuals who are chasing similar goals in consulting, tech, and analytics. By the end of my time in REM, I want to walk away with sharper fundamentals across these interest areas, a stronger network of people who hold me accountable, and a clearer sense of which of these paths, consulting, tech, data, or product, is the right fit for me long-term.","position":"Junior Consulting Strategist","skills":"Statistics and modelling, Data analysis, Python, Design Thinking, Machine Learning","accommodations":"N/A","other":"Thank you again for this opportunity!","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/3/2026 19:03:41","spokeTo":"Max Kaplan, Hannah Lockwood, Eli Koon, Terrence Smith, Ali Musla"}],"infoSession":{"timestamp":"9/3/2026 22:01:36","session":"09/03","appliedBefore":"Yes"},"meetMembers":null}},{"id":"a101_baddeeac","timestamp":"9/4/2026 14:21:06","name":"Quinn Kelley","email":"qkelley@ufl.edu","phone":"5716551248","gender":"Male","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/quinn-kelley-274688328/","resume":"https://drive.google.com/open?id=1ZqhMfM_hmsCgYAhnfPcGCLeinW4h8i0V","university":"University of Florida","gradYear":"2028","classYear":"Junior","major":"Engineering (various disciplines)","minor":"Biological Sciences (e.g., Biology, Chemistry, Physics)","gpa":"3.98","whyRem":"My college career has consisted of technical engineering training. I want to join Rem on campus to grow in another intellectual field which will support me in my career goals. Also, before attending the interest meeting, I thought Rem on campus was just a regular consulting club. After learning about the commitment to our community and the positive impact I could make in Gainesville, I was even more excited about the opportunity to join.","coreValue":"Intellectual Growth","valueEssay":"Intellectual growth stands out to me the most as curiosity is one of my best qualities. One of the main reasons I want to learn more about consulting is because of my level of curiosity about different fields. An example of intellectual growth for me was my internship this past summer. I worked on a probabilistic risk assessment team (PRA) for a nuclear operating company. Although I am a nuclear engineer, I have had zero training on PRA and knew nothing going into the internship. My curiosity and passion for intellectual growth allowed me to quickly understand the role of a PRA engineer and I eventually provided a deliverable to update the companies PRA success criteria for one of their nuclear power plants. I plan to take this same passion for intellectual growth as a junior strategist for Rem on Campus.","careerInterests":"Consulting, Entrepreneurship / Startups, Public Policy / Government","howRemHelps":"I believe joining Rem on Campus will give me the opportunity to learn how actual businesses operate in the real world and the tools to optimize their operation. This knowledge will undoubtedly help me in whatever career path I go down.","position":"Junior Consulting Strategist","skills":"Statistics and modelling, Data analysis, Python, Microsoft Office Suite","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":{"timestamp
