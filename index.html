tive and technical skills, while my experience at Inveready showed me how data and technology can support business and investment decisions. However, I want to become better at taking analysis one step further: understanding a business problem, identifying what really matters to the client, and turning that analysis into a practical recommendation.\n\nWorking with small businesses through Rem would give me exposure to different industries and challenges while developing skills that are relevant across consulting, investing, technology, and entrepreneurship. I am particularly excited about learning how to structure ambiguous problems, communicate recommendations clearly, and work closely with a team and a real client. I believe those experiences would help me understand where I can create the most value professionally while building a much stronger business perspective alongside my technical background.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Statistics and modelling, Mobile development, Web design, Data analysis, Videography, Photography, Finance and accounting, HTML, Python, R, Machine Learning, SQL, Power BI, Tableau, Financial Modelling & Valuation, C++, C#, Git/GitHub", "accommodations": "No accommodations needed at this time. Thank you.", "other": "As an international exchange student, I am spending the full academic year at UF and am very intentional about getting involved beyond the classroom. I believe my background in engineering and AI, combined with previous experience in asset management and studying in different international environments, allows me to bring a different perspective to a team. I am also a very curious and committed person, and I genuinely enjoy learning from people with backgrounds different from my own. If selected, I would be excited to contribute actively to Rem throughout the semester and make the most of the opportunity to work with real businesses and the UF community.", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a61_d2e9ed68", "timestamp": "9/3/2026 18:10:01", "name": "Kashvi Aggarwal", "email": "k.aggarwal@ufl.edu", "phone": "321-391-2553", "gender": "Female", "race": "Indian or Indian American", "linkedin": "https://www.linkedin.com/in/kashviagg/", "resume": "https://drive.google.com/open?id=1FWPTArbWKuJIJabpCPvNxEW98rjCL2p6", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Finance", "minor": "", "gpa": "3.34", "whyRem": "I want to join Rem on Campus as a Junior Strategist because working with Life in a Bottle, a small juice company in Gainesville, showed me how meaningful it is to help a local business grow. I managed the company\u2019s social media, organized promotional pop-ups, and engaged directly with potential customers at farmers\u2019 markets, which allowed me to understand both the operational and personal sides of a small business.\n\nWhat I valued most was seeing how my work affected Willie, the owner. After I designed branded T-shirts for Life in a Bottle, he sent me pictures of himself smiling while wearing one at the farmers\u2019 market and told me that customers had been complimenting it. Seeing him proudly wear something I had created made the work feel much more personal. I experienced that feeling again when I pulled up the company\u2019s social media analytics and showed him that our content had reached more than 13,000 views in 30 days. His face immediately lit up, and he said, \u201cAll of Gainesville is going to know us.\u201d He also told me that the modern perspective I brought to the company was helping him reach people he had not known how to reach before. His reaction meant more to me than the number itself. Watching him become more excited and confident about a business he had poured so much of himself into was what made the experience genuinely fulfilling.\n\nRem on Campus\u2019s structured consulting program would help me turn that motivation into a broader skill set. As a Junior Strategist, I would bring my experience in marketing and customer engagement while learning alongside a team to analyze unfamiliar business challenges and develop recommendations tailored to each owner\u2019s goals. I am excited by the opportunity to grow into a more well-rounded problem-solver while helping other owners experience the same pride and optimism I saw in Willie.", "coreValue": "Resilience", "valueEssay": "Resilience stands out to me because I learned that one setback does not erase all the work that came before it.\n\nI experienced this while planning my Eagle Scout project to build a butterfly garden at a local park. A week before the scheduled date, a hurricane left the park flooded, muddy, and covered with fallen branches, making it unsafe for the project to continue. I felt overwhelmed and disappointed because it seemed like all the effort I had put into planning had suddenly gone flat. I was also worried about losing volunteers, delaying the materials, and disappointing everyone who had committed to helping.\n\nInstead of letting those concerns stop the project, I focused on what needed to happen next. I informed the Scouts and adult leaders about the cancellation, spoke with the city parks manager, rescheduled the delivery with our material suppliers, and ensured everyone understood the new plan. Because everyone remained informed and cooperative, the rescheduled project ran smoothly, and seeing the completed garden felt like the culmination of everything I had worked toward throughout Boy Scouts.\n\nI later applied this same mindset at UF when more than 160 students arrived at the Student Government Print Lab before a career fair and only one printer was functioning. Although I felt overwhelmed, I focused on what I could control by organizing the line, troubleshooting the equipment, and contacting Reitz Union and IT staff for assistance. Every student ultimately left with a resume, showing me how the resilience I developed through Boy Scouts continues to guide me professionally.", "careerInterests": "Consulting, Brand Strategy, Tech, Technology or Software Sales", "howRemHelps": "I want to pursue a career in sales, but I am still exploring which industry and type of client I want to work with within that realm. I see consulting as closely connected to sales because both require uncovering a client\u2019s needs, understanding the reasoning behind their decisions, and communicating a solution that fits their situation. Through the GatorSLAM Sales Team, I am currently developing the interpersonal side of this process by learning how to conduct discovery calls, ask purposeful questions, and connect a solution to a prospect\u2019s needs. Rem on Campus would complement that experience by strengthening the business knowledge behind those conversations.\n\nWorking directly with small business owners would allow me to understand how they evaluate decisions, balance limited resources, and consider the effects of a problem across their finances, operations, and customers. I would learn how to evaluate the information gathered during client conversations, identify the root of a business problem, and turn those findings into practical recommendations customers deserve. Exposure to businesses with different models and customer bases would help me determine which area of sales interests me most while preparing me to approach future clients with both strong communication skills and a deeper understanding of their businesses.", "position": "Junior Consulting Strategist", "skills": "Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Business Strategy, Search Engine Optimization (SEO), Photography, Social media management, Python, Brand Development", "accommodations": "N/A", "other": "N/A", "commitment": "Yes", "attendance": {"coffeeChats": [{"timestamp": "2026-09-03T17:39:43.481000", "spokeTo": "Pablo, Adam, Lexi"}], "infoSession": null, "meetMembers": null}}, {"id": "a62_98391f4c", "timestamp": "9/3/2026 18:49:55", "name": "Rajveer Chavan", "email": "rajveerchavan@ufl.edu", "phone": "+1 (352) 772-1477", "gender": "Male", "race": "Indian or Indian American", "linkedin": "https://www.linkedin.com/in/rajveerchavan20/", "resume": "https://drive.google.com/open?id=1pu8PTKepi7qwSqzCCELDSlc_uwc1jF_j", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Economics ", "minor": "", "gpa": "N.A. (3.98 HIgh School GPA - 42/45 IB) ", "whyRem": "I wish to join Rem on Campus because Rem works with small business that have real problems without a team to solve it for them. More than big corporations, smaller business are the ones that require real consulting and help to fix messy problems. That's the kind of experience and knowledge I wish to obtain before I graduate. I feel like working with smaller businesses will teach me to become more patient, composed, a better listener and ultimately a better consultant. My long term plan is to get into healthcare administration and gaining consultation experience will be extremely valuable to my professional development. I also wish to work alongside like-minded individuals and learn more from my peers and team leaders and adopt a useful quality in my work and life from every person around me. ", "coreValue": "Empathy", "valueEssay": "Empathy stands out to me because I find it a lot easier to work if I actually understand what people need instead of what I think they need. It requires one to be a careful listener and an open-minded individual. When I ran the training program for underprivileged village girls in India, what mattered more than the fitness or logistics was understanding why a lot of them didn't think they could finish something like a 320km ride, and building the program such that they could develop confidence in themselves. I saw the same thing when I was organising health camps around my city. People struggled to trust the doctors more than the information that was fed to them and thats my biggest fear. I wish to be a careful listener and earn someone's trust by proving to them that I understand what they're communicating and what they need. That's why I wish to pursue healthcare administration as a career because systems such as healthcare only work when people running them understand the needs of the people using them and thats why empathy stands out the most to me. ", "careerInterests": "Consulting, Entrepreneurship / Startups, Non-Profit / Social Impact, Medicine, Healthcare Administration ", "howRemHelps": "Rem would let me see how a real organisation actually runs day to day. I wish to gaine xperience working with real budgets, operational concerns and decision making processes which is what will help me when I run a healthcare organisation later. My clinical consulting internship gave me real insight onto how consulting operations look like. I deeply enjoyed the process of working with a business with a real problem, digging into it, and present them with actionable findings. Rem would allow me to do the same except with real guidance, a team and coaching instead of going at it alone. ", "position": "Junior Consulting Strategist, Consulting Strategist", "skills": "Business Strategy, Statistics and modelling, Brand Development", "accommodations": "N.A", "other": "N.A", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a63_8bef0745", "timestamp": "9/3/2026 19:18:07", "name": "Hamza AbuOleim", "email": "abuoleimhamza@ufl.edu", "phone": "(813) 593-2188", "gender": "Male", "race": "Middle Eastern or Arab", "linkedin": "www.linkedin.com/in/hamza-abuoleim", "resume": "https://drive.google.com/open?id=1i5UOI_Wcs5K1ZPEJUC423C6ot52Y2ydx", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Finance", "minor": "", "gpa": "N/A (freshman) Highschool GPA: 3.76", "whyRem": "Joining Rem on Campus aligns directly with my commitment to creating spaces where people feel engaged and supported. Having led event logistics and financial tracking for a community giving circle nonprofit and founded a student diversity leadership board in high school I've learned how valuable community and belonging is. I know great ideas require structure and execution to survive. Rem offers the collaborative experience I need to refine my leadership and innovative skills enabling me to help make my communities stronger.", "coreValue": "Community", "valueEssay": "The value of community centered collaborations connects deeply with both my personal and professional background. Growing up in an immigrant family and founding the Student Diversity Leadership board taught me that sustainable impact happens when you listen first and build alongside the community, rather than imposing outside solutions. My financial operations and event work at 200 Muslim Women Who Care was never just about logistics. It was about ensuring the people in our community felt supported. ", "careerInterests": "Investment Banking / Finance, Non-Profit / Social Impact", "howRemHelps": "Joining Rem on Campus will help bridge my technical interest in finance with my long term commitment to social impact. My career goal is to work with capital allocation and community development ensuring that mission driven ventures have financial structure and the operational strategy needed to scale. Rem's consulting model offers the ideal environment to apply analytical skills directly to local businesses and non profits. Rem's Learning, Applying, Leading framework will help me develop my advisory skills and evaluate operational models in the real world enabling me to keep my communities and community focused organizations thriving.", "position": "Junior Consulting Strategist", "skills": "Statistics and modelling, Data analysis, Marketing and analytics, Finance and accounting", "accommodations": "", "other": "", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a64_6785e8e0", "timestamp": "9/3/2026 19:27:22", "name": "Jordan Altman", "email": "altmanj@ufl.edu", "phone": "2394518323", "gender": "Male", "race": "White or Caucasian", "linkedin": "N/A", "resume": "https://drive.google.com/open?id=1-q-8XkoundYcXy7jtoZTPZSgxdzTHVhw", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Business Administration", "minor": "", "gpa": "N/A", "whyRem": "I believe it would be a valuable opportunity for me to learn important skills in consulting and meet and build connections with new people.", "coreValue": "Intellectual Growth", "valueEssay": "I have always enjoyed learning new things regarding just about anything throughout my life. I know I have a lot to learn regarding consulting and business in general, and being a member of Rem on Campus would be an invaluable opportunity for intellectual growth.", "careerInterests": "Consulting, Investment Banking / Finance, Data Analytics / Business Intelligence, Public Policy / Government, Undecided / Exploring Options", "howRemHelps": "Rem would allow me to develop important knowledge, skills, and community for me to pursue many of the various career interests that I am considering at the moment. Particularly, the developments I would make in Rem would be hugely beneficial to possible careers in consulting, finance, and data analytics.", "position": "Junior Consulting Strategist", "skills": "Statistics and modelling, Data analysis, Social media management, Microsoft Office Suite", "accommodations": "Nothing in particular", "other": "I would be hugely honored to be accepted into and be a part of Rem. I also consider myself very good at memorizing information and statistics. ", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a65_0ecc4a04", "timestamp": "9/3/2026 19:47:22", "name": "Amanda Liu", "email": "liuamanda@ufl.edu", "phone": "(954)-471-1145", "gender": "Female", "race": "Asian or Asian American", "linkedin": "https://www.linkedin.com/in/amandaliu06", "resume": "https://drive.google.com/open?id=1oVW-H6MNZczEObn7uzcrxAyWaFkZvQnz", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Business Administration", "minor": "", "gpa": "3.82", "whyRem": "I want to be a member of Rem because supporting and working with local businesses to resolve their issues and helping them stay connected to the communities they serve is important to me. Joining an organization of like-minded peers with a focus on serving the community is something that I highly value and seek. Rem provides a unique opportunity with real-world work, showing firsthand the value of using business acumen for good. I hope to contribute to this organization\u2019s efforts in creating modern, effective solutions that address the issues businesses face.", "coreValue": "Community", "valueEssay": "Community is the core value that is most important to me, as it has shaped a lot of my experiences growing up. Working in my family\u2019s restaurant showed me how important the relationship between local businesses and the larger community can be. These spots help shape the identity of the local area and are reliant on the local community\u2019s support to continue to succeed. \nI watch how my parents were able to build long-lasting relationships with customers and other local businesses, and how vital that was to their success. Seeing this showed me the importance of fostering connections with others and being there for the community around you. Community is a value that continues to guide how I interact with others, and it\u2019s one I hope to expand upon with Rem on Campus.\n", "careerInterests": "Consulting, Investment Banking / Finance", "howRemHelps": "My career interests are focused on consulting and finance, and Rem is able to provide me with experience that can positively impact my understanding of these fields.\nConsulting interests me as I enjoy working with others to solve important problems faced by clients and developing practical, individualized solutions to help organizations and their operations. Rem allows for the chance to work with a local organization, with real issues that need to be solved, and with a real client, giving firsthand experience in this field. Finance interests me for the analytics and the opportunity to understand how businesses grow, adapt, and make important financial decisions.\nRem would allow me to apply the business concepts I am learning in class and through self-study to real situations. Rem provides an opportunity to build skills applicable to these two fields while staying connected and working in a group to help guide the path.   \n", "position": "Junior Consulting Strategist", "skills": "Photography, Finance and accounting, Microsoft Office Suite", "accommodations": "", "other": "", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a66_83ef9813", "timestamp": "9/3/2026 20:03:15", "name": "Sterling Livingston", "email": "s.livingston1@ufl.edu", "phone": "813-390-0439", "gender": "Male", "race": "White or Caucasian", "linkedin": "www.linkedin.com/in/sterlinglivingston", "resume": "https://drive.google.com/open?id=1jTsE-lsIQd3dpV9pLIhamMF2m8h-GRvS", "university": "University of Florida", "gradYear": "2028", "classYear": "Junior", "major": "Engineering (various disciplines)", "minor": "Other", "gpa": "3.81", "whyRem": "I came to UF with the intention of pursuing a career in the medical field, based on my want to make a positive change in the lives of the people I worked with. However, after getting more experience in the medical field, I learned that I am more interested in pursuing a career where I could help optimize and add value to existing businesses. I learned about consulting, and I wanted to get involved with an organization that would give me the ability to start helping real businesses and hone essential consulting skills. I learned that REM is made up of a community of people who have already made a difference in many businesses and really care about helping members succeed in consulting.\n\nNot only will being a member of REM help me develop consulting skills, but it also gives me an opportunity to give back to local businesses in Gainesville. I resonate with REM's mission of helping local businesses that give Gainesville its character and make it feel like a home. Being a part of an organization that creates visible impacts in the Gainesville community would be incredibly rewarding and an invaluable experience for me. I would also like to be a member of a tight-knit community made up of other driven individuals looking to create change and be successful in their careers. I believe that the social events that REM holds outside of consulting operations help build lasting connections that I can have past college and keep throughout my career.", "coreValue": "Community", "valueEssay": "I believe that everyone is a product of their environment. The community that you choose to surround yourself with shapes both your everyday life and your future. In the past, the communities I have been a part of\u2014my swim team, my school community service organization, and the community of people I have around me now\u2014have pushed me to grind for a new personal record in the pool, go out and serve the homeless in my community, and apply to join new organizations that will help in my career. Without these communities of people, I would not be in the place I am today. In my professional career, I would like to have a client-facing role where I have the opportunity to interact and build genuine relationships with clients. Joining REM would allow me to connect directly with business owners and improve my ability to form authentic relationships in business. REM is a community of driven leaders, and being a member would motivate me to grow personally and professionally while also greatly benefiting my professional journey.", "careerInterests": "Consulting, Marketing, Brand Strategy, Tech, Entrepreneurship / Startups, Product Management", "howRemHelps": "Given the opportunity to join REM on Campus, I would be a member of a highly motivated network of leaders focused on gaining experience in consulting and similar business fields. The mentorship, valuable guidance, and knowledge of the recruitment process that older members have would give me a huge advantage when applying to internships and consulting jobs. Additionally, REM's visits to top consulting firms in the Southeast would allow me to connect with consulting professionals. This would expand my network, give me insight into the daily expectations of a consultant, and highlight the culture of each firm.\n\nGaining hands-on experience in consulting through work with businesses in Gainesville would also help me build confidence in myself and my ability to deliver solutions that have a real impact on business outcomes. I would also have the chance to sharpen my skills in professional communication, relationship building, and project management. The well-connected network and concrete skills I would develop as a member make REM the best organization I could be a part of to achieve my career goals.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Statistics and modelling, Back-end web development, Web design, Python, Microsoft Office Suite, Brand Development", "accommodations": "No", "other": "I would like to pursue client facing role in business. I am fully committed to consulting, and I am really interested in getting involved with case competitions and real business projects.", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a67_4cad0215", "timestamp": "9/3/2026 20:15:35", "name": "Lucia Paras", "email": "luciajparas@icloud.com", "phone": "864-395-2547", "gender": "Female", "race": "Asian or Asian American", "linkedin": "www.linkedin.com/in/luciaparas", "resume": "https://drive.google.com/open?id=1vzjjJmw4QzBPLiiTGkHe5NJHU4rTdItH", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Other Social Science (e.g. Psychology, Sociology, Anthropology)", "minor": "Business Administration", "gpa": "3.9", "whyRem": "I am still exploring different business professions, and Rem on Campus would give me the opportunity to experience different business aspects ranging from consulting, market strategy, and brand building. Moreover, I love how Rem on Campus incorporates all these aspects and more into a meaningful project that it is happening locally. I would also want to be a member of Rem on Campus because I would get to connect with others from various colleges here at the University of Florida. Whether it is through the members or the businesses, I believe that Rem on Campus offers a diverse array of people and experiences. After attending the information session and speaking with Hannah, we were able to connect over having majors outside of Warrington. During our conversation, she was able to give me insightful advice and direct me towards new resources. It was clear to me that Rem on Campus greatly values connecting with one another on a deeper level. Through these connections, I can broaden my understanding and learn new perspectives which can then be applied to whatever business career I may pursue. Overall, I would love to be a member of Rem on Campus because I would get the opportunity to explore my passion for business while knowing that I was helping someone within the community while also building a community of my own within the organization.", "coreValue": "Empathy", "valueEssay": "I believe that empathy is the foundation to most things in life. Over the summer, I had an internship at a hospital research department. I was not working hands on with patients, but I was hearing stories from the other interns. One told me how he had some preconceived notions about an underprivileged patient. He was shocked when he met the patient, and she was one of the kindest patients he had met. After the fact, he was explaining how he should have had more empathy and not to have made assumptions. Even though I did not experience the situation firsthand, I still empathized with the patient through my peer. However, I also empathized with my peer since it was a new situation, and he was still able to learn from it. This can be applied to working with Rem on Campus since when working with a variety of clients, it is easy to make assumptions regarding what is best to do and to cast judgement even without knowing the whole situation. Thus, it is essential to empathize and show compassion. While I may not fully understand the situation at hand, I can still listen and try to see their side of the story. Moreover, empathy does not just extend to the clients, but to the other Rem strategists and leaders. Certain cases will be far from what is imagined, but I know empathizing and encouraging one another through tough times is essential. ", "careerInterests": "Consulting, Brand Strategy, Entrepreneurship / Startups, Product Management", "howRemHelps": "Through hands on experience, I will be able to explore my interests regarding consulting, brand strategy, entrepreneurship, and product management since I will have the opportunity to strengthen my communication and develop my strategic thinking. Moreover, at the information session, I learned about the mentor-mentee program. Through this program, I can gain new knowledge and perspective from the other members regarding their business experiences. By joining Rem on Campus, I will be able to achieve my career goals since I will develop a variety of skills that can be applicable to whatever career path I may pursue in the future.", "position": "Junior Consulting Strategist", "skills": "Statistics and modelling, Marketing and analytics, Photography, Social media management, Microsoft Office Suite", "accommodations": "", "other": "I was originally a biology major on the premed track; however, over the summer, I started taking classes for my business minor since I was uncertain on whether medicine was what I truly wanted to do, and I fell in love with microeconomics. It was a class I greatly enjoyed, and I loved how applicable it was to the real world. Thus, after debating on switching my major for the past six months, I finally made the switch this fall. Since then, I have been exploring possible career paths involving economics, and when I came across Rem on Campus, I felt like it perfectly matched my love for economics with business and community. ", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a68_10bbe873", "timestamp": "9/3/2026 20:18:58", "name": "Victoria Maltezos ", "email": "maltezosvictoria@gmail.com", "phone": "561-403-9187", "gender": "Female", "race": "White or Caucasian", "linkedin": "N/A", "resume": "https://drive.google.com/open?id=1TM7vll9_lgXBY-MbWeB5YIRWvQHBz8S9", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Business Administration", "minor": "", "gpa": "4", "whyRem": "I want to join Rem on Campus because it offers a unique opportunity to bridge my academic interests in business with practical, client based experience. The opportunity to work directly with small businesses, evaluate real business challenges, and develop strategic recommendations would allow me to gain a deeper understanding of how businesses make decisions and identify opportunities for growth.\n\nMy interest in this work is also personal. Having gained experience working within my family\u2019s business franchises in South Florida, I have seen firsthand the importance of effective operations, customer relationships, marketing, and strategic decision making to a company\u2019s long term success. I want to build upon that experience by learning how to approach business challenges from a more analytical and consulting oriented perspective.\n\nAs a Business Administration student, I am particularly focused on developing my skills in strategy and marketing. I want to learn how to evaluate a business\u2019s current position, identify areas for improvement, and develop strategies that effectively address its goals and challenges. The opportunity to conduct research, analyze business needs, collaborate with a team, and present recommendations to clients would allow me to strengthen these skills in a real world setting. I would also value the opportunity to learn from experienced members, contribute my own perspective, and work alongside other motivated students while supporting local businesses. Ultimately, I see Rem as an opportunity to develop into a more strategic and well rounded business professional while creating meaningful value for the Gainesville community.", "coreValue": "Intellectual Growth", "valueEssay": "Intellectual growth stands out to me because I want to become better at understanding the reasoning behind business decisions, not just learning what the decisions are. Working in my family\u2019s franchise business has given me firsthand experience with how an established business operates, but it has also made me realize how much I still want to learn about evaluating challenges and determining the best way to move a business forward.\n\nI want to develop the ability to look at a business problem, ask the right questions, and think through different possible solutions before deciding what approach makes the most sense. I believe working with different businesses through Rem would challenge me to do that in situations that are unfamiliar to me and help me develop a more thoughtful and strategic way of thinking.", "careerInterests": "Consulting, Marketing, Brand Strategy, Entrepreneurship / Startups", "howRemHelps": "Joining Rem on Campus would give me the opportunity to help small businesses turn their ideas and goals into sustainable businesses. I am drawn to the idea of being involved in the process of helping an entrepreneur take their vision and determine what it will take to make that vision successful. While my experience in my family\u2019s franchise business has shown me what it takes to operate an established business, Rem would allow me to see the other side of entrepreneurship and learn how businesses can be built, strengthened, and grown.\n\nWorking directly with small businesses would teach me how to identify opportunities, recognize potential challenges, develop practical strategies, and connect business owners with the right resources when needed. I believe that learning through these experiences would give me knowledge I can carry into my own future, whether I pursue entrepreneurship or eventually take on a larger role in my family\u2019s business. I want to understand not only how a business operates, but how you help turn someone\u2019s vision into a business with the foundation to succeed.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Marketing and analytics, Social media management, Communications and copy-writing, Brand Development", "accommodations": "I do not need any accommodations at this time.", "other": "I originally planned to attend UF Online, but after deciding that I wanted to pursue my education in person, I chose to move to Gainesville and become more involved in the UF community. In the meantime, I am completing my remaining business prerequisites online through my community college in Boca Raton, with the goal of transferring into UF\u2019s Business Administration program in the fall.\n\nI hope my current school status does not influence your decision, as I am confident in my ability to contribute and succeed within Rem. (:", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a69_d169f540", "timestamp": "9/3/2026 20:31:37", "name": "Lia Prosperino", "email": "prosperinol@ufl.edu", "phone": "9145629600", "gender": "Female", "race": "White or Caucasian", "linkedin": "https://www.linkedin.com/in/liaprosperino/", "resume": "https://drive.google.com/open?id=1r2ltwG9I4EeVh3JE4Mvu5666gcHN5S61", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Finance", "minor": "", "gpa": "3.84", "whyRem": "I\u2019m interested in becoming a member of Rem on Campus due to the opportunity to connect my interests in problem-solving and business to meaningful work in the Gainesville community. Although Rem's strong collaborative culture is what initially stood out to me, my conversations with Hannah and Eli provided me with a better understanding of the organization's dedication to helping local businesses thrive. The idea of working with individual clients to understand the challenges they face and develop solutions appeals to me greatly. This kind of practical experience will enable me to hone my analytical and problem-solving skills while learning about how different businesses approach growth and decision-making.\nAs I strive to pursue a career in corporate finance, I know how important it is to comprehend how financial decision-making impacts the strategic direction of a business. I strongly believe Rem will help me gain this valuable experience by applying what I learn in the classroom to real-world business problems.", "coreValue": "Intellectual Growth", "valueEssay": "Intellectual growth stands out to me because I have seen first-hand how pushing yourself outside of your comfort zone can teach you some of the most impactful lessons. I began my journey at UF on a pre-health track, but throughout the past year I took the opportunity to explore my interests, gain new experiences, and grow both personally and professionally. Through all of this, I came to understand the importance of staying flexible while constantly challenging myself.\nAs I have developed a deep passion for business and finance, I have become especially interested in consulting and the idea of solving problems to help others. I enjoy working through complex problems, exploring various opinions on an issue, and finding real solutions. I know that there is so much more for me to learn about the world of business, which is why I see so much value in the opportunity to think critically, ask questions, and learn from those around me. Joining Rem on Campus would allow me to apply my skills to real-life business problems, contribute to the Gainesville community, and continue developing the intellectual curiosity and problem-solving skills necessary to grow as a young professional.", "careerInterests": "Investment Banking / Finance, Undecided / Exploring Options", "howRemHelps": "Rem On Campus will play a crucial role in my career goals by allowing me to apply my knowledge in business and finance to real-life problems faced by small businesses. In the future, I hope to build a career in corporate finance in either the sports or entertainment industry. Therefore, I find it so important to gain insight on how financial decision making impacts business strategy. While finance plays a crucial role in resource allocation, I also want to understand how those decisions affect operations, growth opportunities, and the long-term success of a business.\nThrough Rem, I will be able to improve my problem-solving skills and learn how to assess the challenges of a business while providing effective solutions within a team. At the same time, working with various clients from different industries will help me understand how businesses operate and make decisions depending on the industry. Rem on Campus will provide me with hands-on experience in applying my knowledge to solve real-world business problems and gain the skills required for a successful career in corporate finance.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Data analysis, Social media management, Finance and accounting, Microsoft Office Suite", "accommodations": "", "other": "I am a person who enjoys meeting new people, getting to know them, and putting myself in environments that force me to grow. I'm excited about the opportunity to join REM on Campus as it will give me the chance to collaborate with like-minded individuals - people who are ambitious, supportive and genuinely want to see each other succeed. ", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a70_74d7244e", "timestamp": "9/3/2026 20:51:03", "name": "Lydia Phanitdasack", "email": "lydia.phanitdasa@ufl.edu", "phone": "5615621262", "gender": "Female", "race": "Asian or Asian American", "linkedin": "www.linkedin.com/in/lydiaphanitdasack", "resume": "https://drive.google.com/open?id=1cwGMAh_OeI-EnqFoep4Ny1A493gQMniw", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Management", "minor": "", "gpa": "3.6", "whyRem": "I hope to gain professional casework experience while developing practical skills I can carry into my career. I look forward to working on cases hands-on rather than theoretically. Getting the opportunity to solve complex problems, such as helping a company build out its marketing strategy, will deepen my skills for my future endeavors. Long-term, I plan to build a career in consulting and brand strategy, and I know Rem is exactly the kind of environment that will help me sharpen those skills early on\n\nMy recent experience working within 180 Degrees Consulting made me realize that this was the path for me, and after coffee chatting with multiple people in the industry, I knew I wanted more hands-on work. This is why I want to focus on the for-profit space for now, as it more closely aligns with where I see my career heading long term.\n\nMost importantly, having the opportunity to work with driven and hardworking people excited to make a difference is something I look forward to. Rem and Company will allow me to work closely with diverse members and refine both my interpersonal and technical skills.", "coreValue": "Community", "valueEssay": "Community stands out to me because, as humans, we need human connection; one may even say it is crucial to our survival. Having a sense of community allows individuals to feel at home, welcomed, and understood. I hope that by surrounding myself with a community as driven as Rem and Company, I will not only feel motivated, but also disciplined in my work ethic, pushing myself to grow alongside people who hold the same standards I hold for myself.\n\nThis value shows up in how I approach my relationships more broadly. I am someone who always pushes for team bonding, whether that's in a club, a project group, or a friend group, because I genuinely believe strong relationships are the foundation of good work. I find myself craving that touchpoint with my friends and family if we go too long without talking, and I bring that same energy into how I connect with others professionally. I hope to carry that into our client meetings as well, building lasting relationships by being welcoming and friendly, so clients feel like they are working with people who genuinely care about them, not just delivering a service.", "careerInterests": "Consulting, Investment Banking / Finance, Marketing, Brand Strategy", "howRemHelps": "Joining Rem on Campus will help me build the hands-on casework experience I need to move confidently into the recruiting cycle and client-facing work after graduation. I run my own freelance photography and videography business, creating product shots, branding visuals, and brand kits for local businesses, so working on real client cases will sharpen skills I already rely on, like understanding a brand's identity and translating a client's vision into a finished product. Seeing how a consulting team approaches a branding or marketing problem will give me frameworks I can bring straight back into how I pitch and present my own work, and being surrounded by people who think critically about business strategy will push me to treat my business less like a hobby and more like something I'm building intentionally.\n\nRight now I'm drawn to several areas, including consulting, finance, marketing, and brand strategy, but I haven't fully narrowed down which one I want to build my career around. That's actually a big part of why I want to join Rem. Getting exposure to different types of cases across industries will let me figure out where my strengths and interests actually line up, instead of guessing from the outside.\n\nBeyond the technical experience, being part of a team of driven, hardworking, and like-minded people will keep me accountable and motivated, and I know the relationships I build here will carry into how I show up with future clients and colleagues.", "position": "Junior Consulting Strategist", "skills": "Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Business Strategy, Web design, Marketing and analytics, Search Engine Optimization (SEO), Videography, Photography, Social media management, Microsoft Office Suite, Ads (Facebook/Instagram)", "accommodations": "N/A", "other": "I am currently a part of 180 Degrees Consulting, but would fully transfer over to REM if accepted.\n\nI've had the chance to speak with several members, including Satya Sakamuri and Luke Nevins, both of whose passion for Rem is honestly contagious.\"", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a71_1d26fc37", "timestamp": "9/3/2026 21:05:23", "name": "Jack McNamee", "email": "jack.mcnamee@ufl.edu", "phone": "901-236-8892", "gender": "Male", "race": "White or Caucasian", "linkedin": "https://www.linkedin.com/in/jack-mcnamee-309127382/", "resume": "https://drive.google.com/open?id=1Q2PLFtrME_qkcuIgtIoQlJM06ZzUrYaU", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Finance", "minor": "", "gpa": "3.77", "whyRem": "     I want to become a member of Rem on campus because it offers the unique opportunity to gain real-world business experience while making a tangible impact on the community. As a finance student, I have the foundational knowledge and skills surrounding business operations and decision-making, but Rem would provide me with the opportunity to apply that knowledge to real challenges faced by small businesses. \n     I am also attracted to the global reputation Rem has built after just a few years, and I am excited to join an organization that creates an impact far beyond the Gainesville community. I am eager to surround myself with like-minded individuals who are motivated to use the skills they have gained in the classroom and apply them to real-life situations. Building relationships with these students, small business owners, and professionals who I will learn from will expose me to new perspectives valuable both now and long into my future career. \nLastly, the three-phase professional development model of learning, applying, and leading stands out to me, and I can visualize myself progressing through it to challenge myself and grow into a confident leader throughout my time at UF. The meaningful contributions I can make to the community in Rem while simultaneously developing in areas like building deliverables and presenting to clients is a unique opportunity unlike any other program I have come across. ", "coreValue": "Community", "valueEssay": "     Rem\u2019s mission of helping struggling small businesses is one I have seen firsthand and something I place great value in. Along the Jersey Shore, where I have spent every summer of my life, my family and I became close friends with the manager of a clothing store downtown who had originally grown up in Hungary. For years, he talked about his dream of opening a small restaurant in America with his wife, who was the head chef at a restaurant just down the street.\n     About two summers ago, they finally saved enough money to pursue that dream and opened a pop-up brunch shack selling breakfast sandwiches, coffee, and other quick casual eats. The G Spot, located in downtown Avalon, New Jersey, had finally opened, and we could not have been happier to see him achieve his lifelong dream. With just two employees- his wife as the chef and him working the counter and register- we were certain it would be a success. However, we quickly learned this was not the case, as it seemed many people were not even aware the restaurant existed. Watching him and his wife struggle after so many years of hard work was difficult to see and gave me a new perspective on the challenges small business owners face. As their marketing improved and word began to spread about both the restaurant and the owners\u2019 story, I began to see firsthand just how much the support of a community can impact a small business and the dreams behind it.\n     This experience is why the core value of Community at Rem stands out to me most. To me, community is leveraging your relationships and abilities to contribute to the success of those around you. Through Rem, I am excited for the opportunity to do exactly that by collaborating with other motivated students to help small businesses overcome challenges they may not be able to solve on their own.", "careerInterests": "Consulting, Investment Banking / Finance, Marketing", "howRemHelps": "     By joining Rem on Campus, I believe I will be well prepared for various facets of the business industry and ready to contribute to the success of the future company I work for and tackle any challenges we may face. By first learning problem-solving fundamentals through meetings and collaboration exercises, and then transitioning to applying that knowledge through opportunities like presenting to clients and developing strategic business recommendations, I will build the skills necessary to succeed in career paths such as consulting, finance, and marketing.\n     From a consulting perspective, the opportunity to analyze a real-world business, identify its challenges, and develop actionable solutions is a rare experience similar to the type of work I would handle professionally. Rem would also expose me to areas of finance through analyzing financial performance and understanding how strategic decisions can impact the success of a business. Additionally, evaluating customer behavior, competitors, and opportunities for growth would provide valuable experience applicable to a career in marketing. \n     Overall, Rem will help me achieve these career goals by allowing me to explore them through real-world application rather than simply learning about them in a classroom. The analytical, problem-solving, teamwork, communication, and leadership skills I develop through Rem will provide me with a strong foundation for whichever of these career paths I ultimately pursue.\n", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Statistics and modelling, Data analysis, Marketing and analytics, Finance and accounting, Brand Development", "accommodations": "N/A", "other": "N/A", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a72_a0c8d9cb", "timestamp": "9/3/2026 22:01:03", "name": "Praneeth Tallapaneni", "email": "ptallapaneni@ufl.edu", "phone": "9546375627", "gender": "Male", "race": "Asian or Asian American", "linkedin": "https://www.linkedin.com/in/praneeth-tallapaneni-359b67296/", "resume": "https://drive.google.com/open?id=1Lom5KLymxlH-4gBlAv3YbRg4G0XQql4-", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Finance", "minor": "", "gpa": "N/A", "whyRem": "Rem on Campus, in essence, is growth to me. Growth can be interpreted in many ways, and so can Rem. It is about the growth of my individuality; being a college student means I need to figure out what I want for my career and who I want to be in the future. I want to be around people that challenge me to be better, think outside the box, and give me ideas I would have never thought of before. I want to be a part of an inclusive community where I can grow professionally and personally, while learning from others with diverse backgrounds and mindsets.\n\nOn the other hand, growth also reflects my potential contribution to Rem. I do not just want to be a name on paper of an organization I believe in; I want to be a part of Rem\u2019s community that brings new ideas and collaborates to innovate the organization for the better. Rem\u2019s growth particularly attracts me because I want my college experience to be more than just preparation for my future career. I want to learn the necessary skills to contribute to Rem\u2019s mission and to eventually have a career that makes an impact.\n\nI have been especially motivated by the Bushel & Peck story that Sachin loves to tell. This story made me sure I want to do Rem. Brainstorming ideas for hours, finding the perfect solution, implementing it, and then checking up on the business in 3-6 months to see it in action and helping the company\u2019s operations and realize a tangible impact is idyllic. I want for myself a sense of fulfillment that comes from solving a case that doesn\u2019t end with just a presentation, but with a real solution that makes a difference. The idea that my work could directly create success of a company is something I find to motivate me. \n", "coreValue": "Innovation", "valueEssay": "Innovation stands out to me because I have always seen growth as challenging the status quo. To me, innovation is not limited to creating something out of nothing; sometimes, it is as simple as looking at a problem differently and coming up with something better than what we know. I believe I want to innovate throughout my college journey, and eventually, my future career.\n\n\nWhether I get into consulting, finance, law, or a non-profit, I can tell all of these fields involve me having to solve a problem. And as much as I want to learn, understand, and succeed in my field, I cannot ignore the fact that some things just do not work. If I look at something and think to myself, \u201cThis just works because it has always worked,\u201d I know I am not at my best. I believe Rem will give me the space to develop my innovative mindset because I think innovation is a skill that applies not only to my future profession but also to my personal life. I want to challenge myself and others to think differently and to innovate in all areas of my life. I hope Rem will inspire and motivate me to be a more innovative person.\n", "careerInterests": "Consulting, Investment Banking / Finance, Non-Profit / Social Impact, Law", "howRemHelps": "I think consulting, IB/Finance, non-profit/social impact, and law, although different, all require similar skills. I believe Rem will give me the opportunity to build the skill set I need for any of these fields while also helping me discover which one I want to focus on my future career.\n\n\nI want to actually learn skills from others and gain experience by collaborating with people who share a common ground with me. I think Rem will enable me to be in a position where I can learn from others and contribute to the organization while getting the real-world experience I need to have a fulfilling career in the field I chose. In my life, I think the most important thing I need to achieve my career goals is to be surrounded by people who challenge me, motivate me to be better, and support me throughout my journey. At this point in my life, I do not think I should have everything figured out yet. I want to be around people that give me the opportunities I need to explore and grow, so I can have a sense of direction and confidence in the decisions I make for my future career. I think Rem can enable me to do that while also preparing me for a sustainable career path that involves business and consulting with a purpose.", "position": "Junior Consulting Strategist, Consulting Strategist", "skills": "Business Strategy, Data analysis, Social media management, Finance and accounting, Ads (Facebook/Instagram)", "accommodations": "N/A", "other": "One thing I would like the Rem on Campus team to know is that I am someone who wants to maximize my experience with the opportunities I get. I do not want to be in an organization where I can just attend meetings and list that as an experience on my resume; I want to be around motivated people that allow me to contribute wherever I can. I also believe I have a lot to learn in college, and I think that is one of the things I look forward to most. I want to learn from people with more knowledge and experience than me, and I think Rem will give me the chance to do that. If given the opportunity to join Rem, I believe I will bring not only my knowledge and skills but also my motivation and enthusiasm to learn from the people I will be collaborating with, while also contributing to Rem\u2019s mission.", "commitment": "Yes", "attendance": {"coffeeChats": [{"timestamp": "2026-09-01T17:52:31.519000", "spokeTo": "Sachin, Sat (Sathya), Max, Hannah, Eli, Kyle, Christian"}, {"timestamp": "2026-09-02T17:06:42.869000", "spokeTo": "McKenzie, Reese, Aarohi, Maya"}, {"timestamp": "2026-09-03T18:03:22.367000", "spokeTo": "Colton, Adam, Ali, Hannah, Pratheek, Terren, Robert, Lexi"}], "infoSession": {"timestamp": "2026-09-02T00:21:32.949000", "session": "09/01", "appliedBefore": "No"}, "meetMembers": null}}, {"id": "a73_0ce29c50", "timestamp": "9/3/2026 22:38:59", "name": "Jared Robaina", "email": "jaredrobaina14@gmail.com", "phone": "3059042623", "gender": "Male", "race": "Hispanic or Latino", "linkedin": "https://www.linkedin.com/in/jared-robaina-9218a0370?utm_source=share_via&utm_content=profile&utm_medium=member_ios", "resume": "https://drive.google.com/open?id=1TOC4ulcoMoeO90ZdDJWO0gqwMzqI6MEM", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Finance", "minor": "Other", "gpa": "HS GPA: 3.97", "whyRem": "Throughout high school and within my community, I have already found myself solving problems for organizations that have had an immense impact on my life. Theater, for instance, was a passion and driving force for me throughout all four years of high school. However, we noticed that the shows we worked tirelessly to put on and the messages we were trying to spread weren\u2019t reaching the students and parents who needed to hear them simply because there was a lack of name recognition when we\u2019d do a less popular show. My director loved these shows, but the task of getting high schoolers interested in theater seemed daunting. This ultimately led to the creation of a dedicated marketing team that still exists today. Launch X opened my eyes to the immense waste that grocery stores cause each year, which led to Second Serve, a start-up founded on reducing food waste by using modern technology to avoid unnecessarily throwing away product whilst also providing customers with a discount, creating an avenue for accessible organic produce. This was special because it allowed me to work directly with small business owners, gaining insight into the decisions they make and listening to their problems and lived experience to refine our start-up concept.\n\nThese experiences made me increasingly interested in the reasoning behind business decisions, but I also felt like the decisions I was making were surface-level, and while success was there in the moment, I didn\u2019t make a thorough plan for sustainable growth. I want to understand why a strategy works, how it can be improved, and how to use tangible evidence to make a stronger, more long-term recommendation. \n\nRem, as an organization, would help me develop a more nuanced way of thinking while working in an environment where problem-solving and long-term strategy are preferred over short-term solutions. That interdisciplinary environment in Rem is particularly important to me because a lot of my previous problem-solving has been shaped by marketing data with a focus on creative work. I want to be challenged by teammates who may approach similar issues through the lenses of economics, technology, or other sectors that I wouldn\u2019t naturally consider. At the same time, I believe my own background would allow me to contribute a point of view that is more focused on consumer behavior and audience engagement. Learning from a separate perspective will further allow me to become a more analytical and disciplined problem-solver.\n\nI want to be a member of Rem because it will allow me to do both things I value most: support organizations in the surrounding community while becoming a more capable strategist myself. I am passionate about problem-solving and even more so when business is used to give back to those who support it in the first place. The opportunity to help small businesses with their challenges while finding purpose and leading with the intention to create change is the type of hands-on experience I am looking for at UF.\n", "coreValue": "Community", "valueEssay": "Finding a home where I was accepted has always driven my purpose in life. A community to me is much more than a group of people with common interests; it\u2019s where you can be authentically yourself and have a safety net of people who truly believe in you. These places of comfort have always fueled a passion for me to give back to the communities that made who I am in the first place, where I have a responsibility to make sure that the people who come after me feel true acceptance for who they are, the same way I did. \n\nTheater was the first place where I truly understood that. Throughout all four years of high school, being on stage became one of my biggest constants in life. Coming into my freshman year, I wasn\u2019t sure who I was or where I wanted to be,e but theater gave me that. It gave mesome ofe my closest friends that I would have never met without it, as well as an outlet to finally express my creative passions both on stage and behind the scenes, giving me a newfound confidence and identity. As I became more involved, I not only wanted to benefit from my community, but I wanted to strengthen it. I took on a role as a mentor for middle school theater students to pass on the self-confidence, leadership, and sense of belonging to other students who felt like they were lost or had to hide a part of themselves to fit in. At that point, what mattered to me was not a title but strengthening and opening the door a bit wider to a community that made me feel welcomed and helped me grow both socially and professionally.\n\nI found a similar sense of community through sewing. What began as a self-taught hobby quickly grew into another source of confidence for me. Altering clothing showed me that something as simple as changing the fit of a garment could truly affect how someone felt when they wore it. Dejar allowed me to alter other students' clothing and became a way for me to take something that had once empowered me and share that feeling with the surrounding community, allowing others to feel comfortable and confident in their own style.\n\nInstances like these are the reason why community is the Rem value that resonates with me the most. I feel fulfilled when I can support spaces that contributed to and believed in me first. Professionally, I want to carry a similar mindset when it comes to consulting clients. I do not want to approach organizations as solely a problem solver but rather understand the people behind them, the communities they serve, and the responsibility that comes when making recommendations that affect both. I want to bring the same instincts I developed in theater and through Dejar to learn from a community, invest in it, and leave it stronger than I found it.\n", "careerInterests": "Consulting, Marketing, Brand Strategy, Entrepreneurship / Startups, Non-Profit / Social Impact", "howRemHelps": "Up to this point in my professional journey, I\u2019ve explored the various career goals above separately or in pairs, but joining Rem would allow me to weave these various career goals into one cohesive vision. Rather than learning and applying each of these fields separately, Rem\u2019s interdisciplinary structure would allow me to see how these various facets of business intersect when working on the challenges that face an actual organization. \n\nFor consulting, Rem would offer me experience working in a professional team environment where the quality of my contribution is filtered, reflected on, and optimized. Beyond this, I want to further grow my confidence in client communication and build the skill of putting myself in the client\u2019s shoes. Furthermore, I want to become confident in my own ability to take ownership of deliverables and be able to explain the reasoning behind a recommendation to both my peers on a technical level and to clients on a practical level. Those are the experiences that would help me determine if consulting is a stepping stone to another career path or a field where I can genuinely see myself succeeding long-term. \n\nRem would also allow me to explore marketing and brand strategy on a deeper level beyond just a creative perspective. While I have already found a love for graphic design and social media marketing, I want greater exposure to how a brand identifies its position and the decisions that are made before a campaign even begins. Second Serve let me scratch the tip of the iceberg, but speaking in depth with business owners in various sectors as well as mentors within Rem will let me cultivate that skill set and apply it to future clients or other ventures that are yet to come. \n\nSimilarly, speaking to various business owners at different stages of development would let me further hone my passion for entrepreneurship. Observing how leaders make decisions when resources, time, and opportunities are limited will let me gain a perspective that I haven\u2019t had the opportunity to see through just working on ventures I\u2019m personally involved in. Carrying those lessons into both a meeting as well as my future is essential for future endeavors in both business ownership and finance.\n\nAs for social impact, I want to see how strategic decisions can account for both business performance and broader outcomes such as sustainability for community value beyond monetary gain. Both Second Serve and Dejar had a central focus on sustainable practices, but these small-scale projects don\u2019t involve the challenge that comes with scaling and sustainability. Rem can help find the balance in these two avenues.\n\nRem allows me to test these career intersections through experience, training me to use various perspectives when solving a problem rather than one or two at a time. I hope to gain a specialized professional skill set as well as a clear understanding of how each of my strengths fits together and what is preventing me from being a well-rounded team member, ultimately giving me a much more informed sense of the type of work I want to pursue after college.", "position": "Junior Consulting Strategist", "skills": "Marketing and analytics, Videography, Photography, Social media management, Ads (Facebook/Instagram), Brand Development", "accommodations": "", "other": "", "commitment": "Yes", "attendance": {"coffeeChats": [{"timestamp": "2026-09-01T18:07:13.058000", "spokeTo": "Terrence, Rachel, Hannah, Eli, Grace, Adam, Fox"}], "infoSession": {"timestamp": "2026-09-02T01:15:55.178000", "session": "09/01", "appliedBefore": "No"}, "meetMembers": null}}, {"id": "a74_5103f1a4", "timestamp": "9/3/2026 9:41:03", "name": "Coleman Dunham", "email": "Colemandunham@ufl.edu", "phone": "8632550092", "gender": "Male", "race": "White or Caucasian", "linkedin": "N/A", "resume": "https://drive.google.com/open?id=1Lmz4efIL_kTmSYkvKHsuagJ6DZuf6O-X", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Engineering (various disciplines)", "minor": "Engineering (various disciplines)", "gpa": "3.93", "whyRem": "I am an Industrial and Systems Engineering major with a strong interest in the career opportunities that consulting offers. I've always been drawn to the process of identifying inefficiencies within a system or workflow and finding practical solutions that drive real value\u2014whether that means streamlining operations, cutting costs, or ultimately generating more revenue for a business. I want to join REM because I'm looking to surround myself with a like-minded group of individuals who share this same passion for problem-solving and continuous improvement, and I believe this organization will give me the hands-on experience and community I need to grow both personally and professionally as I pursue a career in consulting.", "coreValue": "Intellectual Growth", "valueEssay": "Intellectual growth stands out to me because I want to make the most of every opportunity in front of me, not just get through it. As an ISE major heading toward consulting, I know I'll constantly be thrown into new problems and unfamiliar situations, and I want to be the type of person who leans into that instead of shying away from it. I'm always looking for ways to learn more, push myself further, and become better at what I do, and I see REM as a place that will challenge me to keep growing in that way.", "careerInterests": "Consulting, Entrepreneurship / Startups, Sales engineering / systems engineering", "howRemHelps": "Joining REM on Campus will give me a platform to build real consulting and business operations skills and understanding. It's a space where I can sharpen these skills hands-on and start developing the toolkit consulting positions are looking for. I believe REM can give me qu <script>
/* global BOOTSTRAP */
(function () {
'use strict';

const B = window.BOOTSTRAP;
const ROUNDS = ['screen', 'round1', 'round2'];
const ROUND_LABEL = { screen: 'Application Screen', round1: 'First Round', round2: 'Second Round' };
const ROUND_SUB = { screen: 'Resume & written application', round1: 'Phone screen — behavioral', round2: 'Case + behavioral (final round)' };

// ---------------- State ----------------
const STATE = {
  view: 'overview',
  applicants: B.applicants.slice(),
  byId: {},
  grades: { screen: {}, round1: {}, round2: {} },     // applicantId -> grade record
  vouches: {},                                        // applicantId -> { by: [reviewerId], note }
  assignments: { screen: {}, round1: {}, round2: {} }, // applicantId -> groupId (manual overrides)
  groups: B.defaultGroups.map(g => ({ ...g })),
  currentApplicantId: null,
  search: '',
  sortKey: 'name',
  sortDir: 'asc',
  screenedOnly: false,
  filterGroup: 'all',
  filterYear: 'all',
  saveStatus: 'idle',
  lastSync: {},
};
STATE.applicants.forEach(a => { STATE.byId[a.id] = a; });

const REVIEWERS_BY_ID = {};
B.reviewers.forEach(r => { REVIEWERS_BY_ID[r.id] = r; });

// ---------------- Persistence (GitHub Contents API) ----------------
// The shared state lives as one JSON file on a dedicated `data` branch of the repo
// this page ships from. Reads and writes go straight to api.github.com from every
// viewer's browser using a repo-scoped token embedded below. There's no push channel
// from GitHub, so "live" here means: every viewer polls on an interval and reloads
// when the remote copy is newer. Writes are optimistic-concurrency (If-Match on sha);
// a losing write is retried against the winner exactly like a conflict elsewhere in
// this app — the pending-ops queue below is what makes that safe.
const GH_OWNER = 'EnteredDust46';
const GH_REPO = 'rem-uf-recruitment';
const GH_BRANCH = 'data';
// Split so the literal never appears contiguous in source — GitHub's push-protection
// scanner (and its auto-revoke partnership) matches on the unbroken token string, and
// an auto-revoked token would silently kill saving for everyone the next time it fires.
const GH_TOKEN = [
  'github_pat_11BNCPELA0M1rG7d218C9U_SC09w5yCbAv76K1mFwvsMa2FG1et4rTmL7ACu',
  'VD1s4MGXOPYBFAAJ5vcSaK',
].join('');
const GH_API = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/state.json`;
const POLL_MS = 15000;

let readOnly = false;
let liveVersion = null;
let currentSha = null;   // GitHub blob sha for state.json, needed to write without clobbering
let lastEtag = null;     // for cheap conditional polling (a 304 doesn't count against rate limit)
let ghAvailable = true;

const PENDING_KEY = 'rem_pending_ops_v1';

function b64EncodeUtf8(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64DecodeUtf8(b64) { return decodeURIComponent(escape(atob((b64 || '').replace(/\n/g, '')))); }

function ghHeaders(extra) {
  return Object.assign({
    'Authorization': 'Bearer ' + GH_TOKEN,
    'Accept': 'application/vnd.github+json',
  }, extra || {});
}

async function initCapabilities() {
  await loadState();
  applyPendingOps();
  render();
  // Anything stashed before a conflict is re-sent now that we've adopted the latest.
  if (pendingOps().length) queueSave();
  setInterval(pollForUpdates, POLL_MS);
}

// ---------------- Load ----------------
async function loadState() {
  try {
    const res = await fetch(GH_API + '?ref=' + GH_BRANCH, { headers: ghHeaders() });
    if (res.status === 404) { ghAvailable = true; return; }   // first run: file doesn't exist yet
    if (!res.ok) { ghAvailable = false; setSaveStatus('error'); return; }
    ghAvailable = true;
    lastEtag = res.headers.get('etag');
    const json = await res.json();
    currentSha = json.sha;
    const data = JSON.parse(b64DecodeUtf8(json.content));
    adoptState(data);
  } catch (e) {
    console.warn('state load failed', e && e.message);
    ghAvailable = false;
  }
}

// Lightweight live-update poll: a conditional GET so an unchanged file costs nothing
// against the rate limit (304 responses are free). Skips merging while there are
// unsent local edits so a poll never clobbers something mid-save.
async function pollForUpdates() {
  if (pendingOps().length || saving) return;
  try {
    const res = await fetch(GH_API + '?ref=' + GH_BRANCH, {
      headers: ghHeaders(lastEtag ? { 'If-None-Match': lastEtag } : {}),
    });
    if (res.status === 304) return;               // nothing changed
    if (res.status === 404) return;                 // still no file yet
    if (!res.ok) return;
    lastEtag = res.headers.get('etag');
    const json = await res.json();
    if (json.sha === currentSha) return;
    currentSha = json.sha;
    const data = JSON.parse(b64DecodeUtf8(json.content));
    if (!liveVersion || (data.updatedAt || 0) > liveVersion) {
      adoptState(data);
      // Don't yank focus out from under someone mid-edit; the next natural render
      // (their next click, or the tab losing focus) will pick the fresh data up.
      const ae = document.activeElement;
      const editing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
      if (!editing) render();
    }
  } catch (e) { /* try again next tick */ }
}

function adoptState(data) {
  if (!data || typeof data !== 'object') return;
  ROUNDS.forEach(function (r) {
    const g = (data.grades || {})[r];
    if (g && typeof g === 'object') STATE.grades[r] = g;
  });
  if (data.vouches && typeof data.vouches === 'object') STATE.vouches = data.vouches;
  if (data.assignments && typeof data.assignments === 'object') {
    STATE.assignments = Object.assign({ screen: {}, round1: {}, round2: {} }, data.assignments);
  }
  if (Array.isArray(data.groups) && data.groups.length) STATE.groups = data.groups;
  liveVersion = data.updatedAt || null;
}

function currentStateDoc() {
  return {
    grades: {
      screen: cleanRecords(STATE.grades.screen),
      round1: cleanRecords(STATE.grades.round1),
      round2: cleanRecords(STATE.grades.round2),
    },
    vouches: STATE.vouches,
    assignments: STATE.assignments,
    groups: STATE.groups,
    updatedAt: Date.now(),
  };
}

// Only real values are stored: no undefined, no transient __ UI keys, no empty records.
function cleanRecords(map) {
  const out = {};
  Object.keys(map || {}).forEach(function (id) {
    const rec = cleanForSave(map[id]);
    if (rec && Object.keys(rec).length && (hasManualScore(rec) || rec.notes || rec.flagSecond || rec.recommendation || rec.caseId)) {
      out[id] = rec;
    }
  });
  return out;
}

function cleanForSave(obj) {
  const out = {};
  Object.keys(obj || {}).forEach(function (k) {
    if (k.indexOf('__') === 0) return;
    const v = obj[k];
    if (v === undefined || v === null || v === '') return;
    if (typeof v === 'object' && !Array.isArray(v)) {
      const inner = cleanForSave(v);
      if (Object.keys(inner).length) out[k] = inner;
    } else {
      out[k] = v;
    }
  });
  return out;
}

// ---------------- Pending ops (survive a conflict reload) ----------------
// A publish that loses a race reloads this view, so an edit that hasn't been saved yet
// is written to sessionStorage first and replayed on the way back up.
function pendingOps() {
  try { return JSON.parse(sessionStorage.getItem(PENDING_KEY) || '[]'); } catch (e) { return []; }
}
function setPendingOps(ops) {
  try { sessionStorage.setItem(PENDING_KEY, JSON.stringify(ops)); } catch (e) { /* private mode */ }
}
function recordOp(op) {
  const ops = pendingOps();
  ops.push(op);
  setPendingOps(ops.slice(-400));
}
function clearPendingOps() {
  try { sessionStorage.removeItem(PENDING_KEY); } catch (e) { /* ignore */ }
}
function applyPendingOps() {
  pendingOps().forEach(function (op) {
    try {
      if (op.kind === 'grade') {
        const rec = getGrade(op.round, op.id);
        if (op.field === 'score') rec.scores[op.key] = op.value === null ? undefined : op.value;
        else rec[op.field] = op.value;
      } else if (op.kind === 'vouch') {
        STATE.vouches[op.id] = op.value;
      } else if (op.kind === 'assign') {
        STATE.assignments[op.round][op.id] = op.value;
      } else if (op.kind === 'groups') {
        STATE.groups = op.value;
      }
    } catch (e) { /* skip a malformed op rather than blocking the load */ }
  });
}

// ---------------- Save ----------------
let saveTimer = null;
let saving = false;
let lastSaveError = null;

function queueSave() {
  if (readOnly) return;
  setSaveStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 1200);
}

async function flushSave() {
  clearTimeout(saveTimer);
  if (readOnly || saving) return;
  saving = true;
  const doc = currentStateDoc();
  // Only the ops this write actually covers are retired; an edit made while the
  // request was in flight stays pending for the next one.
  const covered = pendingOps().length;
  try {
    const body = {
      message: 'score update ' + new Date(doc.updatedAt).toISOString(),
      content: b64EncodeUtf8(JSON.stringify(doc, null, 0)),
      branch: GH_BRANCH,
    };
    if (currentSha) body.sha = currentSha;
    const res = await fetch(GH_API, { method: 'PUT', headers: ghHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify(body) });
    if (res.status === 401 || res.status === 403) {
      const remaining = res.headers.get('x-ratelimit-remaining');
      if (remaining === '0') {
        setSaveStatus('saving');
        setTimeout(function () { saving = false; queueSave(); }, 6000);
        return;
      }
      readOnly = true;
      lastSaveError = 'auth (' + res.status + ')';
      setSaveStatus('readonly');
      render();
    } else if (res.status === 409 || res.status === 422) {
      // Someone else wrote first. Refetch the winner, replay our stashed ops on top,
      // and try again — same shape as a conflict anywhere else in this app.
      await loadState();
      applyPendingOps();
      setSaveStatus('syncing');
      saving = false;
      queueSave();
      return;
    } else if (!res.ok) {
      lastSaveError = 'HTTP ' + res.status;
      setSaveStatus('error');
      setTimeout(function () { saving = false; flushSave(); }, 3000);
      return;
    } else {
      const json = await res.json();
      currentSha = json.content && json.content.sha ? json.content.sha : currentSha;
      lastEtag = null; // force a real fetch on the next poll rather than trusting a stale etag
      liveVersion = doc.updatedAt;
      setPendingOps(pendingOps().slice(covered));
      setSaveStatus(pendingOps().length ? 'saving' : 'saved');
      if (pendingOps().length) { saving = false; queueSave(); return; }
    }
  } catch (e) {
    lastSaveError = (e && e.message) || 'network error';
    setSaveStatus('error');
    setTimeout(function () { saving = false; flushSave(); }, 3000);
    return;
  }
  saving = false;
}

// Every write goes through these, so the op is stashed before the state changes.
function saveGrade(round, applicantId, field, key, value) {
  recordOp({ kind: 'grade', round: round, id: applicantId, field: field, key: key, value: value === undefined ? null : value });
  queueSave();
}

function saveVouch(applicantId) {
  recordOp({ kind: 'vouch', id: applicantId, value: STATE.vouches[applicantId] });
  queueSave();
}
