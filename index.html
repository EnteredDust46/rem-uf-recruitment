<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REM UF Recruitment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============ Tokens ============ */
:root {
  --paper: #f7f7f4;
  --paper-raised: #ffffff;
  --ink: #171b23;
  --ink-soft: #3a4150;
  --slate: #646d7d;
  --slate-faint: #9aa2b0;
  --line: #e2e3e0;
  --line-strong: #cdd0d6;
  --accent: #2f5fdb;
  --accent-soft: #e8edfb;
  --accent-ink: #1c3f9c;
  --accent2: #b4661e;
  --accent2-soft: #f7e9da;
  --good: #24784f;
  --good-soft: #e3f2e9;
  --warn: #a8710f;
  --warn-soft: #fbf0da;
  --bad: #b23c3c;
  --bad-soft: #fbe6e6;
  --radius-s: 6px;
  --radius-m: 10px;
  --radius-l: 16px;
  --shadow-card: 0 1px 2px rgba(20, 24, 32, 0.06), 0 1px 1px rgba(20, 24, 32, 0.04);
  --font-display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  --font-body: 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12141a;
    --paper-raised: #1a1d25;
    --ink: #eceef2;
    --ink-soft: #c4c9d4;
    --slate: #8891a1;
    --slate-faint: #5c6272;
    --line: #2a2e38;
    --line-strong: #383d49;
    --accent: #6f92e8;
    --accent-soft: #1e2740;
    --accent-ink: #cdd8f7;
    --accent2: #d99354;
    --accent2-soft: #332619;
    --good: #5cb885;
    --good-soft: #16281f;
    --warn: #d3a44a;
    --warn-soft: #2e2617;
    --bad: #e08080;
    --bad-soft: #301c1c;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 1px rgba(0, 0, 0, 0.2);
  }
}

:root[data-theme="dark"] {
  --paper: #12141a;
  --paper-raised: #1a1d25;
  --ink: #eceef2;
  --ink-soft: #c4c9d4;
  --slate: #8891a1;
  --slate-faint: #5c6272;
  --line: #2a2e38;
  --line-strong: #383d49;
  --accent: #6f92e8;
  --accent-soft: #1e2740;
  --accent-ink: #cdd8f7;
  --accent2: #d99354;
  --accent2-soft: #332619;
  --good: #5cb885;
  --good-soft: #16281f;
  --warn: #d3a44a;
  --warn-soft: #2e2617;
  --bad: #e08080;
  --bad-soft: #301c1c;
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 1px rgba(0, 0, 0, 0.2);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent-soft); color: var(--accent-ink); }
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; margin: 0; color: var(--ink); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ============ Shell ============ */
#app { display: flex; height: 100vh; overflow: hidden; }

.rail {
  width: 216px;
  flex: none;
  background: var(--paper-raised);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 18px 12px;
  gap: 4px;
}
.rail-brand {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  padding: 4px 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.rail-brand .sub { font-family: var(--font-body); font-size: 11px; color: var(--slate); font-weight: 400; letter-spacing: .02em; }
.rail-group { margin-top: 14px; padding: 0 10px 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--slate-faint); font-weight: 600; }
.rail-btn {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 10px; border-radius: var(--radius-s); border: none; background: transparent;
  color: var(--ink-soft); font-size: 13.5px; text-align: left; cursor: pointer; width: 100%;
}
.rail-btn:hover { background: var(--accent-soft); color: var(--accent-ink); }
.rail-btn.active { background: var(--accent); color: white; font-weight: 600; }
.rail-btn .count { font-family: var(--font-mono); font-size: 11px; opacity: .75; }
.rail-foot { margin-top: auto; padding: 10px; font-size: 11px; color: var(--slate-faint); }
.rail-foot .dot { display:inline-block; width:6px; height:6px; border-radius:50%; background: var(--good); margin-right: 5px; }

.main { flex: 1; overflow-y: auto; }
.topbar {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
  padding: 14px 28px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.topbar h1 { font-size: 20px; }
.topbar .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--slate); margin-bottom: 2px; }
.topbar-spacer { flex: 1; }
.content { padding: 24px 28px 60px; max-width: 1320px; }

/* ============ Buttons / inputs ============ */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px; border-radius: var(--radius-s); border: 1px solid var(--line-strong);
  background: var(--paper-raised); color: var(--ink); font-size: 13px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent-ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
.btn.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); color: white; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:disabled:hover { border-color: var(--line-strong); color: var(--ink); }

input[type="text"], input[type="search"], select, textarea {
  font-family: inherit; font-size: 13px; color: var(--ink);
  background: var(--paper-raised); border: 1px solid var(--line-strong); border-radius: var(--radius-s);
  padding: 7px 10px;
}
textarea { font-family: inherit; resize: vertical; width: 100%; line-height: 1.5; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  border: 1px solid var(--line-strong); background: var(--paper-raised); color: var(--slate);
  cursor: pointer;
}
.chip.active { background: var(--accent); border-color: var(--accent); color: white; }
.chip.static { cursor: default; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.accent2 { background: var(--accent2-soft); color: var(--accent2); border-color: transparent; }

/* ============ Cards / layout ============ */
.card {
  background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-m);
  box-shadow: var(--shadow-card);
}
.card-pad { padding: 18px 20px; }
.grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat-tile { padding: 14px 16px; }
.stat-tile .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--slate); margin-bottom: 6px; }
.stat-tile .value { font-family: var(--font-mono); font-size: 26px; font-weight: 600; }
.stat-tile .sub { font-size: 11.5px; color: var(--slate-faint); margin-top: 3px; }

.section-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display:flex; align-items:center; gap:8px; }
.section-title .n { color: var(--slate); font-weight: 400; font-size: 12px; }

.two-col { display: grid; grid-template-columns: 1.55fr 1fr; gap: 20px; align-items: start; }
@media (max-width: 980px) { .two-col { grid-template-columns: 1fr; } }

/* ============ Table ============ */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-m); background: var(--paper-raised); }
table.grid { border-collapse: collapse; width: 100%; font-size: 13px; }
table.grid th {
  text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--slate);
  padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none;
  position: sticky; top: 0; background: var(--paper-raised);
}
table.grid th:hover { color: var(--accent-ink); }
table.grid th.sorted::after { content: ' ▾'; color: var(--accent); }
table.grid td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.grid tr:last-child td { border-bottom: none; }
table.grid tr.clickable { cursor: pointer; }
table.grid tr.clickable:hover { background: var(--accent-soft); }
.name-cell { display: flex; flex-direction: column; }
.name-cell .nm { font-weight: 600; }
.name-cell .sub { font-size: 11.5px; color: var(--slate); }
.score-pill {
  display: inline-flex; align-items: center; justify-content: center; min-width: 30px;
  font-family: var(--font-mono); font-weight: 700; font-size: 12.5px;
  padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink);
}
.score-pill.none { background: var(--line); color: var(--slate); }
.score-pill.good { background: var(--good-soft); color: var(--good); }
.score-pill.bad { background: var(--bad-soft); color: var(--bad); }

/* ============ Filters bar ============ */
.filters-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.filters-bar input[type="search"] { width: 220px; }

/* ============ Grade view ============ */
.applicant-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.applicant-header h2 { font-size: 24px; }
.applicant-header .meta { color: var(--slate); font-size: 13px; margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
.applicant-header .meta span { display: inline-flex; align-items: center; gap: 4px; }

.dim-card { border: 1px solid var(--line); border-radius: var(--radius-m); background: var(--paper-raised); margin-bottom: 14px; overflow: hidden; }
.dim-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--accent-soft); }
.dim-head h4 { font-size: 13.5px; font-family: var(--font-body); font-weight: 700; color: var(--accent-ink); }
.dim-head.draft { background: var(--warn-soft); }
.dim-head.draft h4 { color: var(--warn); }
.dim-body { padding: 14px 16px; }
.dim-body .prompt { font-family: var(--font-display); font-size: 17px; line-height: 1.4; margin-bottom: 10px; }
.read-aloud { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 700; margin-bottom: 4px; }

.band-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0 12px; }
.band-opt { border: 1px solid var(--line-strong); border-radius: var(--radius-s); padding: 8px 9px; font-size: 11.5px; cursor: pointer; background: var(--paper); }
.band-opt .sc { font-family: var(--font-mono); font-weight: 700; margin-right: 4px; }
.band-opt:hover { border-color: var(--accent); }
.band-opt.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }

.score-selector { display: flex; gap: 6px; margin-top: 8px; }
.score-btn {
  width: 34px; height: 34px; border-radius: var(--radius-s); border: 1px solid var(--line-strong);
  background: var(--paper); font-family: var(--font-mono); font-weight: 700; font-size: 14px; cursor: pointer;
}
.score-btn:hover { border-color: var(--accent); }
.score-btn.sel { background: var(--accent); border-color: var(--accent); color: white; }

.year-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
.year-tab { font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line-strong); cursor: pointer; color: var(--slate); }
.year-tab.sel { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.notes-field { margin-top: 6px; }
.notes-field textarea { min-height: 54px; font-size: 13px; }

.side-stack { position: sticky; top: 74px; display: flex; flex-direction: column; gap: 14px; }
.essay-block { font-size: 13.5px; white-space: pre-wrap; line-height: 1.6; max-height: 220px; overflow-y: auto; padding-right: 4px; }
.essay-block::-webkit-scrollbar { width: 6px; }
.essay-block::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }
.field-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--slate); margin: 12px 0 4px; font-weight: 600; }
.field-label:first-child { margin-top: 0; }

.avg-display { display: flex; align-items: baseline; gap: 6px; }
.avg-display .big { font-family: var(--font-mono); font-size: 32px; font-weight: 700; }
.avg-display .of { color: var(--slate); font-size: 13px; }

.attendance-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; font-size: 13px; border-bottom: 1px dashed var(--line); }
.attendance-row:last-child { border-bottom: none; }
.attendance-row .ic { width: 16px; text-align: center; line-height: 1.3; }
.attendance-row.yes .ic { color: var(--good); }
.attendance-row.no .ic { color: var(--slate-faint); }
.att-detail { min-width: 0; }
.spoke-list { margin: 4px 0 0; padding-left: 16px; color: var(--ink-soft); font-size: 12.5px; line-height: 1.45; }
.spoke-list li { margin: 2px 0; }

/* ============ Groups view ============ */
.group-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.group-card { padding: 14px 16px; }
.group-card h4 { font-size: 14px; margin-bottom: 2px; }
.group-card .members { font-size: 12px; color: var(--slate); margin-bottom: 10px; }
.group-card .load { font-family: var(--font-mono); font-size: 22px; font-weight: 700; }
.group-card .load .of { font-family: var(--font-body); font-size: 12px; color: var(--slate); font-weight: 400; }
.reassign-list { max-height: 160px; overflow-y: auto; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
.reassign-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; padding: 3px 0; }
.reassign-row select { font-size: 11px; padding: 2px 4px; }

/* ============ Bars / distribution ============ */
.bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 6px; }
.bar-row .lbl { width: 96px; flex: none; color: var(--slate); text-align: right; }
.bar-track { flex: 1; height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 5px; }
.bar-row .val { width: 52px; flex: none; font-family: var(--font-mono); font-weight: 600; }

.reviewer-bias-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.reviewer-bias-row:last-child { border-bottom: none; }
.reviewer-bias-row .nm { width: 148px; flex: none; font-weight: 600; }
.reviewer-bias-row .n { color: var(--slate-faint); font-size: 11px; }

/* ============ Misc ============ */
.empty-state { text-align: center; padding: 60px 20px; color: var(--slate); }
.empty-state h3 { color: var(--ink); margin-bottom: 6px; }
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: var(--radius-s);
  font-size: 13px; z-index: 50; box-shadow: var(--shadow-card); opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

.save-dot, .sheet-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--slate-faint); display:inline-block; }
.save-dot.saved, .sheet-dot.ok { background: var(--good); }
.save-dot.saving, .sheet-dot.pulling { background: var(--warn); }
.save-dot.error, .sheet-dot.error, .sheet-dot.denied { background: var(--bad); }
.save-dot.nodb, .sheet-dot.nokey { background: var(--bad); opacity: .55; }

.recommend-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }

.flag-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 10px; }
.flag-row input { width: auto; }

.overflow-menu { position: relative; }

.modal-backdrop { position: fixed; inset: 0; background: rgba(10,12,16,.4); display: flex; align-items: center; justify-content: center; z-index: 40; }
.modal { background: var(--paper-raised); border-radius: var(--radius-l); padding: 22px; max-width: 480px; width: 92%; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.modal h3 { margin-bottom: 10px; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

.case-select { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }

.university-tag { font-size: 11px; color: var(--slate); }

.progress-track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; display: flex; }
.progress-seg { height: 100%; }

.sync-note { font-size: 12px; color: var(--slate-faint); display: flex; align-items: center; gap: 6px; }


/* ============ Auto-scored dimensions ============ */
.band-opt.sel.auto {
  border-style: dashed;
  background: color-mix(in srgb, var(--accent-soft) 60%, var(--paper));
}
.chip.auto {
  background: var(--accent-soft);
  color: var(--accent-ink);
  border: 1px dashed var(--accent);
  font-size: 10px;
  letter-spacing: .04em;
  text-transform: uppercase;
  font-weight: 600;
}
.auto-note {
  margin-top: 10px;
  font-size: 11.5px;
  color: var(--slate);
  line-height: 1.45;
  padding-left: 9px;
  border-left: 2px solid var(--accent);
}
.auto-note strong { color: var(--ink); font-family: var(--font-mono); }
.auto-note.overridden { border-left-color: var(--accent2); }
.auto-note.needs { border-left-color: var(--warn); }
.auto-note em { color: var(--ink-soft); font-style: normal; font-family: var(--font-mono); }
.linkbtn {
  border: none; background: none; padding: 0;
  color: var(--accent); font-size: 11.5px; cursor: pointer;
  text-decoration: underline; text-underline-offset: 2px;
}
.gpa-cell { display: inline-flex; align-items: center; gap: 6px; }
.gpa-cell .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.gpa-cell.none { color: var(--slate-faint); font-size: 11.5px; font-style: italic; }
.auto-pill {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 4px;
  border: 1px dashed var(--accent); border-radius: 5px;
  background: var(--accent-soft); color: var(--accent-ink);
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
}
.auto-pill.na {
  border-color: var(--slate-faint);
  background: var(--paper);
  color: var(--slate);
}


/* ============ Vouching ============ */
.vouch-card.has { border-color: color-mix(in srgb, var(--accent2) 45%, var(--line)); }
.vouch-card .section-title .n {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 17px; height: 17px; margin-left: 4px; padding: 0 4px;
  border-radius: 9px; background: var(--accent2); color: #fff;
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
}
.vouch-row { display: flex; flex-wrap: wrap; gap: 5px; }
.vouch-chip {
  border: 1px solid var(--line-strong); background: var(--paper);
  color: var(--ink-soft); border-radius: 999px;
  padding: 4px 11px; font-size: 12px; cursor: pointer;
}
.vouch-chip:hover { border-color: var(--accent2); color: var(--accent2); }
.vouch-chip.on {
  background: var(--accent2); border-color: var(--accent2); color: #fff; font-weight: 600;
}
.vouch-badge {
  margin-left: 6px; padding: 1px 6px; border-radius: 999px;
  background: color-mix(in srgb, var(--accent2) 14%, transparent);
  color: var(--accent2); font-family: var(--font-mono);
  font-size: 10.5px; font-weight: 700; vertical-align: middle;
}
.muted-note { color: var(--slate-faint); font-size: 12px; }

</style>
</head>

es in my career goals in the finance/real estate realm. As an incoming freshman, I have taken many courses to learn more about finance and real estate. However, I have not yet been able to apply in a high-performance team with actual clients. Rem on Campus will help me achieve this, preparing me for a future career in similar, scaled environments.","position":"Junior Consulting Strategist, Consulting Strategist","skills":"Business Strategy, Statistics and modelling, Web design, Data analysis, Marketing and analytics, Finance and accounting","accommodations":"n/a","other":"n/a","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":{"timestamp":"9/2/2026 0:21:40","session":"09/01","appliedBefore":"No"},"meetMembers":null}},{"id":"a1_5f74c4d6","timestamp":"7/12/2026 17:42:58","name":"Jose Lazzaro","email":"joselazzaro@ufl.edu","phone":"7866723091","gender":"Male","race":"Hispanic or Latino","linkedin":"www.linkedin.com/in/jose-lazzaro-b4471b340","resume":"https://drive.google.com/open?id=1l6rHoESbzncIGBkZvFXs61bho_UnO08U","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"","gpa":"4","whyRem":"I want to join Rem on Campus because I believe business has the power to create meaningful change in communities. Throughout my journey, I have always looked for ways to combine my passion for leadership, problem-solving, and helping others. From founding Un Solo Balón at 17 to supporting accounting operations and working on community-focused campaign initiatives, I have been fortunate to experience how strong organizations are built through strategy, teamwork, and a commitment to serving others.\n\nWhat excites me about Rem is the opportunity to continue growing while learning the consulting process in a structured environment. I have gained experience creating solutions and leading initiatives, but I want to develop the skills to analyze complex challenges, think more strategically, and provide valuable recommendations to organizations. I am excited to learn from other driven students, contribute my experiences, and continue becoming a stronger leader who can create a positive impact.","coreValue":"Community","valueEssay":"Community stands out to me the most because I believe the greatest impact is created when people come together with a shared purpose. Throughout my journey, I have always looked for ways to use my skills and opportunities to support others and create something meaningful.\n\nThis value connects deeply with my experience founding Un Solo Balón, where I built an organization around using soccer to bring opportunities, resources, and hope to underserved youth athletes in La Guaira, Venezuela. Through this experience, I learned that leadership is not only about achieving goals, but about building relationships, understanding people, and creating an environment where others can grow.\n\nMy experiences in community outreach, campaign operations, and nonprofit leadership have shown me the importance of collaboration and service. I believe strong communities create stronger organizations, and I want to continue developing as a leader who uses business to make a positive impact in the world.","careerInterests":"Consulting, Investment Banking / Finance, Data Analytics / Business Intelligence, Entrepreneurship / Startups, Non-Profit / Social Impact","howRemHelps":"Joining Rem on Campus will help me achieve my career goals by strengthening the skills needed to succeed in finance, investment banking, and consulting. Through my experiences in accounting, nonprofit leadership, and campaign operations, I have developed a strong foundation in financial analysis, problem-solving, and managing complex projects. However, I want to continue developing my ability to analyze business challenges, create strategic recommendations, and communicate effectively with clients and teams.\n\nRem’s Learning, Applying, and Leading model aligns with my goals because it provides the opportunity to gain real-world consulting experience, collaborate with motivated students, and learn how businesses make strategic decisions. I hope to bring my background in finance, entrepreneurship, and community leadership while developing the technical and interpersonal skills necessary for a successful career in finance.","position":"Junior Consulting Strategist, Consulting Strategist, Team Lead","skills":"Business Strategy, Statistics and modelling, Web design, Data analysis, Marketing and analytics, Social media management, Finance and accounting, Communications and copy-writing, Design Thinking, Microsoft Office Suite, Brand Development","accommodations":"No accommodations needed. Thank you!","other":"As I begin my journey at the University of Florida, I am eager to continue learning, growing, and joining organizations where I can make a meaningful impact. Throughout high school, I founded Un Solo Balón and was eager to add value to my community while expanding opportunities for those who needed them the most.\n\nThat experience strengthened my passion for using business, leadership, and collaboration to create a positive change. As I continue my education at UF, I hope to bring the same dedication and commitment to organizations across Gainesville by contributing my experiences, learning from others, and helping create solutions that make a lasting impact in others.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a2_c76e5467","timestamp":"7/15/2026 13:49:04","name":"Kate Fausz","email":"kate.fausz@ufl.edu","phone":"859-468-1436","gender":"Female","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/kate-fausz/","resume":"https://drive.google.com/open?id=10hBRLDsFMArShDslqE2WP_5iQVT5eE3-","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Foreign Language Studies (e.g. Spanish, German, Mandarin), Political Science / Public Policy","minor":"","gpa":"3.87","whyRem":"My valiant, resilient, and kind father is a small-business owner of a construction company. Since starting his career, all that he has dreamed of is owning his own company and being able to construct homes and retail spaces for his clients independently, using his own creative flair and enhancing stale business models and construction practices. It has been so inspiring and fulfilling to watch him live out his dream and have success. \n\tHowever, in 2025, his business took a turn when two of his clients did not pay him for his work, resulting in him losing over $500,000. Watching my father as he attempts to handle the arbitration cases, keep his business afloat, and his current clients happy, and do all the pesky tasks involved in being a one-man show has been crushing. \nAdditionally, because his degree is only in construction management, which did not include extensive education on owning your own business, he has struggled with marketing, accounting, managing his inbox and meetings, and adapting to technology changes from the beginning. \nThis summer, I have worked with him extensively, helping to manage his social media pages, crafting a new business plan to accommodate his new focus on new-build homes, and creating AI models to offload work that typically would take him 20 hours a week to complete. Through these changes, his faith in himself and the future of his company has grown, and being an instrumental part of this and helping to maintain his years-long dream has been one of the most fulfilling things I have ever done. \nI believe that there is something incredibly special about people like those at Rem, who are dedicated to helping small-business owners like my father accomplish their dreams. I hope to join the legacy of the teams at Rem who listen attentively and have genuine care for the stories and struggles of visionary small-business owners, who selflessly give their own time to drive innovation, who are committed to always learning new things to better their own craft and to help clients, and who support one another in Rem-related activities and in their colleagues' personal and professional development.","coreValue":"Community","valueEssay":"Although the recipient of my accomplishments may only be me, each one reflects the many communities that have invested in me, given me the ability to follow my dreams, and supported my success. \n\tThe various communities I belong to, from the small communities of immediate family and soccer teams to larger communities like my hometown and home state of Kentucky, have shaped me into the person I am today. Using the principles of a strong community, I have consistently sought ways to engage in and enhance various communities that have impacted me. \nIn high school, I heard of a Kindergartener at my elementary school who spoke little English and could not maintain the pace of lessons. Understanding the role of education and my elementary school on me, I seized the opportunity to empower and educate her. After consistent tutoring, she is now exceeding Kentucky education standards, and I have also begun tutoring her brother and parents, helping them adjust to cultural changes, understand the back of medicine labels, and connecting them to free community resources. \nAfter noticing a gap in programs for local youth, I partnered with a Northern Kentucky nonprofit, the Brighton Center, to develop small programs and initiatives to promote prosocial behaviors and end the cycles of drug abuse in my own community. \nIn my scholarship cohort, through my own experience and listening to the stories of my colleagues, I noticed that there was little activity to foster true community among scholars and the greater UF community. So, with the collaboration of my fellow scholars, we are working to instate a big-little program, hosting more community service events, creating panels of distinguished guest speakers, and forging early and meaningful connections with incoming scholars so that our scholar community can be defined by pillars of friendship, service, and learning.\nThrough these experiences of developing and enhancing my communities, I have learned the value and importance of investing in all members of a community, not just the smartest or most wealthy ones. I hope to continue this commitment of fulfilling unmet needs, seeing the purpose and value in everyone, and recognizing the importance of those around me  for the rest of my life, but on even larger scales.","careerInterests":"Consulting, Non-Profit / Social Impact, Public Policy / Government, Law","howRemHelps":"I believe that Rem on Campus will help me achieve my ultimate career goal of becoming an attorney because of Rem's overlap with the role of attorneys. \nAttorneys, like consultants, must be creative problem solvers, excellent collaborators, principled advisors, and effective communicators. At Rem, I am confident that I will build all of these skills to be both a successful attorney and consultant. Learning how to develop practical and personalized solutions for clients, craft effective proposals and presentations, and collaborate in teams with individuals of various strengths and specialties are not just skills I will develop through my time at Rem, but the exact skills that will help me become a successful, empathetic, and trustworthy attorney and standout in law school admissions essays. \nFurthermore, as stated previously, individuals who are dedicated to helping others achieve their dreams, sometimes at the expense of themselves, are remarkable and exactly the kind of people I want to surround myself with. I am confident that my fellow members at Rem will become my lifelong friends and constant sources of strength and inspiration that will transcend my years at UF and support my professional growth as an attorney as well.","position":"Junior Consulting Strategist","skills":"Web design, Marketing and analytics, Social media management, Communications and copy-writing, Design Thinking, Microsoft Office Suite, Brand Development","accommodations":"NA","other":"I truly love learning, and I am willing and eager to learn as many skills as I can and to continue mastering skills I already have to support UF's Rem division!","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a3_7cc742a7","timestamp":"7/20/2026 11:48:13","name":"Rachel Huang","email":"huangr1705@gmail.com","phone":"9419990466","gender":"Female","race":"Asian or Asian American","linkedin":"https://www.linkedin.com/in/huang-rachel/","resume":"https://drive.google.com/open?id=1bsEEGnzx8xtmMXxc4UCQiZ4AqlSZZHGR","university":"University of Florida","gradYear":"2027","classYear":"Senior","major":"Accounting","minor":"","gpa":"3.64","whyRem":"I want to join Rem on Campus at UF because I would like to learn and apply real world problem solving skills to help the community. I am someone who is eager to develop stronger analytical, strategic, and problem solving frameworks. I have done consulting projects during my freshman year; however, I never got the opportunity to continue. I would like to create an impact for the organization as well as myself. Overall, the positive framework of Rem on Campus (Learning, applying, and leading) makes me seek out the club.","coreValue":"Innovation","valueEssay":"Innovation stands out to me most because it shifts questions that are asked to \"how can we solve this issue.\" To me, innovation is what drives me into being more creative. In any projects I have done, sticking strictly to the minimum can lead to poor development. I value innovation because it encourages critical thinking and further development. I have personally gone through a lot of different interest such as venture capital, fintech, and healthcare. I have seen how innovation has impacted all of the organizations equally, whether it is the development of a new tool or AI.","careerInterests":"Investment Banking / Finance, Tech, Data Analytics / Business Intelligence, Product Management","howRemHelps":"I believe that joining Rem on Campus could help me develop my professional speaking skills as well as give me the opportunity to work with individuals like mind. I will gain experience analyzing actual business operations, identifying inefficiencies, and solving client issues which ties towards finance, tech, and data. By working along side peers with different skillsets, I would be given the opportunity to expand my own skills as well as refining my ability to identify complex analytical problems.","position":"Junior Consulting Strategist","skills":"Marketing and analytics, Finance and accounting","accommodations":"N/A","other":"N/A","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a25_423e768a","timestamp":"8/8/2026 19:45:48","name":"Naomy Torres Contreras","email":"naomytorrescontr@ufl.edu","phone":"7866309914","gender":"Female","race":"Hispanic or Latino","linkedin":"www.linkedin.com/in/naomy-torres-contreras","resume":"https://drive.google.com/open?id=1AuR6F-tqMjCn4Bun5b6JT9M7sfstZ1bf","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Industrial and Systems Engineering","minor":"","gpa":"3.2","whyRem":"I want to join Rem on Campus because it would give me the opportunity to take my growing interest in consulting and develop it through real experience. I am particularly drawn to Rem’s “Learning, Applying, Leading” model because it reflects how I want to grow as a future consultant. \n\nI also really value that Rem works directly with local small businesses. The opportunity to work with a real client, understand their challenges, conduct research, and develop recommendations that could actually improve their business is something I find exciting. My experience at Torre Construction & Development showed me that I enjoy looking beyond a problem on the surface and trying to understand why it exists and how a process can be improved. I want to take that mindset into a setting where I can work with other students, learn from different perspectives, and see how consulting works from beginning to end.\n\nUltimately, I see Rem as an opportunity to push myself outside of the classroom while developing skills that I know will be important in my career. I want to become a stronger problem solver and communicator, but more importantly, I want to learn how to approach problems from a client's perspective. Consulting is not just about having the right answer; it is about understanding the people and business behind the problem and working with them to create a solution that is actually useful and adds value. Rem’s focus on learning, community impact, and developing students into leaders strongly aligns with the kind of experience I am looking for and the kind of consultant I hope to become.","coreValue":"Empathy","valueEssay":"Empathy stands out to me because I believe it is a fundamental part of being a good consultant. It allows you to put yourself in a client’s shoes and understand a problem from their perspective rather than looking at it as an outsider. Before trying to recommend a solution, I think it is important to understand the people experiencing the problem, what their day to day looks like, and why a process may work the way it does.\n\nI learned the importance of this early in my experience at Torre Construction & Development. I started working there in high school, and if I wanted to understand the business beyond my own responsibilities, I quickly realized I had to learn to see things from everyone else’s perspective. Even something as simple as a manager not having time to explain something to me taught me to be more understanding. It was not necessarily that they did not want to help me, they had their own responsibilities and priorities. Instead of taking that personally, I learned to make the most of the time they could give me and find ways to learn independently.\n\nThat mindset became even more important when I transitioned into operations this summer. To understand and solve operational problems, I had to put myself in the shoes of the people actually experiencing them. This meant understanding the challenges field workers faced with technology, while also looking at the inefficiencies project managers experienced from a completely different perspective. Seeing these differences helped me understand that the same problem can look very different depending on who is experiencing it.\n\nThis is why empathy is the Rem value I connect with most. As I continue exploring consulting, I want to develop the ability to not only identify problems, but to understand them from the perspective of the people affected by them. I believe that is what allows a consultant to move beyond simply giving advice and instead develop solutions that are practical, relevant, and genuinely valuable to the client.","careerInterests":"Consulting, Data Analytics / Business Intelligence","howRemHelps":"I believe joining Rem on Campus would help me bridge the gap between my academic background and my growing interest in consulting. As an Industrial and Systems Engineering student, I have developed an interest in using data and analytical thinking to understand how systems work and how they can be improved. My experience at Torre Construction & Development strengthened that interest by giving me the opportunity to work directly with operational and business problems. I realized that I really enjoy looking at a problem, understanding the different factors contributing to it, and thinking about how a process can be made more effective.\n\nRem would allow me to build on that experience in a more structured consulting environment. Working directly with clients would help me develop skills that are difficult to learn in a classroom, especially communicating with clients, asking the right questions, and turning analysis into recommendations that are actually useful. I also think working alongside other students would expose me to different ways of approaching problems and challenge me to become a better teammate and problem solver.\n\nMost importantly, I see Rem as an opportunity to explore consulting while developing the analytical, communication, and leadership skills I will need to pursue it after college. I am still early in my career, so I want to put myself in environments where I can learn by doing, make mistakes, and continue improving. I believe Rem’s hands-on approach would give me that opportunity while allowing me to create meaningful value for the businesses I work with.","position":"Junior Consulting Strategist","skills":"Business Strategy, Data analysis, Microsoft Office Suite","accommodations":"","other":"One thing I would want Rem to know is that I genuinely value putting myself in unfamiliar environments. I believe some of the most meaningful growth comes from being willing to step outside of what is comfortable and learn how to navigate something new. A lot of my growth so far has come from taking on responsibilities before I felt completely prepared for them. From starting at Torre in high school and gradually taking on different roles within the company to becoming more involved in its operations, I have learned how to adapt quickly and contribute in different environments.\n\nThat is the same mindset I would bring to Rem. I am excited by the opportunity to be surrounded by people with different experiences and perspectives and to challenge myself in an environment that is new to me. I am someone who actively seeks opportunities that push me to learn and adapt because I believe that is how I continue to grow. I would be grateful for the opportunity to bring my own perspective to Rem while learning from the people around me and contributing to its community.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a4_9eb92a15","timestamp":"8/12/2026 18:38:57","name":"Aviv Brav","email":"aviv.brav@ufl.edu","phone":"2017140994","gender":"Male","race":"White or Caucasian","linkedin":"www.linkedin.com/in/aviv-brav","resume":"https://drive.google.com/open?id=1Ex7RmEOvogw2Nzh6SWO1wVz1baE0r85o","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"","gpa":"3.9","whyRem":"I want to join REM on Campus because I am drawn to the hands-on, consulting-style problem solving it offers to real local businesses. This summer, my internship at Glacier Global Capital included working on smaller startup companies through incubation, and my work with SmartStamp, an art verification company face me a taste of that exact kind of work I want to build on. What draws me to Rem is the 'Learning, Applying, Leading\" progression, I work best when I am handed a real client problem, and held accountable for the outcome. Ultimately my goal isn't simply to sit in on strategy but to lead others through the same process I want to begin. I am also very motivated by the community aspect of REM, my time this summer showed me how a smaller, resource-strapped team can benefit from the resilience of all parties involved, and I know that the same effort and results that I accomplished over this summer can benefit a Gainesville business rather than just my own resume. Mostly, I believe REM is a club that fits my goals due to the real stakes, as I have come to learn that I work best under pressure with real stakes, and REM's actual impact provides that motivation that I believe will push me to thrive.","coreValue":"Resilience","valueEssay":"Resilience stands out to me because it is the value that I have relied on most when I run into obstacles, no matter the stakes or circumstances, I've learned to treat each misstep as information. Every \"mistake\" results in a process of figuring out what didn't work, adjusting the plan and trying again. This is the same mindset I have employed professionally working at Glacier and SmartStamp, as well as at Founders Fund here at UF. This persistence is exactly why I want to continue testing myself in high-stakes, real-life environments like REM, where willingness to fail, adapt and try again alongside like minded peers is the ultimate goal.","careerInterests":"Investment Banking / Finance, Data Analytics / Business Intelligence, Entrepreneurship / Startups","howRemHelps":"Currently, I plan on pursuing a field in either Investment Banking or Commercial Real Estate. Both these fields reward people who can tackle an ambiguous problem, build a rigorous stance, and present your solution or proposal convincingly to those around you. By working directly with local businesses to diagnose real challenges and pitch data-backed recommendations mirrors the same work I have already done in financial modeling and market analysis. By joining REM, I would be combining the client-facing aspect of work alongside the technical problem solving skills that both IB and CRE demand. By learning how to transform a recommendation into action with real impacts, I will be working on the skills that separate a strong analysts from an average one in the fields I want to pursue. The data is only relevant when you can defend them under pressure. REM would give me the environment to learn from older peers while getting real-stakes reps at problem-solving skills that I will need in the future professionally. Most importantly, I will also be able to have real, positive impact on local Gainesville businesses which ground the entire expense in something bigger than my own personal goals.","position":"Junior Consulting Strategist, Consulting Strategist","skills":"Business Strategy, Statistics and modelling, Data analysis, Marketing and analytics, Finance and accounting, Microsoft Office Suite, Brand Development","accommodations":"N/A","other":"N/A","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a5_0f4f5440","timestamp":"8/17/2026 16:03:36","name":"Janak Vora","email":"janakvora2008@gmail.com","phone":"8136799397","gender":"Male","race":"Indian or Indian American","linkedin":"https://www.linkedin.com/in/janak-vora-19416a317?utm_source=share_via&utm_content=profile&utm_medium=member_android","resume":"https://drive.google.com/open?id=1HtPoc6AByWdkHra3cJIKywBXIXzLvYa2","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"","gpa":"N/A (first year)","whyRem":"I want to join Rem on Campus because I am interested in pursuing investment banking and want to gain practical experience analyzing businesses and solving complex problems in a team environment. Investment banking requires more than just financial knowledge; it requires strong analytical thinking, communication, attention to detail, and the ability to understand a business from multiple perspectives. Rem would give me an opportunity to develop these skills through hands-on consulting work while learning from other motivated students.","coreValue":"Intellectual Growth","valueEssay":"Intellectual Growth stands out to me because I am motivated by constantly learning how businesses operate, create value, and make strategic decisions. My interest in investment banking has pushed me to look beyond simply understanding financial statements and to think about why companies make certain decisions and how those decisions affect their future growth. Through my academic, technical, and entrepreneurial experiences, I have learned that I enjoy breaking down complex problems and finding practical solutions. I see Rem as an opportunity to continue developing that mindset by working with teammates, learning from different perspectives, and tackling real-world business challenges.","careerInterests":"Investment Banking / Finance","howRemHelps":"My long-term goal is to pursue a career in investment banking, and I believe Rem would help me develop several skills that are essential to succeeding in that field. Through client projects, I would gain experience analyzing companies, understanding business models, evaluating strategic decisions, and presenting recommendations. I would also strengthen my ability to work under deadlines, collaborate effectively, and communicate complex information clearly. These experiences would complement my growing interest in financial analysis and valuation while giving me a stronger understanding of how businesses operate beyond what can be learned in a classroom.","position":"Junior Consulting Strategist","skills":"Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Business Strategy, Marketing and analytics, Finance and accounting, Ads (Facebook/Instagram)","accommodations":"","other":"I am particularly interested in developing the analytical and interpersonal skills necessary for a career in investment banking. My background has given me exposure to finance, technology, entrepreneurship, and leadership, and I enjoy finding connections between these areas when approaching problems. I would be excited to bring that perspective to Rem, contribute meaningfully to client projects, and learn from teammates who have different experiences and strengths.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a6_33720d5d","timestamp":"8/20/2026 1:02:28","name":"Julen Goris","email":"julen.goris@ufl.edu","phone":"3053546184","gender":"Male","race":"Hispanic or Latino","linkedin":"https://www.linkedin.com/in/julen-goris-2b154b315/","resume":"https://drive.google.com/open?id=126rEgjhkbyt-hHf535Ibh7KssDK2tdb1","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Engineering (various disciplines)","minor":"Other","gpa":"N/A","whyRem":"I want to join REM because I want a place and community to combine my interest in systems optimization with my drive to build and lead projects. As an Industrial Engineering major at UF, I’m drawn to fixing inefficiencies and making processes work better through means I’ve done before through analyzing video data and modeling logistics systems for national brands at Profitability Labor Guru or managing operations and budgets for my own summer camp. l want to develop myself as a problem solver regarding business projects, as I did across my internship, with a community of people helping me improve myself and themselves as well. I want to exercise my proactive, problem-solving mindset to REM, alongside people who are just as driven as I contribute to the club from day one.","coreValue":"Community","valueEssay":"Community is most important to me because individual success is meaningless without a strong network to build with and learn from. From co-founding my summer camp to collaborating with engineers during my internships, my journey has been defined by bringing people together around common goals. I am not build myself and develop skills in consulting without a community I can get along with and work alongside efficiently. As an Industrial Engineering major, I approach problem-solving with a team-first mindset. REM’s community-driven projects align directly with my goal to work on my skills alongside driven students where we can make a meaningful impact together.","careerInterests":"Consulting, Data Analytics / Business Intelligence, Entrepreneurship / Startups","howRemHelps":"REM on Campus directly aligns with my focus on consulting and entrepreneurship by giving me hands-on problem-solving in real business environments around the community I live in. My background as an Industrial Engineering student and intern has centered on using data analysis and Excel modeling to optimize operational efficiency. At the same time, founding businesses like J+G Summer Camp introduced me into practical strategy, budgeting, and client management. REM will help me synthesize these experiences allowing me to apply advanced analytics to client challenges and learn consulting methodologies. Developing these professional skills in real projects will accelerate my goal and set the foundation of one day starting my own company by teaching me the principles of consulting projects and the steps taken to solve or reach a goal.","position":"Junior Consulting Strategist","skills":"Business Strategy, Mobile development, Marketing and analytics, E-commerce","accommodations":"No accommodations needed.","other":"Time management is of my greatest skills. Every week I will be devoted and able to get as many hours of involvement as needed in projects or events that are being held. Being integrated into the club to the fullest through availability will be one great trait I have and would be glad to be putting forth extra hours if needed.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a7_6d751b73","timestamp":"8/22/2026 17:56:45","name":"Daniel Gumbiner","email":"danielgumbiner@ufl.edu","phone":"3053329558","gender":"Male","race":"Hispanic or Latino","linkedin":"https://www.linkedin.com/in/danielgumbiner/","resume":"https://drive.google.com/open?id=1s1YcfjaTjdvpkZ048aIkmn2sHS36Y38Y","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"Other Social Science (e.g., Psychology, Sociology, Anthropology)","gpa":"3.77","whyRem":"I want to be a member of REM on Campus because it would give me the opportunity to work directly with small businesses and help them solve real challenges. I am especially interested in the combination of strategy, analytics, and client-facing work because it would allow me to apply what I have learned academically and professionally in a setting where the results can have a tangible impact.\n\nI also value the opportunity to work alongside other motivated students with different perspectives and experiences. I want to become better at breaking down ambiguous problems, developing practical recommendations, and communicating those recommendations clearly to clients. At the same time, I would bring experience in market research, data analysis, performance reporting, and working collaboratively toward a shared goal. What stands out most to me about REM is that the experience goes beyond professional development. It also creates an opportunity to build meaningful relationships with both the businesses we serve and the students I would work alongside.","coreValue":"Community","valueEssay":"Community stands out to me because I believe people grow the most when they are surrounded by others who are genuinely invested in their development and success. Throughout my academic and professional experiences, I have found that I learn and perform best when I am challenged by others, exposed to perspectives different from my own, and working toward a shared goal.\n\nI also believe that the strongest working relationships go beyond simply completing a project together. They are built through trust, cooperation, and a genuine desire to see other people succeed. That is why REM’s emphasis on community resonates with me. I want to grow professionally, but I also want to build meaningful relationships with the students I work alongside and the small businesses we support.\n\nBeing part of an environment where I can learn from others, contribute my own perspective, and see the collective impact of our work is exactly what I am looking for. I see REM as a place where professional development and personal relationships reinforce one another.","careerInterests":"Consulting, Entrepreneurship / Startups","howRemHelps":"Joining REM on Campus would help me pursue my interests in consulting and entrepreneurship by giving me hands-on experience solving real business problems for small businesses. In consulting, I am interested in learning how to break down ambiguous challenges, analyze information, develop practical recommendations, and communicate those ideas clearly to clients. REM would allow me to practice those skills in a real-world setting rather than only learning them A","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Computer Science / Information Systems, Finance","minor":"Data Science, Other","gpa":"3.5","whyRem":"Rem on Campus's core mission to empower local communities is what drives me to becoming a member of this organization. Running my own digital business taught me firsthand the sheer grit it takes to keep going, and I want to bridge my passion for supporting local owners with my love for data-driven problem solving. I'm eager to bring my strong analytical foundation to the Junior Consulting Strategist role to help Gainesville businesses uncover actionable insights and confidently navigate their hurdles. Rem's \"Learning, Applying, Leading\" framework is exactly what I need to transition from building analytical models to delivering client-facing strategies alongside innovative peers.","coreValue":"Resilience","valueEssay":"As a first-generation student, resilence allowed me to map my own academic path without a blueprint. This same grit drove my pivot into data analytics within the business world. Embracing that steep learning curve pushed me to engineer complex models for personal projects and research teams. In consulting, setbacks are inevitable. Resilence is what transforms roadblocks into strategic pivots. As a Junior Consulting Strategist, I plan to leverage this perserverance to help Gainesville entrepreneurs navigate their own challenges and build lasting success.","careerInterests":"Consulting, Investment Banking / Finance, Tech, Data Analytics / Business Intelligence","howRemHelps":"My goals in consulting, finance, tech, and data analytics center on translating complex information into actionable business strategies. While I possess the technical skills to build predictive models, I need client-facing experience to evolve into a well-rounded advisor. Joining Rem provides the perfect environment to apply my quantitative skills to business problems, and collaborating with ks and figuring things out on the fly taught me that real growth happens the second you decide not to let setbacks hold you back. When things get chaotic or overwhelming, that grit keeps you locked in on what matters and pushes you past your own limits. At the end of the day, resilience is the backbone of everything: if you have that drive and keep your heart in the right place, living out every other Rem on Campus value just falls naturally into place.","careerInterests":"Consulting, Investment Banking / Finance, Tech, Data Analytics / Business Intelligence, Entrepreneurship / Startups, Product Management, Non-Profit / Social Impact","howRemHelps":"Joining Rem on Campus is huge for me because it’s where tech, finance, consulting, and building things actually meet real-world impact. As a past entrepreneur, I am familiar with the difficulties a business can experience, and how external help will motivate the owner to think out of the box. Also, it pushes me to think critically about messy problems, build products that genuinely matter, and back up decisions with real data.\n\nMore than just the hard skills, being part of Rem on Campus invites me to step out of my bubble, experience other people’s realities, and understand problems from perspectives totally different from my own. Working alongside a driven team on high-impact challenges is the best way to sharpen how I lead, stay adaptable, and create solutions that actually causes impact.","position":"Junior Consulting Strategist, Consulting Strategist","skills":"Business Strategy, Back-end web development, Web design, Data analysis, Social media management, Finance and accounting, Python, Microsoft Office Suite","accommodations":"No","other":"I am excited to stop adding value just to myself and to start help other people reach their objectives.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a10_597717e2","timestamp":"8/26/2026 11:59:22","name":"Dhruv Mutha","email":"muthadhruv@ufl.edu","phone":"9548038278","gender":"Male","race":"Asian or Asian American","linkedin":"www.linkedin.com/in/dhruvmutha","resume":"https://drive.google.com/open?id=1Gyy8axYkiBtXqUmXXSn1cL0NlmabPa_y","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Engineering (various disciplines), Finance","minor":"","gpa":"4","whyRem":"I want to be a member of REM to be a part of a community that is committed to using their knowledge to help others. By joining, I'll not only develop my own skills in problem solving, business analytics, and entrepreneurship which align with my future goals to become an entrepreneur, but I'll also be able to make an impact in my community and apply what I learn. Furthermore, I want to be surrounded by likeminded people who care about others and who are driven to push me to reach higher than I ever thought I could alone.","coreValue":"Empathy","valueEssay":"Empathy is something I've carried with me throughout my life and has shown up everywhere, even some places where I didn't want it to. I've always tried to view the perspective of those sitting in front of me before making a decision.\n\nMy future aspirations involve working in M&A and the private equity industry, and by almost everyone I've been told that it's a cutthroat industry with little room for caring. However, from the teachings of my late-grandfather and even my personal life experiences, I've always been someone who's believed in there being a win-win strategy in any situation. I firmly believe that the strongest deals aren't at the expense of someone else, and I hope to transform the way people see M&A. Through REM I'll be able to keep this mindset with me by helping local businesses while bolstering my skills to be successful in the real world, a true win-win.","careerInterests":"Consulting, Investment Banking / Finance, Entrepreneurship / Startups","howRemHelps":"When working in entrepreneurship and buying and selling companies in M&A transactions, the way one creates value in the company before they sell it off is to improve the business' sales and operations or find ways for others to see more value in it than they did before. In REM, strategists are tasked with solving such problems for small businesses, learning how to find inefficiencies and improve them from the bottom up. Furthermore, by doing this in a team setting, it emulates almost exactly how the process will go in real life, and offer an opportunity to build on my communication and negotiating skills which are essential in the industry. REM would be the perfect club for me to build the hard and soft skills for the M&A industry.","position":"Junior Consulting Strategist","skills":"Business Strategy, Data analysis, Marketing and analytics, Finance and accounting, Ads (Facebook/Instagram), E-commerce, Brand Development","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/1/2026 17:12:41","spokeTo":"Christian, Rachel, Adam, Maria, Sat, Hannah, Sachin, Eli"}],"infoSession":{"timestamp":"9/2/2026 0:21:23","session":"09/01","appliedBefore":"No"},"meetMembers":{"timestamp":"9/2/2026 17:06:21","year":"Freshman","appliedBefore":"No"}}},{"id":"a11_d5e778be","timestamp":"8/26/2026 13:36:55","name":"Tilak Kumar","email":"tilakk911@gmail.com","phone":"8135467750","gender":"Male","race":"Indian or Indian American","linkedin":"https://www.linkedin.com/in/tilakratnkumar/","resume":"https://drive.google.com/open?id=1IUibfbqBLe4k_3feqMKd7B9Ft9RMogPY","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Computer Science / Information Systems, Management","minor":"","gpa":"4","whyRem":"I want to join Rem on Campus because I am passionate about using structured problem-solving to help small businesses and local organizations overcome real operational challenges. In my previous consulting and analyst roles at Stellar Media Group and Advaisori, I saw how much measurable value comes from cleaning up messy processes and turning raw numbers into clear, practical strategies. However, many local businesses do not have access to expensive advisory firms or dedicated technical teams to fix their daily bottlenecks. Rem on Campus provides the exact platform I am looking for to work directly with driven students who care about creating genuine social impact while building practical consulting skills together.","coreValue":"Resilience","valueEssay":"Resilience stands out to me the most because meaningful progress rarely happens without facing roadblocks, unexpected errors, and moments where you have to rethink your approach entirely. During my project management internship at Tampa Electric, I took on the challenge of building an AI automation bot to fix a six-month compliance backlog. Early in the process, I hit major technical barriers and initially believed the bot could not be hosted internally on our SharePoint systems. When my team challenged my conclusion and asked me to keep trying, I did not let frustration take over or walk away from the problem. Instead, I put my pride aside, accepted that my initial setup had mistakes, and spent hours digging back into the architecture to find the root issue. By staying resilient and testing new solutions, I successfully launched the bot internally, ultimately cutting audit prep time by 83%. This journey showed me that resilience is not only about getting through the tough moments; it's also about staying composed when things break, taking ownership of errors, and working towards a solution that will help the entire team succeed.","careerInterests":"Consulting","howRemHelps":"Joining Rem on Campus will help me achieve my goal of building a career in management consulting by giving me direct, hands-on experience guiding real-world clients through complex decisions. While I have built strong technical skills in data modelling, SQL, and Power BI across corporate environments, consulting is fundamentally about understanding people, listening to client needs, and communicating recommendations simply. Working on Rem on Campus project teams will allow me to sharpen how I structure complex problems, conduct root-cause analyses, and pitch actionable solutions directly to business leaders. Additionally, collaborating with peers and receiving direct feedback on client deliverables will teach me how to manage client expectations and adapt strategies under tight deadlines. Ultimately, Rem on Campus will provide the practical advisory experience and teamwork foundation to become a better consultant.","position":"Junior Consulting Strategist","skills":"Business Strategy, Statistics and modelling, Marketing and analytics, Photography, Finance and accounting, Python","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a12_e9b60abb","timestamp":"8/27/2026 15:41:58","name":"Hit Baldha","email":"hit.baldha@ufl.edu","phone":"3522191928","gender":"Male","race":"Asian or Asian American","linkedin":"https://www.linkedin.com/in/hit-baldha","resume":"https://drive.google.com/open?id=1jzYO1X_R7ozkxbWOfYr4v9NYBC3VDbom","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"","gpa":"3.85","whyRem":"I want to join Rem on Campus because I am interested in consulting and want experience working through real business problems with other motivated students. In the long run, I hope to become an entrepreneur, and I think learning how different businesses operate, what problems they face, and how they make decisions will be valuable for that goal. I have also realized through my past experiences that I enjoy work that requires me to look closely at information and understand why something is happening. As Treasurer for Infinity Council, I managed a $3,000+ budget and had to think carefully about how money was being used, while my equity analyst internship required me to research companies and form conclusions based on both financial and business information. Rem would give me the chance to apply that same mindset to a wider range of business challenges while learning from people who have different experiences and ways of thinking.","coreValue":"Intellectual Growth","valueEssay":"Intellectual Growth is the core value that is most important to me because I believe growth starts with understanding yourself and being willing to keep learning. To me, intellectual growth is not just about gaining more knowledge; it is also about recognizing what you are good at, where you need to improve, and being open to changing your perspective when you learn something new. I also think it connects closely with Rem’s other values. The more you learn about people and different perspectives, the easier it becomes to have empathy and contribute to a community. Learning from mistakes helps build resilience, while being curious and willing to challenge your own thinking can lead to more creative ideas and innovation. I want to be in an environment where I am constantly learning from the work I do and from the people around me, and I think Rem would give me that opportunity.","careerInterests":"Consulting, Investment Banking / Finance, Entrepreneurship / Startups","howRemHelps":"Joining Rem on Campus would help me move toward both my short-term goal of exploring consulting and my longer-term goal of becoming an entrepreneur. Before I eventually try to build something of my own, I want to understand how successful businesses work and become better at identifying and solving the problems they face. Consulting would give me exposure to different companies and situations rather than only seeing how one business operates. I also want to strengthen skills that I have started developing through my previous experiences, especially analyzing information, paying attention to details, communicating my ideas clearly, and working with others. During my equity analyst internship, for example, I researched companies and turned my findings into investment recommendations, which showed me how much I enjoy understanding a business and making a decision based on what I find. I see Rem as a place where I can continue building those skills through actual experience while also learning what kind of problems and industries interest me most.","position":"Junior Consulting Strategist","skills":"Business Strategy, Statistics and modelling, Data analysis, Finance and accounting","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a13_876e7401","timestamp":"8/27/2026 20:30:35","name":"Sofia Barnabei Lopez","email":"sbarnabeilopez@ufl.edu","phone":"4076136897","gender":"Female","race":"Hispanic or Latino","linkedin":"www.linkedin.com/in/sofiabarnabeilopez","resume":"https://drive.google.com/open?id=1XXmJxG9JmfQhC_-6EXtVRJCEYk7Gq-3-","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"","gpa":"3.9","whyRem":"I want to be a member of Rem on Campus because I am always striving to learn more about the different areas of finance and continuing to develop professionally. Having spent the last year strengthening my behavioral skills and networking abilities, I am determined to cultivate the technical skills that will set me up for success in my professional career. As a finance student, I truly believe the most impactful way to learn and gain a deeper understanding of the many industries within finance is by exploring opportunities outside of the classroom. I am also interested in continuing to connect with fellow students and to gaining insights directly from professionals. Overall, I believe Rem on Campus would provide a valuable learning opportunity to build on my foundational knowledge, while creating meaningful connections and growing as a young professional.","coreValue":"Intellectual Growth","valueEssay":"Intellectual growth stands out to me among the core values because I believe there is always more to learn, especially as a young professional. Throughout my academic experience, I have consistently sought out different opportunities to expand my current understanding of finance. As I continue to learn technical, behavioral, and social skills within the professional realm, I recognize that true growth and dedication requires challenging myself with new experiences. This core value connects directly to my own journey, as I am specifically looking to build my knowledge of technical and on-the-job skills. Pursuing intellectual growth will push me to succeed not only in my career, but also in aspects outside of my career, allowing me to always remain open minded.","careerInterests":"Brand Strategy, Data Analytics / Business Intelligence, Product Management","howRemHelps":"Joining Rem on Campus will allow me to explore and learn about different areas of industry within finance while building skills that are directly relevant to my goal of pursuing a career in corporate finance. I am fascinated with learning how different functions of a business work together to drive a companies' financial performance and overall success. To succeed in this field, I believe it is important to truly understand business strategy and how to analyze data to make informed decisions that support a company’s goals. Through Rem on Campus, I will gain firsthand exposure to these areas, while strengthening my technical and analytical skills. Learning from professionals, older students, and even fellow classmates will provide me with a diverse and impactful opportunity to expand my knowledge. Overall, I believe Rem on Campus will help me in my process of becoming a business professional.","position":"Junior Consulting Strategist","skills":"Data analysis, Social media management, Communications and copy-writing, Python","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/1/20 3r_8JnJpkANVt0O8YsHnt-F3_YFg","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"","gpa":"3.91","whyRem":"This past summer, I interned as an AI Strategy Consultant and enjoyed using problem solving and AI to help businesses save money and become more efficient. I believe Rem on Campus will help me build on these skills and allow me to pursue a career in consulting.","coreValue":"Resilience","valueEssay":"Resilience has always stood out to me because it represents the ability to keep moving forward, even when things go off track. Throughout my journey, especially this past summer, it is obvious that success doesn't come without setbacks. Every challenge has taught me to fight back with a stronger attitude and work ethic, allowing me to accomplish several goals. Accomplishments are made by staying disciplined and working through hardships, which is why resilience is most important to me.","careerInterests":"Consulting, Investment Banking / Finance","howRemHelps":"Rem on Campus will allow me to work in a hands on setting by solving real business problems and working directly with companies and clients. Rem would also allow me to strengthen my skillset, including communication, analytical thinking, and problem solving skills that are essential to the business world and consulting world alike. I am eager to connect with new and returning members, gaining exposure to different industries and increasing my confidence about pursuing a career in consulting.","position":"Junior Consulting Strategist, Consulting Strategist","skills":"Business Strategy, Back-end web development, Web design, Marketing and analytics, Finance and accounting, HTML, AI LLM's (Anthropic, OpenAI, etc.)","accommodations":"No","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a15_1cbeea83","timestamp":"8/28/2026 14:25:09","name":"Deandra Kurti","email":"deandra.kurti@gmail.com","phone":"8622171901","gender":"Female","race":"White or Caucasian","linkedin":"www.linkedin.com/in/deandra-kurti-7236a23a2","resume":"https://drive.google.com/open?id=1UufsEFx5IrSjNynZaNOpT4BqW9yXKWAy","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Biological Sciences (e.g. Biology, Chemistry and Physics)","minor":"Mathematics","gpa":"4.68 (Highschool), N/A (college)","whyRem":"Being a member of Rem on Campus is an exciting opportunity to intentionally prepare myself for a consulting career while stepping into UF’s campus life with purpose as a freshman. I’m excited by the chance to work on real projects that mirror the collaborative and fast-paced problem-solving environment of the consulting world. I hope to gain guidance from experienced and ambitious peers who are equally committed to growing professionally and will provide me with a clearer understanding of what meaningful, client-focused work looks like through the utilization of technology. As eager as I am to learn how professionals communicate and deliver impact in Rem on Campus, I am equally motivated to contribute. I bring a leadership style that is centered on inclusivity so the ideas of my peers can flourish among one another. As a committed leader, I believe that the strongest teams are those that emerge from a simultaneously supportive and challenging team culture.","coreValue":"Community","valueEssay":"The way I lead and create impact is defined by the value I place in communities. The high school swimming team I joined my freshman year wouldn’t recognize the team that I ended my swimming career with. It lacked more than just the funds and parent association, but a sense of camaraderie that I had just experienced on our state-championship soccer team. Despite being a newcomer, I recognized that our team’s success would be rooted in strengthening our team culture. Drawing from what I’d seen in soccer, I started gathering a few teammates I had just met that week and going to l
