 to pursue my education in person, I chose to move to Gainesville and become more involved in the UF community. In the meantime, I am completing my remaining business prerequisites online through my community college in Boca Raton, with the goal of transferring into UF’s Business Administration program in the fall.\n\nI hope my current school status does not influence your decision, as I am confident in my ability to contribute and succeed within Rem. (:","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a69_d169f540","timestamp":"9/3/2026 20:31:37","name":"Lia Prosperino","email":"prosperinol@ufl.edu","phone":"9145629600","gender":"Female","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/liaprosperino/","resume":"https://drive.google.com/open?id=1r2ltwG9I4EeVh3JE4Mvu5666gcHN5S61","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"","gpa":"3.84","whyRem":"I’m interested in becoming a member of Rem on Campus due to the opportunity to connect my interests in problem-solving and business to meaningful work in the Gainesville community. Although Rem's strong collaborative culture is what initially stood out to me, my conversations with Hannah and Eli provided me with a better understanding of the organization's dedication to helping local businesses thrive. The idea of working with individual clients to understand the challenges they face and develop solutions appeals to me greatly. This kind of practical experience will enable me to hone my analytical and problem-solving skills while learning about how different businesses approach growth and decision-making.\nAs I strive to pursue a career in corporate finance, I know how important it is to comprehend how financial decision-making impacts the strategic direction of a business. I strongly believe Rem will help me gain this valuable experience by applying what I learn in the classroom to real-world business problems.","coreValue":"Intellectual Growth","valueEssay":"Intellectual growth stands out to me because I have seen first-hand how pushing yourself outside of your comfort zone can teach you some of the most impactful lessons. I began my journey at UF on a pre-health track, but throughout the past year I took the opportunity to explore my interests, gain new experiences, and grow both personally and professionally. Through all of this, I came to understand the importance of staying flexible while constantly challenging myself.\nAs I have developed a deep passion for business and finance, I have become especially interested in consulting and the idea of solving problems to help others. I enjoy working through complex problems, exploring various opinions on an issue, and finding real solutions. I know that there is so much more for me to learn about the world of business, which is why I see so much value in the opportunity to think critically, ask questions, and learn from those around me. Joining Rem on Campus would allow me to apply my skills to real-life business problems, contribute to the Gainesville community, and continue developing the intellectual curiosity and problem-solving skills necessary to grow as a young professional.","careerInterests":"Investment Banking / Finance, Undecided / Exploring Options","howRemHelps":"Rem On Campus will play a crucial role in my career goals by allowing me to apply my knowledge in business and finance to real-life problems faced by small businesses. In the future, I hope to build a career in corporate finance in either the sports or entertainment industry. Therefore, I find it so important to gain insight on how financial decision making impacts business strategy. While finance plays a crucial role in resource allocation, I also want to understand how those decisions affect operations, growth opportunities, and the long-term success of a business.\nThrough Rem, I will be able to improve my problem-solving skills and learn how to assess the challenges of a business while providing effective solutions within a team. At the same time, working with various clients from different industries will help me understand how businesses operate and make decisions depending on the industry. Rem on Campus will provide me with hands-on experience in applying my knowledge to solve real-world business problems and gain the skills required for a successful career in corporate finance.","position":"Junior Consulting Strategist","skills":"Business Strategy, Data analysis, Social media management, Finance and accounting, Microsoft Office Suite","accommodations":"","other":"I am a person who enjoys meeting new people, getting to know them, and putting myself in environments that force me to grow. I'm excited about the opportunity to join REM on Campus as it will give me the chance to collaborate with like-minded individuals - people who are ambitious, supportive and genuinely want to see each other succeed.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":{"timestamp":"9/3/2026 22:01:25","session":"09/03","appliedBefore":"No"},"meetMembers":null}},{"id":"a70_74d7244e","timestamp":"9/3/2026 20:51:03","name":"Lydia Phanitdasack","email":"lydia.phanitdasa@ufl.edu","phone":"5615621262","gender":"Female","race":"Asian or Asian American","linkedin":"www.linkedin.com/in/lydiaphanitdasack","resume":"https://drive.google.com/open?id=1cwGMAh_OeI-EnqFoep4Ny1A493gQMniw","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Management","minor":"","gpa":"3.6","whyRem":"I hope to gain professional casework experience while developing practical skills I can carry into my career. I look forward to working on cases hands-on rather than theoretically. Getting the opportunity to solve complex problems, such as helping a company build out its marketing strategy, will deepen my skills for my future endeavors. Long-term, I plan to build a career in consulting and brand strategy, and I know Rem is exactly the kind of environment that will help me sharpen those skills early on\n\nMy recent experience working within 180 Degrees Consulting made me realize that this was the path for me, and after coffee chatting with multiple people in the industry, I knew I wanted more hands-on work. This is why I want to focus on the for-profit space for now, as it more closely aligns with where I see my career heading long term.\n\nMost importantly, having the opportunity to work with driven and hardworking people excited to make a difference is something I look forward to. Rem and Company will allow me to work closely with diverse members and refine both my interpersonal and technical skills.","coreValue":"Community","valueEssay":"Community stands out to me because, as humans, we need human connection; one may even say it is crucial to our survival. Having a sense of community allows individuals to feel at home, welcomed, and understood. I hope that by surrounding myself with a community as driven as Rem and Company, I will not only feel motivated, but also disciplined in my work ethic, pushing myself to grow alongside people who hold the same standards I hold for myself.\n\nThis value shows up in how I approach my relationships more broadly. I am someone who always pushes for team bonding, whether that's in a club, a project group, or a friend group, because I genuinely believe strong relationships are the foundation of good work. I find myself craving that touchpoint with my friends and family if we go too long without talking, and I bring that same energy into how I connect with others professionally. I hope to carry that into our client meetings as well, building lasting relationships by being welcoming and friendly, so clients feel like they are working with people who genuinely care about them, not just delivering a service.","careerInterests":"Consulting, Investment Banking / Finance, Marketing, Brand Strategy","howRemHelps":"Joining Rem on Campus will help me build the hands-on casework experience I need to move confidently into the recruiting cycle and client-facing work after graduation. I run my own freelance photography and videography business, creating product shots, branding visuals, and brand kits for local businesses, so working on real client cases will sharpen skills I already rely on, like understanding a brand's identity and translating a client's vision into a finished product. Seeing how a consulting team approaches a branding or marketing problem will give me frameworks I can bring straight back into how I pitch and present my own work, and being surrounded by people who think critically about business strategy will push me to treat my business less like a hobby and more like something I'm building intentionally.\n\nRight now I'm drawn to several areas, including consulting, finance, marketing, and brand strategy, but I haven't fully narrowed down which one I want to build my career around. That's actually a big part of why I want to join Rem. Getting exposure to different types of cases across industries will let me figure out where my strengths and interests actually line up, instead of guessing from the outside.\n\nBeyond the technical experience, being part of a team of driven, hardworking, and like-minded people will keep me accountable and motivated, and I know the relationships I build here will carry into how I show up with future clients and colleagues.","position":"Junior Consulting Strategist","skills":"Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Business Strategy, Web design, Marketing and analytics, Search Engine Optimization (SEO), Videography, Photography, Social media management, Microsoft Office Suite, Ads (Facebook/Instagram)","accommodations":"N/A","other":"I am currently a part of 180 Degrees Consulting, but would fully transfer over to REM if accepted.\n\nI've had the chance to speak with several members, including Satya Sakamuri and Luke Nevins, both of whose passion for Rem is honestly contagious.\"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a71_1d26fc37","timestamp":"9/3/2026 21:05:23","name":"Jack McNamee","email":"jack.mcnamee@ufl.edu","phone":"901-236-8892","gender":"Male","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/jack-mcnamee-309127382/","resume":"https://drive.google.com/open?id=1Q2PLFtrME_qkcuIgtIoQlJM06ZzUrYaU","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"","gpa":"3.77","whyRem":"I want to become a member of Rem on campus because it offers the unique opportunity to gain real-world business experience while making a tangible impact on the community. As a finance student, I have the foundational knowledge and skills surrounding business operations and decision-making, but Rem would provide me with the opportunity to apply that knowledge to real challenges faced by small businesses. \n     I am also attracted to the global reputation Rem has built after just a few years, and I am excited to join an organization that creates an impact far beyond the Gainesville community. I am eager to surround myself with like-minded individuals who are motivated to use the skills they have gained in the classroom and apply them to real-life situations. Building relationships with these students, small business owners, and professionals who I will learn from will expose me to new perspectives valuable both now and long into my future career. \nLastly, the three-phase professional development model of learning, applying, and leading stands out to me, and I can visualize myself progressing through it to challenge myself and grow into a confident leader throughout my time at UF. The meaningful contributions I can make to the community in Rem while simultaneously developing in areas like building deliverables and presenting to clients is a unique opportunity unlike any other program I have come across.","coreValue":"Community","valueEssay":"Rem’s mission of helping struggling small businesses is one I have seen firsthand and something I place great value in. Along the Jersey Shore, where I have spent every summer of my life, my family and I became close friends with the manager of a clothing store downtown who had originally grown up in Hungary. For years, he talked about his dream of opening a small restaurant in America with his wife, who was the head chef at a restaurant just down the street.\n     About two summers ago, they finally saved enough money to pursue that dream and opened a pop-up brunch shack selling breakfast sandwiches, coffee, and other quick casual eats. The G Spot, located in downtown Avalon, New Jersey, had finally opened, and we could not have been happier to see him achieve his lifelong dream. With just two employees- his wife as the chef and him working the counter and register- we were certain it would be a success. However, we quickly learned this was not the case, as it seemed many people were not even aware the restaurant existed. Watching him and his wife struggle after so many years of hard work was difficult to see and gave me a new perspective on the challenges small business owners face. As their marketing improved and word began to spread about both the restaurant and the owners’ story, I began to see firsthand just how much the support of a community can impact a small business and the dreams behind it.\n     This experience is why the core value of Community at Rem stands out to me most. To me, community is leveraging your relationships and abilities to contribute to the success of those around you. Through Rem, I am excited for the opportunity to do exactly that by collaborating with other motivated students to help small businesses overcome challenges they may not be able to solve on their own.","careerInterests":"Consulting, Investment Banking / Finance, Marketing","howRemHelps":"By joining Rem on Campus, I believe I will be well prepared for various facets of the business industry and ready to contribute to the success of the future company I work for and tackle any challenges we may face. By first learning problem-solving fundamentals through meetings and collaboration exercises, and then transitioning to applying that knowledge through opportunities like presenting to clients and developing strategic business recommendations, I will build the skills necessary to succeed in career paths such as consulting, finance, and marketing.\n     From a consulting perspective, the opportunity to analyze a real-world business, identify its challenges, and develop actionable solutions is a rare experience similar to the type of work I would handle professionally. Rem would also expose me to areas of finance through analyzing financial performance and understanding how strategic decisions can impact the success of a business. Additionally, evaluating customer behavior, competitors, and opportunities for growth would provide valuable experience applicable to a career in marketing. \n     Overall, Rem will help me achieve these career goals by allowing me to explore them through real-world application rather than simply learning about them in a classroom. The analytical, problem-solving, teamwork, communication, and leadership skills I develop through Rem will provide me with a strong foundation for whichever of these career paths I ultimately pursue.","position":"Junior Consulting Strategist","skills":"Business Strategy, Statistics and modelling, Data analysis, Marketing and analytics, Finance and accounting, Brand Development","accommodations":"N/A","other":"N/A","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a72_a0c8d9cb","timestamp":"9/3/2026 22:01:03","name":"Praneeth Tallapaneni","email":"ptallapaneni@ufl.edu","phone":"9546375627","gender":"Male","race":"Asian or Asian American","linkedin":"https://www.linkedin.com/in/praneeth-tallapaneni-359b67296/","resume":"https://drive.google.com/open?id=1Lom5KLymxlH-4gBlAv3YbRg4G0XQql4-","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"","gpa":"N/A","whyRem":"Rem on Campus, in essence, is growth to me. Growth can be interpreted in many ways, and so can Rem. It is about the growth of my individuality; being a college student means I need to figure out what I want for my career and who I want to be in the future. I want to be around people that challenge me to be better, think outside the box, and give me ideas I would have never thought of before. I want to be a part of an inclusive community where I can grow professionally and personally, while learning from others with diverse backgrounds and mindsets.\n\nOn the other hand, growth also reflects my potential contribution to Rem. I do not just want to be a name on paper of an organization I believe in; I want to be a part of Rem’s community that brings new ideas and collaborates to innovate the organization for the better. Rem’s growth particularly attracts me because I want my college experience to be more than just preparation for my future career. I want to learn the necessary skills to contribute to Rem’s mission and to eventually have a career that makes an impact.\n\nI have been especially motivated by the Bushel & Peck story that Sachin loves to tell. This story made me sure I want to do Rem. Brainstorming ideas for hours, finding the perfect solution, implementing it, and then checking up on the business in 3-6 months to see it in action and helping the company’s operations and realize a tangible impact is idyllic. I want for myself a sense of fulfillment that comes from solving a case that doesn’t end with just a presentation, but with a real solution that makes a difference. The idea that my work could directly create success of a company is something I find to motivate me.","coreValue":"Innovation","valueEssay":"Innovation stands out to me because I have always seen growth as challenging the status quo. To me, innovation is not limited to creating something out of nothing; sometimes, it is as simple as looking at a problem differently and coming up with something better than what we know. I believe I want to innovate throughout my college journey, and eventually, my future career.\n\n\nWhether I get into consulting, finance, law, or a non-profit, I can tell all of these fields involve me having to solve a problem. And as much as I want to learn, understand, and succeed in my field, I cannot ignore the fact that some things just do not work. If I look at something and think to myself, “This just works because it has always worked,” I know I am not at my best. I believe Rem will give me the space to develop my innovative mindset because I think innovation is a skill that applies not only to my future profession but also to my personal life. I want to challenge myself and others to think differently and to innovate in all areas of my life. I hope Rem will inspire and motivate me to be a more innovative person.","careerInterests":"Consulting, Investment Banking / Finance, Non-Profit / Social Impact, Law","howRemHelps":"I think consulting, IB/Finance, non-profit/social impact, and law, although different, all require similar skills. I believe Rem will give me the opportunity to build the skill set I need for any of these fields while also helping me discover which one I want to focus on my future career.\n\n\nI want to actually learn skills from others and gain experience by collaborating with people who share a common ground with me. I think Rem will enable me to be in a position where I can learn from others and contribute to the organization while getting the real-world experience I need to have a fulfilling career in the field I chose. In my life, I think the most important thing I need to achieve my career goals is to be surrounded by people who challenge me, motivate me to be better, and support me throughout my journey. At this point in my life, I do not think I should have everything figured out yet. I want to be around people that give me the opportunities I need to explore and grow, so I can have a sense of direction and confidence in the decisions I make for my future career. I think Rem can enable me to do that while also preparing me for a sustainable career path that involves business and consulting with a purpose.","position":"Junior Consulting Strategist, Consulting Strategist","skills":"Business Strategy, Data analysis, Social media management, Finance and accounting, Ads (Facebook/Instagram)","accommodations":"N/A","other":"One thing I would like the Rem on Campus team to know is that I am someone who wants to maximize my experience with the opportunities I get. I do not want to be in an organization where I can just attend meetings and list that as an experience on my resume; I want to be around motivated people that allow me to contribute wherever I can. I also believe I have a lot to learn in college, and I think that is one of the things I look forward to most. I want to learn from people with more knowledge and experience than me, and I think Rem will give me the chance to do that. If given the opportunity to join Rem, I believe I will bring not only my knowledge and skills but also my motivation and enthusiasm to learn from the people I will be collaborating with, while also contributing to Rem’s mission.","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/1/2026 17:52:32","spokeTo":"Sachin, Sat (Sathya), Max, Hannah, Eli, Kyle, Christian"},{"timestamp":"9/2/2026 17:06:43","spokeTo":"McKenzie, Reese, Aarohi, Maya"},{"timestamp":"9/3/2026 18:03:22","spokeTo":"Colton, Adam, Ali, Hannah, Pratheek, Terren, Robert, Lexi"}],"infoSession":{"timestamp":"9/2/2026 0:21:33","session":"09/01","appliedBefore":"No"},"meetMembers":{"timestamp":"9/2/2026 17:06:46","year":"Freshman","appliedBefore":"No"}}},{"id":"a73_0ce29c50","timestamp":"9/3/2026 22:38:59","name":"Jared Robaina","email":"jaredrobaina14@gmail.com","phone":"3059042623","gender":"Male","race":"Hispanic or Latino","linkedin":"https://www.linkedin.com/in/jared-robaina-9218a0370?utm_source=share_via&utm_content=profile&utm_medium=member_ios","resume":"https://drive.google.com/open?id=1TOC4ulcoMoeO90ZdDJWO0gqwMzqI6MEM","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"Other","gpa":"HS GPA: 3.97","whyRem":"Throughout high school and within my community, I have already found myself solving problems for organizations that have had an immense impact on my life. Theater, for instance, was a passion and driving force for me throughout all four years of high school. However, we noticed that the shows we worked tirelessly to put on and the messages we were trying to spread weren’t reaching the students and parents who needed to hear them simply because there was a lack of name recognition when we’d do a less popular show. My director loved these shows, but the task of getting high schoolers interested in theater seemed daunting. This ultimately led to the creation of a dedicated marketing team that still exists today. Launch X opened my eyes to the immense waste that grocery stores cause each year, which led to Second Serve, a start-up founded on reducing food waste by using modern technology to avoid unnecessarily throwing away product whilst also providing customers with a discount, creating an avenue for accessible organic produce. This was special because it allowed me to work directly with small business owners, gaining insight into the decisions they make and listening to their problems and lived experience to refine our start-up concept.\n\nThese experiences made me increasingly interested in the reasoning behind business decisions, but I also felt like the decisions I was making were surface-level, and while success was there in the moment, I didn’t make a thorough plan for sustainable growth. I want to understand why a strategy works, how it can be improved, and how to use tangible evidence to make a stronger, more long-term recommendation. \n\nRem, as an organization, would help me develop a more nuanced way of thinking while working in an environment where problem-solving and long-term strategy are preferred over short-term solutions. That interdisciplinary environment in Rem is particularly important to me because a lot of my previous problem-solving has been shaped by marketing data with a focus on creative work. I want to be challenged by teammates who may approach similar issues through the lenses of economics, technology, or other sectors that I wouldn’t naturally consider. At the same time, I believe my own background would allow me to contribute a point of view that is more focused on consumer behavior and audience engagement. Learning from a separate perspective will further allow me to become a more analytical and disciplined problem-solver.\n\nI want to be a member of Rem because it will allow me to do both things I value most: support organizations in the surrounding community while becoming a more capable strategist myself. I am passionate about problem-solving and even more so when business is used to give back to those who support it in the first place. The opportunity to help small businesses with their challenges while finding purpose and leading with the intention to create change is the type of hands-on experience I am looking for at UF.","coreValue":"Community","valueEssay":"Finding a home where I was accepted has always driven my purpose in life. A community to me is much more than a group of people with common interests; it’s where you can be authentically yourself and have a safety net of people who truly believe in you. These places of comfort have always fueled a passion for me to give back to the communities that made who I am in the first place, where I have a responsibility to make sure that the people who come after me feel true acceptance for who they are, the same way I did. \n\nTheater was the first place where I truly understood that. Throughout all four years of high school, being on stage became one of my biggest constants in life. Coming into my freshman year, I wasn’t sure who I was or where I wanted to be,e but theater gave me that. It gave mesome ofe my closest friends that I would have never met without it, as well as an outlet to finally express my creative passions both on stage and behind the scenes, giving me a newfound confidence and identity. As I became more involved, I not only wanted to benefit from my community, but I wanted to strengthen it. I took on a role as a mentor for middle school theater students to pass on the self-confidence, leadership, and sense of belonging to other students who felt like they were lost or had to hide a part of themselves to fit in. At that point, what mattered to me was not a title but strengthening and opening the door a bit wider to a community that made me feel welcomed and helped me grow both socially and professionally.\n\nI found a similar sense of community through sewing. What began as a self-taught hobby quickly grew into another source of confidence for me. Altering clothing showed me that something as simple as changing the fit of a garment could truly affect how someone felt when they wore it. Dejar allowed me to alter other students' clothing and became a way for me to take something that had once empowered me and share that feeling with the surrounding community, allowing others to feel comfortable and confident in their own style.\n\nInstances like these are the reason why community is the Rem value that resonates with me the most. I feel fulfilled when I can support spaces that contributed to and believed in me first. Professionally, I want to carry a similar mindset when it comes to consulting clients. I do not want to approach organizations as solely a problem solver but rather understand the people behind them, the communities they serve, and the responsibility that comes when making recommendations that affect both. I want to bring the same instincts I developed in theater and through Dejar to learn from a community, invest in it, and leave it stronger than I found it.","careerInterests":"Consulting, Marketing, Brand Strategy, Entrepreneurship / Startups, Non-Profit / Social Impact","howRemHelps":"Up to this point in my professional journey, I’ve explored the various career goals above separately or in pairs, but joining Rem would allow me to weave these various career goals into one cohesive vision. Rather than learning and applying each of these fields separately, Rem’s interdisciplinary structure would allow me to see how these various facets of business intersect when working on the challenges that face an actual organization. \n\nFor consulting, Rem would offer me experience working in a professional team environment where the quality of my contribution is filtered, reflected on, and optimized. Beyond this, I want to further grow my confidence in client communication and build the skill of putting myself in the client’s shoes. Furthermore, I want to become confident in my own ability to take ownership of deliverables and be able to explain the reasoning behind a recommendation to both my peers on a technical level and to clients on a practical level. Those are the experiences that would help me determine if consulting is a stepping stone to another career path or a field where I can genuinely see myself succeeding long-term. \n\nRem would also allow me to explore marketing and brand strategy on a deeper level beyond just a creative perspective. While I have already found a love for graphic design and social media marketing, I want greater exposure to how a brand identifies its position and the decisions that are made before a campaign even begins. Second Serve let me scratch the tip of the iceberg, but speaking in depth with business owners in various sectors as well as mentors within Rem will let me cultivate that skill set and apply it to future clients or other ventures that are yet to come. \n\nSimilarly, speaking to various business owners at different stages of development would let me further hone my passion for entrepreneurship. Observing how leaders make decisions when resources, time, and opportunities are limited will let me gain a perspective that I haven’t had the opportunity to see through just working on ventures I’m personally involved in. Carrying those lessons into both a meeting as well as my future is essential for future endeavors in both business ownership and finance.\n\nAs for social impact, I want to see how strategic decisions can account for both business performance and broader outcomes such as sustainability for community value beyond monetary gain. Both Second Serve and Dejar had a central focus on sustainable practices, but these small-scale projects don’t involve the challenge that comes with scaling and sustainability. Rem can help find the balance in these two avenues.\n\nRem allows me to test these career intersections through experience, training me to use various perspectives when solving a problem rather than one or two at a time. I hope to gain a specialized professional skill set as well as a clear understanding of how each of my strengths fits together and what is preventing me from being a well-rounded team member, ultimately giving me a much more informed sense of the type of work I want to pursue after college.","position":"Junior Consulting Strategist","skills":"Marketing and analytics, Videography, Photography, Social media management, Ads (Facebook/Instagram), Brand Development","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/1/2026 18:07:13","spokeTo":"Terrence, Rachel, Hannah, Eli, Grace, Adam, Fox"},{"timestamp":"9/3/2026 20:33:54","spokeTo":"Eli, Lexi, Ali, Robert, Max, Aya"}],"infoSession":{"timestamp":"9/2/2026 1:15:55","session":"09/01","appliedBefore":"No"},"meetMembers":null}},{"id":"a75_f92366ec","timestamp":"9/3/2026 23:37:45","name":"Annabelle Carey","email":"annabellecarey@ufl.edu","phone":"4073834023","gender":"Female","race":"White or Caucasian","linkedin":"www.linkedin.com/in/annabellecarey","resume":"https://drive.google.com/open?id=1A_7p_CPT4nHBEVZtMZQOBveiEd08VTQC","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Accounting","minor":"","gpa":"3.79","whyRem":"I want to be a member of REM because I want to gain hands-on experience in the consulting industry. Being an accounting major, I've enjoyed learning the technical side of accounting, but I'm looking for more real-world experience to see how I can make a meaningful impact on my community. I've grown to love the city of Gainesville and with such a large student population I think connecting local businesses to the university would be very fulfilling and worth-while.","coreValue":"Empathy","valueEssay":"I chose the value of empathy because it is a trait that I have not always possessed, but have gained recently since being in college. I think it is easy to become irritable in such a large, busy area (like a university) when there are always people around, however once I realized that being empathetic and understanding was such a pivotal trait in building meaningful connections it changed the trajectory of my experience here at UF. Instead of thinking about the \"next thing to say\" in a conversation, I began genuinely focusing on what the person I was talking to had to say, and it deepened my understanding of the people around me. Empathy is important because it helps us look past ourselves and truly understand what is going on around us. I believe this is especially important to the success of an organization like REM, where understanding and making a meaningful impact on the community is a main priority.","careerInterests":"Consulting, Data Analytics / Business Intelligence, Public Policy / Government","howRemHelps":"Joining REM on Campus would help me achieve my career goals by giving me the opportunity to apply what I am learning in the classroom to real-world situations. As an accounting major, I am developing a strong technical and analytical foundation, but I also want to learn how to use those skills to solve problems that impact businesses and communities. My interests in consulting, data analytics, and public policy all involve looking at complex information, understanding the people affected by it, and using that information to make meaningful decisions. Through REM, I hope to gain experience working with real organizations, analyzing problems, and collaborating with people who bring different perspectives and skill sets. I believe this experience would not only prepare me for a future career, but also help me better understand where my strengths and interests can make the greatest impact.","position":"Junior Consulting Strategist","skills":"Social media management, Ads (Facebook/Instagram), Brand Development","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a76_76afb80d","timestamp":"9/4/2026 0:05:24","name":"Ruhaan Sood","email":"RSood1203@gmail.com","phone":"5615990961","gender":"Male","race":"Indian or Indian American","linkedin":"www.linkedin.com/in/ruhaansood","resume":"https://drive.google.com/open?id=19Ufnh62RSIZWYIs9fP23h7oA2AAQGT5v","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"","gpa":"HS GPA: 3.8","whyRem":"I'd like to be a member of Rem on Campus because it offers the unique opportunity to apply problem solving and structure to the local community. I've always valued hands-on civic engagement with those nearby, doing my best to volunteer and serve a variety of nonprofit organizations in the Palm Beach area. Through Rem on Campus, I want to harness this spirit and learn more about business strategy and consulting to apply it towards the greater community around UF.\n\nAdditionally, I'm curious about Rem's progression phase of leadership and their emphasis on \"learning\". I want absorb more information about the business industry as it's a future career that I feel very passionate about. Specifically, I'd like to know more about what case studies are truly like and also understanding how different parts of business strategy come together (design, business finance, implementation, etc). Learning more about these factors and how Rem at UF delivers this into a finished product to energize and improve the Gainesville community is important to me. It'll teach me what local businesses truly need, allow me to collaborate  with like-minded individuals, and create finished products that actually have impact.","coreValue":"Empathy","valueEssay":"Empathy stands out to me because I view it as the bridge between strategy and human impact. In business and the general financial world, it's easy to overlook operations (struggling and succeeding alike) and simply only view the data-driven mechanics behind them and subsequently deploy a solution only focused on quantitative metrics. Without empathy, the best financial/operational strategy is useless if it ignores the constraints, fears, and reality of the business that has to execute it. \n\nMy view and passion for empathy is deeply rooted in my background of competitive public speaking through speech and debate. When constantly being tasked with building compelling arguments and narratives, effective communication isn't about being the smartest in the room with the richest data. Instead, my best arguments were won when I understood and saw myself through my audience.Through every new speech topic, my core goal was to always understand my judges, spectators, and the audience. You have to be able to anticipate perspective and emotion to deliver a message or solution that actually resonates with a human. \n\nI found this dynamic reach out further from a community perspective looking at the mission of Rem on Campus. It's largely why the organization's values resonate deeply within me. Small business owners are the backbone of our country, individuals who pour every last cent into work that means more than corporate giants could ever wish to amount to. With the mission of pro-bono consulting provided through Rem, empathy means listening and understanding the businesses unique pressures and advantages. I aim to bring an empathetic and audience-first mindset towards Rem because I want to ensure that my work within the organization is not an intellectually sound number on Excel. I aim to ultimately serve the community I live in.","careerInterests":"Consulting, Investment Banking / Finance, Non-Profit / Social Impact, Public Policy / Government","howRemHelps":"I think joining Rem on Campus will provide a link between learning opportunities and the execution across my varied career interests. It's a unique environment to synthesize a variety of attributes that future employers will find desirable (analysis, engagement, communication). Industries such as IB and PE demand more than just financial models, they require knowledge of how businesses actually operate. Working with Rem on Campus will teach me to look beyond spreadsheets and actually understand the operational realities, business friction, and dynamics that drive the numbers on the spreadsheet. I believe these will make me a more grounded employee when evaluating future financial targets and just lengthen my overall foundation of the finance industry. \n\nThrough consulting, I desire to learn more about how firms diagnose problems and then translate them into employable strategies. The ability to structure a solution in high-pressure environments is something local communities need (that REM provides). Rem on Campus offers the hands-on environment to practice delivering these ideas with empathy and value, ensuring recommendations are actually actionable for the client.","position":"Junior Consulting Strategist","skills":"Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), User Experience (UX), Business Strategy, Statistics and modelling, Data analysis, Marketing and analytics, Photography, Social media management, Finance and accounting, Design Thinking, Microsoft Office Suite, Ads (Facebook/Instagram), E-commerce, Machine Learning, Brand Development","accommodations":"N/A","other":"I'm extremely motivated to serve, regardless if I am offered a position within Rem. I am ready to support/contribute/or do anything to help the needs of Rem at UF.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a77_0b03216c","timestamp":"9/4/2026 0:53:09","name":"Liora Brown","email":"liora.brown@ufl.edu","phone":"5169608310","gender":"Female","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/liora-brown/","resume":"https://drive.google.com/open?id=1OA5Eq3hyiy_dx9cpAZ8aiBCqIy1UoMny","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"Mathematics","gpa":"3.93","whyRem":"After I graduated high school in 2024, I spent some time working as an associate for a public relations firm in Manhattan. The firm had a boutique structure, meaning we’d sign on various clients from all fields rather than being the public relations division for a specific company. My job was to cultivate client relations, conduct in depth research, and craft pitches. I would argue that client relations was the most integral part of the job. There was constant turnover, so I was perpetually looking for potential new clients. The thought process there was more involved than one might think, it requires in depth research to see who has needs that need to be met and would be conducive to what services the firm was offering. Once a client was signed, we would start running through their goals, and after much research and planning, would discuss specific strategies in how the media would best respond to whatever their business was offering. Our client list spanned from restaurants to private equity firms, so each pitch was tailor made to fit each individual need. However, there was one instance where a client wasn’t happy with the tone a reporter used when quoting her (at the end of the day the firm can’t directly control what the reporter/editor/producer does), and I sat in on a call where my boss was handling them. I started taking notes on her delivery, because she handled a client who was arguing from a place of passion, frustration and even anger, logically and rationally. A few months later I had my own less extreme version of that call, and I channeled my boss’s calm tone, competent demeanor, while also understanding and validating the issue. I realized that successful people learn from other successful people, and that’s why I would be thrilled to join REM. To continue my passion for consulting, but to also be working alongside a community of great people I can learn from.","coreValue":"Resilience","valueEssay":"I chose resilience. I believe resilience is the most important virtue you can have, in every area of life. Personally, I choose to live my life with the stoic mentality – meaning, being grateful for everything you have and making the best of whatever fate comes your way. I truly believe you need to adapt that mentality in order to live a successful, happy life. What I’ve seen happen in many adults, teachers, mentors I really like and respect, is that there is a tendency to become more and more weighed down just by life itself over time. When that happens, I feel it’s easy to become stagnant and take the world for granted. This idea is not to be confused with being callous; rather, it’s the conscious choice to always be in motion, to be creating, improving, and growing. On a more personal note, my vision for a happy, successful life is to be focused on the present moment where you are and to never become complacent/stagnant in learning and growing. I’m eager to learn and experience everything I can, and I would be unable to implement those values if there weren’t resilience enabling me to move forward. This also means you possess complete trust in yourself. You live in the present moment, extinguishing any future fears or anxieties, rather, you look forward to meeting the future head on, because you’ve internalized no matter what happens (excluding extreme cases) you have it within yourself to make the best of it, learn from it, and simply move on. This way of thinking takes practice, almost like a muscle you have to exercise, but I’ve learned to carry this with me in everything I do, both personally and professionally, and I feel I’m all the better because of it.","careerInterests":"Investment Banking / Finance, Tech, Data Analytics / Business Intelligence","howRemHelps":"I believe that client relations is the most important thing in business, regardless of what field it’s in. At the end of the day, people are what matter. Nobody is going to be closing deals with Chatgpt, regardless of the rise of AI, I strongly believe that individuals will always need that face-to-face connection and competence in order to feel sure of a deal. When I was working in PR, there’s a thrill in getting real-world work done. It’s electrifying to be so engaged with your work and then see the real-world results.  I want to develop my client-relations and consulting skills to be the best they can possibly be, and I aim to do that through REM’s real-world model. I’m eager to learn and contribute as much as I can and become the best team member possible. I want to dive into the hands-on experience, structured feedback, and the opportunity to work collaboratively on real-world problems. I strongly believe the underlying themes of strong communication and analytical skills will prepare me regardless of which career I choose.","position":"Junior Consulting Strategist","skills":"Business Strategy, Marketing and analytics, Social media management, Finance and accounting, Python, Microsoft Office Suite, Brand Development","accommodations":"N/A","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a78_619358b5","timestamp":"9/4/2026 1:00:12","name":"Laura Rodrigues V Viana","email":"laurarodriguesvv@ufl.edu","phone":"+1 (561) 212 6061","gender":"Female","race":"Hispanic or Latino","linkedin":"www.linkedin.com/in/laurarodriguesvv","resume":"https://drive.google.com/open?id=1mWqD6NWDgbuiQeo5cReCSD1m-LgLGMhc","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Marketing, Also planning to dual major Marketing and Psychology!","minor":"","gpa":"high school gpa = 3.987","whyRem":"I had originally heard of Rem because one of my mutuals on Instagram is involved with the club. After looking through the instagram, and seeing that marketing was in the caption, I realized it might be an interesting club for me! After speaking with a board member at the Business Bash, and finding out that Rem focuses on helping small businesses, that's when I knew I wanted to get involved. My father brought his small business from Brazil over to the U.S. 13 years ago. Watching the intricacies, the ups, and sometimes the harsh downs, made me realize how many small businesses don't have access to crucial support that can lessen the blows of owning a smaller operation.","coreValue":"Empathy","valueEssay":"While I align with all the values presented, I think empathy is the one I steer to the most. Throughout most of high school, I struggled to maintain a proper mental health while also juggling extracurriculars, tutoring, volunteering, and social life. Having people in my life who understood my situation and went out of their way to help me made me realize how important it is, for me, to be that pillar in other people's lives. Starting a small business can be very tricky, and from first-hand experience I've seen the struggles behind-the-scenes. That's why, as someone who wats to contribute to a community that uplifts small businesses, it's important to be there for them - not just financially and strategically, but emotionally too.","careerInterests":"Consulting, Marketing, Product Management, I have an interest in combining marketing and psychology to do marketing for psychiatric medications, to make sure that the right medicine reaches the right individual.","howRemHelps":"I believe that being apart of a community where there are like-minded individuals who I can not only collaborate with, but can also guide me into becoming someone, wiser, stronger, and overall better, is something I strongly desire from my University experience. Learning about all the different facets of helping a small business can guide me towards realizing what I truly want from my professional career a few years down the road.","position":"Junior Consulting Strategist","skills":"Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Marketing and analytics, Photography, Social media management","accommodations":"N/A","other":"Nope! I'm excited to hear from Rem. If there are any issues with my application, please contact me. Thank you! :)","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a79_d41dfe03","timestamp":"9/4/2026 1:16:19","name":"Ari Brewer","email":"a.brewer@ufl.edu","phone":"561-430-7444","gender":"Male","race":"Hispanic or Latino","linkedin":"https://www.linkedin.com/in/ari-brewer-7697362a0/","resume":"https://drive.google.com/open?id=1Gf4Sfecu_rnQ6FrsrOFPm4YmPq6mY9oH","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"","gpa":"UF: reset to 4.0  FAU: 3.86","whyRem":"I believe that REM on Campus is one of the best ways for me to achieve my career goals. I am a freshman finance student with a very large head start into the finance curriculum at UF. I am currently taking Business Finance, and I am currently realizing how fast my career is approaching. I want to make sure I have every resource possible to help prepare myself for the not so distance future. I hope to gain as much experience as possible towards my career track, and I am currently deciding between asset management and investment banking. I believe that the next few years that UF provides me is very valuable and limited, and REM on Campus is the best place for me to use that time and gain invaluable knowledge, connections, and experience.","coreValue":"Intellectual Growth","valueEssay":"All 5 core values are essential for a company to function efficiently or even in life in general, but to me the most important value currently is Intellectual Growth. I have always had a thirst for knowledge, to the point it becomes an obsession to learn everything I can about something I am interested in. I am not just interested in Finance as job, it's a passion of mine that I would chase professionally or personally. I have loved the world of finance since I was a little kid, and my dad would teach me about owning a business or investing in the stock market. Growing intellectually in relation to the finance world started as a passionate hobby, investing some birthday money as kid in the stock market, and I hope to continue to grow my knowledge and pursue a career in Finance. What's better than a pursuing knowledge for a job that you love and can't wait to start working in.","careerInterests":"Investment Banking / Finance, Asset Management","howRemHelps":"Rem on Campus will help me work on and master many needed skills for my career goals. I will be able to consistently gain experience in business consulting and real world financial analysis. Both of which could be useful in Investment Banking and Asset Management. Rem will teach me how a real business operates, allowing me to gain important knowledge of how to evaluate a company, which I can implement often when evaluating companies for mergers and acquisitions in Investment Banking. I can use similar evaluation techniques and financial analysis in Asset Management to find the upsides or downsides of certain stocks. Lastly, one of the most appealing things to me besides knowledge is the community that Rem provides. Being surrounded by many like-minded individuals that are trying to enter the finance world, could form a healthy competitive environment where I can test myself against peers who are just as serious about finance as I am.","position":"Junior Consulting Strategist","skills":"Business Strategy, Data analysis, Finance and accounting, Microsoft Office Suite","accommodations":"n/a","other":"n/a","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a80_4d48f184","timestamp":"9/4/2026 2:11:39","name":"Denzil Bessy","email":"bessyd@ufl.edu","phone":"7866036212","gender":"Male","race":"Asian or Asian American","linkedin":"https://www.linkedin.com/in/denzil-bessy-5162b5300?utm_source=share_via&utm_content=profile&utm_medium=member_ios","resume":"https://drive.google.com/open?id=1-qpEgUC_6QOc_Ru9dpC6jmZgoX7KbSqT","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"","gpa":"4","whyRem":"I want to be a member of REM on Campus to join a group of like-minded people who are all seeking to grow together and help each other succeed, and hopefully be able to add my own thoughts to a body of knowledge among peers from different backgrounds. One of my favorite parts of REM is the hands-on problem solving aspect of it, after attending coffee chats and learning about the different clients that have worked with REM, I have heard first-hand experiences of what it was like to go out and visit clients in our local area and learn about the interesting stories they have to offer whether it was Kari who fell in love with the monkey her ex-boyfriend left her and started a monkey sanctuary or the Whoopi's bar right here in downtown Gainesville. \n\nAs a Finance major, consulting is the first branch that interested me, as it is one of the few branches that rely heavily on a social aspect of building personal relationships with the clients you come across, in addition to the common technical or business aspects that you find in most branches. I want to not only be able to develop professionally and learn technical skills but I also want to go out and be able to have real-world experiences with businesses that are currently struggling in the changing and modernizing economy. Rem on Campus also was founded by Camryn in an effort to help support the small business nationwide that were struggling with a pandemic that affected everyone, business owners or not and these frameworks that led to the creation of the organization is something I align myself as someone who first-hand was able to see the pandemic leave business with no consumers and owners with no way of putting food on the table for their own loved ones waiting at home.\n\nTo be able to start a nationwide organization that has chapters in over 20 universities across the country, all from the simple, empathetic value of wanting to give back to the community in any way possible, is a value I desire to lead my life with. What differentiates Rem on Campus from any other organizations and attracts me as a student is not only how they have students from majors across the spectrum, ranging from aerospace engineering all the way to marketing, allowing for different minds that are experts in different fields to be able to brainstorm effectively and strategically come up with solutions for businesses but also how there's no set industry limits on the companies they choose to help, whether it’s the Greenhouse church or personal trainers seeking to gain more clients, from what I’ve heard and seen if there’s a genuine need and desire shown from a company that is willing to receive help, the organization tries its very best to help the business grow and prosper.","coreValue":"Empathy","valueEssay":"Empathy is a value that stands out to me because out of the five different values that were listed, I believe it to be the most important ability that an individual needs to be able to properly operate and serve in today’s world. In a world where many harbor hate towards one another over differences in opinions or cultures, being able to recognize the reasoning and thought processes behind each other's ideas shows a level of intellectualism that is unfortunately scarce. \n\nIn my own personal journey, I've learned about the significance of empathy through my experiences volunteering and working with different companies. By volunteering at my local hospital and assisting postpartum mothers whether it was through grabbing them snacks or giving them someone to talk too, I learned the importance of empathy by hearing the numerous stories that they all went through to get to where they are today, notably one mother explaining her story of escaping a household of domestic violence and being strong enough to carry out the rest of the pregnancy on her own. It was through stories like these that I learned that you never know the struggles of what someone is going through and to never judge someone before you put yourself in their shoes. In addition, I volunteered at a non-profit organization called Shaka Soul Surfers, where we had the privilege of teaching neurodivergent children how to surf. It was here that I learned that you don't always have to be able to communicate to the other to be able to empathize with them, even though I was never able to have a conversation with most of the kids I faced weekly I was still able to form a strong enough connection where they came up running to me every Sunday during lesson time excited to get back in the water and have fun. Finally, and arguably my most important lesson in empathy, came from working at Kumon, a math and reading tutoring center for children. Seeing the small toddlers aged up to 5 being able to do what many adults today can’t, and without fail stopping whatever they were doing when the child sitting next to them fell while running across the center to go check up on them and make sure they were okay, taught me many more important lessons than the simple addition or subtraction techniques that I ever taught them. These children taught me that being childlike isn't always bad, and being able to empathize with one another shouldn’t be something that has to be forcibly taught; instead, it should come naturally with a good heart and pure intentions. \n\nAll these different experiences throughout my life have taught me different lessons about the value and importance of empathy, and I hope to be able to bring that into both Rem on Campus and my professional life and future endeavors.","careerInterests":"Consulting, Brand Strategy, Non-Profit / Social Impact","howRemHelps":"I think joining Rem on Campus will be able to help achieve the career goals I selected, including consulting, brand strategy, and non-profit/social impact, by allowing me to join teams of 4-5 other peers and working with clients, in industries that I'm currently interested in and also exploring industries that I am not so familiar with, and learn what it’s like to consult and provide companies with a strategic means of getting back on their feet or gain more revenue. I'm also seeking to help non-profits or give back and have an impact on my community in any way possible, not only during my time in college but also well after and having worked with non-profits before I believe their work is truly because they care for the cause and not just for any monetary benefit they may get which is a driving reason in why I would love to get involved. Being able to join Rem on Campus would also truly help me feel like I've made a difference in someone's livelihood by using my full ability and also the peers on my team to devise a long-term plan for a company to stand out from its competition and truly break into the market. \n\nOverall, after hearing about the past clients that Rem on Campus has worked for and hearing not only the personal stories that drive them but also how they continue to share their successes with members with whom they have grown personal relationships is a bond I have yet to experience but would love to be able to build for myself. Meeting new people with different stories and continuing to write my own as a member of Rem and Company is ultimately the goal that I hope to achieve.","position":"Junior Consulting Strategist","skills":"Business Strategy, Data analysis, Finance and accounting, Microsoft Office Suite, Brand Development","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/1/2026 19:16:44","spokeTo":"Hannah, Christian, Sachin, Adam, Grace, Eli"}],"infoSession":{"timestamp":"9/2/2026 1:15:58","session":"09/01","appliedBefore":"No"},"meetMembers":null}},{"id":"a81_a5cb6c09","timestamp":"9/4/2026 10:21:58","name":"Rylee Gill","email":"rylee.gill@ufl.edu","phone":"9133339306","gender":"Female","race":"White or Caucasian","linkedin":"www.linkedin.com/in/ryleegill","resume":"https://drive.google.com/open?id=1brqpSY6wuwKrm2UcITBJf0HtFB-CEzIp","university":"University of Florida","gradYear":"2028","classYear":"Junior","major":"Management","minor":"Economics","gpa":"3.9","whyRem":"Being comfortable with the uncomfortable is a mindset. Rem on Campus puts you in positions and industries you may know nothing about. This summer, working at Archer Daniels Midland, I did exactly that. Commodity markets, agronomy, and market spreads were unfamiliar to me, but I tackled them head-on and asked the important questions. My manager noted that I learned impressively fast. By going above and beyond and reaching out to colleagues and leadership with niche expertise, I learned about a variety of subjects and markets, including those beyond my immediate work, such as regenerative agriculture, legislation, global trade, and rail and barge freight spreads. Rem on Campus will continue to push me to be uncomfortable as we help others accomplish their dreams.","coreValue":"Empathy","valueEssay":"After being accepted into the Girls Belong Here program at Plan International Canada, I knew I needed to take every opportunity. When an offer was made to my cohort to serve as a spokesperson for Plan International Canada in a roundtable discussion on Girl Hero’s Beat the Clock livestream, I accepted. Taking initiative gave me the opportunity to speak to 10,000 live viewers about the barriers and the inequalities women face in the gaming and technology industries, advocating for women globally. That stream was a record for Plan International Canada, being the largest direct engagement they had had. \n\nThat experience taught me how to speak publicly, provided me with media training, and showed me how one small choice can lead to a big impact. Advocating for others on important issues, like gender equity and environmental preservation, is an act of empathy. It is easy to sit idly by, but it takes empathy-driven bravery to advocate for change. \n\nThe advocacy work I have done to promote diversity of voice and thought resonates across disciplines. At the center of it all is empathy.","careerInterests":"Consulting, Brand Strategy, Product Management, Non-Profit / Social Impact, Public Policy / Government","howRemHelps":"Although Rem on Campus works across industries, the skills learned are applicable anywhere. This summer, when talking to senior leadership at Archer Daniels Midland, the common advice was to learn the soft skills, and companies will teach you the rest. With additional focus this semester on professional development, such as workshops and professional trips, I know that I will not only be ready to face our clients, but also to join the workforce. \n\nAs members of Rem on Campus have emphasized throughout recruitment, communication is one of the most important skills. Simultaneously, it is a skill that recruiters consistently say our generation lacks. Rem on Campus, in nature, fosters public speaking skills, concise and precise communication, and the building of relationships based on trust through open conversation. \n\nIn the workforce, this skill was the most pivotal. Working in corporate America, I saw firsthand how communication breaks down across teams and across offices, making it difficult to provide important information to clients. \n\nContinuing to improve my ability to communicate confidently and empathetically will make leaps and bounds, both professionally and personally.","position":"Junior Consulting Strategist","skills":"Business Strategy, Data analysis, Marketing and analytics, Search Engine Optimization (SEO), Social media management, Communications and copy-writing, Design Thinking, Microsoft Office Suite, Ads (Facebook/Instagram), Brand Development","accommodations":"","other":"My summer internship at ADM allowed me to work in many different and exciting capabilities for a large firm. These skills are scalable to work with local businesses to help them succeed.","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/3/2026 19:21:20","spokeTo":"Lexi, Isabella, Ali, Hannah, Aya, Max"}],"infoSession":{"timestamp":"9/2/2026 0:21:46","session":"09/01","appliedBefore":"Yes"},"meetMembers":{"timestamp":"9/2/2026 17:06:42","year":"Junior","appliedBefore":"Yes"}}},{"id":"a82_ea41ef40","timestamp":"9/4/2026 10:49:02","name":"Brady Bishop","email":"brady.bishop@ufl.edu","phone":"3522780708","gender":"Male","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/brady-bishop-6507b02aa/","resume":"https://drive.google.com/open?id=1tfHm88nMNQkpPy9Z4sLlwbjB2tCBbmSE","university":"University of Florida","gradYear":"2028","classYear":"Junior","major":"Business Administration","minor":"","gpa":"3.78","whyRem":"I want to be a member of Rem because I am looking to be a part of an organization full of driven and motivated people that drive me to do my best. A lot of my business experience has been hands-on, whether that has been through sales, entrepreneurship, or graphic design, so what I like about Rem is that it would give me the opportunity to apply that mindset in a new way while learning from people with different strengths and experiences. I feel like this organization is the next step in my business career to really step out and execute my knowledge and experiences of the past. I am also very intrigued by the idea of working with a team and learning how to manage that in a business setting. I think the most important thing I could take away from Rem are the connections and relationships made with others, and really finding a family-like culture.","coreValue":"Community","valueEssay":"Community stands out to me because I think the people you surround yourself with have a huge impact on how much you grow. During my sales internship with United Energy Services, I worked directly with business owners while also learning from people who had much more experience in sales than I did, and being around these people helped me become more confident talking with customers, handling rejection, and following up because I was surrounded by people I could learn from and had been there before. I've really realized recently that I grow the fastest when I am surrounded by people who challenge me and bring different perspectives and I feel like Rem executes that so well.","careerInterests":"Consulting, Marketing, Tech, Entrepreneurship / Startups, Sales/Business Development","howRemHelps":"Joining Rem would help me build on the experience I already have in sales, entrepreneurship, marketing, and creating my own AI customer communication startup by giving me more opportunities to solve real business problems. I also think it would teach me how to work better as part of a team, where I can contribute my own strengths while learning how other people approach problems and use their skills. Since I am interested in entrepreneurship, consulting, marketing, tech, and business development, I see Rem as a way to become more confident walking into a new business situation, understanding the problem, and finding a way to help.","position":"Junior Consulting Strategist","skills":"Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Business Strategy, Web design, Marketing and analytics, Search Engine Optimization (SEO), Social media management, Microsoft Office Suite, Machine Learning, Brand Development","accommodations":"N/A","other":"I would just add that I am someone who likes to get involved and learn by doing. A lot of the experience I have gained so far has come from putting myself in situations where I had to learn as I went, whether that was through sales, working with clients, or building something of my own. That is what I am looking for in Rem too. I want to meet people who are motivated, learn from them, and bring what I have learned from my own experiences.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":{"timestamp":"9/3/2026 22:01:29","session":"09/03","appliedBefore":"No"},"meetMembers":null}},{"id":"a83_3909c520","timestamp":"9/4/2026 10:54:21","name":"Jacob Glazer","email":"jacob1glazer@gmail.com","phone":"9177892606","gender":"Male","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/jacob-glazer-4b4479321/","resume":"https://drive.google.com/open?id=1ql4sq-sEIgzNZJFsFRsYEOEoh1CZ1If-","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"","gpa":"N/A","whyRem":"When I learned about Rem on Campus, it immediately appealed to me. I was searching for an opportunity to learn more about the consulting industry, but I never thought that a school organization would allow students to do real consulting work for local businesses. Not only does that offer genuine insight into the industry, but it also has an altruistic angle that I really like. Knowing that my work would help organizations address actual issues makes it significantly more satisfying.\n\nI believe I can add a lot through the diverse experiences I've already had. As an intern at ELPH Marketing, I had the opportunity to work with clients to achieve their business and marketing goals. ELPH served small and medium-sized clients who hired the company to oversee and optimize their marketing strategy. As part of a small team, I met with clients and discussed marketing campaigns based on demographics and market conditions. I also worked with the broader business community when I drafted a sustainable business bill as a member of my town's Environment Commission. Holding a number of part-time jobs at small local businesses, such as a law firm and a physical therapy practice, has allowed me to experience firsthand the difficulties and pressures that businesses face.\n\nJoining Rem would allow me to build my industry skills alongside the formal education I will be receiving at UF. Since there is no consulting major, I would treat Rem as a critical part of my development. It is also a chance to give back to the community I will be part of for the next four years, and to gain the kind of hands-on experience that will make me a better professional.","coreValue":"Community","valueEssay":"I have always looked not only to be an active member of the communities I am a part of, but also to find ways to make them better. Whether in my school, local city, or surrounding region, my personal journey is centered on my desire to contribute meaningfully and leave each community stronger than I found it.\n\nOne such example came in high school. After spending nearly all of middle school remote, I arrived at a school with no spirit and decided to improve the morale of the student body. As freshman class president, I proposed a number of events that got kids socializing outside of class: an underclassmen semi-formal dance, various spirit events, and a school barbecue. Pulling them off required learning to do things I had never done before, such as creating proposals for a skeptical school administration, polling demand from my classmates, collecting vendor quotes, and coordinating day-of-event logistics. The semi-formal drew over 400 students, the barbecue over 600, and each event raised tens of thousands of dollars. I was elected class president every year after that and student body president as a senior. Throughout the years, I kept working to rejuvenate the school even further through new traditions, pep rallies, and a culminating festival that over 1,000 students attended. My high school community's spirit is significantly stronger now than it was four years ago, and I'm proud to have been a part of that growth.\n\nMy desire to help my community carried beyond high school as this value became a bigger part of who I am. In my hometown, I created an initiative called \"Light the Way\" to improve crosswalk visibility. Our track coaches had us running long distances through the neighborhood, which led to more than one close call with a speeding car. I decided to try my best to improve our town's pedestrian safety, meeting with city officials and presenting a solution to the Town Council at a public town hall meeting. From there, I worked with public lighting manufacturers and the Department of Public Works to install Livingston's first in-ground crosswalk lights.\n\nOver the next few years, I hope to leave a mark on UF and the Gainesville community. I believe Rem on Campus is the ideal place for me to do this because of its emphasis on community, through both its internal, close-knit team and its commitment to helping local businesses. I hope my personal passion for community improvement extends into my professional life, where I can make a career of improving the areas around me.","careerInterests":"Consulting","howRemHelps":"I believe that working in strategic consulting will require more than just academic knowledge. While my technical classes will be extremely important, the experience of working with a team on real consulting projects will provide me with important skills for my future. Much of this career is based on soft skills such as leadership, teamwork, and client interactions, which I believe have to be experienced rather than just taught in a classroom. \n\nFurther, REM will provide me with an opportunity to network with like-minded students who are also interested in this field and will one day be peers of mine. Building strong relationships while working alongside one another will allow us to continue these connections as we go into the industry. \n\nI am also looking forward to going on treks to visit companies such as McKinsey, Bain, BCG, Accenture, etc. Seeing the organizations firsthand can not only open up potential career opportunities, but also help inform me of the type of work the industry expects. Ultimately, REM will allow me to begin my career as a strategic business consultant better informed, with more real work experience, and with a wider network of peers across the industry.","position":"Junior Consulting Strategist","skills":"Business Strategy, Marketing and analytics, Search Engine Optimization (SEO), Social media management, Finance and accounting, Communications and copy-writing, Ads (Facebook/Instagram), Brand Development","accommodations":"No.","other":"No.","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/2/2026 15:30:22","spokeTo":"Anjayli"},{"timestamp":"9/3/2026 15:49:30","spokeTo":"Colton, Terrence"}],"infoSession":null,"meetMembers":{"timestamp":"9/2/2026 17:06:24","year":"Freshman","appliedBefore":"No"}}},{"id":"a84_baf0927c","timestamp":"9/4/2026 10:55:51","name":"Rachel Nguyen","email":"rachelnguyen028@gmail.com","phone":"407-458-3033","gender":"Female","race":"Asian or Asian American","linkedin":"www.linkedin.com/in/rachel-nguyen-665b41330","resume":"https://drive.google.com/open?id=1vO5Tg6-B4GnfuEj_Ixk9N70vE6FS8giC","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"","gpa":"4","whyRem":"I admire the work that Rem on Campus does for the community and I hope to play a part in contributing to the aid that our local businesses receive. I am deeply interested in the type of quick thinking skills and fast paced environment that Rem creates and upholds at UF in helping to navigate analytical aspects of the business world. Being a member of Rem on Campus would give me an opportunity to showcase the dedication and grit I have towards providing solutions to real life problems and strengthening my communication abilities. As I've observed many of my favorite small businesses in my hometown struggle to break even and survive, I have made it my mission to support them personally. Now, especially considering how rural it is beyond the college campus, I aim to take direct part in my local community on this larger scale that Rem on Campus operates on as well as explore new unique ways to help it thrive as a collective.","coreValue":"Intellectual Growth","valueEssay":"I believe in education as a means to a beginning, not a means to an end. Intellectual growth is a privilege and a tool that's too often taken for granted, only being viewed as a way to chase certificates. This is why the power of intelligence and expanding those abilities means so much to me. Intellectual growth is a skill that allows for the advancement of both general knowledge and a cohesive awareness of the world. Having the capacity to engage in intellectualism allows any person to harness understanding of societal issues, and most importantly, empathy. I hope to prioritize my intellectual growth for the purpose of being knowledgable enough to solve and resolve work in my desired career of law and consulting, as well as push towards navigating human connection. Intellectual growth goes beyond what anyone can learn in a classroom; having the patience to develop that quality also means making the active choice to be informed, and I aim to apply that sense of proactiveness in exploring consulting and maintaining my relationships.","careerInterests":"Consulting, Marketing, Data Analytics / Business Intelligence, Product Management, Law","howRemHelps":"I aim to gain real world experience with working pro bono cases in Rem on Campus' problem solving centered approach. I hope to further develop my analytical skills within the business realm as well as have the opportunity to communicate with local businesses and play a role in helping them thrive. My main career focus lies within the law field where I desire to enter the intellectual property sector, so being able to work with local businesses that encounter those types of cases is something I would greatly pursue through Rem on Campus. This organization is especially alluring to me for its focus on innovation, so having the chance to work with cases that involve the need for creativity in addition to analytical thinking is crucial to my career path in the area of legal work that protects businesses in similar cases.","position":"Junior Consulting Strategist","skills":"Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Statistics and modelling, Data analysis, Photography, Social media management, Finance and accounting, Communications and copy-writing, Microsoft Office Suite","accommodations":"N/A","other":"N/A","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a85_3b53931e","timestamp":"9/4/2026 11:22:38","name":"Gabriel Haren","email":"gharen@ufl.edu","phone":"3862768881","gender":"Male","race":"Mixed","linkedin":"https://www.linkedin.com/in/gabrielharen/","resume":"https://drive.google.com/open?id=1evkToPvkpWpkK9gAm8d1kXqOPmbMjDVO","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"","gpa":"3.79","whyRem":"Through my time in e-comme
