 and analytics, Search Engine Optimization (SEO), Social media management, Finance and accounting, Microsoft Office Suite, E-commerce, Brand Development","accommodations":"No!","other":"I would just add that I’m someone who is always looking for opportunities to learn and challenge myself. I’m excited to gain hands-on experience, meet people with different perspectives, and contribute wherever I can. I’m very motivated when it comes to my career, and I believe REM would be a great opportunity for me to continue developing both personally and professionally.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a74_5103f1a4","timestamp":"9/3/2026 9:41:03","name":"Coleman Dunham","email":"Colemandunham@ufl.edu","phone":"8632550092","gender":"Male","race":"White or Caucasian","linkedin":"N/A","resume":"https://drive.google.com/open?id=1Lmz4efIL_kTmSYkvKHsuagJ6DZuf6O-X","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Engineering (various disciplines)","minor":"Engineering (various disciplines)","gpa":"3.93","whyRem":"I am an Industrial and Systems Engineering major with a strong interest in the career opportunities that consulting offers. I've always been drawn to the process of identifying inefficiencies within a system or workflow and finding practical solutions that drive real value—whether that means streamlining operations, cutting costs, or ultimately generating more revenue for a business. I want to join REM because I'm looking to surround myself with a like-minded group of individuals who share this same passion for problem-solving and continuous improvement, and I believe this organization will give me the hands-on experience and community I need to grow both personally and professionally as I pursue a career in consulting.","coreValue":"Intellectual Growth","valueEssay":"Intellectual growth stands out to me because I want to make the most of every opportunity in front of me, not just get through it. As an ISE major heading toward consulting, I know I'll constantly be thrown into new problems and unfamiliar situations, and I want to be the type of person who leans into that instead of shying away from it. I'm always looking for ways to learn more, push myself further, and become better at what I do, and I see REM as a place that will challenge me to keep growing in that way.","careerInterests":"Consulting, Entrepreneurship / Startups, Sales engineering / systems engineering","howRemHelps":"Joining REM on Campus will give me a platform to build real consulting and business operations skills and understanding. It's a space where I can sharpen these skills hands-on and start developing the toolkit consulting positions are looking for. I believe REM can give me quality insight into the consulting career track that will help me make the best decisions for my career.","position":"Junior Consulting Strategist","skills":"Communications and copy-writing, Python, project management, sales","accommodations":"no","other":"How much time commitment should I expect to put towards REM weekly?","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a49_b672061d","timestamp":"9/3/2026 10:39:21","name":"Erik Nanaj","email":"nanajerik@gmail.com","phone":"9146895335","gender":"Male","race":"White or Caucasian","linkedin":"https://www.linkedin.com/feed/","resume":"https://drive.google.com/open?id=1LqrEtse44v4OCsv0Thu94I9hdU5jWo0d","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Business Administration","minor":"","gpa":"3.82","whyRem":"I want to be a member of Rem on Campus to test out a new career I believe I have a passion for, and I believe the community is something to be fond of. I came into school as an exploratory student; now, I am majoring in Business Administration partially because of its versatility, and because I enjoy the communication, teamwork, and administrative aspects of work. One of the most important things I have learned in college is to try everything I can, and I strongly believe that the foundations of consulting, such as problem-solving, are areas where I excel. I want to join Rem because I want to test out if this is a possible career track for me in the future. I am excited for the opportunity to be around other eager students, as I think that will push me to perform even better. Additionally, I will get the opportunity to apply what I have learned in my business classes to something in the real world with local communities. Ultimately, I hope to walk away from Rem with a sharper analytical thinking and a clear vision of my professional future.","coreValue":"Community","valueEssay":"The value I have chosen is community. I believe it is the basis of all my personal and professional dream. The idea of urban development, mass transportation, and walkable spaces comes from my conviction that there is an intimate connection between the physical structures we design and the power of the communities that reside within them. During my time at university, where I study business and am considering doing urban planning and real estate, I have been extra focused on learning how to construct, finance, and govern the types of spaces which will bring people together, not tear them apart. In my personal experience, the dedication to building community is what has been motivating me. The organization of a charity basketball game for the Leukemia and Lymphoma Society showed me how important a communal cause can be in unifying an entire neighborhood and making an impact. In more recent times, taking on the position of Assistant Director of Projects for The Big Event and organizing community 5K fundraisers made me understand the value of constructing a community through service work. Whether I try to improve urban infrastructure or motivate my fellow students to take action for a good cause, I am very certain that putting a community first is the best way to achieve anything.","careerInterests":"Consulting, Non-Profit / Social Impact, Public Policy / Government, Law, Undecided / Exploring Options","howRemHelps":"White I selected such fields as law, non-profit, public policy, the most accurate choice in my case is undecided. I am still trying to figure out what I would like to do when I graduate. The reason why I find consulting so attractive and why I am interested in Rem on Campus is because it is multidisciplinary. This nature of consulting allows me to do what I like doing the most: solve different kinds of problems. Consulting does not require choosing any industry, and I have to analyze a company from operational, legal and community perspectives, which fits my style of learning. Being an active member of Rem on Campus would help me test myself in a new field and apply my diverse knowledge gained during my studies in solving various problems of small companies. Therefore, it is an amazing environment where I could explore different industries and understand what kinds of problems I like solving. By the end of my time at Rem, I would hope to have decided on what to pursue further in my life, with the lessons I get here being the reason for that decision.","position":"Junior Consulting Strategist","skills":"Business Strategy, Microsoft Office Suite","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a50_8431e9a0","timestamp":"9/3/2026 10:56:04","name":"Conrad Taube","email":"ctaube@ufl.edu","phone":"7027882705","gender":"Male","race":"White or Caucasian","linkedin":"www.linkedin.com/in/conrad-taube-104555354","resume":"https://drive.google.com/open?id=1u6eRuMxXnJWv2eE1F4Fte97qo3Vp8rLD","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Marketing","minor":"Other","gpa":"4.56 (In HS, no GPA yet because I am a first year)","whyRem":"I want to become a member of REM on campus because I believe that helping small businesses grow is extremely important, especially when they might not have the resources to pay for professional consulting. Currently, I work with small businesses in my own company, specifically in the contracting and remodeling niche. So seeing the growth that these people can have is extremely fulfilling. And also working with local businesses allows you to see the impact you make, which is an extremely rewarding process.","coreValue":"Community","valueEssay":"I believe that community is extremely important in two ways. One, the community that's within REM is extremely important because it's a place where there's like-minded people, where everyone will help each other grow and succeed. When you have a group of like-minded people who are pushing and striving for the same goal, it inspires you to work even harder. The second part about community is the local community. I believe that REM will help the local community in Gainesville really flourish and allow local small businesses to grow even more than what they ever thought was possible.","careerInterests":"Consulting, Marketing, Brand Strategy, Entrepreneurship / Startups","howRemHelps":"I believe joining REM on campus will help me achieve my career goals above because it dips my toes in the waters of my career goals and allows me to see what aspects of business I like, what aspects of business I don't like, and maybe even see some unexpected areas that I wasn't expecting to like or be talented in. But I see more talent in those areas and introduce me to more areas of business. So I think having a well-rounded approach is extremely important and will help me improve in my career goals, skills, as well as opportunities in the future.","position":"Junior Consulting Strategist","skills":"Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Business Strategy, Back-end web development, Web design, Marketing and analytics, Search Engine Optimization (SEO), Videography, Photography, Social media management, Communications and copy-writing, HTML, Python, Ads (Facebook/Instagram)","accommodations":"N/A","other":"I have a good amount of experience running meta ads and client acquisition systems with back-end web development and front-end design for remodelers. I really enjoy the process of working with local businesses and helping them expand and grow beyond the capabilities that they ever thought was possible. It's an extremely rewarding process. Throughout my time, I've been able to work with numerous remodelers currently and in the past. Helping them grow their businesses is extremely cool to see. It means more with a local company than it does with a big corporate company. That's why I think it's so important for myself to be a part of an organization like this.","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/3/2026 15:47:35","spokeTo":"Adam K. VP Consulting "}],"infoSession":null,"meetMembers":null}},{"id":"a51_9b7c21ec","timestamp":"9/3/2026 12:34:37","name":"Yvette Deng","email":"yiwendeng@ufl.edu","phone":"3528100881","gender":"Female","race":"Asian or Asian American","linkedin":"NA","resume":"https://drive.google.com/open?id=1Rv8idBUgkGc0LPOYt-MpUo_hlQ2KYH4B","university":"University of Florida","gradYear":"2026","classYear":"Senior","major":"Finance","minor":"","gpa":"NA","whyRem":"As an international student who recently arrived in Gainesville, I do not want my understanding of business to remain inside the classroom. I have noticed how closely the city’s cafés, restaurants, independent stores, and service businesses are connected to both UF students and long-term residents. I am especially interested in how these businesses differentiate themselves, respond to demand changes throughout the academic year, and use their digital presence to turn first-time visitors into returning customers. I would like to contribute through customer and competitor research and help turn those findings into recommendations an owner can realistically use.\n\nAs a first-year student without formal consulting experience, I am not expecting to enter already knowing how to solve a client’s problem. I want to learn the process carefully, take ownership of a workstream, and gradually become confident enough to communicate directly with clients and eventually guide others.\n\nDebate and Model United Nations taught me how to research complicated issues, compare possible solutions, and develop proposals under uncertainty. However, those solutions usually ended as speeches or simulations. Rem would challenge me to take the next step through producing work that affects a real business and its community. I want my own learning to contribute to someone else’s progress.","coreValue":"Empathy","valueEssay":"Empathy stands out to me because I learned that understanding someone should come before trying to solve their problem. As a peer listener at UWC Norway, I once began suggesting ways a student could handle a difficult situation, but their short responses made me realize I was moving too quickly. When I stopped offering advice and asked what they needed from me, they explained that they mainly wanted to speak without feeling judged. That conversation taught me that helping someone begins with listening rather than assuming I already understand.\n\nI believe empathy is equally important in consulting. A small-business owner might describe the problem as low sales, but the deeper challenge could involve limited resources or an unclear target audience. Recommending a solution without understanding the owner’s circumstances could result in an impressive presentation that the client cannot realistically use.\n\nEmpathy would also make me a better teammate. Having studied with student from 90 different country, I know that people may communicate, organize their work, or respond to disagreement differently. Rather than dismissing an approach I do not immediately understand, I try to ask questions and find a way of working that uses everyone’s strengths. As I explore strategy and marketing, I want to combine this mindset with research so I can contribute recommendations that are thoughtful, practical, and responsible.","careerInterests":"Consulting, Investment Banking / Finance, Marketing","howRemHelps":"As a first-year student, I do not want to choose a career based only on job descriptions or what I have heard from other people. I want to understand these fields by doing work that resembles what professionals actually do. Rem would give me that opportunity through real client projects.\n\nConsulting is currently my strongest interest because I enjoy examining an unfamiliar problem, organizing information, and helping a team develop a recommendation. At the same time, I am interested in how finance and marketing contribute to that process. Depending on a client’s needs, I could explore questions involving costs, revenue, competitors, customer behavior, or digital strategy. Seeing how these areas connect within one project would help me identify which type of work I find most meaningful.\n\nRem would also help me build skills that are valuable across all three career paths, including structuring an unclear problem, creating data-supported deliverables, communicating with clients, and presenting recommendations confidently. As I progress from Learning to Applying and potentially Leading, I would gain both greater responsibility and a clearer understanding of my professional strengths. By the time I apply for internships, I hope to have more than an interest in these careers but also to have real project experiences that show why I am prepared to pursue them.","position":"Junior Consulting Strategist","skills":"Web design, Data analysis, Marketing and analytics, Videography, Photography, Social media management, Finance and accounting, Microsoft Office Suite, Ads (Facebook/Instagram)","accommodations":"","other":"I would be ready to commit time, accept feedback, and contribute consistently to my team and client.","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/1/2026 15:10:50","spokeTo":"Rachel"}],"infoSession":null,"meetMembers":null}},{"id":"a52_0d7ee2c2","timestamp":"9/3/2026 13:08:50","name":"Aashrita Alavala","email":"Aashritaalavala@ufl.edu","phone":"9014907836","gender":"Female","race":"Indian or Indian American","linkedin":"www.linkedin.com/in/aashritaalavala","resume":"https://drive.google.com/open?id=1zSBJ1o0ipRhEr4rUpbLk2pN4ox6OGNoP","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"","gpa":"3.96 Highschool","whyRem":"I've always wanted to take advantage of opportunities presented to me, whether it be joining a club, taking on a job, or attending a spontaneous event. Things like this have allowed me to step outside my comfort zone and helped me grow not just academically but also personally. With REM on Campus, I recognize it as an important opportunity to build my college career while also giving back to the local community. By being an active member in REM, I hope to gain a skillset that prepares me for real-world application through hands-on experiences working with local businesses and nonprofits. I am interested in combining my ambition with leaning how to build relationships, collaborate with others, and contribute to meaningful change with like-minded individuals. Ultimately, I hope REM challenges me to grow beyond my current understanding of problem-solving and gives me the confidence and perspective to make a positive impact wherever I go.","coreValue":"Resilience","valueEssay":"Throughout my life, I've learned that setbacks are inevitable, but how you respond to them is what actually matters. I know that corporate financial advisory is a demanding field that required hard work, persistence, and the ability to work through difficult problems. Resilience is what keeps you going when things get challenging. To me, it ultimately comes from believing in yourself and trusting that you can work through whatever is in front of you.","careerInterests":"Investment Banking / Finance, Public Policy / Government, Law","howRemHelps":"REM on Campus's commitment to exposing its members to unparalleled resources, ethical leadership, and collaboration will help me grow both professionally and personally. Joining REM would also help me pursue my career interests in investment banking and finance, public policy and government, and law by giving me hands-on experience analyzing problems, developing solutions, and working directly with real clients. I hope to strengthen my financial and analytical skills while also learning how business decisions intersect with policy, regulation, and legal considerations. I especially believe REM's mission because of the program's undeniable impact, demonstrated through its continued success in partnering with small, local family businesses. This mission is particularly meaningful to me beaches my aunt's family restaurant has faced financial and operational challenges that could have benefited from the type of guidance and support REM provides. That personal connection has shown me how valuable it is to have access to people with the knowledge and resources to help business overcome real-world challenges. I believe REM will challenge me to become a more thoughtful, capable, and well-rounded professional while giving me the skills and perspective necessary to pursue my long-term career goals.","position":"Junior Consulting Strategist","skills":"Business Strategy, Marketing and analytics, Finance and accounting","accommodations":"N/A","other":"N/A","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a53_db70a81e","timestamp":"9/3/2026 13:47:59","name":"Kristen Colom","email":"kristen.colom@ufl.edu","phone":"786-817-7030","gender":"Female","race":"Hispanic or Latino","linkedin":"N/A","resume":"https://drive.google.com/open?id=1QHKljrHe0vOj1_dlRVHO5cVvyxvQmEXA","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Business Administration","minor":"","gpa":"N/A, Highschool GPA 3.8 u.w","whyRem":"I would love to be a member of Rem on Campus because I’m looking to become more involved on campus and connect with people who share similar values and interests. As a freshman, I think joining Rem would be a great opportunity to grow personally and be part of a supportive community. Having the opportunity to contribute my own ideas and energy while getting more involved in the UF community is extremely important to me.","coreValue":"Resilience","valueEssay":"Resilliance stands out to me because throughout life, obstacles will stand in the way of both my personal and professional life and in order to move forward, I need to maintain resilliance. For example, I may not get a job that I worked extremely hard to get, but I cant let that affect my drive to continue finding a job that I would love. While all the other values are also extremely important, none of them would be possible without the ability to overcome problems and be resilient.","careerInterests":"Consulting, Brand Strategy, Entrepreneurship / Startups, Law, Undecided / Exploring Options","howRemHelps":"I believe joining Rem on Campus will help me explore the different career paths available within business while connecting with ambitious and like-minded students. Through opportunities to learn from professionals, develop my skills, and build meaningful connections, I hope to gain a better understanding of where my strengths and interests fit within the business world. As someone who is still exploring my long-term career goals, I believe Rem would provide valuable exposure and experiences that will help me grow both professionally and personally.","position":"Junior Consulting Strategist","skills":"Business Strategy, Social media management","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a54_56661273","timestamp":"9/3/2026 14:56:02","name":"Hayden Veras","email":"hayden.veras@ufl.edu","phone":"5613299094","gender":"Male","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/hayden-veras/","resume":"https://drive.google.com/open?id=1635XMKZnk8qSOekLqZZGjm40dXyeaZ2Z","university":"University of Florida","gradYear":"2028","classYear":"Junior","major":"Mathematics","minor":"Mathematics","gpa":"3.85","whyRem":"Through my role as an Instructional Support Assistant, I have come to appreciate the satisfaction that comes with advising and working with others, whether it be assisting professors with course material or learning from my coworkers. Rem on Campus would give me a great opportunity to get involved with helping businesses and to see more of the impact of my work outside of academia. I want to make new friends and expand my network through Rem on Campus, while gaining experience through working with businesses. As a Statistics major, I feel that I could bring a valuable perspective to projects through more technical and quantitative work while also developing my skills in the business realm. I also currently am a part of a statistics capstone course Anheuser-Busch, so I strongly believe I can transfer many skills from the this experience to Rem on Campus.","coreValue":"Community","valueEssay":"Community stands out as a value that can bring about these others and more. Having a community of people with similar goals drives everyone to want to improve shared values. As a Statistics major, I feel part of a community in the major. It is not one of the largest majors, so moving through classes has allowed me to make great friends as part of a community of students who want to improve our knowledge of the subject and study for many of the same classes. Furthermore, my role as an Instructional Support Assistant has given me a community of coworkers who are in different fields and stages of their college experience. Hearing about the career and academic goals of others in my communities motivates me to also succeed. I have learned more about many fields and organizations, including consulting, that I may have missed out on were it not for these UF communities.","careerInterests":"Consulting, Investment Banking / Finance, Tech, Data Analytics / Business Intelligence","howRemHelps":"Whether it be a career in consulting, finance, tech, or data analytics, these fields all involve some sort of collaboration and an understanding of business functions. Rem on Campus would strengthen my ability to work as part of a team, something that is important to me in my career. Expanding my network through the Rem on Campus community also would allow me to cement myself in these industries, while learning from others' experiences in recruitment or alumni already in the workforce. Also, working on projects with a variety of businesses provides many great talking points for future employers, showcasing my ability to work with business data and make informed decisions. For all four of the interests I selected, I want to be in a position involving data analysis and business decisions, making experience gained through Rem on Campus extremely helpful.","position":"Junior Consulting Strategist","skills":"Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), User Experience (UX), Statistics and modelling, Data analysis, HTML, Python, R, Design Thinking, Microsoft Office Suite","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":{"timestamp":"9/2/2026 0:21:35","session":"09/01","appliedBefore":"No"},"meetMembers":null}},{"id":"a55_54a13cde","timestamp":"9/3/2026 16:24:17","name":"Charlotte Osol","email":"Charlottebosol@gmail.com","phone":"9179007994","gender":"Female","race":"White or Caucasian","linkedin":"www.linkedin.com/in/charlotte-osol-5a0212386","resume":"https://drive.google.com/open?id=1cRehaIGPcitsJCBmXdKUnuZVoFlCrDTw","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Humanities","minor":"","gpa":"3.98 in high school, I have no grades in college yet.","whyRem":"I want to get directly involved in my community and actually help people instead of joining a club that may help individuals in a less hands on, more abstract manner. Further, I have a personal connection with small businesses because my parents own one in my hometown. Due to this and my enrollment in the marketing academy at my high school, I often helped my parents with marketing and promoting our restaurant.","coreValue":"Empathy","valueEssay":"Empathy stands out to me because when it comes to judging local businesses I feel like many people can be very picky and not understanding of how difficult it is to run one. I think that REM’s core value of empathy is most important because to aid businesses one should not be judgmental and should instead approach any issues with empathy and understanding.","careerInterests":"Consulting, Public Policy / Government, Law","howRemHelps":"To start off, REM is a student led consulting company so to get hands on experiences with consulting would be an amazing way to get into a real job in a consulting company through the experience of it and networking as well. Further, I am currently a pre-law student with an interest in working in law for some time and transitioning into working for the state department as a diplomat. Working for REM will help develop my problem solving skills that would be essential for working as a diplomat. It may also further my understanding of the inner workings of a business that could be helpful if I work within corporate law.","position":"Junior Consulting Strategist, Consulting Strategist","skills":"Marketing and analytics, Search Engine Optimization (SEO), Photography, Social media management","accommodations":"","other":"These are the official certifications I earned while enrolled in the International Marketing Academy at Ponte Vedra High School: \nProject Management Certification\nEntrepreneurship and Small Business Certification\nSoft Skills Certification\nDigital Skills Certification\nSocial Media Strategist Certification","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a56_dadf71be","timestamp":"9/3/2026 16:24:52","name":"Daniel Burris","email":"danielburris@ufl.edu","phone":"9546544774","gender":"Male","race":"White or Caucasian","linkedin":"www.linkedin.com/in/daniel-burris","resume":"https://drive.google.com/open?id=1iQ9AK6oU5W82Fyvlbej7BiYX-z3tVa52","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"Economics","gpa":"3.92","whyRem":"I want to become a member of Rem on Campus because I want to experience what it is like to solve problems that exist outside of a classroom or competition. I have always enjoyed figuring out why a business makes certain decisions and how they weigh their options, which is what initially drew me toward consulting. However, most of my experience so far has been focused on hypothetical situations. REM’s opportunity to work directly with real businesses and develop recommendations for real business challenges excites me.\nI am also interested in REM’s “Learning, Applying, Leading” structure. As someone still early in my college career, I see a lot of value in learning from students with more experience and applying those skills through meaningful client work. Over time, I hope to use these skills to become someone who can contribute to and eventually lead a team through challenging problems. I am not looking to join REM just to add something to my resume. I want to push myself, ask questions, contribute to local businesses, and develop the confidence required to approach unfamiliar problems.","coreValue":"Empathy","valueEssay":"Empathy stands out to me because I believe the way you treat and understand others has a major impact on the relationships you build. Growing up, my mom often told me that empathy was one of my strongest qualities, and I have come to realize how important it is for understanding other people's perspectives. I saw this firsthand while working as a private algebra tutor in high school. I learned that knowing how to solve a problem didn’t always mean I knew how to explain it in a way that someone else could understand. I had to put myself in my student’s shoes to recognize where they were struggling and adjust the way I communicated based on their perspective.\nThis is also why I see empathy as valuable in almost any situation, since it allows me to consider viewpoints outside of my own. Whether I am working with a teammate, client, or business owner, understanding their point of view can help me communicate more effectively, build stronger relationships, and approach problems in a way that I may not have considered on my own.","careerInterests":"Consulting, Investment Banking / Finance, Marketing, Data Analytics / Business Intelligence, Undecided / Exploring Options","howRemHelps":"One of my main career goals right now is to gain meaningful internship experience while continuing to explore where my interests and strengths can take me in the business world. Joining Rem on Campus would expose me to real businesses and challenges that I have not had the opportunity to experience yet. Working through different types of problems would help me better understand the work I find most interesting and where my skills are most valuable.\nBeyond my immediate internship goals, I eventually want to take on a role where I am trusted to make important decisions and contribute valuable ideas. REM would give me the opportunity I need to develop my abilities by working through unfamiliar problems, collaborating with a team, and contributing to work that has a real impact on businesses. The skills, relationships, and experiences I gain through that process would prepare me for both my future internships and my larger career goals in Finance.","position":"Junior Consulting Strategist","skills":"Business Strategy, Marketing and analytics, Finance and accounting, Microsoft Office Suite","accommodations":"","other":"One thing I would like to add is that I genuinely enjoy challenging myself and learning things that are unfamiliar to me. In the past, I have taken difficult classes and explored subjects beyond what was required simply because I wanted to learn more. I also value being coachable and am always open to feedback, different perspectives, and opportunities to improve.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a57_7fb0a1c0","timestamp":"9/3/2026 16:26:41","name":"Keerti Patil","email":"patil.keerti@ufl.edu","phone":"4074175758","gender":"Female","race":"Indian or Indian American","linkedin":"https://www.linkedin.com/in/keerti-patil-8a7560342/","resume":"https://drive.google.com/open?id=1igAeA-3N8OEMRsMLsKfCq5WP2lCU-Zwn","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Computer Science / Information Systems","minor":"","gpa":"4","whyRem":"I want to be a member of Rem on campus in order to meet new people and build a community of like-minded students that can guide me on my career path. Being a member of Rem would help me build my skillset, as well as gain experience with real world scenarios and projects. I also want to build lasting relationships with driven peers and mentors, and I also want to learn new information about the field of consulting. Overall, I want to improve myself through Rem in order to contribute my knowledge to the team and make an impact.","coreValue":"Innovation","valueEssay":"Innovation stands out to be because of its importance in our future. As time progresses, technology is increasingly becoming more advanced, and its significance on the corporate world will only continue to rise. Innovation is what created new opportunities and built humanity, improving our global standard of living today. I view innovation as not just a tool for inventing new products, but a critical value that will improve problem solving and navigate organizations in the future evolutionary marketplace.","careerInterests":"Consulting, Brand Strategy, Tech, Data Analytics / Business Intelligence, Entrepreneurship / Startups, Product Management","howRemHelps":"Joining Rem on Campus will help me meet like-minded people and network with members that have experience, which can allow me to build relationships with people that can guide my future career path. I also believe that Rem on Campus will help me learn more about consulting, and build the skillset that is necessary to thrive in the field. I would love to be a part of Rem and contribute my efforts to the organization, so that I gain knowledge and experience that I can apply to the real world one day.","position":"Junior Consulting Strategist","skills":"Mobile development, Web design, Videography, Photography, Social media management, Ads (Facebook/Instagram)","accommodations":"None","other":"N/A","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a58_9e3ae33a","timestamp":"9/3/2026 16:26:49","name":"Gaby Triana","email":"gabriella.triana@ufl.edu","phone":"3059030334","gender":"Female","race":"Hispanic or Latino","linkedin":"www.linkedin.com/in/gabriella-triana-00570a3a7","resume":"https://drive.google.com/open?id=1XmudyGoSAojyek-etKBSYlJd8mI8NcR7","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Business Administration","minor":"","gpa":"3.31","whyRem":"I’ve been taught my whole life that the most meaningful experiences are the ones where you leave something and/or someone better than you found them. During the rest of my college experience, that is the kind of impact I want to make and that is why I want to be a member of Rem on Campus. \n     Before college, I was involved in clubs and organizations and even had the opportunity to start my own nonprofit service organization. While building it, I experienced firsthand how difficult it can be to turn an idea into something that can grow beyond your immediate community. There were so many moments when I wished I had someone with experience in consulting or business who I could reach out to for guidance. Someone who could help me think bigger, identify opportunities, and figure out how to expand the organization's impact. That experience made me realize just how valuable it is to have people who are willing to share their knowledge and help others turn their ideas into something greater \n     That is one of the reasons Rem on Campus stands out to me. I want to be able to provide that kind of value to others while also learning how to do it myself. Since I am still exploring my exact career path, gaining exposure to consulting and working with businesses across different industries would give me valuable experiences while helping me discover where my interests and strengths truly align. I hope to develop practical skills, gain knowledge from experienced people, and learn how to approach real-world problems from different perspectives.\n     Most importantly, I want my college experience to be about more than just what I can accomplish for myself. I want to be part of something bigger than myself, just as I was through the organizations and nonprofit work I was involved in before college. I want to contribute to the success of others, help businesses and organizations reach goals that may feel out of reach, and surround myself with people who are equally motivated to make an impact. I see Rem on Campus as an opportunity to continue serving others while challenging myself, discovering my career path, and becoming the kind of person I once wished I had in my own corner.","coreValue":"Community","valueEssay":"I truly believe that I am a product of the communities that have invested in me. From my family, to my teams, to the people I’ve met at UF, the support and experiences I’ve gained from others have shaped who I am today. Therefore, community stands out to me because it represents not only having people around you, but growing together, supporting one another, and creating an environment where everyone can succeed.          \n\n     Community has also shaped how I understand the other core values. Through sports and dance, I learned resilience by facing challenges with teammates and pushing each other to improve. Attending an all-girls school and serving on student council taught me empathy and the importance of understanding different perspectives. Because my council members and I were so close, we were comfortable giving and receiving constructive criticism, which helped us solve problems and grow together. Working as a team also encouraged innovation by bringing different ideas together, while being surrounded by people who challenged me contributed to my intellectual growth and taught me to always remain open to learning.\n     Coming to UF has reinforced how important community is to me. Having friends from Miami here helped me adapt to a new environment, while my sorority introduced me to women who have become like family and mentors who continue to encourage my growth. One of my closest friends has also pushed me outside of my comfort zone by encouraging me to attend club events and helping me find new ways to get involved on campus.\n     Professionally, I want to create that same sense of community for others. I want to be someone who supports others, encourages new ideas, gives and receives constructive feedback, and helps people grow. To me, community is the foundation that allows resilience, empathy, innovation, and intellectual growth to thrive. It has taught me that success is not just about what I accomplish myself, but also about how I can help the people around me succeed.","careerInterests":"Consulting, Marketing, Product Management, Law, Fashion, Sports, Real Estate","howRemHelps":"I don’t see being undecided as not knowing where I’m going, I see it as having multiple paths that I’m genuinely excited to explore. When selecting my career interests, I chose “undecided” because I have not yet narrowed myself down to one specific path. At the same time, I selected and added several areas that strongly interest me. I’m still exploring how those interests may shape my future, which is why I am looking for experiences that allow me to gain exposure to different industries and discover where my skills and passions align.\n     Joining Rem on Campus would give me that opportunity through hands-on consulting experience with different businesses and brands. What initially drew me to Rem was seeing how consulting can provide exposure to a variety of industries, including ones that align with my interests. Through this experience, I hope to strengthen my strategic thinking, communication, problem-solving, and leadership skills while gaining insight into marketing, product development, business strategy, and client relationships. These are skills that I know would support the different career paths I am considering. \n     As I look toward my future, one goal I am particularly interested in is pursuing a combined degree at UF that would allow me to earn a master’s in either management or marketing. I see graduate school as an opportunity to build on the business knowledge and experiences I gain as an undergraduate while developing a deeper understanding of the areas I ultimately choose to pursue. I believe the experiences I gain through Rem could help me make that decision with greater confidence and give me a stronger foundation for that next step.\n     Ultimately, my long-term goal is to create a product or service that I can turn into a successful business of my own. I already find myself brainstorming ideas that I hope to bring to life one day, but I know that building something successful takes experience, knowledge, and time. I believe Rem would help me build that foundation by allowing me to work with real businesses, learn from different perspectives, and better understand how successful ideas are developed and executed. Regardless of where my career exploration leads me, I know the experiences I gain through Rem will bring me closer to becoming the entrepreneur and professional I hope to be.","position":"Junior Consulting Strategist","skills":"Marketing and analytics, Social media management, Ads (Facebook/Instagram)","accommodations":"","other":"One thing I would want Rem to know about me is that I genuinely look for opportunities to grow, even when I do not have everything figured out yet which I feel is pretty evident in my responses to these questions. I’ve always been someone who seeks out new experiences, challenges myself to step outside of my comfort zone, and looks for ways to make a meaningful impact. I may not have one exact career path mapped out yet, but I know I want to build something meaningful, help others succeed, and surround myself with people who push me to become better. I would bring curiosity, initiative, and a willingness to learn to Rem, but most importantly, I would bring the mindset that there is always an opportunity to learn, improve, and make a greater impact","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":{"timestamp":"9/2/2026 0:21:28","session":"09/01","appliedBefore":"No"},"meetMembers":null}},{"id":"a59_677a1862","timestamp":"9/3/2026 17:23:18","name":"Steven Pham","email":"phamsteven1246@gmail.com","phone":"2398228867","gender":"Male","race":"Asian or Asian American","linkedin":"www.linkedin.com/in/stevenphamuf","resume":"https://drive.google.com/open?id=1Nxrb6nfthkFiA2KW7xR8VIcUolYuOzya","university":"University of Florida","gradYear":"2028","classYear":"Junior","major":"Finance","minor":"","gpa":"3.5","whyRem":"I want to be a member of Rem on Campus because of the community that Rem holds at the University of Florida. The community consists of hard-working and like minded individuals. I am firm believer on the influence of environments and want to be surrounded with individuals who hold a high moral compass and have a drive towards growth like myself.","coreValue":"Resilience","valueEssay":"This value stands out to me because it compliments how I approach my whole life. I am a type of person where I never avoid opportunities or situations because it is new or scary, I push through my emotions and recognize the value of failure. In addition, I feel that resilience has been a big part of my journey not only as a student but as a person, being a First Generation Student. Through out my life, I have gone through multiple challenges of cultural and social norms. My parents came to the United States from Vietnam to escape the war and provide my family better opportunities. In exchange of that, they did not know any cultural knowledge or American systems. As a result, certain responsibilities such as learning how to apply to college or how to sign up for sports, fell to me. The situations I am put in and where I had to be resilient does not mean I have more weaknesses than others, but rather shows a growth in my mental strength and drive to become the best possible version of myself that I can be.","careerInterests":"Investment Banking / Finance","howRemHelps":"I believe joining Rem on Campus will help me achieve my career goals of breaking into finance by providing me with the necessary experience to succeed outside of college, whether it would be soft skills or technical skills. In addition, being surrounded in an environment with driven minded individuals like myself, will allow me to continue to stay focused on academics and achieving my goals.","position":"Junior Consulting Strategist","skills":"Business Strategy, Statistics and modelling, Data analysis, Marketing and analytics, Social media management, Finance and accounting, Python, Brand Development","accommodations":"N/A","other":"N/A","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a60_efbd1750","timestamp":"9/3/2026 17:54:02","name":"Irene Turrado Sierra","email":"turradoirene@gmail.com","phone":"+1 3522562778","gender":"Female","race":"White or Caucasian","linkedin":"www.linkedin.com/in/irene-turrado-sierra","resume":"https://drive.google.com/open?id=1kd9c5FgaPeKKIa0lPu1LLhdDNTqJ9rLp","university":"University of Florida","gradYear":"2027","classYear":"Senior","major":"Engineering (various disciplines)","minor":"Computer Science / Information Systems, Data Science, Engineering (various disciplines), Mathematics","gpa":"Approx. 3.31/4.0 — original cumulative GPA: 8.28/10 (Universidad Pontificia Comillas – ICAI, Spain)","whyRem":"I want to join Rem on Campus because I am especially interested in applying my analytical background to real business problems and seeing the direct impact of my work. As a Mathematical Engineering and AI student, I am used to approaching complex problems in a structured and data-driven way, but I want to strengthen the business and client-facing side of that skill set.\n\nMy internship at Inveready reinforced this interest, as I worked with financial and portfolio information and saw how technology and analysis can support real business decisions. What attracts me most to Rem is the opportunity to work directly with small businesses, understand the challenges they are facing, and help develop practical recommendations as part of a team. I also value the mentorship and learning component, as I see Rem as a place where I can both contribute my quantitative perspective and grow as a problem solver and communicator.","coreValue":"Empathy","valueEssay":"Empathy stands out to me because I believe that solving a problem well starts with understanding the person behind it. Through years of tutoring and volunteering with people from very different backgrounds, I have learned that listening first often changes the solution you initially thought was right. Different people have different priorities, constraints, and ways of approaching a problem, and being able to adapt to those differences is something I value deeply.\n\nThis has also shaped the way I approach more analytical work. My background in Mathematical Engineering and AI has taught me how to break down complex problems using data, but I have learned that a technically strong answer is only valuable if it is useful to the people who have to act on it. That is particularly meaningful to me in Rem’s work with small businesses, where recommendations affect real owners, employees, and communities. I would want to understand each client’s reality before trying to improve it.","careerInterests":"Consulting, Investment Banking / Finance, Tech, Data Analytics / Business Intelligence, Entrepreneurship / Startups","howRemHelps":"My career interests sit at the intersection of technology, analytics, finance, and business strategy, and I see Rem on Campus as an opportunity to connect those interests through real client work. My academic background has given me strong quantitative and technical skills, while my experience at Inveready showed me how data and technology can support business and investment decisions. However, I want to become better at taking analysis one step further: understanding a business problem, identifying what really matters to the client, and turning that analysis into a practical recommendation.\n\nWorking with small businesses through Rem would give me exposure to different industries and challenges while developing skills that are relevant across consulting, investing, technology, and entrepreneurship. I am particularly excited about learning how to structure ambiguous problems, communicate recommendations clearly, and work closely with a team and a real client. I believe those experiences would help me understand where I can create the most value professionally while building a much stronger business perspective alongside my technical background.","position":"Junior Consulting Strategist","skills":"Business Strategy, Statistics and modelling, Mobile development, Web design, Data analysis, Videography, Photography, Finance and accounting, HTML, Python, R, Machine Learning, SQL, Power BI, Tableau, Financial Modelling & Valuation, C++, C#, Git/GitHub","accommodations":"No accommodations needed at this time. Thank you.","other":"As an international exchange student, I am spending the full academic year at UF and am very intentional about getting involved beyond the classroom. I believe my background in engineering and AI, combined with previous experience in asset management and studying in different international environments, allows me to bring a different perspective to a team. I am also a very curious and committed person, and I genuinely enjoy learning from people with backgrounds different from my own. If selected, I would be excited to contribute actively to Rem throughout the semester and make the most of the opportunity to work with real businesses and the UF community.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a61_d2e9ed68","timestamp":"9/3/2026 18:10:01","name":"Kashvi Aggarwal","email":"k.aggarwal@ufl.edu","phone":"321-391-2553","gender":"Female","race":"Indian or Indian American","linkedin":"https://www.linkedin.com/in/kashviagg/","resume":"https://drive.google.com/open?id=1FWPTArbWKuJIJabpCPvNxEW98rjCL2p6","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"","gpa":"3.34","whyRem":"I want to join Rem on Campus as a Junior Strategist because working with Life in a Bottle, a small juice company in Gainesville, showed me how meaningful it is to help a local business grow. I managed the company’s social media, organized promotional pop-ups, and engaged directly with potential customers at farmers’ markets, which allowed me to understand both the operational and personal sides of a small business.\n\nWhat I valued most was seeing how my work affected Willie, the owner. After I designed branded T-shirts for Life in a Bottle, he sent me pictures of himself smiling while wearing one at the farmers’ market and told me that customers had been complimenting it. Seeing him proudly wear something I had created made the work feel much more personal. I experienced that feeling again when I pulled up the company’s social media analytics and showed him that our content had reached more than 13,000 views in 30 days. His face immediately lit up, and he said, “All of Gainesville is going to know us.” He also told me that the modern perspective I brought to the company was helping him reach people he had not known how to reach before. His reaction meant more to me than the number itself. Watching him become more excited and confident about a business he had poured so much of himself into was what made the experience genuinely fulfilling.\n\nRem on Campus’s structured consulting program would help me turn that motivation into a broader skill set. As a Junior Strategist, I would bring my experience in marketing and customer engagement while learning alongside a team to analyze unfamiliar business challenges and develop recommendations tailored to each owner’s goals. I am excited by the opportunity to grow into a more well-rounded problem-solver while helping other owners experience the same pride and optimism I saw in Willie.","coreValue":"Resilience","valueEssay":"Resilience stands out to me because I learned that one setback does not erase all the work that came before it.\n\nI experienced this while planning my Eagle Scout project to build a butterfly garden at a local park. A week before the scheduled date, a hurricane left the park flooded, muddy, and covered with fallen branches, making it unsafe for the project to continue. I felt overwhelmed and disappointed because it seemed like all the effort I had put into planning had suddenly gone flat. I was also worried about losing volunteers, delaying the materials, and disappointing everyone who had committed to helping.\n\nInstead of letting those concerns stop the project, I focused on what needed to happen next. I informed the Scouts and adult leaders about the cancellation, spoke with the city parks manager, rescheduled the delivery with our material suppliers, and ensured everyone understood the new plan. Because everyone remained informed and cooperative, the rescheduled project ran smoothly, and seeing the completed garden felt like the culmination of everything I had worked toward throughout Boy Scouts.\n\nI later applied this same mindset at UF when more than 160 students arrived at the Student Government Print Lab before a career fair and only one printer was functioning. Although I felt overwhelmed, I focused on what I could control by organizing the line, troubleshooting the equipment, and contacting Reitz Union and IT staff for assistance. Every student ultimately left with a resume, showing me how the resilience I developed through Boy Scouts continues to guide me professionally.","careerInterests":"Consulting, Brand Strategy, Tech, Technology or Software Sales","howRemHelps":"I want to pursue a career in sales, but I am still exploring which industry and type of client I want to work with within that realm. I see consulting as closely connected to sales because both require uncovering a client’s needs, understanding the reasoning behind their decisions, and communicating a solution that fits their situation. Through the GatorSLAM Sales Team, I am currently developing the interpersonal side of this process by learning how to conduct discovery calls, ask purposeful questions, and connect a solution to a prospect’s needs. Rem on Campus would complement that experience by strengthening the business knowledge behind those conversations.\n\nWorking directly with small business owners would allow me to understand how they evaluate decisions, balance limited resources, and consider the effects of a problem across their finances, operations, and customers. I would learn how to evaluate the information gathered during client conversations, identify the root of a business problem, and turn those findings into practical recommendations customers deserve. Exposure to businesses with different models and customer bases would help me determine which area of sales interests me most while preparing me to approach future clients with both strong communication skills and a deeper understanding of their businesses.","position":"Junior Consulting Strategist","skills":"Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Business Strategy, Search Engine Optimization (SEO), Photography, Social media management, Python, Brand Development","accommodations":"N/A","other":"N/A","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/3/2026 17:39:43","spokeTo":"Pablo, Adam, Lexi"}],"infoSession":null,"meetMembers":null}},{"id":"a62_98391f4c","timestamp":"9/3/2026 18:49:55","name":"Rajveer Chavan","email":"rajveerchavan@ufl.edu","phone":"+1 (352) 772-1477","gender":"Male","race":"Indian or Indian American","linkedin":"https://www.linkedin.com/in/rajveerchavan20/","resume":"https://drive.google.com/open?id=1pu8PTKepi7qwSqzCCELDSlc_uwc1jF_j","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Economics","minor":"","gpa":"N.A. (3.98 HIgh School GPA - 42/45 IB)","whyRem":"I wish to join Rem on Campus because Rem works with small business that have real problems without a team to solve it for them. More than big corporations, smaller business are the ones that require real consulting and help to fix messy problems. That's the kind of experience and knowledge I wish to obtain before I graduate. I feel like working with smaller businesses will teach me to become more patient, composed, a better listener and ultimately a better consultant. My long term plan is to get into healthcare administration and gaining consultation experience will be extremely valuable to my professional development. I also wish to work alongside like-minded individuals and learn more from my peers and team leaders and adopt a useful quality in my work and life from every person around me.","coreValue":"Empathy","valueEssay":"Empathy stands out to me because I find it a lot easier to work if I actually understand what people need instead of what I think they need. It requires one to be a careful listener and an open-minded individual. When I ran the training program for underprivileged village girls in India, what mattered more than the fitness or logistics was understanding why a lot of them didn't think they could finish something like a 320km ride, and building the program such that they could develop confidence in themselves. I saw the same thing when I was organising health camps around my city. People struggled to trust the doctors more than the information that was fed to them and thats my biggest fear. I wish to be a careful listener and earn someone's trust by proving to them that I understand what they're communicating and what they need. That's why I wish to pursue healthcare administration as a career because systems such as healthcare only work when people running them understand the needs of the people using them and thats why empathy stands out the most to me.","careerInterests":"Consulting, Entrepreneurship / Startups, Non-Profit / Social Impact, Medicine, Healthcare Administration","howRemHelps":"Rem would let me see how a real organisation actually runs day to day. I wish to gaine xperience working with real budgets, operational concerns and decision making processes which is what will help me when I run a healthcare organisation later. My clinical consulting internship gave me real insight onto how consulting operations look like. I deeply enjoyed the process of working with a business with a real problem, digging into it, and present them with actionable findings. Rem would allow me to do the same except with real guidance, a team and coaching instead of going at it alone.","position":"Junior Consulting Strategist, Consulting Strategist","skills":"Business Strategy, Statistics and modelling, Brand Development","accommodations":"N.A","other":"N.A","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a63_8bef0745","timestamp":"9/3/2026 19:18:07","name":"Hamza AbuOleim","email":"abuoleimhamza@ufl.edu","phone":"(813) 593-2188","gender":"Male","race":"Middle Eastern or Arab","linkedin":"www.linkedin.com/in/hamza-abuoleim","resume":"https://drive.google.com/open?id=1i5UOI_Wcs5K1ZPEJUC423C6ot52Y2ydx","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"","gpa":"N/A (freshman) Highschool GPA: 3.76","whyRem":"Joining Rem on Campus aligns directly with my commitment to creating spaces where people feel engaged and supported. Having led event logistics and financial tracking for a community giving circle nonprofit and founded a student diversity leadership board in high school I've learned how valuable community and belonging is. I know great ideas require structure and execution to survive. Rem offers the collaborative experience I need to refine my leadership and innovative skills enabling me to help make my communities stronger.","coreValue":"Community","valueEssay":"The value of community centered collaborations connects deeply with both my personal and professional background. Growing up in an immigrant family and founding the Student Diversity Leadership board taught me that sustainable impact happens when you listen first and build alongside the community, rather than imposing outside solutions. My financial operations and event work at 200 Muslim Women Who Care was never just about logistics. It was about ensuring the people in our community felt supported.","careerInterests":"Investment Banking / Finance, Non-Profit / Social Impact","howRem , skills, and community for me to pursue many of the various career interests that I am considering at the moment. Particularly, the developments I would make in Rem would be hugely beneficial to possible careers in consulting, finance, and data analytics.","position":"Junior Consulting Strategist","skills":"Statistics and modelling, Data analysis, Social media management, Microsoft Office Suite","accommodations":"Nothing in particular","other":"I would be hugely honored to be accepted into and be a part of Rem. I also consider myself very good at memorizing information and statistics.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a65_0ecc4a04","timestamp":"9/3/2026 19:47:22","name":"Amanda Liu","email":"liuamanda@ufl.edu","phone":"(954)-471-1145","gender":"Female","race":"Asian or Asian American","linkedin":"https://www.linkedin.com/in/amandaliu06","resume":"https://drive.google.com/open?id=1oVW-H6MNZczEObn7uzcrxAyWaFkZvQnz","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Business Administration","minor":"","gpa":"3.82","whyRem":"I want to be a member of Rem because supporting and working with local businesses to resolve their issues and helping them stay connected to the communities they serve is important to me. Joining an organization of like-minded peers with a focus on serving the community is something that I highly value and seek. Rem provides a unique opportunity with real-world work, showing firsthand the value of using business acumen for good. I hope to contribute to this organization’s efforts in creating modern, effective solutions that address the issues businesses face.","coreValue":"Community","valueEssay":"Community is the core value that is most important to me, as it has shaped a lot of my experiences growing up. Working in my family’s restaurant showed me how important the relationship between local businesses and the larger community can be. These spots help shape the identity of the local area and are reliant on the local community’s support to continue to succeed. \nI watch how my parents were able to build long-lasting relationships with customers and other local businesses, and how vital that was to their success. Seeing this showed me the importance of fostering connections with others and being there for the community around you. Community is a value that continues to guide how I interact with others, and it’s one I hope to expand upon with Rem on Campus.","careerInterests":"Consulting, Investment Banking / Finance","howRemHelps":"My career interests are focused on consulting and finance, and Rem is able to provide me with experience that can positively impact my understanding of these fields.\nConsulting interests me as I enjoy working with others to solve important problems faced by clients and developing practical, individualized solutions to help organizations and their operations. Rem allows for the chance to work with a local organization, with real issues that need to be solved, and with a real client, giving firsthand experience in this field. Finance interests me for the analytics and the opportunity to understand how businesses grow, adapt, and make important financial decisions.\nRem would allow me to apply the business concepts I am learning in class and through self-study to real situations. Rem provides an opportunity to build skills applicable to these two fields while staying connected and working in a group to help guide the path.","position":"Junior Consulting Strategist","skills":"Photography, Finance and accounting, Microsoft Office Suite","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a66_83ef9813","timestamp":"9/3/2026 20:03:15","name":"Sterling Livingston","email":"s.livingston1@ufl.edu","phone":"813-390-0439","gender":"Male","race":"White or Caucasian","linkedin":"www.linkedin.com/in/sterlinglivingston","resume":"https://drive.google.com/open?id=1jTsE-lsIQd3dpV9pLIhamMF2m8h-GRvS","university":"University of Florida","gradYear":"2028","classYear":"Junior","major":"Engineering (various disciplines)","minor":"Other","gpa":"3.81","whyRem":"I came to UF with the intention of pursuing a career in the medical field, based on my want to make a positive change in the lives of the people I worked with. However, after getting more experience in the medical field, I learned that I am more interested in pursuing a career where I could help optimize and add value to existing businesses. I learned about consulting, and I wanted to get involved with an organization that would give me the ability to start helping real businesses and hone essential consulting skills. I learned that REM is made up of a community of people who have already made a difference in many businesses and really care about helping members succeed in consulting.\n\nNot only will being a member of REM help me develop consulting skills, but it also gives me an opportunity to give back to local businesses in Gainesville. I resonate with REM's mission of helping local businesses that give Gainesville its character and make it feel like a home. Being a part of an organization that creates visible impacts in the Gainesville community would be incredibly rewarding and an invaluable experience for me. I would also like to be a member of a tight-knit community made up of other driven individuals looking to create change and be successful in their careers. I believe that the social events that REM holds outside of consulting operations help build lasting connections that I can have past college and keep throughout my career.","coreValue":"Community","valueEssay":"I believe that everyone is a product of their environment. The community that you choose to surround yourself with shapes both your everyday life and your future. In the past, the communities I have been a part of—my swim team, my school community service organization, and the community of people I have around me now—have pushed me to grind for a new personal record in the pool, go out and serve the homeless in my community, and apply to join new organizations that will help in my career. Without these communities of people, I would not be in the place I am today. In my professional career, I would like to have a client-facing role where I have the opportunity to interact and build genuine relationships with clients. Joining REM would allow me to connect directly with business owners and improve my ability to form authentic relationships in business. REM is a community of driven leaders, and being a member would motivate me to grow personally and professionally while also greatly benefiting my professional journey.","careerInterests":"Consulting, Marketing, Brand Strategy, Tech, Entrepreneurship / Startups, Product Management","howRemHelps":"Given the opportunity to join REM on Campus, I would be a member of a highly motivated network of leaders focused on gaining experience in consulting and similar business fields. The mentorship, valuable guidance, and knowledge of the recruitment process that older members have would give me a huge advantage when applying to internships and consulting jobs. Additionally, REM's visits to top consulting firms in the Southeast would allow me to connect with consulting professionals. This would expand my network, give me insight into the daily expectations of a consultant, and highlight the culture of each firm.\n\nGaining hands-on experience in consulting through work with businesses in Gainesville would also help me build confidence in myself and my ability to deliver solutions that have a real impact on business outcomes. I would also have the chance to sharpen my skills in professional communication, relationship building, and project management. The well-connected network and concrete skills I would develop as a member make REM the best organization I could be a part of to achieve my career goals.","position":"Junior Consulting Strategist","skills":"Business Strategy, Statistics and modelling, Back-end web development, Web design, Python, Microsoft Office Suite, Brand Development","accommodations":"No","other":"I would like to pursue client facing role in business. I am fully committed to consulting, and I am really interested in getting involved with case competitions and real business projects.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a67_4cad0215","timestamp":"9/3/2026 20:15:35","name":"Lucia Paras","email":"luciajparas@icloud.com","phone":"864-395-2547","gender":"Female","race":"Asian or Asian American","linkedin":"www.linkedin.com/in/luciaparas","resume":"https://drive.google.com/open?id=1vzjjJmw4QzBPLiiTGkHe5NJHU4rTdItH","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Other Social Science (e.g. Psychology, Sociology, Anthropology)","minor":"Business Administration","gpa":"3.9","whyRem":"I am still exploring different business professions, and Rem on Campus would give me the opportunity to experience different business aspects ranging from consulting, market strategy, and brand building. Moreover, I love how Rem on Campus incorporates all these aspects and more into a meaningful project that it is happening locally. I would also want to be a member of Rem on Campus because I would get to connect with others from various colleges here at the University of Florida. Whether it is through the members or the businesses, I believe that Rem on Campus offers a diverse array of people and experiences. After attending the information session and speaking with Hannah, we were able to connect over having majors outside of Warrington. During our conversation, she was able to give me insightful advice and direct me towards new resources. It was clear to me that Rem on Campus greatly values connecting with one another on a deeper level. Through these connections, I can broaden my understanding and learn new perspectives which can then be applied to whatever business career I may pursue. Overall, I would love to be a member of Rem on Campus because I would get the opportunity to explore my passion for business while knowing that I was helping someone within the community while also building a community of my own within the organization.","coreValue":"Empathy","valueEssay":"I believe that empathy is the foundation to most things in life. Over the summer, I had an internship at a hospital research department. I was not working hands on with patients, but I was hearing stories from the other interns. One told me how he had some preconceived notions about an underprivileged patient. He was shocked when he met the patient, and she was one of the kindest patients he had met. After the fact, he was explaining how he should have had more empathy and not to have made assumptions. Even though I did not experience the situation firsthand, I still empathized with the patient through my peer. However, I also empathized with my peer since it was a new situation, and he was still able to learn from it. This can be applied to working with Rem on Campus since when working with a variety of clients, it is easy to make assumptions regarding what is best to do and to cast judgement even without knowing the whole situation. Thus, it is essential to empathize and show compassion. While I may not fully understand the situation at hand, I can still listen and try to see their side of the story. Moreover, empathy does not just extend to the clients, but to the other Rem strategists and leaders. Certain cases will be far from what is imagined, but I know empathizing and encouraging one another through tough times is essential.","careerInterests":"Consulting, Brand Strategy, Entrepreneurship / Startups, Product Management","howRemHelps":"Through hands on experience, I will be able to explore my interests regarding consulting, brand strategy, entrepreneurship, and product management since I will have the opportunity to strengthen my communication and develop my strategic thinking. Moreover, at the information session, I learned about the mentor-mentee program. Through this program, I can gain new knowledge and perspective from the other members regarding their business experiences. By joining Rem on Campus, I will be able to achieve my career goals since I will develop a variety of skills that can be applicable to whatever career path I may pursue in the future.","position":"Junior Consulting Strategist","skills":"Statistics and modelling, Marketing and analytics, Photography, Social media management, Microsoft Office Suite","accommodations":"","other":"I was originally a biology major on the premed track; however, over the summer, I started taking classes for my business minor since I was uncertain on whether medicine was what I truly wanted to do, and I fell in love with microeconomics. It was a class I greatly enjoyed, and I loved how applicable it was to the real world. Thus, after debating on switching my major for the past six months, I finally made the switch this fall. Since then, I have been exploring possible career paths involving economics, and when I came across Rem on Campus, I felt like it perfectly matched my love for economics with business and community.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":{"timestamp":"9/3/2026 22:01:26","session":"09/03","appliedBefore":"No"},"meetMembers":null}},{"id":"a68_10bbe873","timestamp":"9/3/2026 20:18:58","name":"Victoria Maltezos","email":"Maltezosvictoria@gmail.com","phone":"561-403-9187","gender":"Female","race":"White or Caucasian","linkedin":"N/A","resume":"https://drive.google.com/open?id=1TM7vll9_lgXBY-MbWeB5YIRWvQHBz8S9","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Business Administration","minor":"","gpa":"4","whyRem":"I want to join Rem on Campus because it offers a unique opportunity to bridge my academic interests in business with practical, client based experience. The opportunity to work directly with small businesses, evaluate real business challenges, and develop strategic recommendations would allow me to gain a deeper understanding of how businesses make decisions and identify opportunities for growth.\n\nMy interest in this work is also personal. Having gained experience working within my family’s business franchises in South Florida, I have seen firsthand the importance of effective operations, customer relationships, marketing, and strategic decision making to a company’s long term success. I want to build upon that experience by learning how to approach business challenges from a more analytical and consulting oriented perspective.\n\nAs a Business Administration student, I am particularly focused on developing my skills in strategy and marketing. I want to learn how to evaluate a business’s current position, identify areas for improvement, and develop strategies that effectively address its goals and challenges. The opportunity to conduct research, analyze business needs, collaborate with a team, and present recommendations to clients would allow me to strengthen these skills in a real world setting. I would also value the opportunity to learn from experienced members, contribute my own perspective, and work alongside other motivated students while supporting local businesses. Ultimately, I see Rem as an opportunity to develop into a more strategic and well rounded business professional while creating meaningful value for the Gainesville community.","coreValue":"Intellectual Growth","valueEssay":"Intellectual growth stands out to me because I want to become better at understanding the reasoning behind business decisions, not just learning what the decisions are. Working in my family’s franchise business has given me firsthand experience with how an established business operates, but it has also made me realize how much I still want to learn about evaluating challenges and determining the best way to move a business forward.\n\nI want to develop the ability to look at a business problem, ask the right questions, and think through different possible solutions before deciding what approach makes the most sense. I believe working with different businesses through Rem would challenge me to do that in situations that are unfamiliar to me and help me develop a more thoughtful and strategic way of thinking.","careerInterests":"Consulting, Marketing, Brand Strategy, Entrepreneurship / Startups","howRemHelps":"Joining Rem on Campus would give me the opportunity to help small businesses turn their ideas and goals into sustainable businesses. I am drawn to the idea of being involved in the process of helping an entrepreneur take their vision and determine what it will take to make that vision successful. While my experience in my family’s franchise business has shown me what it takes to operate an established business, Rem would allow me to see the other side of entrepreneurship and learn how businesses can be built, strengthened, and grown.\n\nWorking directly with small businesses would teach me how to identify opportunities, recognize potential challenges, develop practical strategies, and connect business owners with the right resources when needed. I believe that learning through these experiences would give me knowledge I can carry into my own future, whether I pursue entrepreneurship or eventually take on a larger role in my family’s business. I want to understand not only how a business operates, but how you help turn someone’s vision into a business with the foundation to succeed.","position":"Junior Consulting Strategist","skills":"Business Strategy, Marketing and analytics, Social media management, Communications and copy-writing, Brand Development","accommodations":"I do not need any accommodations at this time.","other":"I originally planned to attend UF Online, but after deciding that I wanted
