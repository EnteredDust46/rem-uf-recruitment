 pivot toward industrial engineering, turning a difficult moment into a clear path forward that aligned better with my strengths and interests. I put this value into practice again during my time in a case competition last spring. When our project group was suddenly reduced from five members to two, my partner and I were left with a choice: complain or step up. We embraced the extra workload, restructured our approach, and ultimately earned second place. That experience showed me that resilience is more than just enduring a tough situation; it is about taking ownership, staying adaptable, and delivering results despite unexpected obstacles. Joining Rem on Campus would mean bringing this mindset to every project. Whether navigating complex client challenges in supply chain operations or adapting under tight deadlines, I know that maintaining resilience enables me to learn continuously and support my team through any setback.","careerInterests":"Consulting, Engineering","howRemHelps":"Joining Rem on Campus feels like the ideal bridge between what I am learning in the classroom and where I ultimately want to take my career. My goal is to work in operations, supply chain, or engineering consulting, and the practical experience Rem on Campus provides is exactly what I need to prepare for those fast-paced environments. For supply chain and operations, having the opportunity to work on real client cases means I can move beyond textbook theories. I want to practice optimizing complex workflows, identifying bottlenecks, and managing logistics challenges as they unfold in real time. On the consulting side, the hands-on project work will help me hone critical skills like breaking down ambiguous technical problems, turning raw data into strategic insights, and presenting polished solutions clearly to stakeholders. Beyond the technical preparation, what excites me most is the collaborative environment. Working alongside a dedicated, high-achieving team will sharpen my cross-functional communication and leadership style. By fully committing to the projects and learning from both my peers and mentors, I know I can build the confidence, adaptability, and sharp business literacy required to hit the ground running in either field after graduation.","position":"Junior Consulting Strategist","skills":"Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Web design, Data analysis, Social media management, Python, R, Design Thinking, Microsoft Office Suite","accommodations":"n/a","other":"n/a","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":{"timestamp":"9/3/2026 22:01:37","session":"09/03","appliedBefore":"Yes"},"meetMembers":null}},{"id":"a38_7989d3e7","timestamp":"9/2/2026 14:33:12","name":"Jake Dalessio","email":"jakedalessio@ufl.edu","phone":"914-255-7430","gender":"Male","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/jake-dalessio-044148231/","resume":"","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"","gpa":"4","whyRem":"In high school, I served my community for over 500 hours whereas the graduation requirement was only 100 hours. I find so much enjoyment and satisfaction from giving to others, helping others, and seeing others prosper. When I heard about Rem and how it helps REAL companies and REAL people, I was ecstatic. The fact that I can have a real impact on someone and help them with their business is so beautiful. My goal is to selflessly serve whichever individual and company I can to help them to the best of my ability. Their business is my business, and I'd love to establish a lasting professional relationship with my client. Eventually if I can climb to Team Lead and even further, I would very much be interested in that so I can help and mentor and give back to more aspiring Rem members.","coreValue":"Community","valueEssay":"As mentioned earlier, in high school I served my community for over 500 hours whereas the graduation requirement was merely 100 hours. The community value stands out because I understand how our consulting services at Rem genuinely help our clients. I believe this connects to my professional journey because as I pursue Wealth Management, client relationships are incredibly important and the idea of servitude and doing whatever possible for your client, I want to nurture these skills early to enhance them.","careerInterests":"Consulting, Wealth Management","howRemHelps":"Wealth management is heavily reliant on client relationships, trust, and servitude. I know how with Rem we get to nurture a client relationship with trust and through service. It's genuinely perfect practice and execution for my career goal of building trusting, lasting, powerful relationships with ultra-high net worth clients.","position":"Junior Consulting Strategist, Consulting Strategist, Team Lead","skills":"Business Strategy, Data analysis, Marketing and analytics, Social media management, Finance and accounting, Microsoft Office Suite, Public Speaking","accommodations":"N/A","other":"In the question \"Please check the position(s) you are applying for\", I selected all of them, but I meant that in a way where I'd pursue them throughout my time in Rem. I cannot immediately jump to Team Lead. My goal is to start as a junior strategist or strategist and eventually move my way up through strong service and passion!","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":{"timestamp":"9/3/2026 22:03:53","session":"09/03","appliedBefore":"No"},"meetMembers":{"timestamp":"9/2/2026 17:06:45","year":"Freshman","appliedBefore":"No"}}},{"id":"a39_5c3e4981","timestamp":"9/2/2026 15:44:56","name":"Reinaldo Vilchez","email":"vilchezreinaldo@ufl.edu","phone":"3054641779","gender":"Male","race":"Hispanic or Latino","linkedin":"https://www.linkedin.com/in/reinaldo-vilchez-46ba81348/","resume":"https://drive.google.com/open?id=1tKNV3EmKfTJNWPiB_HplxcaWWpe8S-wl","university":"University of Florida","gradYear":"2027","classYear":"Senior","major":"Business Administration","minor":"Business Administration, Other","gpa":"3.58","whyRem":"I want to join Rem on Campus to work with real clients and see how small businesses actually grow. That's exactly what I need for my goal of one day starting my own machinery sales company since selling well means understanding what a business really needs. I already have some hands-on business experience from my externship with Beats by Dre and my procurement role at Gourmand but I want more real client-facing work and Rem is the right place to get it.","coreValue":"Empathy","valueEssay":"Empathy stands out to me the most. I've always believed that listening to people carefully before jumping in with my own opinion is the best way to actually understand someone. This started with my family and friends, where I learned that people open up more and trust you more when they feel truly heard. I try to carry that same mindset into my professional life, since understanding what a client or a business really needs before offering a solution makes all the difference. That's part of why I'm drawn to Rem on Campus, since consulting for small businesses starts with listening to their challenges before jumping into strategy.","careerInterests":"Consulting, Marketing, Brand Strategy, Tech, Data Analytics / Business Intelligence, Entrepreneurship / Startups","howRemHelps":"Joining Rem on Campus will give me the chance to practice talking with real clients, which is something I can't fully get from a classroom. Every conversation with a small business is a chance to practice selling and negotiating, since I'll need to understand their needs, explain my ideas clearly, and get them on board with a solution. That's exactly the kind of practice I need for my goal of one day starting my own machinery sales company. Building those skills now, in a real setting, will help me walk into that future with more confidence and experience.","position":"Junior Consulting Strategist","skills":"Business Strategy, Data analysis, Marketing and analytics, Videography, Photography, Python, Brand Development","accommodations":"No","other":"When can I start?","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a40_8dd93674","timestamp":"9/2/2026 15:54:50","name":"Alex Gerstenfeld","email":"agerstenfeld@ufl.edu","phone":"7329155279","gender":"Male","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/alex-gerstenfeld-456b7b423/","resume":"https://drive.google.com/open?id=1qdRSYFPcFrFU8VkPWflChD6ItdjOvLja","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Computer Science / Information Systems","minor":"","gpa":"N/A (First semester freshman)","whyRem":"Based on my childhood choice of video games, I knew consulting was a career that fit me perfectly. I always loved factory games, where players have to find bottlenecks in cluttered systems and redesign them. To me, consulting sounded like a similar task. REM is an organization where I can gain experience in the field while pushing local businesses to succeed. Having the ability to help change a small business owner’s life is something I can only do in REM. REM also opens up countless opportunities by connecting me with potential future employers and mentors. Additionally, I hope to gain a new network of not just colleagues, but close friends. In the process, I’m looking to build my teamwork, communication, and problem-solving skills through my work so that I can become the best analyst I can be. I want to continue to learn about consulting and improve on my skills, while helping to push as many businesses as I can to grow and prosper, and REM is where I can do both.","coreValue":"Intellectual Growth","valueEssay":"Out of these five values, intellectual growth is the most important to me. Without intellectual growth, society would stop persistently trying to learn more, and as a result, technology, businesses, and communities would stagnate and innovation would cease. This value resonates with me, as I have always had an urge to learn and expand my horizons. In High School, I was part of a specialized program that taught students multiple coding languages. I decided to join this program because I wanted to expand my skillset and knowledge. I had to work for countless hours to even develop a working proficiency in some languages. As a result, I developed a myriad of new skills that I could use to benefit those around me. For example, I coded a fully-functional booking system for my friend’s small business. I’m looking to pursue a similar course of action. My goal is to continue to intellectually grow and learn about consulting, analytics, and decision-making, so that I’m able to help other businesses grow and succeed.","careerInterests":"Consulting, Tech, Data Analytics / Business Intelligence, Product Management","howRemHelps":"To break into any of the industries I selected, applicants need knowledge, connections, and skill. REM can help me achieve all three. First, REM on Campus is a massive organization spanning across many college campuses, and is a part of the global giant REM and Company. REM’s size leads to members working at hundreds of prestigious firms. These members are invaluable connections to huge companies I would be fortunate to work for after I graduate. In REM, I’d also connect with older students that are on a path similar to mine that could possibly help me secure an internship or job later. Second, the knowledge I’d gain about the consulting, analytics, and tech industries from doing hands-on work with businesses would be unmatched. I’d begin to understand which implementations can solve certain problems and which can’t. I’d be prepared for any future case interviews I would have to partake in. Third, I’d develop some of the most valuable skills employers look for: teamwork and communication. By working with a team on every project, I’d learn to communicate in a professional setting with those of different backgrounds and with different opinions. This would prepare me to work in a team on a larger scale in a potential future endeavor. Overall, REM would be one of my most powerful assets towards my future career goals.","position":"Junior Consulting Strategist","skills":"Back-end web development, Web design, HTML","accommodations":"N/A","other":"N/A","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/3/2026 18:20:55","spokeTo":"Christian, Terrence, Lexi, Isabella, Kyle"}],"infoSession":null,"meetMembers":null}},{"id":"a41_84f69be7","timestamp":"9/2/2026 16:00:59","name":"Vance Byrd","email":"vancebyrd@ufl.edu","phone":"2394009036","gender":"Male","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/vance-byrd-897b693ba/","resume":"https://drive.google.com/open?id=1ywyNSUC3ntEFQ3VYDhlR_ZdDV5RqHTgm","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Business Administration","minor":"","gpa":"I am a freshman. My high school GPA was 3.98 unweighted.","whyRem":"I would love to be a member of Rem on Campus because I believe it would be an incredible opportunity to expand my knowledge and develop skills across different areas of the business world. I am especially interested in gaining experience with networking, teamwork, problem-solving, and personal growth while working with others to help real clients.\n\nMy interest in consulting comes from experiences I have already had. Through Model United Nations, I spent years tackling complex global problems, considering different perspectives, working with a team, and presenting solutions. I loved the challenge of taking a complicated issue and figuring out how to approach it, and I was fortunate enough to receive multiple awards at competitive conferences. I also interned at my family's construction business, where I was able to see the day-to-day challenges of running a business and experience everything from project coordination and administrative work to seeing how decisions affect real projects and clients.\n\nBeyond the professional experience, I am excited about the community Rem on Campus offers. I am a very social person, and I want to become more involved at UF, meet new people, and surround myself with students who are motivated to improve themselves. I also want to eventually use what I learn to give back to my community. I believe Rem on Campus would be a great place for me to challenge myself, build meaningful relationships, and gain experiences that will help me grow both personally and professionally, regardless of the career path I ultimately pursue.","coreValue":"Intellectual Growth","valueEssay":"Intellectual growth stands out to me because I believe some of the most valuable skills you can develop come from constantly challenging yourself to learn something new. As a freshman, I think learning is one of the most important things I can focus on right now, and I want to take advantage of opportunities that push me outside of my comfort zone and allow me to learn from people with different experiences and perspectives.\n\nI experienced this throughout my time in Model United Nations. Every conference required me to learn about issues I was not already familiar with, research different perspectives, evaluate information, and work with new people to develop solutions. I also led training sessions for other students in research, public speaking, debate, and collaborative problem-solving, which pushed me to understand concepts well enough to explain them to others. Those experiences taught me that growth comes from being willing to ask questions, adapt your thinking, and learn from the people around you.\n\nThat is one of the reasons I am interested in Rem on Campus. I see consulting as an opportunity to continue developing my business knowledge while learning how to approach problems from different perspectives, communicate effectively, and create solutions that help real people and businesses. Making an impact through the work I do is important to me, and I believe developing a strong foundation of intellectual growth will help me make a greater impact in the future.","careerInterests":"Consulting, Investment Banking / Finance, Marketing, Brand Strategy, Data Analytics / Business Intelligence, Entrepreneurship / Startups, Product Management, Undecided / Exploring Options","howRemHelps":"As a freshman, I am still exploring different career paths, which is why I selected several areas that interest me. However, I believe consulting provides skills that can be valuable across almost any career. Strong problem-solving, communication, analytical, and interpersonal skills are useful whether I eventually pursue consulting, finance, entrepreneurship, or another area of business.\n\nWhat especially interests me about Rem on Campus is the opportunity to gain tangible experience by working with real businesses and understanding the challenges they face. My experience at my family's construction business showed me that running a business involves much more than having a good idea. There are constantly problems to solve, decisions to make, and different priorities to balance. Being able to learn from real business owners and understand both their successes and struggles would give me a perspective that I cannot get from a classroom alone. My experience leading Young Investors Society also taught me how much I enjoy analyzing information, making decisions, and helping others develop their own understanding of business and investing.\n\nI also want to surround myself with driven, like-minded people who will challenge me to keep improving. I believe Rem on Campus would give me the experience, relationships, and foundation to explore my interests while developing skills I can carry into whatever career I ultimately choose.","position":"Junior Consulting Strategist","skills":"Business Strategy, Statistics and modelling, Web design, Data analysis, Marketing and analytics, Social media management, Finance and accounting, Communications and copy-writing, Design Thinking","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/1/2026 16:09:43","spokeTo":"Christian, Adam, Eli"}],"infoSession":null,"meetMembers":null}},{"id":"a42_482869d4","timestamp":"9/2/2026 16:39:31","name":"Lydia Day","email":"lydia.day@ufl.edu","phone":"8504019981","gender":"Female","race":"Asian or Asian American","linkedin":"https://www.linkedin.com/in/lydia-day-76a82a289/","resume":"https://drive.google.com/open?id=1og1h8d6Kd-8hMliMOiUPBq7nbBg7A3cv","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Advertising","minor":"Other","gpa":"3.87","whyRem":"I want to be a member of Rem on Campus because I am looking to get more involved in the Gainesville community beyond just classes. I have experience from high school working with local organizations in my hometown community. For these organizations, I helped run their social media and promote their mission and values at outreach events. Similarily, I am interested in helping Gainesville organizations, but with more of the business focus in order to develop my skills in business and deepen my strategic communication skills.","coreValue":"Empathy","valueEssay":"Empathy stands out to me because it is a quality that I have developed throughout my whole life. I was born with a bilateral arm limb difference, so I have always tried to put myself in other people's shoes because I always appreciate when people approach me with empathy. Having this skill has also helped me in my professional journey, not just my personal one. I have been able to collaborate with teammates, connect with professionals, and problem-solve more effectively by keeping empathy in mind.","careerInterests":"Marketing, Brand Strategy, Data Analytics / Business Intelligence, Product Management, Non-Profit / Social Impact, Undecided / Exploring Options","howRemHelps":"I believe joining Rem on Campus will help me achieve my career goals because working directly with Gainesville organizations to build their brands and businesses requires these skills. One of the main skills I hope to get out of Rem on Campus is developing strategic communication. Part of strategic communication is having a plan of action to promote specific program values to create a certain outcome. By gaining hands-on experience working with businesses, I will be able to develop this skill and expand my other skills in partnership and communication.","position":"Junior Consulting Strategist","skills":"Photography, Social media management, Brand Development","accommodations":"N/A","other":"Last week, I switched my major from Environmental Science to Advertising, which is why my LinkedIn profile may not have that updated information.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a43_6ada3662","timestamp":"9/2/2026 18:59:44","name":"Sarah Yan","email":"sarah.yan@ufl.edu","phone":"3527271237","gender":"Female","race":"Asian or Asian American","linkedin":"www.linkedin.com/in/sarahyan1","resume":"https://drive.google.com/open?id=1xK9-ZOVqHfumj16iQHqwnfHMC4SrEvkY","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"","gpa":"3.89","whyRem":"I am interested in joining REM because I want to be involved in a group of like-minded individuals with the same interests and goals as me. There are so many sectors of finance to explore, and I feel like consulting is definitely one of the ones I am most interested in. I hope to gain the knowledge and experience necessary for interviews and internships, which I’ve learned a lot about through the recruitment events. In return, I can bring experience in problem-solving and teaching people who may be unfamiliar with certain concepts. For example, in high school, I was involved in the Special Olympics organization, where I brought my experience in tennis to children who had mental or physical disabilities that affected their learning process. I had to experiment with different teaching techniques to find one that was most effective, and I believe I can translate these skills into REM.","coreValue":"Community","valueEssay":"Community is a value that stands out to me because I think it's the most important thing that one can have. I am who I am today as a result of the communities that have surrounded me in my life, and I think that goes for a lot of people. In my personal life, one of the biggest communities I had was my tennis community, especially through Special Olympics. I bonded with so many people of all different abilities and talents, and the diversity within our community is what made it so uplifting. So many people I've met through Special Olympics have shaped me into who I am today, and I know I've been a part of a community that has changed other people's lives. As a Gainesville native, I've also had a chance to interact with many of the small businesses in our town and their communities. For example, I worked at Volcanic Sushi + Sake, a local sushi restaurant, from my sophomore year in high school to now, my freshman year in college. The community of people I've met there has shaped my professional journey in countless ways, and the skills I've learned within my community have helped my professional development.","careerInterests":"Consulting, Investment Banking / Finance, Tech, Data Analytics / Business Intelligence, Entrepreneurship / Startups, Non-Profit / Social Impact","howRemHelps":"I believe Rem on Campus will help me achieve my career goals by equipping me with the skills necessary to stand out in these positions. The hands-on experience that Rem brings through local small businesses will not only prepare me for working with bigger companies in the future, but also with professional communication, which is necessary in all of the career goals I selected. Rem allows students to apply what they know instead of just learning passively, which is essential for my career goals.","position":"Consulting Strategist","skills":"Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Business Strategy, Statistics and modelling, Marketing and analytics, Videography, Photography, Social media management, Finance and accounting, Microsoft Office Suite, Ads (Facebook/Instagram)","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a44_623eb86c","timestamp":"9/2/2026 19:26:09","name":"Matt Goodman","email":"matthewgoodman@ufl.edu","phone":"4846785269","gender":"Male","race":"White or Caucasian","linkedin":"www.linkedin.com/in/matt-goodman-842728399","resume":"https://drive.google.com/open?id=1ANJi7nuQA7Cyha5TvZivOZBPFFgqTp4a","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"","gpa":"3.93","whyRem":"Rem will provide me with the perfect opportunity to further develop my passion for consulting using real client work with actual businesses, as well as technical and development assistance from other experienced student members. The mission of Rem on Campus, creating an actual impact on local small businesses, is something that I am passionate about and have already begun to do. I believe that I will bring my skills as an emotionally intelligent leader and power to efficiently and confidently communicate with the Rem strategist team. I have already begun to develop my leadership in the business world by working as a data analyst and learning as a mentee through FLA, as well as putting the leadership into practice this past summer working as a math teacher at a local charter school. Through Rem, I hope to apply this leadership and further develop skills necessary for consulting success through learning from team leads and successes and failures from working on real tasks with client companies. Rem offers me the perfect platform to grow as a leader and put my passion for consulting and community service into practice.","coreValue":"Community","valueEssay":"Community stands out to me because I have seen firsthand how a strong sense of belonging can turn individual accomplishments into shared successes.\nDuring my time as a math instructor at a charter school in Wilmington, Delaware, I taught algebra and precalculus to over 100 high school students recovering credits from previously failed courses while supervising volunteer tutors. I leveraged my role to take charge of creating an end-of-summer showcase to give students an opportunity to celebrate their progress with their families. Recognizing that students took pride in different areas, I tailored the event to highlight their individual achievements. Math and science students presented projects; theater students performed; culinary students displayed their dishes, and the day concluded with a student-versus-staff kickball game. Students were excited to showcase their accomplishments, while parents came to the school to see firsthand the progress their children had made. \nWitnessing the shared joy and pride between our staff, the students, and their families showed me that achievement becomes even more meaningful when it is shared and celebrated by a community. Many of the students had entered the summer after experiencing academic setbacks, but the showcase gave them the opportunity to be recognized not for their past struggles, but for what they had accomplished.\nThat experience shaped the way I think about community. To me, community is more than simply being part of a group; it means creating an environment where people feel supported, valued, and invested in one another’s success. Whether in the classroom or in a professional setting, I want to contribute to communities where people with different strengths and experiences can learn from one another and take pride in what they accomplish together. That is why community resonates most strongly with me among Rem and Company’s core values.","careerInterests":"Consulting, Investment Banking / Finance","howRemHelps":"While consulting stands as my top choice for my desired career path, I still have not ruled out other paths in the business world, like those in wealth management/finance.\nFor my goal of consulting, the REM strategist structure will give me a key opportunity to develop skills that are difficult to gain solely in the classroom. Working through open-ended client problems would strengthen my ability to analyze information, structure and dissect ambiguous problems, communicate recommendations, and collaborate with a team toward a practical solution. Just as importantly, receiving feedback from team leads and interacting with actual clients would help me become more confident presenting ideas and interacting with executives and higher-ups in the business world.\nThese experiences would also translate well to a career in finance. Both consulting and finance require strong analytical thinking, attention to detail, communication, and the ability to understand how businesses make decisions. Exposure to different companies and their challenges would allow me to better understand how factors such as strategy and operations affect finances, as well as learning what the best solutions are keeping margins in mind.\nUltimately, I see REM as an opportunity not only to prepare myself for consulting, but also to build a versatile business skill set and gain the experience necessary to make a more informed decision about my long-term career path.","position":"Junior Consulting Strategist, Consulting Strategist","skills":"Statistics and modelling, Data analysis, Finance and accounting, Microsoft Office Suite","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/3/2026 18:00:08","spokeTo":"Eli Koon"}],"infoSession":{"timestamp":"9/3/2026 22:01:38","session":"09/03","appliedBefore":"No"},"meetMembers":null}},{"id":"a45_fc728345","timestamp":"9/2/2026 21:37:19","name":"Sabrina Dong","email":"sabrina.dong@ufl.edu","phone":"2397446211","gender":"Female","race":"Asian or Asian American","linkedin":"www.linkedin.com/in/sabrinaadong","resume":"https://drive.google.com/open?id=1k719wcAc3VgfwZ61PKGuHYQPKdwiRxdp","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Business Administration","minor":"","gpa":"3.5","whyRem":"I have always been someone who asks, “Why?” Why do people make certain decisions? What makes one solution better than another? And, most importantly, how can I better understand the world around me? I truly enjoy learning and am constantly looking for opportunities to challenge myself and grow. I have learned that some of my greatest growth comes from being around people who think differently than I do and pushing myself outside of what is comfortable. That is what draws me to Rem. I want to be part of a community where I can learn from others, challenge my own thinking, and grow alongside people who are just as curious and driven. I would bring that same curiosity, hard work, and authenticity to Rem on Campus. I take what I do seriously, but I also value the people, relationships, and experiences that make the journey meaningful.","coreValue":"Resilience","valueEssay":"Resilience is the core value that resonates with me most because I believe growth is not about being the smartest person in the room; it is about being willing to keep learning when you are not. Everyone starts from a different place and grows at a different pace, and I have learned not to compare my progress to the people around me. There have been times when I have felt behind or unsure of myself, but instead of letting that discourage me, I use it as motivation to work harder, ask questions, and improve. To me, resilience means being willing to keep showing up, even when something does not come naturally or success does not happen immediately. Hard work and persistence can't guarantee that I will be the best, but they took me farther than I expected every time. I value resilience because it reminds me that growth is not about how quickly you get there, but your willingness to keep moving forward.","careerInterests":"Consulting, Marketing","howRemHelps":"Joining Rem would help me build the skills I hope to use in both consulting and marketing. I am especially interested in learning how to understand a client’s needs, communicate ideas clearly, and build relationships that create trust. I believe strong solutions are not just about having the right answer, but understanding the people you are working with and knowing how to effectively communicate and convey that answer. Through Rem, I hope to become more confident in persuasion, problem-solving, and working hands-on with clients while learning how to adapt my communication to different people and situations. These are skills I can carry into both consulting and marketing, where understanding people and the environment is just as important as understanding the problem. I see Rem as an opportunity to develop these skills through real experiences while gaining a better understanding of the type of professional I want to become.","position":"Junior Consulting Strategist","skills":"Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Marketing and analytics, Photography, Social media management, Communications and copy-writing, Microsoft Office Suite","accommodations":"N/A","other":"Something I hope comes across throughout my application is that I genuinely care about the people I work with. I take my commitments seriously and always want to do my best, but I also believe the relationships you build along the way are just as important. I do not expect myself to know everything, but I always expect myself to keep learning. I will always be willing to put in the work, grow from every experience, and show up for the people around me.","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/1/2026 15:03:14","spokeTo":"Cristi"}],"infoSession":{"timestamp":"9/3/2026 22:01:22","session":"09/03","appliedBefore":"No"},"meetMembers":{"timestamp":"9/2/2026 17:06:23","year":"Sophomore","appliedBefore":"No"}}},{"id":"a46_59a0f88e","timestamp":"9/2/2026 21:53:22","name":"Olivia Shar","email":"oshar@ufl.edu","phone":"9176991511","gender":"Female","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/olivia-shar/","resume":"https://drive.google.com/open?id=1DFeWfZzaBoX7ODOK1Uurc1lGs6pOFQVe","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"Other","gpa":"N/A (freshman)","whyRem":"I want to join REM on Campus because I'm really interested in working with actual organizations, solving real problems, and getting exposure to consulting. I enjoy analytical work but I love the people side of business (like talking to others, understanding what they need, and working through problems with them). I've realized that I'm very engaged when I combine analysis with communication, and REM would give me the opportunity to do that further with hands-on projects. It would also allow me to work alongside students with similar interests.","coreValue":"Intellectual Growth","valueEssay":"Intellectual growth stands out to me because I'm happiest when I'm learning something I didn't understand before and then figuring out how to actually apply it. I've found that I'm drawn to situations where there is a steep learning curve and where I have to ask a lot of questions and learn from people around me. I've experienced this within my professional journey during my internship at Lowy. There, I was exposed to financial modeling and investment analysis that was all very new to me and I liked having to work through unfamiliar concepts until I could contribute. I also interestingly enjoyed being uncomfortable in not knowing as much as others there, because it
