s at competitive conferences. I also interned at my family's construction business, where I was able to see the day-to-day challenges of running a business and experience everything from project coordination and administrative work to seeing how decisions affect real projects and clients.\n\nBeyond the professional experience, I am excited about the community Rem on Campus offers. I am a very social person, and I want to become more involved at UF, meet new people, and surround myself with students who are motivated to improve themselves. I also want to eventually use what I learn to give back to my community. I believe Rem on Campus would be a great place for me to challenge myself, build meaningful relationships, and gain experiences that will help me grow both personally and professionally, regardless of the career path I ultimately pursue.", "coreValue": "Intellectual Growth", "valueEssay": "Intellectual growth stands out to me because I believe some of the most valuable skills you can develop come from constantly challenging yourself to learn something new. As a freshman, I think learning is one of the most important things I can focus on right now, and I want to take advantage of opportunities that push me outside of my comfort zone and allow me to learn from people with different experiences and perspectives.\n\nI experienced this throughout my time in Model United Nations. Every conference required me to learn about issues I was not already familiar with, research different perspectives, evaluate information, and work with new people to develop solutions. I also led training sessions for other students in research, public speaking, debate, and collaborative problem-solving, which pushed me to understand concepts well enough to explain them to others. Those experiences taught me that growth comes from being willing to ask questions, adapt your thinking, and learn from the people around you.\n\nThat is one of the reasons I am interested in Rem on Campus. I see consulting as an opportunity to continue developing my business knowledge while learning how to approach problems from different perspectives, communicate effectively, and create solutions that help real people and businesses. Making an impact through the work I do is important to me, and I believe developing a strong foundation of intellectual growth will help me make a greater impact in the future.\n", "careerInterests": "Consulting, Investment Banking / Finance, Marketing, Brand Strategy, Data Analytics / Business Intelligence, Entrepreneurship / Startups, Product Management, Undecided / Exploring Options", "howRemHelps": "As a freshman, I am still exploring different career paths, which is why I selected several areas that interest me. However, I believe consulting provides skills that can be valuable across almost any career. Strong problem-solving, communication, analytical, and interpersonal skills are useful whether I eventually pursue consulting, finance, entrepreneurship, or another area of business.\n\nWhat especially interests me about Rem on Campus is the opportunity to gain tangible experience by working with real businesses and understanding the challenges they face. My experience at my family's construction business showed me that running a business involves much more than having a good idea. There are constantly problems to solve, decisions to make, and different priorities to balance. Being able to learn from real business owners and understand both their successes and struggles would give me a perspective that I cannot get from a classroom alone. My experience leading Young Investors Society also taught me how much I enjoy analyzing information, making decisions, and helping others develop their own understanding of business and investing.\n\nI also want to surround myself with driven, like-minded people who will challenge me to keep improving. I believe Rem on Campus would give me the experience, relationships, and foundation to explore my interests while developing skills I can carry into whatever career I ultimately choose.\n", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Statistics and modelling, Web design, Data analysis, Marketing and analytics, Social media management, Finance and accounting, Communications and copy-writing, Design Thinking", "accommodations": "", "other": "", "commitment": "Yes", "attendance": {"coffeeChats": [{"timestamp": "2026-09-01T16:09:43.038000", "spokeTo": "Christian, Adam, Eli"}], "infoSession": null, "meetMembers": null}}, {"id": "a42_482869d4", "timestamp": "9/2/2026 16:39:31", "name": "Lydia Day", "email": "lydia.day@ufl.edu", "phone": "8504019981", "gender": "Female", "race": "Asian or Asian American", "linkedin": "https://www.linkedin.com/in/lydia-day-76a82a289/ ", "resume": "https://drive.google.com/open?id=1og1h8d6Kd-8hMliMOiUPBq7nbBg7A3cv", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Advertising", "minor": "Other", "gpa": "3.87", "whyRem": "I want to be a member of Rem on Campus because I am looking to get more involved in the Gainesville community beyond just classes. I have experience from high school working with local organizations in my hometown community. For these organizations, I helped run their social media and promote their mission and values at outreach events. Similarily, I am interested in helping Gainesville organizations, but with more of the business focus in order to develop my skills in business and deepen my strategic communication skills. ", "coreValue": "Empathy", "valueEssay": "Empathy stands out to me because it is a quality that I have developed throughout my whole life. I was born with a bilateral arm limb difference, so I have always tried to put myself in other people's shoes because I always appreciate when people approach me with empathy. Having this skill has also helped me in my professional journey, not just my personal one. I have been able to collaborate with teammates, connect with professionals, and problem-solve more effectively by keeping empathy in mind. ", "careerInterests": "Marketing, Brand Strategy, Data Analytics / Business Intelligence, Product Management, Non-Profit / Social Impact, Undecided / Exploring Options", "howRemHelps": "I believe joining Rem on Campus will help me achieve my career goals because working directly with Gainesville organizations to build their brands and businesses requires these skills. One of the main skills I hope to get out of Rem on Campus is developing strategic communication. Part of strategic communication is having a plan of action to promote specific program values to create a certain outcome. By gaining hands-on experience working with businesses, I will be able to develop this skill and expand my other skills in partnership and communication.", "position": "Junior Consulting Strategist", "skills": "Photography, Social media management, Brand Development", "accommodations": "N/A", "other": "Last week, I switched my major from Environmental Science to Advertising, which is why my LinkedIn profile may not have that updated information. ", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a43_6ada3662", "timestamp": "9/2/2026 18:59:44", "name": "Sarah Yan", "email": "sarah.yan@ufl.edu", "phone": "3527271237", "gender": "Female", "race": "Asian or Asian American", "linkedin": "www.linkedin.com/in/sarahyan1", "resume": "https://drive.google.com/open?id=1xK9-ZOVqHfumj16iQHqwnfHMC4SrEvkY", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Finance", "minor": "", "gpa": "3.89", "whyRem": "I am interested in joining REM because I want to be involved in a group of like-minded individuals with the same interests and goals as me. There are so many sectors of finance to explore, and I feel like consulting is definitely one of the ones I am most interested in. I hope to gain the knowledge and experience necessary for interviews and internships, which I\u2019ve learned a lot about through the recruitment events. In return, I can bring experience in problem-solving and teaching people who may be unfamiliar with certain concepts. For example, in high school, I was involved in the Special Olympics organization, where I brought my experience in tennis to children who had mental or physical disabilities that affected their learning process. I had to experiment with different teaching techniques to find one that was most effective, and I believe I can translate these skills into REM. ", "coreValue": "Community", "valueEssay": "Community is a value that stands out to me because I think it's the most important thing that one can have. I am who I am today as a result of the communities that have surrounded me in my life, and I think that goes for a lot of people. In my personal life, one of the biggest communities I had was my tennis community, especially through Special Olympics. I bonded with so many people of all different abilities and talents, and the diversity within our community is what made it so uplifting. So many people I've met through Special Olympics have shaped me into who I am today, and I know I've been a part of a community that has changed other people's lives. As a Gainesville native, I've also had a chance to interact with many of the small businesses in our town and their communities. For example, I worked at Volcanic Sushi + Sake, a local sushi restaurant, from my sophomore year in high school to now, my freshman year in college. The community of people I've met there has shaped my professional journey in countless ways, and the skills I've learned within my community have helped my professional development.", "careerInterests": "Consulting, Investment Banking / Finance, Tech, Data Analytics / Business Intelligence, Entrepreneurship / Startups, Non-Profit / Social Impact", "howRemHelps": "I believe Rem on Campus will help me achieve my career goals by equipping me with the skills necessary to stand out in these positions. The hands-on experience that Rem brings through local small businesses will not only prepare me for working with bigger companies in the future, but also with professional communication, which is necessary in all of the career goals I selected. Rem allows students to apply what they know instead of just learning passively, which is essential for my career goals.", "position": "Consulting Strategist", "skills": "Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Business Strategy, Statistics and modelling, Marketing and analytics, Videography, Photography, Social media management, Finance and accounting, Microsoft Office Suite, Ads (Facebook/Instagram)", "accommodations": "", "other": "", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a44_623eb86c", "timestamp": "9/2/2026 19:26:09", "name": "Matt Goodman", "email": "matthewgoodman@ufl.edu", "phone": "4846785269", "gender": "Male", "race": "White or Caucasian", "linkedin": "www.linkedin.com/in/matt-goodman-842728399", "resume": "https://drive.google.com/open?id=1ANJi7nuQA7Cyha5TvZivOZBPFFgqTp4a", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Finance", "minor": "", "gpa": "3.93", "whyRem": "Rem will provide me with the perfect opportunity to further develop my passion for consulting using real client work with actual businesses, as well as technical and development assistance from other experienced student members. The mission of Rem on Campus, creating an actual impact on local small businesses, is something that I am passionate about and have already begun to do. I believe that I will bring my skills as an emotionally intelligent leader and power to efficiently and confidently communicate with the Rem strategist team. I have already begun to develop my leadership in the business world by working as a data analyst and learning as a mentee through FLA, as well as putting the leadership into practice this past summer working as a math teacher at a local charter school. Through Rem, I hope to apply this leadership and further develop skills necessary for consulting success through learning from team leads and successes and failures from working on real tasks with client companies. Rem offers me the perfect platform to grow as a leader and put my passion for consulting and community service into practice.", "coreValue": "Community", "valueEssay": "Community stands out to me because I have seen firsthand how a strong sense of belonging can turn individual accomplishments into shared successes.\nDuring my time as a math instructor at a charter school in Wilmington, Delaware, I taught algebra and precalculus to over 100 high school students recovering credits from previously failed courses while supervising volunteer tutors. I leveraged my role to take charge of creating an end-of-summer showcase to give students an opportunity to celebrate their progress with their families. Recognizing that students took pride in different areas, I tailored the event to highlight their individual achievements. Math and science students presented projects; theater students performed; culinary students displayed their dishes, and the day concluded with a student-versus-staff kickball game. Students were excited to showcase their accomplishments, while parents came to the school to see firsthand the progress their children had made. \nWitnessing the shared joy and pride between our staff, the students, and their families showed me that achievement becomes even more meaningful when it is shared and celebrated by a community. Many of the students had entered the summer after experiencing academic setbacks, but the showcase gave them the opportunity to be recognized not for their past struggles, but for what they had accomplished.\nThat experience shaped the way I think about community. To me, community is more than simply being part of a group; it means creating an environment where people feel supported, valued, and invested in one another\u2019s success. Whether in the classroom or in a professional setting, I want to contribute to communities where people with different strengths and experiences can learn from one another and take pride in what they accomplish together. That is why community resonates most strongly with me among Rem and Company\u2019s core values.\n", "careerInterests": "Consulting, Investment Banking / Finance", "howRemHelps": "While consulting stands as my top choice for my desired career path, I still have not ruled out other paths in the business world, like those in wealth management/finance.\nFor my goal of consulting, the REM strategist structure will give me a key opportunity to develop skills that are difficult to gain solely in the classroom. Working through open-ended client problems would strengthen my ability to analyze information, structure and dissect ambiguous problems, communicate recommendations, and collaborate with a team toward a practical solution. Just as importantly, receiving feedback from team leads and interacting with actual clients would help me become more confident presenting ideas and interacting with executives and higher-ups in the business world.\nThese experiences would also translate well to a career in finance. Both consulting and finance require strong analytical thinking, attention to detail, communication, and the ability to understand how businesses make decisions. Exposure to different companies and their challenges would allow me to better understand how factors such as strategy and operations affect finances, as well as learning what the best solutions are keeping margins in mind.\nUltimately, I see REM as an opportunity not only to prepare myself for consulting, but also to build a versatile business skill set and gain the experience necessary to make a more informed decision about my long-term career path.", "position": "Junior Consulting Strategist, Consulting Strategist", "skills": "Statistics and modelling, Data analysis, Finance and accounting, Microsoft Office Suite", "accommodations": "", "other": "", "commitment": "Yes", "attendance": {"coffeeChats": [{"timestamp": "2026-09-03T18:00:08.073000", "spokeTo": "Eli Koon"}], "infoSession": null, "meetMembers": null}}, {"id": "a45_fc728345", "timestamp": "9/2/2026 21:37:19", "name": "Sabrina Dong", "email": "sabrina.dong@ufl.edu", "phone": "2397446211", "gender": "Female", "race": "Asian or Asian American", "linkedin": "www.linkedin.com/in/sabrinaadong", "resume": "https://drive.google.com/open?id=1k719wcAc3VgfwZ61PKGuHYQPKdwiRxdp", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Business Administration", "minor": "", "gpa": "3.5", "whyRem": "I have always been someone who asks, \u201cWhy?\u201d Why do people make certain decisions? What makes one solution better than another? And, most importantly, how can I better understand the world around me? I truly enjoy learning and am constantly looking for opportunities to challenge myself and grow. I have learned that some of my greatest growth comes from being around people who think differently than I do and pushing myself outside of what is comfortable. That is what draws me to Rem. I want to be part of a community where I can learn from others, challenge my own thinking, and grow alongside people who are just as curious and driven. I would bring that same curiosity, hard work, and authenticity to Rem on Campus. I take what I do seriously, but I also value the people, relationships, and experiences that make the journey meaningful. ", "coreValue": "Resilience", "valueEssay": "Resilience is the core value that resonates with me most because I believe growth is not about being the smartest person in the room; it is about being willing to keep learning when you are not. Everyone starts from a different place and grows at a different pace, and I have learned not to compare my progress to the people around me. There have been times when I have felt behind or unsure of myself, but instead of letting that discourage me, I use it as motivation to work harder, ask questions, and improve. To me, resilience means being willing to keep showing up, even when something does not come naturally or success does not happen immediately. Hard work and persistence can't guarantee that I will be the best, but they took me farther than I expected every time. I value resilience because it reminds me that growth is not about how quickly you get there, but your willingness to keep moving forward.", "careerInterests": "Consulting, Marketing", "howRemHelps": "Joining Rem would help me build the skills I hope to use in both consulting and marketing. I am especially interested in learning how to understand a client\u2019s needs, communicate ideas clearly, and build relationships that create trust. I believe strong solutions are not just about having the right answer, but understanding the people you are working with and knowing how to effectively communicate and convey that answer. Through Rem, I hope to become more confident in persuasion, problem-solving, and working hands-on with clients while learning how to adapt my communication to different people and situations. These are skills I can carry into both consulting and marketing, where understanding people and the environment is just as important as understanding the problem. I see Rem as an opportunity to develop these skills through real experiences while gaining a better understanding of the type of professional I want to become.", "position": "Junior Consulting Strategist", "skills": "Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Marketing and analytics, Photography, Social media management, Communications and copy-writing, Microsoft Office Suite", "accommodations": "N/A", "other": "Something I hope comes across throughout my application is that I genuinely care about the people I work with. I take my commitments seriously and always want to do my best, but I also believe the relationships you build along the way are just as important. I do not expect myself to know everything, but I always expect myself to keep learning. I will always be willing to put in the work, grow from every experience, and show up for the people around me.", "commitment": "Yes", "attendance": {"coffeeChats": [{"timestamp": "2026-09-01T15:03:13.788000", "spokeTo": "Cristi"}], "infoSession": null, "meetMembers": null}}, {"id": "a46_59a0f88e", "timestamp": "9/2/2026 21:53:22", "name": "Olivia Shar", "email": "oshar@ufl.edu", "phone": "9176991511", "gender": "Female", "race": "White or Caucasian", "linkedin": "https://www.linkedin.com/in/olivia-shar/", "resume": "https://drive.google.com/open?id=1DFeWfZzaBoX7ODOK1Uurc1lGs6pOFQVe", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Finance", "minor": "Other", "gpa": "N/A (freshman)", "whyRem": "I want to join REM on Campus because I'm really interested in working with actual organizations, solving real problems, and getting exposure to consulting. I enjoy analytical work but I love the people side of business (like talking to others, understanding what they need, and working through problems with them). I've realized that I'm very engaged when I combine analysis with communication, and REM would give me the opportunity to do that further with hands-on projects. It would also allow me to work alongside students with similar interests.", "coreValue": "Intellectual Growth", "valueEssay": "Intellectual growth stands out to me because I'm happiest when I'm learning something I didn't understand before and then figuring out how to actually apply it. I've found that I'm drawn to situations where there is a steep learning curve and where I have to ask a lot of questions and learn from people around me. I've experienced this within my professional journey during my internship at Lowy. There, I was exposed to financial modeling and investment analysis that was all very new to me and I liked having to work through unfamiliar concepts until I could contribute. I also interestingly enjoyed being uncomfortable in not knowing as much as others there, because it pushed me to ask better questions and learn more at a faster rate.", "careerInterests": "Consulting, Investment Banking / Finance, Entrepreneurship / Startups, Undecided / Exploring Options", "howRemHelps": "It would help me achieve my career goals by giving me hands-on experience solving real problems for organizations. It would also build both my analytical and communication skills. Since I'm exploring consulting and finance, I think working on projects with actual clients would help me better understand what type of work I enjoy and where my strengths fit best. I'm especially interested in gaining experience communicating with clients directly and working through problems. Collaborating with a team to work on finding solutions also excites me. REM would also help me see what consulting actually looks like and give me a better sense of whether I want to pursue it long term.", "position": "Junior Consulting Strategist", "skills": "Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Business Strategy, Data analysis, Marketing and analytics, Photography, Social media management, Finance and accounting, Microsoft Office Suite, E-commerce, Brand Development", "accommodations": "N/A", "other": "N/A", "commitment": "Yes", "attendance": {"coffeeChats": [{"timestamp": "2026-09-03T17:31:51.620000", "spokeTo": "Adam, Hannah, Lexi, Ollie, Robert, Brody"}], "infoSession": null, "meetMembers": null}}, {"id": "a47_8388fe9b", "timestamp": "9/2/2026 23:52:10", "name": "Luke Corbin ", "email": "lukecorbin50@gmail.com", "phone": "5167137370", "gender": "Male", "race": "White or Caucasian", "linkedin": "https://www.linkedin.com/in/luke-tyler-corbin?utm_source=share_via&utm_content=profile&utm_medium=member_ios", "resume": "https://drive.google.com/open?id=1RNmlXdMChLXieIDEVVrA2geg-FCRWx4J", "university": "University of Florida", "gradYear": "2028", "classYear": "Junior", "major": "Finance", "minor": "Other", "gpa": "3.2", "whyRem": "I want to be a member of REM on Campus because I\u2019m interested in gaining more exposure to the real estate industry and connecting with other students who share that interest. As a finance major, I think REM would give me the opportunity to learn more about real estate investing, development, and different career paths within the industry. I also want to build relationships with professionals and other members while becoming more involved on campus. Most importantly, I\u2019m excited to learn, contribute to the organization, and gain experience that will help me in my future career.", "coreValue": "Innovation", "valueEssay": "Innovation stands out to me because I believe growth comes from being willing to think differently and look for better ways to solve problems. Whether in school, my past work experiences, or my involvement in different organizations, I\u2019ve always enjoyed finding new approaches instead of simply doing things the way they have always been done. As a finance student, innovation is especially important to me because industries like finance and real estate are constantly changing. I want to continue developing a mindset that allows me to adapt, think creatively, and bring new ideas to the people and organizations I work with.", "careerInterests": "Investment Banking / Finance, Entrepreneurship / Startups", "howRemHelps": "Joining REM on Campus would help me achieve my career goals by giving me more exposure to the finance and business world outside of the classroom. I\u2019m interested in pursuing a career in investment banking or finance, while also having an interest in startups and entrepreneurship. REM would give me the opportunity to learn from professionals, connect with students who have similar goals, and gain a better understanding of different industries and career paths. I also think being surrounded by motivated and ambitious people would push me to grow professionally and help me build skills and relationships that will be valuable throughout my career.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Web design, Data analysis, Marketing and analytics, Search Engine Optimization (SEO), Social media management, Finance and accounting, Microsoft Office Suite, E-commerce, Brand Development", "accommodations": "No!", "other": "I would just add that I\u2019m someone who is always looking for opportunities to learn and challenge myself. I\u2019m excited to gain hands-on experience, meet people with different perspectives, and contribute wherever I can. I\u2019m very motivated when it comes to my career, and I believe REM would be a great opportunity for me to continue developing both personally and professionally.", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a48_8fc90a9f", "timestamp": "9/2/2026 2:02:44", "name": "Calvin Zou", "email": "calvinzou08@gmail.com", "phone": "908-274-6836", "gender": "Male", "race": "Asian or Asian American", "linkedin": "www.linkedin.com/in/calvin-zou", "resume": "https://drive.google.com/open?id=1f8Gj2iVNXQUfGt7Ia4ALtTMk8etmRI4H", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Finance", "minor": "", "gpa": "N/A for College 4.9/5.3 for Highschool", "whyRem": "There are two main reasons why I want to be part of Rem On Campus. The first one is a bit basic, but I want more team-building experience and to join a community of people who have similar interests as me. I also want to branch out and learn more about completely different businesses so I can become more versatile and be able to adapt to different situations in the future.\n\nThe second reason is a bit more personal to me. I really like the idea of helping out small businesses and organizations. Where I\u2019m from in Warren, New Jersey, we have a local farm called Wagner Farm. The farm has been in an ongoing battle with the town\u2019s planning committee over plans to shut it down and build townhomes.  did not really think much of it, but during the summer after my freshman year they had a volunteering opportunity at the farm. I needed community service hours, so I decided to go. Volunteering there ended up being an amazing experience. I learned how to plant crops and stakes, package goods, manage composting bins, top off soil, and basically do a lot of the work a farmhand would do. It was really cool getting to learn things I probably would have never experienced otherwise.The best part, though, was the people. Wagner Farm has been passed down for multiple generations, and seeing how dedicated the farmers were to keeping it going was genuinely inspiring. I saw how hard they worked, and it was also clear that they were not just doing it for money. Around 50% of the produce from the farm is donated to people in need. Seeing people be that passionate about something while also doing something good for the community really stuck with me.\n\nThat is one of the biggest reasons why Rem On Campus interests me. Like you guys mentioned during the info session, for some small businesses and organizations, this is their livelihood and a mission they really care about. Back then, I could only really help Wagner Farm through physical labor. With Rem On Campus, I hope I can build the skills to help organizations like these in a bigger and more meaningful way.\nP.S they have been fighting a legal battle for like over 4 years about this(link to website: https://conservationwarren.org/history/)", "coreValue": "Resilience", "valueEssay": "Resilience stands out to me because I think a lot of growth comes from being able to adapt when things do not go as planned. I see this through a lot of people in my life, whether it is the farmers at Wagner Farm working hard to keep their farm from being torn down or my parents immigrating from a completely different continent, China, and starting a new life. All of them had to adapt in order to continue surviving and growing, whether that meant becoming the people they are today or keeping something they care deeply about alive.\n\nIn my own professional journey, I experienced this through the clubs I was involved in during high school, especially when it came to fundraising. As treasurer of my computer science club, I was rejected multiple times by businesses when asking them to sponsor our annual event. My first year as treasurer, though I do not like to admit it, was pretty abysmal. We only had around 15 attendees, and I managed to raise just $150, nowhere near enough for what we wanted the event to be. However, I was given another chance the next year and did not want to repeat the same mistakes. I changed my approach, looked at what did not work the year before, and became much more persistent when reaching out to businesses. By my senior year, I was able to raise over $1,000 and help bring in a record 65 attendees. \n\nThis idea of failure and growth is really cliche but if I just gave up I would have never seen the highs. Resilience is one of the important traits anyone can have when it comes to succeeding.\n", "careerInterests": "Consulting, Investment Banking / Finance, Data Analytics / Business Intelligence, Non-Profit / Social Impact", "howRemHelps": "Rem On Campus will help me achieve my career goals because all the fields I chose require strong problem-solving, communication, adaptability, and analytical skills. At Rem, being placed in unfamiliar situations will force me to become more resilient and comfortable with challenges. I will have to build the confidence and ability to research unfamiliar situations deeply and figure out how to approach them. I will also have the opportunity to work with different people, approach real-life problems from multiple perspectives, and learn how to turn ideas and information into actual solutions. Whatever I eventually choose to pursue, I believe these experiences will help me become someone who can adapt quickly, think critically, and contribute to a team even when I do not immediately know the answer.", "position": "Junior Consulting Strategist", "skills": "Statistics and modelling, Web design, Data analysis, Marketing and analytics, Photography, Python, Design Thinking, Machine Learning", "accommodations": "No", "other": "\nI am fluent in Chinese so I can help gain \"trust\" by speaking a native language for some clients that this skill applies to. I also have some experience running a small business through my friend's watch making business. A lot of my high school EC's had me planning and developing then executing fundraisers, events, etc. so I have some experience in those departments.", "commitment": "Yes", "attendance": {"coffeeChats": [{"timestamp": "2026-09-03T18:56:59.156000", "spokeTo": "Max, Eli, Terren"}], "infoSession": {"timestamp": "2026-09-02T00:21:30.129000", "session": "09/01", "appliedBefore": "No"}, "meetMembers": null}}, {"id": "a49_b672061d", "timestamp": "9/3/2026 10:39:21", "name": "Erik Nanaj", "email": "nanajerik@gmail.com", "phone": "9146895335", "gender": "Male", "race": "White or Caucasian", "linkedin": "https://www.linkedin.com/feed/", "resume": "https://drive.google.com/open?id=1LqrEtse44v4OCsv0Thu94I9hdU5jWo0d", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Business Administration", "minor": "", "gpa": "3.82", "whyRem": "I want to be a member of Rem on Campus to test out a new career I believe I have a passion for, and I believe the community is something to be fond of. I came into school as an exploratory student; now, I am majoring in Business Administration partially because of its versatility, and because I enjoy the communication, teamwork, and administrative aspects of work. One of the most important things I have learned in college is to try everything I can, and I strongly believe that the foundations of consulting, such as problem-solving, are areas where I excel. I want to join Rem because I want to test out if this is a possible career track for me in the future. I am excited for the opportunity to be around other eager students, as I think that will push me to perform even better. Additionally, I will get the opportunity to apply what I have learned in my business classes to something in the real world with local communities. Ultimately, I hope to walk away from Rem with a sharper analytical thinking and a clear vision of my professional future.", "coreValue": "Community", "valueEssay": "The value I have chosen is community. I believe it is the basis of all my personal and professional dream. The idea of urban development, mass transportation, and walkable spaces comes from my conviction that there is an intimate connection between the physical structures we design and the power of the communities that reside within them. During my time at university, where I study business and am considering doing urban planning and real estate, I have been extra focused on learning how to construct, finance, and govern the types of spaces which will bring people together, not tear them apart. In my personal experience, the dedication to building community is what has been motivating me. The organization of a charity basketball game for the Leukemia and Lymphoma Society showed me how important a communal cause can be in unifying an entire neighborhood and making an impact. In more recent times, taking on the position of Assistant Director of Projects for The Big Event and organizing community 5K fundraisers made me understand the value of constructing a community through service work. Whether I try to improve urban infrastructure or motivate my fellow students to take action for a good cause, I am very certain that putting a community first is the best way to achieve anything.", "careerInterests": "Consulting, Non-Profit / Social Impact, Public Policy / Government, Law, Undecided / Exploring Options", "howRemHelps": "White I selected such fields as law, non-profit, public policy, the most accurate choice in my case is undecided. I am still trying to figure out what I would like to do when I graduate. The reason why I find consulting so attractive and why I am interested in Rem on Campus is because it is multidisciplinary. This nature of consulting allows me to do what I like doing the most: solve different kinds of problems. Consulting does not require choosing any industry, and I have to analyze a company from operational, legal and community perspectives, which fits my style of learning. Being an active member of Rem on Campus would help me test myself in a new field and apply my diverse knowledge gained during my studies in solving various problems of small companies. Therefore, it is an amazing environment where I could explore different industries and understand what kinds of problems I like solving. By the end of my time at Rem, I would hope to have decided on what to pursue further in my life, with the lessons I get here being the reason for that decision. ", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Microsoft Office Suite", "accommodations": "", "other": "", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a50_8431e9a0", "timestamp": "9/3/2026 10:56:04", "name": "Conrad Taube", "email": "ctaube@ufl.edu", "phone": "7027882705", "gender": "Male", "race": "White or Caucasian", "linkedin": "www.linkedin.com/in/conrad-taube-104555354", "resume": "https://drive.google.com/open?id=1u6eRuMxXnJWv2eE1F4Fte97qo3Vp8rLD", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Marketing", "minor": "Other", "gpa": "4.56 (In HS, no GPA yet because I am a first year)", "whyRem": "I want to become a member of REM on campus because I believe that helping small businesses grow is extremely important, especially when they might not have the resources to pay for professional consulting. Currently, I work with small businesses in my own company, specifically in the contracting and remodeling niche. So seeing the growth that these people can have is extremely fulfilling. And also working with local businesses allows you to see the impact you make, which is an extremely rewarding process.", "coreValue": "Community", "valueEssay": "I believe that community is extremely important in two ways. One, the community that's within REM is extremely important because it's a place where there's like-minded people, where everyone will help each other grow and succeed. When you have a group of like-minded people who are pushing and striving for the same goal, it inspires you to work even harder. The second part about community is the local community. I believe that REM will help the local community in Gainesville really flourish and allow local small businesses to grow even more than what they ever thought was possible.", "careerInterests": "Consulting, Marketing, Brand Strategy, Entrepreneurship / Startups", "howRemHelps": "I believe joining REM on campus will help me achieve my career goals above because it dips my toes in the waters of my career goals and allows me to see what aspects of business I like, what aspects of business I don't like, and maybe even see some unexpected areas that I wasn't expecting to like or be talented in. But I see more talent in those areas and introduce me to more areas of business. So I think having a well-rounded approach is extremely important and will help me improve in my career goals, skills, as well as opportunities in the future.", "position": "Junior Consulting Strategist", "skills": "Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Business Strategy, Back-end web development, Web design, Marketing and analytics, Search Engine Optimization (SEO), Videography, Photography, Social media management, Communications and copy-writing, HTML, Python, Ads (Facebook/Instagram)", "accommodations": "N/A", "other": "I have a good amount of experience running meta ads and client acquisition systems with back-end web development and front-end design for remodelers. I really enjoy the process of working with local businesses and helping them expand and grow beyond the capabilities that they ever thought was possible. It's an extremely rewarding process. Throughout my time, I've been able to work with numerous remodelers currently and in the past. Helping them grow their businesses is extremely cool to see. It means more with a local company than it does with a big corporate company. That's why I think it's so important for myself to be a part of an organization like this.", "commitment": "Yes", "attendance": {"coffeeChats": [{"timestamp": "2026-09-03T15:47:34.989000", "spokeTo": "Adam K. VP Consulting"}], "infoSession": null, "meetMembers": null}}, {"id": "a51_9b7c21ec", "timestamp": "9/3/2026 12:34:37", "name": "Yvette Deng ", "email": "yiwendeng@ufl.edu", "phone": "3528100881", "gender": "Female", "race": "Asian or Asian American", "linkedin": "NA", "resume": "https://drive.google.com/open?id=1Rv8idBUgkGc0LPOYt-MpUo_hlQ2KYH4B", "university": "University of Florida", "gradYear": "2026", "classYear": "Senior", "major": "Finance", "minor": "", "gpa": "NA", "whyRem": "As an international student who recently arrived in Gainesville, I do not want my understanding of business to remain inside the classroom. I have noticed how closely the city\u2019s caf\u00e9s, restaurants, independent stores, and service businesses are connected to both UF students and long-term residents. I am especially interested in how these businesses differentiate themselves, respond to demand changes throughout the academic year, and use their digital presence to turn first-time visitors into returning customers. I would like to contribute through customer and competitor research and help turn those findings into recommendations an owner can realistically use.\n\nAs a first-year student without formal consulting experience, I am not expecting to enter already knowing how to solve a client\u2019s problem. I want to learn the process carefully, take ownership of a workstream, and gradually become confident enough to communicate directly with clients and eventually guide others.\n\nDebate and Model United Nations taught me how to research complicated issues, compare possible solutions, and develop proposals under uncertainty. However, those solutions usually ended as speeches or simulations. Rem would challenge me to take the next step through producing work that affects a real business and its community. I want my own learning to contribute to someone else\u2019s progress.", "coreValue": "Empathy", "valueEssay": "Empathy stands out to me because I learned that understanding someone should come before trying to solve their problem. As a peer listener at UWC Norway, I once began suggesting ways a student could handle a difficult situation, but their short responses made me realize I was moving too quickly. When I stopped offering advice and asked what they needed from me, they explained that they mainly wanted to speak without feeling judged. That conversation taught me that helping someone begins with listening rather than assuming I already understand.\n\nI believe empathy is equally important in consulting. A small-business owner might describe the problem as low sales, but the deeper challenge could involve limited resources or an unclear target audience. Recommending a solution without understanding the owner\u2019s circumstances could result in an impressive presentation that the client cannot realistically use.\n\nEmpathy would also make me a better teammate. Having studied with student from 90 different country, I know that people may communicate, organize their work, or respond to disagreement differently. Rather than dismissing an approach I do not immediately understand, I try to ask questions and find a way of working that uses everyone\u2019s strengths. As I explore strategy and marketing, I want to combine this mindset with research so I can contribute recommendations that are thoughtful, practical, and responsible.", "careerInterests": "Consulting, Investment Banking / Finance, Marketing", "howRemHelps": "As a first-year student, I do not want to choose a career based only on job descriptions or what I have heard from other people. I want to understand these fields by doing work that resembles what professionals actually do. Rem would give me that opportunity through real client projects.\n\nConsulting is currently my strongest interest because I enjoy examining an unfamiliar problem, organizing information, and helping a team develop a recommendation. At the same time, I am interested in how finance and marketing contribute to that process. Depending on a client\u2019s needs, I could explore questions involving costs, revenue, competitors, customer behavior, or digital strategy. Seeing how these areas connect within one project would help me identify which type of work I find most meaningful.\n\nRem would also help me build skills that are valuable across all three career paths, including structuring an unclear problem, creating data-supported deliverables, communicating with clients, and presenting recommendations confidently. As I progress from Learning to Applying and potentially Leading, I would gain both greater responsibility and a clearer understanding of my professional strengths. By the time I apply for internships, I hope to have more than an interest in these careers but also to have real project experiences that show why I am prepared to pursue them.", "position": "Junior Consulting Strategist", "skills": "Web design, Data analysis, Marketing and analytics, Videography, Photography, Social media management, Finance and accounting, Microsoft Office Suite, Ads (Facebook/Instagram)", "accommodations": "", "other": "I would be ready to commit time, accept feedback, and contribute consistently to my team and client.", "commitment": "Yes", "attendance": {"coffeeChats": [{"timestamp": "2026-09-01T15:10:50.159000", "spokeTo": "Rachel"}], "infoSession": null, "meetMembers": null}}, {"id": "a52_0d7ee2c2", "timestamp": "9/3/2026 13:08:50", "name": "Aashrita Alavala", "email": "Aashritaalavala@ufl.edu", "phone": "9014907836", "gender": "Female", "race": "Indian or Indian American", "linkedin": "www.linkedin.com/in/aashritaalavala", "resume": "https://drive.google.com/open?id=1zSBJ1o0ipRhEr4rUpbLk2pN4ox6OGNoP", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Finance", "minor": "", "gpa": "3.96 Highschool", "whyRem": "I've always wanted to take advantage of opportunities presented to me, whether it be joining a club, taking on a job, or attending a spontaneous event. Things like this have allowed me to step outside my comfort zone and helped me grow not just academically but also personally. With REM on Campus, I recognize it as an important opportunity to build my college career while also giving back to the local community. By being an active member in REM, I hope to gain a skillset that prepares me for real-world application through hands-on experiences working with local businesses and nonprofits. I am interested in combining my ambition with leaning how to build relationships, collaborate with others, and contribute to meaningful change with like-minded individuals. Ultimately, I hope REM challenges me to grow beyond my current understanding of problem-solving and gives me the confidence and perspective to make a positive impact wherever I go. ", "coreValue": "Resilience", "valueEssay": "Throughout my life, I've learned that setbacks are inevitable, but how you respond to them is what actually matters. I know that corporate financial advisory is a demanding field that required hard work, persistence, and the ability to work through difficult problems. Resilience is what keeps you going when things get challenging. To me, it ultimately comes from believing in yourself and trusting that you can work through whatever is in front of you. ", "careerInterests": "Investment Banking / Finance, Public Policy / Government, Law", "howRemHelps": "REM on Campus's commitment to exposing its members to unparalleled resources, ethical leadership, and collaboration will help me grow both professionally and personally. Joining REM would also help me pursue my career interests in investment banking and finance, public policy and government, and law by giving me hands-on experience analyzing problems, developing solutions, and working directly with real clients. I hope to strengthen my financial and analytical skills while also learning how business decisions intersect with policy, regulation, and legal considerations. I especially believe REM's mission because of the program's undeniable impact, demonstrated through its continued success in partnering with small, local family businesses. This mission is particularly meaningful to me beaches my aunt's family restaurant has faced financial and operational challenges that could have benefited from the type of guidance and support REM provides. That personal connection has shown me how valuable it is to have access to people with the knowledge and resources to help business overcome real-world challenges. I believe REM will challenge me to become a more thoughtful, capable, and well-rounded professional while giving me the skills and perspective necessary to pursue my long-term career goals.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Marketing and analytics, Finance and accounting", "accommodations": "N/A", "other": "N/A", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a53_db70a81e", "timestamp": "9/3/2026 13:47:59", "name": "Kristen Colom", "email": "kristen.colom@ufl.edu", "phone": "786-817-7030", "gender": "Female", "race": "Hispanic or Latino", "linkedin": "N/A", "resume": "https://drive.google.com/open?id=1QHKljrHe0vOj1_dlRVHO5cVvyxvQmEXA", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Business Administration", "minor": "", "gpa": "N/A, Highschool GPA 3.8 u.w", "whyRem": "I would love to be a member of Rem on Campus because I\u2019m looking to become more involved on campus and connect with people who share similar values and interests. As a freshman, I think joining Rem would be a great opportunity to grow personally and be part of a supportive community. Having the opportunity to contribute my own ideas and energy while getting more involved in the UF community is extremely important to me.", "coreValue": "Resilience", "valueEssay": "Resilliance stands out to me because throughout life, obstacles will stand in the way of both my personal and professional life and in order to move forward, I need to maintain resilliance. For example, I may not get a job that I worked extremely hard to get, but I cant let that affect my drive to continue finding a job that I would love. While all the other values are also extremely important, none of them would be possible without the ability to overcome problems and be resilient.", "careerInterests": "Consulting, Brand Strategy, Entrepreneurship / Startups, Law, Undecided / Exploring Options", "howRemHelps": "I believe joining Rem on Campus will help me explore the different career paths available within business while connecting with ambitious and like-minded students. Through opportunities to learn from professionals, develop my skills, and build meaningful connections, I hope to gain a better understanding of where my strengths and interests fit within the business world. As someone who is still exploring my long-term career goals, I believe Rem would provide valuable exposure and experiences that will help me grow both professionally and personally.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Social media management", "accommodations": "", "other": "", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a54_56661273", "timestamp": "9/3/2026 14:56:02", "name": "Hayden Veras", "email": "hayden.veras@ufl.edu", "phone": "5613299094", "gender": "Male", "race": "White or Caucasian", "linkedin": "https://www.linkedin.com/in/hayden-veras/", "resume": "https://drive.google.com/open?id=1635XMKZnk8qSOekLqZZGjm40dXyeaZ2Z", "university": "University of Florida", "gradYear": "2028", "classYear": "Junior", "major": "Mathematics", "minor": "Mathematics", "gpa": "3.85", "whyRem": "Through my role as an Instructional Support Assistant, I have come to appreciate the satisfaction that comes with advising and working with others, whether it be assisting professors with course material or learning from my coworkers. Rem on Campus would give me a great opportunity to get involved with helping businesses and to see more of the impact of my work outside of academia. I want to make new friends and expand my network through Rem on Campus, while gaining experience through working with businesses. As a Statistics major, I feel that I could bring a valuable perspective to projects through more technical and quantitative work while also developing my skills in the business realm. I also currently am a part of a statistics capstone course Anheuser-Busch, so I strongly believe I can transfer many skills from the this experience to Rem on Campus.", "coreValue": "Community", "valueEssay": "Community stands out as a value that can bring about these others and more. Having a community of people with similar goals drives everyone to want to improve shared values. As a Statistics major, I feel part of a community in the major. It is not one of the largest majors, so moving through classes has allowed me to make great friends as part of a community of students who want to improve our knowledge of the subject and study for many of the same classes. Furthermore, my role as an Instructional Support Assistant has given me a community of coworkers who are in different fields and stages of their college experience. Hearing about the career and academic goals of others in my communities motivates me to also succeed. I have learned more about many fields and organizations, including consulting, that I may have missed out on were it not for these UF communities.", "careerInterests": "Consulting, Investment Banking / Finance, Tech, Data Analytics / Business Intelligence", "howRemHelps": "Whether it be a career in consulting, finance, tech, or data analytics, these fields all involve some sort of collaboration and an understanding of business functions. Rem on Campus would strengthen my ability to work as part of a team, something that is important to me in my career. Expanding my network through the Rem on Campus community also would allow me to cement myself in these industries, while learning from others' experiences in recruitment or alumni already in the workforce. Also, working on projects with a variety of businesses provides many great talking points for future employers, showcasing my ability to work with business data and make informed decisions. For all four of the interests I selected, I want to be in a position involving data analysis and business decisions, making experience gained through Rem on Campus extremely helpful.", "position": "Junior Consulting Strategist", "skills": "Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), User Experience (UX), Statistics and modelling, Data analysis, HTML, Python, R, Design Thinking, Microsoft Office Suite", "accommodations": "", "other": "", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": {"timestamp": "2026-09-02T00:21:35.039000", "session": "09/01", "appliedBefore": "No"}, "meetMembers": null}}, {"id": "a55_54a13cde", "timestamp": "9/3/2026 16:24:17", "name": "Charlotte Osol", "email": "charlottebosol@gmail.com", "phone": "9179007994", "gender": "Female", "race": "White or Caucasian", "linkedin": "www.linkedin.com/in/charlotte-osol-5a0212386 ", "resume": "https://drive.google.com/open?id=1cRehaIGPcitsJCBmXdKUnuZVoFlCrDTw", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Humanities", "minor": "", "gpa": "3.98 in high school, I have no grades in college yet.", "whyRem": "I want to get directly involved in my community and actually help people instead of joining a club that may help individuals in a less hands on, more abstract manner. Further, I have a personal connection with small businesses because my parents own one in my hometown. Due to this and my enrollment in the marketing academy at my high school, I often helped my parents with marketing and promoting our restaurant.", "coreValue": "Empathy", "valueEssay": "Empathy stands out to me because when it comes to judging local businesses I feel like many people can be very picky and not understanding of how difficult it is to run one. I think that REM\u2019s core value of empathy is most important because to aid businesses one should not be judgmental and should instead approach any issues with empathy and understanding.", "careerInterests": "Consulting, Public Policy / Government, Law", "howRemHelps": "To start off, REM is a student led consulting company so to get hands on experiences with consulting would be an amazing way to get into a real job in a consulting company through the experience of it and networking as well. Further, I am currently a pre-law student with an interest in working in law for some time and transitioning into working for the state department as a diplomat. Working for REM will help develop my problem solving skills that would be essential for working as a diplomat. It may also further my understanding of the inner workings of a business that could be helpful if I work within corporate law.", "position": "Junior Consulting Strategist, Consulting Strategist", "skills": "Marketing and analytics, Search Engine Optimization (SEO), Photography, Social media management", "accommodations": "", "other": "These are the official certifications I earned while enrolled in the International Marketing Academy at Ponte Vedra High School: \nProject Management Certification\nEntrepreneurship and Small Business Certification\nSoft Skills Certification\nDigital Skills Certification\nSocial Media Strategist Certification", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a56_dadf71be", "timestamp": "9/3/2026 16:24:52", "name": "Daniel Burris", "email": "danielburris@ufl.edu", "phone": "9546544774", "gender": "Male", "race": "White or Caucasian", "linkedin": "www.linkedin.com/in/daniel-burris", "resume": "https://drive.google.com/open?id=1iQ9AK6oU5W82Fyvlbej7BiYX-z3tVa52", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Finance", "minor": "Economics", "gpa": "3.92", "whyRem": "I want to become a member of Rem on Campus because I want to experience what it is like to solve problems that exist outside of a classroom or competition. I have always enjoyed figuring out why a business makes certain decisions and how they weigh their options, which is what initially drew me toward consulting. However, most of my experience so far has been focused on hypothetical situations. REM\u2019s opportunity to work directly with real businesses and develop recommendations for real business challenges excites me.\nI am also interested in REM\u2019s \u201cLearning, Applying, Leading\u201d structure. As someone still early in my college career, I see a lot of value in learning from students with more experience and applying those skills through meaningful client work. Over time, I hope to use these skills to become someone who can contribute to and eventually lead a team through challenging problems. I am not looking to join REM just to add something to my resume. I want to push myself, ask questions, contribute to local businesses, and develop the confidence required to approach unfamiliar problems.", "coreValue": "Empathy", "valueEssay": "Empathy stands out to me because I believe the way you treat and understand others has a major impact on the relationships you build. Growing up, my mom often told me that empathy was one of my strongest qualities, and I have come to realize how important it is for understanding other people's perspectives. I saw this firsthand while working as a private algebra tutor in high school. I learned that knowing how to solve a problem didn\u2019t always mean I knew how to explain it in a way that someone else could understand. I had to put myself in my student\u2019s shoes to recognize where they were struggling and adjust the way I communicated based on their perspective.\nThis is also why I see empathy as valuable in almost any situation, since it allows me to consider viewpoints outside of my own. Whether I am working with a teammate, client, or business owner, understanding their point of view can help me communicate more effectively, build stronger relationships, and approach problems in a way that I may not have considered on my own.", "careerInterests": "Consulting, Investment Banking / Finance, Marketing, Data Analytics / Business Intelligence, Undecided / Exploring Options", "howRemHelps": "One of my main career goals right now is to gain meaningful internship experience while continuing to explore where my interests and strengths can take me in the business world. Joining Rem on Campus would expose me to real businesses and challenges that I have not had the opportunity to experience yet. Working through different types of problems would help me better understand the work I find most interesting and where my skills are most valuable.\nBeyond my immediate internship goals, I eventually want to take on a role where I am trusted to make important decisions and contribute valuable ideas. REM would give me the opportunity I need to develop my abilities by working through unfamiliar problems, collaborating with a team, and contributing to work that has a real impact on businesses. The skills, relationships, and experiences I gain through that process would prepare me for both my future internships and my larger career goals in Finance.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Marketing and analytics, Finance and accounting, Microsoft Office Suite", "accommodations": "", "other": "One thing I would like to add is that I genuinely enjoy challenging myself and learning things that are unfamiliar to me. In the past, I have taken difficult classes and explored subjects beyond what was required simply because I wanted to learn more. I also value being coachable and am always open to feedback, different perspectives, and opportunities to improve.", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a57_7fb0a1c0", "timestamp": "9/3/2026 16:26:41", "name": "Keerti Patil", "email": "patil.keerti@ufl.edu", "phone": "4074175758", "gender": "Female", "race": "Indian or Indian American", "linkedin": "https://www.linkedin.com/in/keerti-patil-8a7560342/", "resume": "https://drive.google.com/open?id=1igAeA-3N8OEMRsMLsKfCq5WP2lCU-Zwn", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Computer Science / Information Systems", "minor": "", "gpa": "4", "whyRem": "I want to be a member of Rem on campus in order to meet new people and build a community of like-minded students that can guide me on my career path. Being a member of Rem would help me build my skillset, as well as gain experience with real world scenarios and projects. I also want to build lasting relationships with driven peers and mentors, and I also want to learn new information about the field of consulting. Overall, I want to improve myself through Rem in order to contribute my knowledge to the team and make an impact. ", "coreValue": "Innovation", "valueEssay": "Innovation stands out to be because of its importance in our future. As time progresses, technology is increasingly becoming more advanced, and its significance on the corporate world will only continue to rise. Innovation is what created new opportunities and built humanity, improving our global standard of living today. I view innovation as not just a tool for inventing new products, but a critical value that will improve problem solving and navigate organizations in the future evolutionary marketplace.", "careerInterests": "Consulting, Brand Strategy, Tech, Data Analytics / Business Intelligence, Entrepreneurship / Startups, Product Management", "howRemHelps": "Joining Rem on Campus will help me meet like-minded people and network with members that have experience, which can allow me to build relationships with people that can guide my future career path. I also believe that Rem on Campus will help me learn more about consulting, and build the skillset that is necessary to thrive in the field. I would love to be a part of Rem and contribute my efforts to the organization, so that I gain knowledge and experience that I can apply to the real world one day.", "position": "Junior Consulting Strategist", "skills": "Mobile development, Web design, Videography, Photography, Social media management, Ads (Facebook/Instagram)", "accommodations": "None", "other": "N/A", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a58_9e3ae33a", "timestamp": "9/3/2026 16:26:49", "name": "Gaby Triana", "email": "gabriella.triana@ufl.edu", "phone": "3059030334", "gender": "Female", "race": "Hispanic or Latino", "linkedin": "www.linkedin.com/in/gabriella-triana-00570a3a7", "resume": "https://drive.google.com/open?id=1XmudyGoSAojyek-etKBSYlJd8mI8NcR7", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Business Administration", "minor": "", "gpa": "3.31", "whyRem": "\n     I\u2019ve been taught my whole life that the most meaningful experiences are the ones where you leave something and/or someone better than you found them. During the rest of my college experience, that is the kind of impact I want to make and that is why I want to be a member of Rem on Campus. \n     Before college, I was involved in clubs and organizations and even had the opportunity to start my own nonprofit service organization. While building it, I experienced firsthand how difficult it can be to turn an idea into something that can grow beyond your immediate community. There were so many moments when I wished I had someone with experience in consulting or business who I could reach out to for guidance. Someone who could help me think bigger, identify opportunities, and figure out how to expand the organization's impact. That experience made me realize just how valuable it is to have people who are willing to share their knowledge and help others turn their ideas into something greater \n     That is one of the reasons Rem on Campus stands out to me. I want to be able to provide that kind of value to others while also learning how to do it myself. Since I am still exploring my exact career path, gaining exposure to consulting and working with businesses across different industries would give me valuable experiences while helping me discover where my interests and strengths truly align. I hope to develop practical skills, gain knowledge from experienced people, and learn how to approach real-world problems from different perspectives.\n     Most importantly, I want my college experience to be about more than just what I can accomplish for myself. I want to be part of something bigger than myself, just as I was through the organizations and nonprofit work I was involved in before college. I want to contribute to the success of others, help businesses and organizations reach goals that may feel out of reach, and surround myself with people who are equally motivated to make an impact. I see Rem on Campus as an opportunity to continue serving others while challenging myself, discovering my career path, and becoming the kind of person I once wished I had in my own corner. \n", "coreValue": "Community", "valueEssay": " I truly believe that I am a product of the communities that have invested in me. From my family, to my teams, to the people I\u2019ve met at UF, the support and experiences I\u2019ve gained from others have shaped who I am today. Therefore, community stands out to me because it represents not only having people around you, but growing together, supporting one another, and creating an environment where everyone can succeed.          \n\n     Community has also shaped how I understand the other core values. Through sports and dance, I learned resilience by facing challenges with teammates and pushing each other to improve. Attending an all-girls school and serving on student council taught me empathy and the importance of understanding different perspectives. Because my council members and I were so close, we were comfortable giving and receiving constructive criticism, which helped us solve problems and grow together. Working as a team also encouraged innovation by bringing different ideas together, while being surrounded by people who challenged me contributed to my intellectual growth and taught me to always remain open to learning.\n     Coming to UF has reinforced how important community is to me. Having friends from Miami here helped me adapt to a new environment, while my sorority introduced me to women who have become like family and mentors who continue to encourage my growth. One of my closest friends has also pushed me outside of my comfort zone by encouraging me to attend club events and helping me find new ways to get involved on campus.\n     Professionally, I want to create that same sense of community for others. I want to be someone who supports others, encourages new ideas, gives and receives constructive feedback, and helps people grow. To me, community is the foundation that allows resilience, empathy, innovation, and intellectual growth to thrive. It has taught me that success is not just about what I accomplish myself, but also about how I can help the people around me succeed.", "careerInterests": "Consulting, Marketing, Product Management, Law, Fashion, Sports, Real Estate ", "howRemHelps": " I don\u2019t see being undecided as not knowing where I\u2019m going, I see it as having multiple paths that I\u2019m genuinely excited to explore. When selecting my career interests, I chose \u201cundecided\u201d because I have not yet narrowed myself down to one specific path. At the same time, I selected and added several areas that strongly interest me. I\u2019m still exploring how those interests may shape my future, which is why I am looking for experiences that allow me to gain exposure to different industries and discover where my skills and passions align.\n     Joining Rem on Campus would give me that opportunity through hands-on consulting experience with different businesses and brands. What initially drew me to Rem was seeing how consulting can provide exposure to a variety of industries, including ones that align with my interests. Through this experience, I hope to strengthen my strategic thinking, communication, problem-solving, and leadership skills while gaining insight into marketing, product development, business strategy, and client relationships. These are skills that I know would support the different career paths I am considering. \n     As I look toward my future, one goal I am particularly interested in is pursuing a combined degree at UF that would allow me to earn a master\u2019s in either management or marketing. I see graduate school as an opportunity to build on the business knowledge and experiences I gain as an undergraduate while developing a deeper understanding of the areas I ultimately choose to pursue. I believe the experiences I gain through Rem could help me make that decision with greater confidence and give me a stronger foundation for that next step.\n     Ultimately, my long-term goal is to create a product or service that I can turn into a successful business of my own. I already find myself brainstorming ideas that I hope to bring to life one day, but I know that building something successful takes experience, knowledge, and time. I believe Rem would help me build that foundation by allowing me to work with real businesses, learn from different perspectives, and better understand how successful ideas are developed and executed. Regardless of where my career exploration leads me, I know the experiences I gain through Rem will bring me closer to becoming the entrepreneur and professional I hope to be.", "position": "Junior Consulting Strategist", "skills": "Marketing and analytics, Social media management, Ads (Facebook/Instagram)", "accommodations": "", "other": "     One thing I would want Rem to know about me is that I genuinely look for opportunities to grow, even when I do not have everything figured out yet which I feel is pretty evident in my responses to these questions. I\u2019ve always been someone who seeks out new experiences, challenges myself to step outside of my comfort zone, and looks for ways to make a meaningful impact. I may not have one exact career path mapped out yet, but I know I want to build something meaningful, help others succeed, and surround myself with people who push me to become better. I would bring curiosity, initiative, and a willingness to learn to Rem, but most importantly, I would bring the mindset that there is always an opportunity to learn, improve, and make a greater impact", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": {"timestamp": "2026-09-02T00:21:27.831000", "session": "09/01", "appliedBefore": "No"}, "meetMembers": null}}, {"id": "a59_677a1862", "timestamp": "9/3/2026 17:23:18", "name": "Steven Pham", "email": "phamsteven1246@gmail.com", "phone": "2398228867", "gender": "Male", "race": "Asian or Asian American", "linkedin": "www.linkedin.com/in/stevenphamuf", "resume": "https://drive.google.com/open?id=1Nxrb6nfthkFiA2KW7xR8VIcUolYuOzya", "university": "University of Florida", "gradYear": "2028", "classYear": "Junior", "major": "Finance", "minor": "", "gpa": "3.5", "whyRem": "I want to be a member of Rem on Campus because of the community that Rem holds at the University of Florida. The community consists of hard-working and like minded individuals. I am firm believer on the influence of environments and want to be surrounded with individuals who hold a high moral compass and have a drive towards growth like myself.", "coreValue": "Resilience", "valueEssay": "This value stands out to me because it compliments how I approach my whole life. I am a type of person where I never avoid opportunities or situations because it is new or scary, I push through my emotions and recognize the value of failure. In addition, I feel that resilience has been a big part of my journey not only as a student but as a person, being a First Generation Student. Through out my life, I have gone through multiple challenges of cultural and social norms. My parents came to the United States from Vietnam to escape the war and provide my family better opportunities. In exchange of that, they did not know any cultural knowledge or American systems. As a result, certain responsibilities such as learning how to apply to college or how to sign up for sports, fell to me. The situations I am put in and where I had to be resilient does not mean I have more weaknesses than others, but rather shows a growth in my mental strength and drive to become the best possible version of myself that I can be.", "careerInterests": "Investment Banking / Finance", "howRemHelps": "I believe joining Rem on Campus will help me achieve my career goals of breaking into finance by providing me with the necessary experience to succeed outside of college, whether it would be soft skills or technical skills. In addition, being surrounded in an environment with driven minded individuals like myself, will allow me to continue to stay focused on academics and achieving my goals.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Statistics and modelling, Data analysis, Marketing and analytics, Social media management, Finance and accounting, Python, Brand Development", "accommodations": "N/A", "other": "N/A", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a60_efbd1750", "timestamp": "9/3/2026 17:54:02", "name": "Irene Turrado Sierra", "email": "turradoirene@gmail.com", "phone": "+1 3522562778", "gender": "Female", "race": "White or Caucasian", "linkedin": "www.linkedin.com/in/irene-turrado-sierra", "resume": "https://drive.google.com/open?id=1kd9c5FgaPeKKIa0lPu1LLhdDNTqJ9rLp", "university": "University of Florida", "gradYear": "2027", "classYear": "Senior", "major": "Engineering (various disciplines)", "minor": "Computer Science / Information Systems, Data Science, Engineering (various disciplines), Mathematics", "gpa": "Approx. 3.31/4.0 \u2014 original cumulative GPA: 8.28/10 (Universidad Pontificia Comillas \u2013 ICAI, Spain)", "whyRem": "I want to join Rem on Campus because I am especially interested in applying my analytical background to real business problems and seeing the direct impact of my work. As a Mathematical Engineering and AI student, I am used to approaching complex problems in a structured and data-driven way, but I want to strengthen the business and client-facing side of that skill set.\n\nMy internship at Inveready reinforced this interest, as I worked with financial and portfolio information and saw how technology and analysis can support real business decisions. What attracts me most to Rem is the opportunity to work directly with small businesses, understand the challenges they are facing, and help develop practical recommendations as part of a team. I also value the mentorship and learning component, as I see Rem as a place where I can both contribute my quantitative perspective and grow as a problem solver and communicator.", "coreValue": "Empathy", "valueEssay": "Empathy stands out to me because I believe that solving a problem well starts with understanding the person behind it. Through years of tutoring and volunteering with people from very different backgrounds, I have learned that listening first often changes the solution you initially thought was right. Different people have different priorities, constraints, and ways of approaching a problem, and being able to adapt to those differences is something I value deeply.\n\nThis has also shaped the way I approach more analytical work. My background in Mathematical Engineering and AI has taught me how to break down complex problems using data, but I have learned that a technically strong answer is only valuable if it is useful to the people who have to act on it. That is particularly meaningful to me in Rem\u2019s work with small businesses, where recommendations affect real owners, employees, and communities. I would want to understand each client\u2019s reality before trying to improve it.", "careerInterests": "Consulting, Investment Banking / Finance, Tech, Data Analytics / Business Intelligence, Entrepreneurship / Startups", "howRemHelps": "My career interests sit at the intersection of technology, analytics, finance, and business strategy, and I see Rem on Campus as an opportunity to connect those interests through real client work. My academic background has given me strong quantita
