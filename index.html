ocal Starbucks and Shake Shack, asking to partner with them to raise money for upgraded caps, uniforms, and equipment. These early efforts became contagious and grew into team-wide fundraisers coordinated with my coaches that soon funded regular team dinners that became the heart of our team’s traditions and cultures for years to come. By senior year, I was elected captain, but I realized I had stepped into that role long before the title came along. Leading meant creating an environment to be proud of, one focused on accountability that transformed not only our team relationships but performance in the water. The strongest teams emerge united, a belief that I will bring along with me during my time with Rem and Company that makes me eager to contribute in a community that values growth and collective impact.","careerInterests":"Consulting, Data Analytics / Business Intelligence, Medicine","howRemHelps":"Joining Rem on Campus will support my goal of pursuing a career at the intersection of medicine and consulting by placing me in a team defined by diverse academic backgrounds and problem-solving approaches. Rem stands out for how intentionally it brings together students from a wide range of majors to strengthen the quality of client-centric decisions. Healthcare consulting requires understanding both the human side of care and the strategic, analytical side of business, and Rem’s interdisciplinary approach mirrors that exact balance. Working alongside peers who think differently will challenge me to approach issues through multiple lenses and prepare me to use technology and data to shape meaningful solutions. Ultimately, Rem on Campus offers the environment I need to grow into a consultant who solves problems through the intersection of varied disciplines and perspectives.","position":"Junior Consulting Strategist","skills":"Business Strategy, Statistics and modelling, Mobile development, Data analysis, Marketing and analytics, Photography, Social media management, Ads (Facebook/Instagram), Brand Development","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":{"timestamp":"9/2/2026 17:06:27","year":"Freshman","appliedBefore":"No"}}},{"id":"a16_11e9f224","timestamp":"8/28/2026 14:33:12","name":"Nathalie Patino","email":"nathaliepatino456@gmail.com","phone":"3052195797","gender":"Female","race":"Hispanic or Latino","linkedin":"www.linkedin.com/in/nathaliepatino","resume":"https://drive.google.com/open?id=1oP1zer0LVV0deEiYXKCGRenL-vieUvmE","university":"University of Florida","gradYear":"2028","classYear":"Junior","major":"Business Administration, Finance","minor":"","gpa":"3.71","whyRem":"I want to be a member of Rem on Campus because I’m interested in opportunities to apply what I’m learning in the classroom to real business challenges while making a meaningful impact in my community.  What especially stands out to me about Rem is its focus on professional development and the opportunity to work directly with small businesses. Additionally, I especially like how students remained involved past 3 semesters and were committed to REM throughout university. I’m also drawn to learning structure because it provides a clear opportunity to continuously develop my analytical, communication, and leadership skills. I would be excited to contribute my perspective, learn from my teammates, and grow to be someone who can take on greater responsibility within the organization. Most importantly, I want to be part of a team that uses its skills to help local businesses succeed and strengthen the communities around them.","coreValue":"Intellectual Growth","valueEssay":"Intellectual growth is the value that stands out to me the most because while I have learned a great amount through my courses at UF, I believe that some of the most important learning happens through the people you surround yourself with. Learning from people with similar goals, different perspectives, and experience across different industries allows me to think beyond what I already know. As a student, I want to continue developing my understanding of business by learning from others and applying that knowledge to real-world situations and I believe Rem would give me the opportunity to do both.","careerInterests":"Investment Banking / Finance, Wealth/Asset Management","howRemHelps":"Joining Rem on Campus would help me achieve my long term career goals by giving me hands-on experience solving real business problems and developing skills that I can apply to any career in finance. While again my coursework at UF has helped me build a strong foundation in business, I want to gain more experience understanding how businesses operate, identifying challenges, and using analytical thinking to develop solutions. I am particularly interested in Wealth and Asset Management because I enjoy understanding businesses, markets, and how financial decisions can create long-term value. Working with real businesses through Rem would allow me to strengthen my problem-solving, communication, and analytical skills.","position":"Junior Consulting Strategist","skills":"Business Strategy, Finance and accounting, Microsoft Office Suite","accommodations":"N/A","other":"N/A","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a18_f1339ec8","timestamp":"8/28/2026 20:50:13","name":"Justice Martin","email":"justicemartin@ufl.edu","phone":"9546654882","gender":"Male","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/justice-martin-28b292357/","resume":"https://drive.google.com/open?id=1MElZcDYxCmvcZ_bfRllBJKfM4a09mvQU","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Business Administration","minor":"","gpa":"3.73","whyRem":"I admire how Rem empowers students to use their knowledge to strengthen their local communities. The opportunity to gain hands-on experience while helping organizations solve real problems is especially meaningful to me because it combines professional growth with service and ethical leadership, an aspect of business I believe is often overlooked. I want to join Rem because I know I can commit the time, energy, and work ethic that is necessary and deserved to improve our clients businesses and overall well being.","coreValue":"Empathy","valueEssay":"Empathy stands out to me because I believe many of the ethical challenges we see in business stem from a lack of understanding and consideration for others. When leaders genuinely empathize with clients, coworkers, competitors, and the communities they serve, business becomes about creating lasting value rather than simply maximizing profit. I admire that Rem recognizes empathy as a core value because I believe teaching future business leaders to lead with both compassion and integrity is rare, but essential for building stronger organizations and a better society.","careerInterests":"Brand Strategy, Non-Profit / Social Impact, Public Policy / Government, Music management","howRemHelps":"I believe joining Rem on Campus is a step in the right direction toward my career goals because it provides the opportunity to develop professionally while making a meaningful impact. Rather than choosing organizations solely for how they might benefit my resume, I am drawn to opportunities where I genuinely believe in the mission, know the work creates positive change, and feel inspired to give my full effort. I know that when I care deeply about the purpose behind what I'm doing, I contribute at my highest level, and I believe Rem is the kind of organization where I can do exactly that.","position":"Junior Consulting Strategist","skills":"Business Strategy, Data analysis, Marketing and analytics, Design Thinking, Brand Development","accommodations":"N/A","other":"N/A","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a19_b60439c5","timestamp":"8/28/2026 22:29:07","name":"Ava Zaragoza","email":"avazaragoza@ufl.edu","phone":"7723026784","gender":"Female","race":"White or Caucasian","linkedin":"www.linkedin.com/in/avazaragoza","resume":"https://drive.google.com/open?id=1_nNITNW_l0NlBnkZxzVoIvncfVXrhD7f","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"","gpa":"3.84","whyRem":"I want to be a member of Rem on Campus because I am genuinely excited by the opportunity to surround myself with motivated people who present different perspectives and ideas. Whether they be my peers, who vary in major and background, or the business owners who I will have the pleasure of supporting, I grow best by hearing about others' experiences and applying what I learn to my own life. Beyond this, friends have shared their journey with Rem and the invaluable lessons they have gained. From creating lasting relationships with local companies to dedicating long hours on developing strategies and solutions, it is clear they have made a meaningful difference in not only their personal growth but in the growth of our community. These experiences are a testament to the value Rem provides, and I would love the opportunity to continue growing alongside it.","coreValue":"Empathy","valueEssay":"Of Rem's core values, empathy stands out to me because I believe it is often undervalued despite being essential to meaningful relationships and communication. Truly understanding someone's situation and putting yourself in their shoes can be difficult as we all naturally view the world through the lens of our own experiences and biases. I consider myself an empathetic person, but I also recognize that it is a skill and can always be strengthened. The opportunity to work closely with local business owners and spend real time developing solutions with them would challenge me to listen deeply and consider perspectives different from my own. I believe understanding is what drives communication to become more effective and strategies to become more impactful, making empathy a skill I hope to continue developing throughout my personal and professional journey.","careerInterests":"Investment Banking / Finance, Wealth Management","howRemHelps":"As I am pursuing a career in Wealth Management, Rem on Campus will allow me to develop the problem-solving and interpersonal skills necessary to be both efficient and successful in the industry. During my experience in the FPD Wealth Management track, I learned how valuable it is to be thrown into an ambiguous situation and learn how to work through the uncertainty to identify a solution. Rem would allow me to further develop this ability by working with businesses whose challenges may not have the clearest of answers. I am also drawn to the opportunity to develop customized solutions, as every business and, similarly, every wealth management client has special needs and circumstances. Working with different businesses would challenge me to understand their specific needs and communicate recommendations effectively. I am certain these skills will be pertinent to my career and that Rem on Campus will strengthen them.","position":"Junior Consulting Strategist","skills":"Statistics and modelling, Data analysis, Marketing and analytics, Videography, Photography, Finance and accounting, Brand Development","accommodations":"","other":"I am truly grateful for the opportunity to apply and the students who put their time and dedication into running Rem on Campus.","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/1/2026 16:49:14","spokeTo":"Sachin Mario, Hannah Lockwood, Eli Koon, Aya Aldorri, Maria Lopez, Terrence Smith"}],"infoSession":{"timestamp":"9/2/2026 0:21:25","session":"09/01","appliedBefore":"No"},"meetMembers":{"timestamp":"9/3/2026 10:24:58","year":"Sophomore","appliedBefore":"No"}}},{"id":"a20_71d628d4","timestamp":"8/29/2026 14:35:45","name":"Leila Silieti","email":"leila.silieti@ufl.edu","phone":"4074134207","gender":"Female","race":"White or Caucasian","linkedin":"www.linkedin.com/in/leilasilieti","resume":"https://drive.google.com/open?id=12rcvl1vgK1eTLuyAsX-xyICCqLsa-os7","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Engineering (various disciplines)","minor":"Business Administration","gpa":"3.67","whyRem":"In my first year at the University of Florida, I learned that I can be successful in courses such as Physics, which is funny coming from an Engineering major, but is the truth nevertheless. I was originally intimidated by my coursework, but I have become confident in my ability to build my knowledge and understanding in the classroom. Now as I start my second year, I need to transition my focus and instead gain the skills and confidence I need to lead teams strategically and effectively. I am certain Rem on Campus is the outlet for me to gain the experience I am looking for, and I will be a passionate member from the very start of the \"Learning\" phase. As a junior strategist, I will invest my time in Rem on Campus so that I can improve my understanding of what it means to problem-solve in industry.","coreValue":"Resilience","valueEssay":"For me, Resilience is the definition of my college journey. There are two aspects where resilience is most prevalent: in my finances and academics. Coming from a single parent household, I have had to pay for all of my college expenses, and thus I have been employed  by the University since before I even step foot on campus. Through my engineering curriculum I have learned how to bounce back and study harder after a 8/20 on my Physics exam. Additionally, I have been able to manage the stress when these two situations overlap. For instance, picking up extra UF tour shifts the morning of my Calculus exam. I will continue to be resilient and learn how to grow and adapt from experiences in my life, and also professionally when I am involved in industry.","careerInterests":"Consulting, Data Analytics / Business Intelligence, Product Management","howRemHelps":"The strategic model Rem on Campus has for their members is why I believe Rem will guide me to achieving my career goals. From the \"Learning\" to the \"Leading\" phase, I will be able to grow professionally as I gather a strong understanding of what the demands are in a client-facing role. I will also be grateful for the opportunity to be a strategy team member developing deliverables and analyzing solutions for clients. The experiences Rem provides will build my skill base, while also allowing me to become familiar with the objectives professionals aligned with my career goals face.","position":"Junior Consulting Strategist","skills":"Statistics and modelling, Data analysis, Python, Microsoft Office Suite","accommodations":"N/A","other":"N/A","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/2/2026 18:32:12","spokeTo":"Kyle, Reese, Eli, Aya, Aarohi, Parker"}],"infoSession":{"timestamp":"9/2/2026 0:21:28","session":"09/01","appliedBefore":"No"},"meetMembers":null}},{"id":"a21_f7ec1864","timestamp":"8/29/2026 16:47:55","name":"Aryan Patel","email":"adp0419@gmail.com","phone":"9045320201","gender":"Male","race":"Asian or Asian American","linkedin":"www.linkedin.com/in/adp0419","resume":"https://drive.google.com/open?id=1HDqvJQoDTvY_AJbaff_Pu9q_N5HV9Im4","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Computer Science / Information Systems","minor":"Business Administration","gpa":"3.93","whyRem":"I understand that I am still new to the industry of consulting, but that is exactly why I want to be a part of Rem on Campus. As a Computer Science major with a Business Administration minor, what draws me to consulting is the same thing that draws me into tech: solving problems. This instance is just in the service of business decisions.\n\nRecently, I completed an externship for Amazon, where I analyzed employee reviews on Glassdoor to identify drivers of attrition in their Fulfillment Center warehouses. This was the first time I saw the intersection of tech and business in practice, turning raw qualitative data into numerical metrics a business could act on. I want Rem to help me build on that, and to learn how real client problems get scoped, how findings actually reach a business as strategy, and how to communicate technical work to people who are not engineers.\n\nBeyond the skills, I am also looking for a community I can learn from and eventually contribute to. I may not walk in knowing as much as other applicants, but I will show up ready to help wherever I am needed and to grow into the industry alongside Rem.","coreValue":"Innovation","valueEssay":"Only 1.4% of recorded history includes the era of computational technology. Yet in that sliver of time, we have already revolutionized the way we live, from putting supercomputers in everyone's pockets to landing rovers on Mars. Our ancestors going from smashing rocks together to our generation reaching for other planets is one of the most inspirational things ever. That indomitable human spirit, and the constant drive for innovation, is what draws me to software engineering.\n\nI was fascinated by technology from a young age; I built my first computer when I was 13, and from that point I knew I wanted a tech career. It was not an easy decision. Most of my family is in the medical field; my father is a pharmacist, and my sister is in medical school, and as much as I respect that path, I could not picture myself in scrubs. So I continued on my own path, researching the CS industry, building projects, and figuring things out mostly on my own.\n\nOnce I started college, I still felt that same pull to keep building and catching up, joining clubs, becoming a research assistant, and creating more projects, even when it felt like everyone else was ahead. That drive for excellence and innovation kept me pushing rather than settling for where I already am. It is why I want to be a part of Rem, to be around people who share the same hunger to innovate, and to keep growing alongside them.","careerInterests":"Consulting, Tech, Data Analytics / Business Intelligence, Product Management","howRemHelps":"I am extremely interested in the intersection of technical skill and business strategy. Right now, most of my experience comes from the technical side: building projects, doing research, and working with data. What I am missing is the exposure to how that technical work translates into business strategy and real business impact. And that is the gap Rem can help me close.\n\nBy connecting with members who are on the same path as me, I can learn firsthand how problems get scoped, analyzed, and delivered as recommendations a business can actually act on. Product management especially lives in that overlap between technical execution and business strategy, and Rem gives me a way to explore it with mentorship.\n\nWhat I am looking for is guidance, real experience, and a community that is willing to help me turn my technical background into a business-facing skill set.","position":"Junior Consulting Strategist","skills":"User Experience (UX), Back-end web development, Web design, Data analysis, HTML, Python, Machine Learning","accommodations":"n/a","other":"n/a","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/2/2026 18:16:01","spokeTo":"Maya, Arohi, Eli, Isiah, Reese, Alexandra, Aya"}],"infoSession":{"timestamp":"9/2/2026 0:21:30","session":"09/01","appliedBefore":"No"},"meetMembers":{"timestamp":"9/2/2026 17:06:27","year":"Sophomore","appliedBefore":"No"}}},{"id":"a23_2ed15690","timestamp":"8/30/2026 9:39:21","name":"Logan Bartelt","email":"l.bartelt@ufl.edu","phone":"239-316-0831","gender":"Male","race":"White or Caucasian","linkedin":"www.linkedin.com/in/logan-bartelt-69276a405","resume":"https://drive.google.com/open?id=1TW3Jn4SH0CO3TvIkadgvwfdqZ2dcLaNy","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"","gpa":"N/A (First Semester Freshman)","whyRem":"I want to be a member of Rem on Campus because of the ability to learn hard and soft skills that are necessary not only for a future career in finance, but also that help serve the local community here in Gainesville over my next four years here. Alongside learning, surrounding myself with people that are highly ambitious and passionate about the world of finance and applying that knowledge to better the community around them. As a child of parents who have owned small local food businesses, I have seen first hand the amount of work it takes to run a successful small business and the impact that an organization, such as Rem on Campus, can have on such businesses– helping them to become more efficient and expand to serve as many people as best as they can. Consulting with these small local businesses creates a chain reaction where helping them become more efficient in turn helps the customers have a better experience, bettering the overall community. In four years I would like to look back at the organizations or clubs I have been a part of and the work that I have done and be able to see that I left a positive impact on the lives of people in the community surrounding the place I am lucky to call home for these four years– and I believe Rem on Campus provides one of, if not the, best opportunity to do that whilst learning the skills I need to do so now and in the future.","coreValue":"Community","valueEssay":"To me, community is the most important value because of the impact it has on you and the impact you can have on others. Out of the core values, I believe the root of improvement for all of them stems from community. When you surround yourself with people who are resilient, empathetic, innovative, and want to grow intellectually, you yourself are bound to naturally pick up on those characteristics. In turn, as you improve, the people in the community around you will pick up on your characteristics and begin improving themselves– and the cycle repeats. In that sense I was referencing the community of Rem on Campus, however, this also applies to the overarching community. Through consulting with businesses in the area, Rem on Campus at UF is able to improve the community in Gainesville by providing businesses with the tools to better serve the people of the community, allowing people more opportunity to grow. \n\tThroughout my life I have tried my best to surround myself with people that will push me to become the best that I can. Whether it was transferring schools, staying connected with friends, or building a relationship, each person in the community around me played a role in building me into who I am today– with specific impacts that I can point to. For example, the decision in my senior year to switch from football to cross country was, in part, led by the friends who I had made through running sharing goals and characteristics that I had and aspired to reach. It is for this reason that I value community so highly.","careerInterests":"Consulting, Investment Banking / Finance","howRemHelps":"Joining Rem on Campus would prepare me for careers in consulting and finance as a whole by providing the opportunity to learn the skills necessary for a career in the field and gain experience applying those skills to make a positive impact on the community around me through the “Learning - Applying - Leading” model that Rem on Campus embodies. In addition to gaining the technical skills, soft skills, and experience in the area, being part of this community allows me to meet people who are also driven to learn and serve those around them, allowing us to help and push each other to continue working to achieve the career we desire. By joining Rem on Campus I would be exposed directly to the type of work consulting organizations do, giving me hands-on experience in the field I am looking at a career for– a field that also has applications to the broader finance industry, such as investment banking, where the skills I learn here will apply no matter which specific sector I enter.","position":"Junior Consulting Strategist","skills":"Social media management, Microsoft Office Suite, Currently majoring in Finance.","accommodations":"No.","other":"","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/1/2026 16:40:38","spokeTo":"Sachin Mario, Kyle Morris, Christian Fox, Maria Juliana Lopez"},{"timestamp":"9/2/2026 18:31:44","spokeTo":"Aarohi Bali, Mackenzie Kurtz, Parker Whelan"},{"timestamp":"9/3/2026 16:38:14","spokeTo":"Colton Swain, Terrence Smith, Brody Power, Pablo Navas, Aya Aldorri "}],"infoSession":{"timestamp":"9/3/2026 22:02:05","session":"09/03","appliedBefore":"No"},"meetMembers":{"timestamp":"9/2/2026 17:06:31","year":"Freshman","appliedBefore":"No"}}},{"id":"a22_6634e109","timestamp":"8/30/2026 17:28:09","name":"Diya Tharun","email":"d.tharun@ufl.edu","phone":"8132916167","gender":"Female","race":"Indian or Indian American","linkedin":"www.linkedin.com/in/diya-tharun","resume":"https://drive.google.com/open?id=12T0gknvqc6pAIkQhwmNC2ufApZ-lF4VR","university":"University of Florida","gradYear":"2028","classYear":"Junior","major":"Management","minor":"Other","gpa":"3.59","whyRem":"I want to join REM on Campus because it provides a great opportunity to gain hands-on experience solving real-world business challenges. I am excited to work alongside motivated students, collaborate with clients, and contribute to building an organization where members can develop their consulting skills through meaningful projects.  \n\nThrough my previous consulting experience with Enactus Active Consultancy, I developed a strong interest in consulting while working with a charter flight agency in Costa Rica. My team conducted research, evaluated operational challenges, and developed recommendations tailored to the client’s needs. This experience strengthened my skills in research, problem-solving, and teamwork, while also showing me how much I enjoy working through ambiguous problems and developing practical solutions. However, because we were not involved in the implementation process, I did not get to see the long-term impact of our recommendations. \n\nAt REM on Campus, I hope to build on this experience by developing stronger skills in data analysis, strategic thinking, and client communication while gaining a deeper understanding of the consulting process. I am excited by the opportunity to see our efforts come to life in our community.","coreValue":"Empathy","valueEssay":"Empathy stands out to me because it is a value I try to practice in my everyday life. I make an effort to consider different perspectives, ensure others feel included, and create space for people to share their ideas and experiences. I also recognize that everyone is navigating circumstances that may not be visible to others, making it especially important to approach people with patience and understanding rather than assumptions. \n\nThis value has also shaped how I approach teamwork and professional experiences. I believe that understanding how others think and what they value leads to stronger collaboration and better outcomes. In consulting, empathy is particularly important because solving a client’s problem requires more than identifying what is wrong. It requires listening carefully, understanding the context behind the challenge, and considering the perspectives of everyone affected by a recommendation. I hope to bring this mindset to REM by being someone who actively listens, values different perspectives, and helps create an environment where everyone feels comfortable contributing.","careerInterests":"Consulting, Entrepreneurship / Startups, Product Management, Non-Profit / Social Impact","howRemHelps":"My primary career interest is consulting, and I believe joining REM on Campus would provide me with the practical experience necessary to explore and pursue this career path. I am particularly interested in gaining firsthand experience working with companies to understand their challenges, analyze information, and develop thoughtful, actionable recommendations. While my academic and extracurricular experiences have helped me build a foundation in analytical and critical thinking, I want to strengthen these skills by applying them to real-world business problems. \n\nThrough REM on Campus, I hope to develop a better understanding of the consulting process from beginning to end, including communicating with clients, conducting research, and presenting recommendations. I also believe that working with different companies and industries would expose me to a variety of business challenges and help me determine the areas of consulting that I find most interesting. Equally important, I am excited to build connections with the driven peers within REM. I believe being surrounded by people who are motivated to grow and challenge themselves would push me to improve while allowing me to learn from their diverse perspectives and experiences. Ultimately, I hope to build both the skills and relationships that will help me pursue a successful career in consulting.","position":"Junior Consulting Strategist","skills":"Data analysis, Marketing and analytics, Photography, Social media management, Communications and copy-writing, Microsoft Office Suite","accommodations":"None","other":"Super excited for this opportunity!!","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a24_07931044","timestamp":"8/31/2026 15:30:13","name":"Michelle Lin","email":"michellelin0715@gmail.com","phone":"(917) 226-5819","gender":"Female","race":"Asian or Asian American","linkedin":"www.linkedin.com/in/michellelin-","resume":"https://drive.google.com/open?id=1Spm4dI6idqUkCmwnASJ6mSmjLYkHd4nB","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Business Administration","minor":"","gpa":"3.72","whyRem":"As an individual who constantly strives to challenge herself and become better at what she does, I believe Rem on Campus can help me become the version of myself I have always hoped to become, both personally and professionally.\n\nRem on Campus is filled with ambitious and motivated individuals who want the best for their clients. They are people who strive to provide thoughtful solutions not only because they are proud of their work, but also because they understand the responsibility of someone else’s trust in them as they help better the company. These traits of individuals in Rem truly demonstrates the culture within the organization and what I appreciate. Each individual possesses an indescribable drive and accountability that is admirable. I want to surround myself with individuals like these so that I can be influenced to constantly push myself, stay curious, and be better in general.\n\nProfessionally, Rem on Campus has many individuals that are pursuing the same career I hope to pursue, consulting. As I learn more about the industry, I would be surrounded by individuals who can teach me more about consulting, navigate me through common challenges, and provide insight to their experience. They are able to help develop me professionally, and mentor me as I look for internships and full-time jobs within consulting.  \n\nI want to be a member of Rem on Campus because the organization will teach me all that I need to know about consulting, put that into practice, and become well-versed in the industry. Most of all, this newfound knowledge would allow me to ultimately discover the “why” behind my passion for this career.","coreValue":"Intellectual Growth","valueEssay":"When people ask me what my favorite color is, I naturally say yellow and explain that it’s because of Winnie the Pooh. In return, I receive confused looks but my explanation is simple. Yes, I like yellow because it is Winnie the Pooh’s color, but more importantly it is his qualities and character that I associate with this color. Winnie the Pooh is my spirit animal. He is kind, loving, and finds joy in the simplest things, but the trait I love the most about him is his natural curiosity. His curious mind is fueled simply by the world around him and I see a resemblance within myself. My close family and friends know me and my endless “whys,” sometimes to annoy them (on purpose, of course) but most of the time because I have genuine questions on the way things work or why something is the way it is.\n\nRather than sticking to the hobbies I already know, I have the tendency to always try something new because I live off the thrill of learning new things and stepping outside my comfort zone. This curious mindset has led me to take up golf, learn to do my own nails, fold jars full of paper stars, solve the rubix cube, play pickleball, and pursue many other things. To me, the feeling of starting something with zero idea of how to do it and eventually becoming familiar with it is unmatched. It gives me such a sense of accomplishment that I continue to feed off of this curiosity. Intellectual growth is more than just simply gaining more knowledge. I think that intellectual growth is a process where one continues to challenge themselves to be brave, learn more, and continue this endless pursuit. \n\nI also carry this mindset with me throughout my professional journey. Not even a semester ago, I discovered the career of consulting. The specifics of this path was extremely new to me, like case interviews. However, I found this unfamiliarity to be exciting rather than scary. I seek to grow knowledge within this field, so that one day I could look at a case and easily identify my buckets or work with a client and know what I am doing. With this goal in mind, I will continue to pursue knowledge within the field, starting right now with reading “Hacking the Case Interview.”\n\nIntellectual growth also means expanding my views and perspectives to include the entire world rather than limiting it to the culture I live in. Professionally, I hope to be able to travel the world and be an international consultant one day. I have always had an extreme fondness over traveling and discovering other cultures as well as their way of life. With this, I hope to continue to learn about these differences in culture so that I can better approach topics and different things rather holistically than from the lens of what is familiar to me.\n\nUltimately, intellectual growth is a value to me because I have shaped my life around it. Without intellectual growth, I would not be the person I am today, confident and eager to learn about the unknown. It shapes my bravery, confidence, and knowledge which I believe will take me to my goals and beyond that. Like Winnie the Pooh, I will continue to navigate my life to discover the endless new things to learn about the world around me.","careerInterests":"Consulting","howRemHelps":"Growing up, I was always most fond of projects in school, especially the ones where I had to build something like a 3D model of an animal cell. While some people complained that these projects were tedious, I found effectiveness within them. I have never been a pen-to-paper, taking notes during the lecture because that wasn’t how I learned best. I could really understand concepts through hands-on projects, where I saw the application of my knowledge to something tangible.\n\nThe same idea is what piques my interest with Rem on Campus. As someone interested in pursuing consulting, I know that this field relies a lot on solving problems, working through cases, and developing real-world solutions. It is easy to just read “Hacking the Case interview” and understand how the job works on paper, but it is another thing to actually apply those concepts in a real-world context. Rem provides the tangibility that I seek as I advance towards my career goals. With Rem, I would have the opportunity to work as a strategist on a team to develop solutions for real companies around me and see how they apply the solutions into their businesses. This provides a tangible impact and experience that would allow me to feel more prepared and confident going into the consulting career field. \n\nIn addition to providing me with a look into what consulting would be like in the real world, Rem on Campus would also help me strengthen various valuable skills in critical thinking, communication, collaboration, and problem-solving. With this knowledge, Rem on Campus helps build a foundation for me as I work to achieve my career goals.","position":"Junior Consulting Strategist, Consulting Strategist","skills":"Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Business Strategy, Web design, Marketing and analytics, Social media management, Microsoft Office Suite","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/2/2026 16:18:49","spokeTo":"Brody, Anabella, Max"}],"infoSession":{"timestamp":"9/2/2026 0:21:16","session":"09/01","appliedBefore":"No"},"meetMembers":{"timestamp":"9/2/2026 17:06:22","year":"Sophomore","appliedBefore":"No"}}},{"id":"a26_2beb1129","timestamp":"9/1/2026 0:00:52","name":"Sergio Acosta","email":"sergio.acosta@ufl.edu","phone":"4698231465","gender":"Male","race":"Hispanic or Latino","linkedin":"www.linkedin.com/in/sergiojacosta","resume":"https://drive.google.com/open?id=1lpPm3a2pY3VyhPFUqr-YRiOKNIZSkpZc","university":"University of Florida","gradYear":"2028","classYear":"Junior","major":"Business Administration","minor":"Computer Science / Information Systems, Finance","gpa":"3.9","whyRem":"I want hands-on consulting experience with real clients while I'm still in school. Adapting fast and figuring things out with limited support is something I've had to do my whole life; moving across three countries taught me that early. I've since applied that same instinct to project-based work: an operational strategy pitch deck during my Amazon externship, cross-cultural business projects in coursework. But I want to build that into a repeatable skill set on a team, with real accountability, not just one-off assignments. Rem gives me that structure, plus a community of people who take the work seriously.","coreValue":"Resilience","valueEssay":"Resilience isn't abstract for me, it's been the constant across three countries. I moved from Venezuela to Mexico at 12, back to Venezuela at 14, then to the U.S. at 15, landing in Dallas right before starting high school. Nobody was there to help me learn English; there was no ESL support waiting for me. I had to teach myself on my own time, outside of class, while still keeping up with schoolwork in a language I didn't speak yet. Making friends and adjusting to an entirely different culture happened at the same time, with no real cushion. Since I was a kid, my father always told me to be resilient and stay constant with the things I want to achieve, and that stuck with me. It's what got me through those moves. I've never given up on something until I found the solution, whatever it took. Resilience isn't a mindset you talk about; it's showing up every day and doing the unglamorous work until you catch up. That's the same standard I hold myself to now, whether it's a difficult class or a client project that isn't going the way I planned.","careerInterests":"Consulting, Brand Strategy, Data Analytics / Business Intelligence, Non-Profit / Social Impact","howRemHelps":"Rem sits right at the intersection of these three. Consulting engagements will sharpen my client-facing problem-solving; the analytical rigor consulting projects demand will strengthen my data analytics skills; and working across different client industries will give me exposure to brand and marketing strategy I don't get from coursework alone. I want to leave Rem with a portfolio of real client work I can point to, not just a title.","position":"Junior Consulting Strategist, Consulting Strategist, Team Lead","skills":"User Experience (UX), Business Strategy, Web design, Data analysis, Marketing and analytics, Python, Machine Learning","accommodations":"No","other":"I'm genuinely excited about the opportunity to contribute to Rem, and I show up consistently for the things I commit to.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a27_da2475d2","timestamp":"9/1/2026 11:44:18","name":"Matias Costantini","email":"matiascostantini@ufl.edu","phone":"7865997331","gender":"Male","race":"Hispanic or Latino","linkedin":"www.linkedin.com/in/matias-costantini-b5a32742b","resume":"https://drive.google.com/open?id=1ThAMRdGMlz7a2K5R9wGPp4jKoUBoDyHz","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Business Administration, Finance","minor":"","gpa":"3.9","whyRem":"Joining Rem on Campus would be a great opportunity for me since I am seeking an experience that could be gained in the course of client facing tasks that cannot be obtained through coursework only. Being a Finance major from the University of Florida, I want to put a lot of time to studying how to analyze certain problems and how to come to my conclusions. However, I need to get some practical experience in doing that.\n\nThe reason why being a Junior Strategist suits me better is that it will allow me to gain certain experience in building up a solid base by learning skills such as design thinking, learning how a strategy team works and, how it prepares its result based on solid data. Rather than jumping right into leading something without having enough practice and experience in that area, I would prefer to see how a senior does that and get used to the way it is done.\n\nWhat is more important for me is the possibility of impacting lives of small businesses and nonprofits in my local community.","coreValue":"Intellectual Growth","valueEssay":"Intellectual development stood out to me right away, as it is the one value I have always depended on throughout the activities I have chosen, even without having a term for it yet. A couple of summers ago, for example, I taught myself how stocks and markets work, simply out of intellectual curiosity. This led me to be President of my school's Finance Club, facilitating discussion groups on the fundamentals of investing and group projects analyzing real estate transactions as another way of testing my knowledge by trying to teach others about it.\n\nI have done so in the past as well. I started and analyzed an independent survey study on people's saving and spending behavior simply because I wanted to understand the reasons behind people's everyday spending actions, and I have spent years tutoring children in a variety of subjects such as mathematics or reading comprehension.\n\nThat is exactly what Rem on Campus offers me, an opportunity to continue doing exactly the same, but in a different setting and a different context. Intellectual growth is what I beleive in and I think Rem on Campus can offer me that.","careerInterests":"Real Estate","howRemHelps":"I feel joining Rem on Campus will help create the very foundation necessary for a career in real estate, even though the clients not being property investors themselves. Career in the real estate industry thrives and survives based on the ability to interpret the local market, understanding how it moves, conducting a financial analysis based on this information, and making a proper recommendation to a client making an important decision. The skills mentioned above are basically what one acquires being involved in the training program of Rem on Campus, the only difference is that in such a scenario we are not talking about a property but a business or nonprofit organization.\n\nI have already experienced the attraction towards real estate careers by becoming the President of Finance Club of my school and running several projects dealing with the process of conducting transactions in the real estate sphere from the perspectives of both the buyer and seller. However, all of this was only a theory. Joining Rem on Campus will provide me with the opportunity to learn about the practical side of the story. As Junior Strategist, I will be able to observe the ways professionals approach vague issues and how to conduct research.","position":"Junior Consulting Strategist","skills":"Business Strategy, Marketing and analytics, Social media management, Finance and accounting","accommodations":"None","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a28_0f590130","timestamp":"9/1/2026 12:46:28","name":"Cindy Liao","email":"cindyliao@ufl.edu","phone":"2566982869","gender":"Female","race":"Asian or Asian American","linkedin":"https://www.linkedin.com/in/cindy-liao-0173i372361/","resume":"https://drive.google.com/open?id=10fEP2je74LbQ17uslNDN6UuwTClA_M0nKWN1w2K5F2U","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Accounting","minor":"","gpa":"3.36","whyRem":"I want to join Rem on Campus because I hope to pursue consulting in the future, and it would provide an excellent opportunity to gain experience in the field throughout the year. Having just switched from being pre-med the entirety of my freshman year, I have found it hard to find a community of people that have the same goals as me career wise. Additionally, as Rem is more focused than general business clubs, it will provide a group of people with similar consulting aspirations who I will be able to learn from.","coreValue":"Community","valueEssay":"Community is huge for me because I firmly believe that everyone is where they are in life because of the people surrounding them. Everyone no matter how smooth their path to whatever they are pursuing will experience setbacks. When it comes to preserving past those setbacks, it is the group of people who support, uplift, and encourage you that allow you to get through it. I really believe that no one can get through life alone, and whether it is people there for you to celebrate your wins, and carry you through losses, I think having a firm community by your side at all times is the most important part of not only having a successful career, but a happy life.","careerInterests":"Consulting, Product Management","howRemHelps":"Rem on Campus will give me real-world consulting experience, coming from a place with little experience. Especially applying for junior consulting strategist, I will be given enough support to fully learn about the field and skills necessary to succeed, but also given enough autonomy where I will be able to use trial and error to learn. Additionally, the networking opportunities and people I will meet in Rem will be invaluable when it comes to making meaningful connections in the field.","position":"Junior Consulting Strategist","skills":"Business Strategy, Photography, Social media management, Finance and accounting","accommodations":"n/a","other":"n/a","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a29_cad692c6","timestamp":"9/1/2026 13:41:35","name":"Diego Lopez Franco","email":"lopezfrancodiego@ufl.edu","phone":"3054972336","gender":"Male","race":"Hispanic or Latino","linkedin":"https://www.linkedin.com/in/diego-lopez-franco/","resume":"https://drive.google.com/open?id=1Rrawtt9x-T13lOHaffy2oxsPgiv-cSvY","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"","gpa":"N/A","whyRem":"I want to be a member of Rem on Campus because I love that its consulting work is connected to the Gainesville community. I was most attracted to the fact that it supported 38 local small businesses and nonprofits through pro bono consulting in the past year. Rem gives members responsibility over a real client team and a clear path from junior strategist to team lead; this is the best way that I see to learn real consulting concepts. The chance to learn it and then apply it to real life matches my way of learning: building the basics, then putting them into practice until perfection is achieved, and eventually helping others do the same. \n\nI want to learn how to break down complex problems, turn research into action, and communicate it effectively to a client while helping a business grow. I would bring curiosity, ambition, a hunger for learning, and the willingness to contribute wherever the team needs me.","coreValue":"Empathy","valueEssay":"Empathy stands out to me because I know that to get the best solution, you need to understand the person you are trying to help. While tutoring underprivileged students at Gibson Charter School, I saw kids learn at different paces and come from very different backgrounds. The same solution didn't work for all of them; I had to listen, understand their needs, and learn to adapt.\n\nThis experience led me to write a children's finance book designed around concepts like saving, budgeting, and investing, and made it very approachable for young students. It taught me that empathy is not only about being a good person, but that it makes you a better problem solver. In consulting, when working with small-business owners who worked hard on what they created, understanding the person who has the problem is the most important thing before coming up with a solution.","careerInterests":"Consulting, Investment Banking / Finance","howRemHelps":"Rem would help me build skills I could use in both consulting and finance. Working alongside a small business would help me understand how a company operates, identify what causes problems, analyze qualitative and quantitative information, and turn it into actions the client can use. This skill translates well to consulting, but it's just as valuable in finance, where understanding a business goes far beyond numbers.\n\nThe experience that I would gain communicating recommendations to clients and showing my reasoning is what I'm most interested in. The progression from Junior Strategist to Strategist and, one day, Team Lead would give me greater responsibility and the chance to lead a team. Whatever career I end up pursuing, I would like to leave college understanding businesses, communicating under stress, and contributing effectively on a team.","position":"Junior Consulting Strategist","skills":"Business Strategy, Marketing and analytics, Social media management, Finance and accounting, Communications and copy-writing, Microsoft Office Suite, Brand Development","accommodations":"N/A","other":"As a first-year, I'm very excited to learn with Rem over my four years. I hope to take on greater responsibility as I develop and, one day, be in a position to help new members. I bring an international perspective, having lived in Spain, Brazil, and the U.S., and I am fluent in Spanish, Portuguese, and English. These experiences have made me comfortable adapting to new and different people, perspectives, cultures, and communication styles. I believe all of this would be valuable when working with clients and a team.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a30_9b69c06c","timestamp":"9/1/2026 13:47:04","name":"Maximo Federici","email":"maximofederici@ufl.edu","phone":"2026973336","gender":"Male","race":"Hispanic or Latino","linkedin":"www.linkedin.com/in/maximo-federici-3b9048430","resume":"https://drive.google.com/open?id=1mLIs-SU_g3xV0CqkN-kAL9PdJAlVPmyZ","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"","gpa":"3.907","whyRem":"During my last years of high school, I learned the fundamentals of finance from inside of real firms. I interned at three different financial firms in which I analyzed markets, researched about global economic trends, and built risk-adjusted portfolios. Those experiences opened the financial world and taught me how capital operates at the top of the market. But the accomplishment that I'm most proud of is the HandsOnFoundation, a nonprofit I founded to connect volunteer tutors with underprivileged students in Argentina.\n\nThis contrast is exactly why I want to be a member of Rem On Campus. I have experienced how large and complex financial institutions can be, but I haven't yet had the chance to apply those learned skills into the small businesses and nonprofits that Rem On helps. Some local companies and entrepreneurs can't afford a consulting firm, but they need it just as much as other large organizations do. I'm also interested in Rem's model of connecting students with real clients under the guidance of industry professionals. It is exactly the kind of hands-on experience that I sought out throughout my high school years. \n\nLastly, I'm drawn towards the \"Learning, Applying, Leading\" structure that Rem holds. Specifically, because I know through experience that the leadership part cannot go missing. I have built teams, coordinate with students and volunteers and held accountability for consequences since I was a freshman in high school. I want to bring those same skill sets into the Rem On team and continue building the goal that has always mattered to me: helping those in need.","coreValue":"Empathy","valueEssay":"The value that stands out to me the most is empathy. It has shaped almost everything that I do outside the classroom. When I founded the HandsOnFoundation, I saw many students in Argentina that lacked access to the academic support that most people today take for granted. These students were bright and talented, but were missing the opportunities and resources that could allow them to reach their full potential. Instead of simply accepting that fact, I decided to do something about it. I started by connecting students with volunteer tutors from my area, tutors who had the knowledge needed to help them. Eventually I turned HandsOnFoundation into a real non-profit organization with the goal of making education more accessible to students regardless of the circumstances. \n\nThis experience has taught me everything about empathy. The students we worked with were just as capable and motivated as anyone else. Recognizing that taught me to look beyond someone's circumstances and understand what they actually need to succeed. \n\nNow, my plan is to bring the skills that I learned to Rem. Through empathy and HandsOnFoundation, I understood how to listen to people, and figure out what it is that they need. I learned how to turn an idea into something that can create meaningful change. At Rem, I hope to bring that same mindset into the small businesses we would work with. I want to recognize the challenges that they are facing, and understand them beyond the numbers. But most important, I will provide the same sense of responsibility I felt towards the students we helped in HandsOnFoundation.","careerInterests":"Consulting, Investment Banking / Finance, Data Analytics / Business Intelligence, Entrepreneurship / Startups, Non-Profit / Social Impact","howRemHelps":"Finance, consulting, and entrepreneurship are my principal career interests. Rem On Campus is the perfect opportunity for me to explore these areas, while at the same time, gaining actual experience working with businesses. \n\nBy working with small startups and nonprofits, I will be able to expand the range of skills that I have learned. I am eager to learn more about how businesses operate, the challenges that they face, and how a smart consulting team can support and improve them. Also, working with clients will allow me to improve my communication skills and present ideas more clearly and confidently. \n\nI am still in my freshman year of college, so joining Rem On would be a huge opportunity for me. I will have the opportunity to learn from other students and professionals while also figuring out where my career interests take me in life.","position":"Junior Consulting Strategist","skills":"Business Strategy, Statistics and modelling, Data analysis, Finance and accounting, Communications and copy-writing, Microsoft Office Suite, Brand Development","accommodations":"No","other":"I am hoping to come into Rem On Campus with a lot to learn, but also with a strong mindset to work. I would like you to know that I am someone that takes commitments seriously. I understand that when I am surrounded by people who challenge and expect from me, I learn the most. Whether through my internships, my nonprofit, or other projects, I now know that following through on what I commit is just as important as having good ideas. I am ready to learn and contribute in any possible way.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a31_208a93f3","timestamp":"9/1/2026 19:01:24","name":"Carolina Garmendia","email":"cgarmendia@ufl.edu","phone":"3054969290","gender":"Female","race":"Hispanic or Latino","linkedin":"https://www.linkedin.com/in/carolina-garmendia-77851038b?utm_source=share_via&utm_content=profile&utm_medium=member_ios","resume":"https://drive.google.com/open?id=18aZTqP-JUUnZ1oB1iQJUULlEB1G9NwaH","university":"University of Florida","gradYear":"2028","classYear":"Junior","major":"Business Administration","minor":"Finance","gpa":"3.84","whyRem":"To become more involved in campus and in the business world. To learn and grow in the business world, connecting with fellow peers with similar interests","coreValue":"Community","valueEssay":"Growing up in very big, close communities, I have learned how important communities are in your day to day lives. People to help you grow, learn, and have other to lean on","careerInterests":"Investment Banking / Finance, Marketing","howRemHelps":"I believe joining Rem will help me learn more about business and help me learn more about how I see my day to day life in the future, in the workforce.","position":"Junior Consulting Strategist, Consulting Strategist, Team Lead","skills":"Business Strategy, Photography, Finance and accounting, Communications and copy-writing","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a32_f220f26f","timestamp":"9/1/2026 19:03:20","name":"Isabella Horowitz","email":"ihorowitz@ufl.edu","phone":"9178318983","gender":"Female","race":"White or Caucasian","linkedin":"www.linkedin.com/in/isabellahorowitz","resume":"https://drive.google.com/open?id=13jeyor_jK6jRT0gV2K71baDsysuLfqMw","university":"University of Florida","gradYear":"2028","classYear":"Junior","major":"Business Administration","minor":"Economics","gpa":"3.84","whyRem":"I want to be a member of Rem on Campus to have the opportunity to give back to small businesses and boost my career by learning skills to become a consultant and applying my past experiences. Joining this organization is important to my professional development because I want to learn more about what is involved in consulting to explore it as a career path. Additionally, my career goals align with Rem on Campus's values. I want to utilize creativity to help people and have the chance to work on a team to improve peoples' lives. Rem on Campus would be one of the best ways to boost my career and develop myself in my personal and professional life.","coreValue":"Intellectual Growth","valueEssay":"Intellectual growth stands out to me because college is a time to explore what I want for a career and to take every opportunity to grow my skillset. As someone who aspires to be able to solve business problems as well as everyday problems for all sorts of people, having technical training in college is one of the most valuable ways I can do this. Intellectual growth is a continuous process, but it allows you to expand your horizons to be able to think on a larger scale about the world, which can then be converted into broader problem solving skills. As an aspiring consultant with an interest in nonprofits, developing how I view and approach business problems is a key skill that I will need for success. Intellectual growth comes from challenging oneself, which is something I value that is also important for my career aspirations.","careerInterests":"Consulting, Entrepreneurship / Startups, Non-Profit / Social Impact, Undecided / Exploring Options","howRemHelps":"Joining Rem on Campus will boost my career because it focuses on developing consulting skills. While consulting is only one of my potential career paths, learning skills and having training as a consultant, regardless of which path I end up taking, will give me more opportunities throughout college and after graduation. Entrepreneurship and startups can both run into many problems as new companies and/or business concepts, and Rem on Campus would teach me the skills to approach those struggles head-on. It would also train me in relevant areas if I pursue a career in the non-profit/social impact category, because they also face several unique categories of issues that may have more legal restrictions. Rem on Campus would prepare me to face any problem in my own life and in whatever career path I pursue.","position":"Junior Consulting Strategist","skills":"Business Strategy, Statistics and modelling, Data analysis, Marketing and analytics, Photography, Social media management, Design Thinking, Ads (Facebook/Instagram), Brand Development","accommodations":"","other":"","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a33_093e80d3","timestamp":"9/1/2026 20:25:12","name":"Sanaya Rai","email":"Sanaya.rai@gmail.com","phone":"8473452413","gender":"Female","race":"Asian or Asian American","linkedin":"N/A","resume":"https://drive.google.com/open?id=109ClAqRWbbTvaNRGGh6DujuaHkF70UlQ","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"","gpa":"N/A","whyRem":"I want to be a member of REM on Campus because, coming to UF as an out-of-state student, I want to get involved and meet as many people as I can. Through word of mouth, I have heard many great things about REM and the opportunities it provides. Throughout high school, I was heavily involved in business centered clubs. However, none of them were tailored to consulting, which is an area I have been interested in pursuing. The opportunity to give back to local communities while developing my consulting and soft skills is something I believe I could gain a lot from. Additionally, I am excited to connect with the students already involved in REM. As I navigate my path through college, having the opportunity to talk with older students who have been in my shoes and learn from their experiences would be extremely valuable. Overall, I see REM as an opportunity to become more involved at UF as I build meaningful relationships and explore my continuing interest in consulting.","coreValue":"Resilience","valueEssay":"Resilience is the value that stands out to me. Throughout high school, I can think back to various times where I felt overwhelmed with stress, my course load, or just mentally drained.  Throughout these times, I kept reminding myself to push forward and get back on my feet. In college, I know I will face similar challenges and I plan to overcome them by being resilient and continuing forward. Being around like minded people in REM will allow me to have a community to rely on and I hope to be someone that people can rely on as well.","careerInterests":"Consulting, Investment Banking / Finance, Product Management, Non-Profit / Social Impact","howRemHelps":"I believe that joining REM on Campus will help me achieve my career goals as it will expose me to different pathways in the business world. While practicing my skills with consulting cases, I can identify my strengths and how I can build upon them, while also recognizing areas that I can improve on. Understanding these strengths and weaknesses will then help narrow down the numerous career fields that are available, allowing me to determine where my skills best fit. Similarly, being able to discuss with other members in REM their career journey and what they have learned will also be a huge helping hand in my journey. As someone who still has a lot to explore within the business world, I believe REM on Campus will provide me with the right guidance and opportunities.","position":"Junior Consulting Strategist","skills":"Business Strategy, Marketing and analytics, Social media management, Brand Development","accommodations":"No.","other":"Im super excited for this opportunity!","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a34_b20efe3d","timestamp":"9/1/2026 20:35:16","name":"Chloe Leskovac","email":"chloeleskovac@ufl.edu","phone":"3305658426","gender":"Female","race":"White or Caucasian","linkedin":"https://www.linkedin.com/in/chloe-leskovac-a12397433/","resume":"https://drive.google.com/open?id=19XdclzuNuulnN0awt13_nTrWCVPRouRj","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"","gpa":"3.82","whyRem":"I want to be part of REM on Campus because I'm interested in consulting and want to gain experience solving real world business problems. I'm especially interested in finance and wealth management. I think consulting would help me develop the analytical communication, and problem solving skills that are important in those fields. I also want to surround myself with motivated students who challenge me to think differently and take advantage of opportunities outside the classroom. I believe REM would give me the opportunity to learn from others, build meaningful connections, and get a better understanding of what a career in consulting can look like.","coreValue":"Resilience","valueEssay":"The core value of resilience stands out to me because I've learned that growth usually comes from moments when things don't go exactly planned. Starting college has pushed me outside of my comfort zone, especially as I figure out what I want my future in finance to look like. I've had to become comfortable not having everything figured out but rather pushing myself to pursue opportunities. I think resilience is especially important in consulting because you have to able to adapt, think critically, and stay confident. That is a quality I want to continue developing through REM and carry with me into my career.","careerInterests":"Consulting, Investment Banking / Finance, Marketing, Tech, Data Analytics / Business Intelligence, Product Management","howRemHelps":"I believe joining REM on Campus will l help me explore my interests in consulting while building skills that will be valuable in any business career. I want to gain hands on experience working through real problems, learn how to approach cases from different perspectives, and become a stronger communicator. I also think being surrounded by motivated students and professionals will push me outside of my comfort zone and help me better understand which career path is right for me. Ultimately, I see REM as a way to gain experience, build my network, and grow both personally and professionally.","position":"Junior Consulting Strategist","skills":"Business Strategy, Statistics and modelling, Mobile development, Marketing and analytics, Photography, Communications and copy-writing, Design Thinking, Ads (Facebook/Instagram)","accommodations":"No","other":"I am currently in the FPD program.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a48_8fc90a9f","timestamp":"9/2/2026 2:02:44","name":"Calvin Zou","email":"calvinzou08@gmail.com","phone":"908-274-6836","gender":"Male","race":"Asian or Asian American","linkedin":"www.linkedin.com/in/calvin-zou","resume":"https://drive.google.com/open?id=1f8Gj2iVNXQUfGt7Ia4ALtTMk8etmRI4H","university":"University of Florida","gradYear":"2030","classYear":"Freshman","major":"Finance","minor":"","gpa":"N/A for College 4.9/5.3 for Highschool","whyRem":"There are two main reasons why I want to be part of Rem On Campus. The first one is a bit basic, but I want more team-building experience and to join a community of people who have similar interests as me. I also want to branch out and learn more about completely different businesses so I can become more versatile and be able to adapt to different situations in the future.\n\nThe second reason is a bit more personal to me. I really like the idea of helping out small businesses and organizations. Where I’m from in Warren, New Jersey, we have a local farm called Wagner Farm. The farm has been in an ongoing battle with the town’s planning committee over plans to shut it down and build townhomes.  did not really think much of it, but during the summer after my freshman year they had a volunteering opportunity at the farm. I needed community service hours, so I decided to go. Volunteering there ended up being an amazing experience. I learned how to plant crops and stakes, package goods, manage composting bins, top off soil, and basically do a lot of the work a farmhand would do. It was really cool getting to learn things I probably would have never experienced otherwise.The best part, though, was the people. Wagner Farm has been passed down for multiple generations, and seeing how dedicated the farmers were to keeping it going was genuinely inspiring. I saw how hard they worked, and it was also clear that they were not just doing it for money. Around 50% of the produce from the farm is donated to people in need. Seeing people be that passionate about something while also doing something good for the community really stuck with me.\n\nThat is one of the biggest reasons why Rem On Campus interests me. Like you guys mentioned during the info session, for some small businesses and organizations, this is their livelihood and a mission they really care about. Back then, I could only really help Wagner Farm through physical labor. With Rem On Campus, I hope I can build the skills to help organizations like these in a bigger and more meaningful way.\nP.S they have been fighting a legal battle for like over 4 years about this(link to website: https://conservationwarren.org/history/)","coreValue":"Resilience","valueEssay":"Resilience stands out to me because I think a lot of growth comes from being able to adapt when things do not go as planned. I see this through a lot of people in my life, whether it is the farmers at Wagner Farm working hard to keep their farm from being torn down or my parents immigrating from a completely different continent, China, and starting a new life. All of them had to adapt in order to continue surviving and growing, whether that meant becoming the people they are today or keeping something they care deeply about alive.\n\nIn my own professional journey, I experienced this through the clubs I was involved in during high school, especially when it came to fundraising. As treasurer of my computer science club, I was rejected multiple times by businesses when asking them to sponsor our annual event. My first year as treasurer, though I do not like to admit it, was pretty abysmal. We only had around 15 attendees, and I managed to raise just $150, nowhere near enough for what we wanted the event to be. However, I was given another chance the next year and did not want to repeat the same mistakes. I changed my approach, looked at what did not work the year before, and became much more persistent when reaching out to businesses. By my senior year, I was able to raise over $1,000 and help bring in a record 65 attendees. \n\nThis idea of failure and growth is really cliche but if I just gave up I would have never seen the highs. Resilience is one of the important traits anyone can have when it comes to succeeding.","careerInterests":"Consulting, Investment Banking / Finance, Data Analytics / Business Intelligence, Non-Profit / Social Impact","howRemHelps":"Rem On Campus will help me achieve my career goals because all the fields I chose require strong problem-solving, communication, adaptability, and analytical skills. At Rem, being placed in unfamiliar situations will force me to become more resilient and comfortable with challenges. I will have to build the confidence and ability to research unfamiliar situations deeply and figure out how to approach them. I will also have the opportunity to work with different people, approach real-life problems from multiple perspectives, and learn how to turn ideas and information into actual solutions. Whatever I eventually choose to pursue, I believe these experiences will help me become someone who can adapt quickly, think critically, and contribute to a team even when I do not immediately know the answer.","position":"Junior Consulting Strategist","skills":"Statistics and modelling, Web design, Data analysis, Marketing and analytics, Photography, Python, Design Thinking, Machine Learning","accommodations":"No","other":"I am fluent in Chinese so I can help gain \"trust\" by speaking a native language for some clients that this skill applies to. I also have some experience running a small business through my friend's watch making business. A lot of my high school EC's had me planning and developing then executing fundraisers, events, etc. so I have some experience in those departments.","commitment":"Yes","attendance":{"coffeeChats":[{"timestamp":"9/3/2026 18:56:59","spokeTo":"Max, Eli, Terren"}],"infoSession":{"timestamp":"9/2/2026 0:21:30","session":"09/01","appliedBefore":"No"},"meetMembers":null}},{"id":"a35_5b7764a0","timestamp":"9/2/2026 11:09:41","name":"Zachary Meyerowitz","email":"zachary@meyerowitzfamily.com","phone":"4705503339","gender":"Male","race":"White or Caucasian","linkedin":"www.linkedin.com/in/zacharymeyerowitz","resume":"https://drive.google.com/open?id=1ClxNmOQshfLucPKFFHSoGwTzCEADG0Qf","university":"University of Florida","gradYear":"2028","classYear":"Junior","major":"Business Administration, International Relations / Global Studies","minor":"","gpa":"3.83","whyRem":"I'm eager to join Rem on Campus for the chance to grow both professionally and intellectually in a challenging, supportive environment. The organization offers hands-on consulting experience in a field I'm genuinely passionate about pursuing, and I look forward to working alongside driven, hard-working peers who will expand my network and push me to raise my professional and personal standards. What excites me most, though, is the opportunity to partner directly with real-world companies to deliver practical solutions with tangible impact.","coreValue":"Community","valueEssay":"Hands down, the most important value for me is community. I come from a place where community is everything, everybody knows everybody, and everyone is there for one another. Whenever something bad happens, there are always people willing to lend a helping hand. My community has always pushed me to do better and work harder, and I want to be part of an organization that does the same. That's a big part of why I'm eager to join Rem: I'll gain not only a community of hard-working, driven peers to work alongside on projects, but also a nationwide network of past and present Rem members whose experience I can continue to learn from.","careerInterests":"Consulting, Undecided / Exploring Options","howRemHelps":"I believe joining Rem on Campus will help me achieve my career goals because it will expose me to real-world problems and cases while also providing a strong network of people who can be great advocates and supporters. The tasks and projects in Rem will be instrumental to my personal growth, helping me build proficiency in skills and tactics that are essential when dealing with real-world cases, directly preparing me for the consulting cases I may see once I'm in my career. On top of that, Rem offers a network of hard-working, successful peers and mentors who will all be valuable connections to have in the future.","position":"Junior Consulting Strategist","skills":"Business Strategy, Search Engine Optimization (SEO), Finance and accounting","accommodations":"NA","other":"I am really excited about the potential opportunity to be part of Rem. I've heard so many great things from friends and peers about the organization, and I'm eager to be a part of it.","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a36_aa32f18e","timestamp":"9/2/2026 12:37:41","name":"Avaneesh Yada","email":"avanyada2193@gmail.com","phone":"9047750388","gender":"Male","race":"Asian or Asian American","linkedin":"| linkedin.com/in/avaneesh-yada-388738431","resume":"https://drive.google.com/open?id=1MkYYnt2yae_G1mlFnNY73LAYnHfor7Sj","university":"University of Florida","gradYear":"2029","classYear":"Sophomore","major":"Finance","minor":"","gpa":"3.4","whyRem":"I want to be a member because I can get real world experience with consulting and I'm intrigued to help small businesses and creating real strategies with your community to combat problems.","coreValue":"Community","valueEssay":"This value stands out to me because I watched one of my dad's close friends struggle to keep his Indian restuarant afloat. I saw how he had thin margins, how long it took to keep the place running, and controversies with coworkers and staff. That's when I realize that just knowledge can only take you so far. I'm majoring in finance because I want to be one of those people to fix those type of problems. REM is a perfect opportunity  to where I can be part of a community to help people.","careerInterests":"Consulting, Marketing","howRemHelps":"Consulting and marketing both involve solving real problems, and Rem on Campus gives an opportunity to do that instead of just learning about it in my finance classes. I think about my dad's friend and his restaurant a once in a while, and just wonder how different it could've been if someone helped fix his problems. Rem on campus puts me on real small businesses and would let me get real world experience.","position":"Junior Consulting Strategist","skills":"Business Strategy, Statistics and modelling, Marketing and analytics, Photography","accommodations":"No accommodations","other":"N/A","commitment":"Yes","attendance":{"coffeeChats":[],"infoSession":null,"meetMembers":null}},{"id":"a37_67d3d9fb","timestamp":"9/2/2026 12:45:08","name":"Gabriella Angulo","email":"gabriella.angulo@ufl.edu","phone":"8139971580","gender":"Female","race":"Hispanic or Latino","linkedin":"www.linkedin.com/in/gabriella-angulo","resume":"https://drive.google.com/open?id=1lbVSKheoqHjJgGBULqs_RNreDrVGwD4i","university":"University of Florida","gradYear":"2028","classYear":"Junior","major":"Engineering (various disciplines)","minor":"","gpa":"3.96","whyRem":"I want to join Rem on Campus because I am looking for real, hands-on experience and hard skills that go far beyond what a textbook can teach. Classroom learning provides a solid foundation, but nothing replaces the growth that comes from solving fast-paced, real-world business challenges. What excites me most is the opportunity to work directly with local business owners and clients. I want to grow my learning in how to diagnose operational bottlenecks, analyze data under realistic constraints, and deliver strategies that genuinely impact a business’s bottom line. Presenting recommendations to real stakeholders will force me to think on my feet and refine my professional communication. Ultimately, I want to bridge the gap between academic theory and real execution. Rem on Campus offers the ideal environment to develop those practical consulting and supply chain skills while delivering meaningful results alongside a high-performing team.","coreValue":"Resilience","valueEssay":"Resilience stands out most to me because true growth happens when things do not go according to plan. Early in my academic journey, facing steep challenges in aerospace engineering left me feeling defeated. Instead of letting that setback define me, I chose to
