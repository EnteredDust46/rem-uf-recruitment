<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REM UF Recruitment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============ Tokens ============ */
:root {
  --paper: #f7f7f4;
  --paper-raised: #ffffff;
  --ink: #171b23;
  --ink-soft: #3a4150;
  --slate: #646d7d;
  --slate-faint: #9aa2b0;
  --line: #e2e3e0;
  --line-strong: #cdd0d6;
  --accent: #2f5fdb;
  --accent-soft: #e8edfb;
  --accent-ink: #1c3f9c;
  --accent2: #b4661e;
  --accent2-soft: #f7e9da;
  --good: #24784f;
  --good-soft: #e3f2e9;
  --warn: #a8710f;
  --warn-soft: #fbf0da;
  --bad: #b23c3c;
  --bad-soft: #fbe6e6;
  --radius-s: 6px;
  --radius-m: 10px;
  --radius-l: 16px;
  --shadow-card: 0 1px 2px rgba(20, 24, 32, 0.06), 0 1px 1px rgba(20, 24, 32, 0.04);
  --font-display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  --font-body: 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12141a;
    --paper-raised: #1a1d25;
    --ink: #eceef2;
    --ink-soft: #c4c9d4;
    --slate: #8891a1;
    --slate-faint: #5c6272;
    --line: #2a2e38;
    --line-strong: #383d49;
    --accent: #6f92e8;
    --accent-soft: #1e2740;
    --accent-ink: #cdd8f7;
    --accent2: #d99354;
    --accent2-soft: #332619;
    --good: #5cb885;
    --good-soft: #16281f;
    --warn: #d3a44a;
    --warn-soft: #2e2617;
    --bad: #e08080;
    --bad-soft: #301c1c;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 1px rgba(0, 0, 0, 0.2);
  }
}

:root[data-theme="dark"] {
  --paper: #12141a;
  --paper-raised: #1a1d25;
  --ink: #eceef2;
  --ink-soft: #c4c9d4;
  --slate: #8891a1;
  --slate-faint: #5c6272;
  --line: #2a2e38;
  --line-strong: #383d49;
  --accent: #6f92e8;
  --accent-soft: #1e2740;
  --accent-ink: #cdd8f7;
  --accent2: #d99354;
  --accent2-soft: #332619;
  --good: #5cb885;
  --good-soft: #16281f;
  --warn: #d3a44a;
  --warn-soft: #2e2617;
  --bad: #e08080;
  --bad-soft: #301c1c;
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 1px rgba(0, 0, 0, 0.2);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent-soft); color: var(--accent-ink); }
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; margin: 0; color: var(--ink); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ============ Shell ============ */
#app { display: flex; height: 100vh; overflow: hidden; }

.rail {
  width: 216px;
  flex: none;
  background: var(--paper-raised);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 18px 12px;
  gap: 4px;
}
.rail-brand {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  padding: 4px 10px 14px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.rail-brand .sub { font-family: var(--font-body); font-size: 11px; color: var(--slate); font-weight: 400; letter-spacing: .02em; }
.rail-group { margin-top: 14px; padding: 0 10px 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--slate-faint); font-weight: 600; }
.rail-btn {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 10px; border-radius: var(--radius-s); border: none; background: transparent;
  color: var(--ink-soft); font-size: 13.5px; text-align: left; cursor: pointer; width: 100%;
}
.rail-btn:hover { background: var(--accent-soft); color: var(--accent-ink); }
.rail-btn.active { background: var(--accent); color: white; font-weight: 600; }
.rail-btn .count { font-family: var(--font-mono); font-size: 11px; opacity: .75; }
.rail-foot { margin-top: auto; padding: 10px; font-size: 11px; color: var(--slate-faint); }
.rail-foot .dot { display:inline-block; width:6px; height:6px; border-radius:50%; background: var(--good); margin-right: 5px; }

.main { flex: 1; overflow-y: auto; }
.topbar {
  position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
  padding: 14px 28px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.topbar h1 { font-size: 20px; }
.topbar .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--slate); margin-bottom: 2px; }
.topbar-spacer { flex: 1; }
.content { padding: 24px 28px 60px; max-width: 1320px; }

/* ============ Buttons / inputs ============ */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px; border-radius: var(--radius-s); border: 1px solid var(--line-strong);
  background: var(--paper-raised); color: var(--ink); font-size: 13px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent-ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
.btn.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); color: white; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:disabled:hover { border-color: var(--line-strong); color: var(--ink); }

input[type="text"], input[type="search"], select, textarea {
  font-family: inherit; font-size: 13px; color: var(--ink);
  background: var(--paper-raised); border: 1px solid var(--line-strong); border-radius: var(--radius-s);
  padding: 7px 10px;
}
textarea { font-family: inherit; resize: vertical; width: 100%; line-height: 1.5; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  border: 1px solid var(--line-strong); background: var(--paper-raised); color: var(--slate);
  cursor: pointer;
}
.chip.active { background: var(--accent); border-color: var(--accent); color: white; }
.chip.static { cursor: default; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.accent2 { background: var(--accent2-soft); color: var(--accent2); border-color: transparent; }

/* ============ Cards / layout ============ */
.card {
  background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius-m);
  box-shadow: var(--shadow-card);
}
.card-pad { padding: 18px 20px; }
.grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat-tile { padding: 14px 16px; }
.stat-tile .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--slate); margin-bottom: 6px; }
.stat-tile .value { font-family: var(--font-mono); font-size: 26px; font-weight: 600; }
.stat-tile .sub { font-size: 11.5px; color: var(--slate-faint); margin-top: 3px; }

.section-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display:flex; align-items:center; gap:8px; }
.section-title .n { color: var(--slate); font-weight: 400; font-size: 12px; }

.two-col { display: grid; grid-template-columns: 1.55fr 1fr; gap: 20px; align-items: start; }
@media (max-width: 980px) { .two-col { grid-template-columns: 1fr; } }

/* ============ Table ============ */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-m); background: var(--paper-raised); }
table.grid { border-collapse: collapse; width: 100%; font-size: 13px; }
table.grid th {
  text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--slate);
  padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none;
  position: sticky; top: 0; background: var(--paper-raised);
}
table.grid th:hover { color: var(--accent-ink); }
table.grid th.sorted::after { content: ' ▾'; color: var(--accent); }
table.grid td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.grid tr:last-child td { border-bottom: none; }
table.grid tr.clickable { cursor: pointer; }
table.grid tr.clickable:hover { background: var(--accent-soft); }
.name-cell { display: flex; flex-direction: column; }
.name-cell .nm { font-weight: 600; }
.name-cell .sub { font-size: 11.5px; color: var(--slate); }
.score-pill {
  display: inline-flex; align-items: center; justify-content: center; min-width: 30px;
  font-family: var(--font-mono); font-weight: 700; font-size: 12.5px;
  padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink);
}
.score-pill.none { background: var(--line); color: var(--slate); }
.score-pill.good { background: var(--good-soft); color: var(--good); }
.score-pill.bad { background: var(--bad-soft); color: var(--bad); }

/* ============ Filters bar ============ */
.filters-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.filters-bar input[type="search"] { width: 220px; }

/* ============ Grade view ============ */
.applicant-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.applicant-header h2 { font-size: 24px; }
.applicant-header .meta { color: var(--slate); font-size: 13px; margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
.applicant-header .meta span { display: inline-flex; align-items: center; gap: 4px; }

.dim-card { border: 1px solid var(--line); border-radius: var(--radius-m); background: var(--paper-raised); margin-bottom: 14px; overflow: hidden; }
.dim-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--accent-soft); }
.dim-head h4 { font-size: 13.5px; font-family: var(--font-body); font-weight: 700; color: var(--accent-ink); }
.dim-head.draft { background: var(--warn-soft); }
.dim-head.draft h4 { color: var(--warn); }
.dim-body { padding: 14px 16px; }
.dim-body .prompt { font-family: var(--font-display); font-size: 17px; line-height: 1.4; margin-bottom: 10px; }
.read-aloud { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 700; margin-bottom: 4px; }

.band-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0 12px; }
.band-opt { border: 1px solid var(--line-strong); border-radius: var(--radius-s); padding: 8px 9px; font-size: 11.5px; cursor: pointer; background: var(--paper); }
.band-opt .sc { font-family: var(--font-mono); font-weight: 700; margin-right: 4px; }
.band-opt:hover { border-color: var(--accent); }
.band-opt.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }

.score-selector { display: flex; gap: 6px; margin-top: 8px; }
.score-btn {
  width: 34px; height: 34px; border-radius: var(--radius-s); border: 1px solid var(--line-strong);
  background: var(--paper); font-family: var(--font-mono); font-weight: 700; font-size: 14px; cursor: pointer;
}
.score-btn:hover { border-color: var(--accent); }
.score-btn.sel { background: var(--accent); border-color: var(--accent); color: white; }

.year-tabs { display: flex; gap: 6px; margin-bottom: 8px; }
.year-tab { font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line-strong); cursor: pointer; color: var(--slate); }
.year-tab.sel { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.notes-field { margin-top: 6px; }
.notes-field textarea { min-height: 54px; font-size: 13px; }

.side-stack { position: sticky; top: 74px; display: flex; flex-direction: column; gap: 14px; }
.essay-block { font-size: 13.5px; white-space: pre-wrap; line-height: 1.6; max-height: 220px; overflow-y: auto; padding-right: 4px; }
.essay-block::-webkit-scrollbar { width: 6px; }
.essay-block::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }
.field-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--slate); margin: 12px 0 4px; font-weight: 600; }
.field-label:first-child { margin-top: 0; }

.avg-display { display: flex; align-items: baseline; gap: 6px; }
.avg-display .big { font-family: var(--font-mono); font-size: 32px; font-weight: 700; }
.avg-display .of { color: var(--slate); font-size: 13px; }

.attendance-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; border-bottom: 1px dashed var(--line); }
.attendance-row:last-child { border-bottom: none; }
.attendance-row .ic { width: 16px; text-align: center; }
.attendance-row.yes .ic { color: var(--good); }
.attendance-row.no .ic { color: var(--slate-faint); }

/* ============ Groups view ============ */
.group-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.group-card { padding: 14px 16px; }
.group-card h4 { font-size: 14px; margin-bottom: 2px; }
.group-card .members { font-size: 12px; color: var(--slate); margin-bottom: 10px; }
.group-card .load { font-family: var(--font-mono); font-size: 22px; font-weight: 700; }
.group-card .load .of { font-family: var(--font-body); font-size: 12px; color: var(--slate); font-weight: 400; }
.reassign-list { max-height: 160px; overflow-y: auto; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
.reassign-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; padding: 3px 0; }
.reassign-row select { font-size: 11px; padding: 2px 4px; }

/* ============ Bars / distribution ============ */
.bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 6px; }
.bar-row .lbl { width: 96px; flex: none; color: var(--slate); text-align: right; }
.bar-track { flex: 1; height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 5px; }
.bar-row .val { width: 30px; flex: none; font-family: var(--font-mono); font-weight: 600; }

.reviewer-bias-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.reviewer-bias-row:last-child { border-bottom: none; }
.reviewer-bias-row .nm { width: 110px; flex: none; font-weight: 600; }
.reviewer-bias-row .n { color: var(--slate-faint); font-size: 11px; }

/* ============ Misc ============ */
.empty-state { text-align: center; padding: 60px 20px; color: var(--slate); }
.empty-state h3 { color: var(--ink); margin-bottom: 6px; }
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: var(--radius-s);
  font-size: 13px; z-index: 50; box-shadow: var(--shadow-card); opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

.save-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--slate-faint); display:inline-block; }
.save-dot.saved { background: var(--good); }
.save-dot.saving { background: var(--warn); }
.save-dot.error { background: var(--bad); }
.save-dot.nodb { background: var(--bad); opacity: .55; }

.recommend-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }

.flag-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 10px; }
.flag-row input { width: auto; }

.overflow-menu { position: relative; }

.modal-backdrop { position: fixed; inset: 0; background: rgba(10,12,16,.4); display: flex; align-items: center; justify-content: center; z-index: 40; }
.modal { background: var(--paper-raised); border-radius: var(--radius-l); padding: 22px; max-width: 480px; width: 92%; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.modal h3 { margin-bottom: 10px; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

.case-select { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }

.university-tag { font-size: 11px; color: var(--slate); }

.progress-track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; display: flex; }
.progress-seg { height: 100%; }

.sync-note { font-size: 12px; color: var(--slate-faint); display: flex; align-items: center; gap: 6px; }


/* ============ Auto-scored dimensions ============ */
.band-opt.sel.auto {
  border-style: dashed;
  background: color-mix(in srgb, var(--accent-soft) 60%, var(--paper));
}
.chip.auto {
  background: var(--accent-soft);
  color: var(--accent-ink);
  border: 1px dashed var(--accent);
  font-size: 10px;
  letter-spacing: .04em;
  text-transform: uppercase;
  font-weight: 600;
}
.auto-note {
  margin-top: 10px;
  font-size: 11.5px;
  color: var(--slate);
  line-height: 1.45;
  padding-left: 9px;
  border-left: 2px solid var(--accent);
}
.auto-note strong { color: var(--ink); font-family: var(--font-mono); }
.auto-note.overridden { border-left-color: var(--accent2); }
.auto-note.needs { border-left-color: var(--warn); }
.auto-note em { color: var(--ink-soft); font-style: normal; font-family: var(--font-mono); }
.linkbtn {
  border: none; background: none; padding: 0;
  color: var(--accent); font-size: 11.5px; cursor: pointer;
  text-decoration: underline; text-underline-offset: 2px;
}
.gpa-cell { display: inline-flex; align-items: center; gap: 6px; }
.gpa-cell .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.gpa-cell.none { color: var(--slate-faint); font-size: 11.5px; font-style: italic; }
.auto-pill {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 4px;
  border: 1px dashed var(--accent); border-radius: 5px;
  background: var(--accent-soft); color: var(--accent-ink);
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
}


/* ============ Vouching ============ */
.vouch-card.has { border-color: color-mix(in srgb, var(--accent2) 45%, var(--line)); }
.vouch-card .section-title .n {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 17px; height: 17px; margin-left: 4px; padding: 0 4px;
  border-radius: 9px; background: var(--accent2); color: #fff;
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
}
.vouch-row { display: flex; flex-wrap: wrap; gap: 5px; }
.vouch-chip {
  border: 1px solid var(--line-strong); background: var(--paper);
  color: var(--ink-soft); border-radius: 999px;
  padding: 4px 11px; font-size: 12px; cursor: pointer;
}
.vouch-chip:hover { border-color: var(--accent2); color: var(--accent2); }
.vouch-chip.on {
  background: var(--accent2); border-color: var(--accent2); color: #fff; font-weight: 600;
}
.vouch-badge {
  margin-left: 6px; padding: 1px 6px; border-radius: 999px;
  background: color-mix(in srgb, var(--accent2) 14%, transparent);
  color: var(--accent2); font-family: var(--font-mono);
  font-size: 10.5px; font-weight: 700; vertical-align: middle;
}
.muted-note { color: var(--slate-faint); font-size: 12px; }

</style>
</head>
<body>
<div id="app">
  <div class="rail" id="rail"></div>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>

t me up for later challenges in my career goals in the finance/real estate realm. As an incoming freshman, I have taken many courses to learn more about finance and real estate. However, I have not yet been able to apply in a high-performance team with actual clients. Rem on Campus will help me achieve this, preparing me for a future career in similar, scaled environments.", "position": "Junior Consulting Strategist, Consulting Strategist", "skills": "Business Strategy, Statistics and modelling, Web design, Data analysis, Marketing and analytics, Finance and accounting", "accommodations": "n/a", "other": "n/a", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": {"timestamp": "2026-09-02T00:21:39.511000", "session": "09/01", "appliedBefore": "No"}, "meetMembers": null}}, {"id": "a1_5f74c4d6", "timestamp": "7/12/2026 17:42:58", "name": "Jose Lazzaro", "email": "joselazzaro@ufl.edu", "phone": "7866723091", "gender": "Male", "race": "Hispanic or Latino", "linkedin": "www.linkedin.com/in/jose-lazzaro-b4471b340", "resume": "https://drive.google.com/open?id=1l6rHoESbzncIGBkZvFXs61bho_UnO08U", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Finance", "minor": "", "gpa": "4", "whyRem": "I want to join Rem on Campus because I believe business has the power to create meaningful change in communities. Throughout my journey, I have always looked for ways to combine my passion for leadership, problem-solving, and helping others. From founding Un Solo Bal\u00f3n at 17 to supporting accounting operations and working on community-focused campaign initiatives, I have been fortunate to experience how strong organizations are built through strategy, teamwork, and a commitment to serving others.\n\nWhat excites me about Rem is the opportunity to continue growing while learning the consulting process in a structured environment. I have gained experience creating solutions and leading initiatives, but I want to develop the skills to analyze complex challenges, think more strategically, and provide valuable recommendations to organizations. I am excited to learn from other driven students, contribute my experiences, and continue becoming a stronger leader who can create a positive impact.", "coreValue": "Community", "valueEssay": "Community stands out to me the most because I believe the greatest impact is created when people come together with a shared purpose. Throughout my journey, I have always looked for ways to use my skills and opportunities to support others and create something meaningful.\n\nThis value connects deeply with my experience founding Un Solo Bal\u00f3n, where I built an organization around using soccer to bring opportunities, resources, and hope to underserved youth athletes in La Guaira, Venezuela. Through this experience, I learned that leadership is not only about achieving goals, but about building relationships, understanding people, and creating an environment where others can grow.\n\nMy experiences in community outreach, campaign operations, and nonprofit leadership have shown me the importance of collaboration and service. I believe strong communities create stronger organizations, and I want to continue developing as a leader who uses business to make a positive impact in the world.", "careerInterests": "Consulting, Investment Banking / Finance, Data Analytics / Business Intelligence, Entrepreneurship / Startups, Non-Profit / Social Impact", "howRemHelps": "Joining Rem on Campus will help me achieve my career goals by strengthening the skills needed to succeed in finance, investment banking, and consulting. Through my experiences in accounting, nonprofit leadership, and campaign operations, I have developed a strong foundation in financial analysis, problem-solving, and managing complex projects. However, I want to continue developing my ability to analyze business challenges, create strategic recommendations, and communicate effectively with clients and ssYear": "Sophomore", "major": "Foreign Language Studies (e.g. Spanish, German, Mandarin), Political Science / Public Policy", "minor": "", "gpa": "3.87", "whyRem": "My valiant, resilient, and kind father is a small-business owner of a construction company. Since starting his career, all that he has dreamed of is owning his own company and being able to construct homes and retail spaces for his clients independently, using his own creative flair and enhancing stale business models and construction practices. It has been so inspiring and fulfilling to watch him live out his dream and have success. \n\tHowever, in 2025, his business took a turn when two of his clients did not pay him for his work, resulting in him losing over $500,000. Watching my father as he attempts to handle the arbitration cases, keep his business afloat, and his current clients happy, and do all the pesky tasks involved in being a one-man show has been crushing. \nAdditionally, because his degree is only in construction management, which did not include extensive education on owning your own business, he has struggled with marketing, accounting, managing his inbox and meetings, and adapting to technology changes from the beginning. \nThis summer, I have worked with him extensively, helping to manage his social media pages, crafting a new business plan to accommodate his new focus on new-build homes, and creating AI models to offload work that typically would take him 20 hours a week to complete. Through these changes, his faith in himself and the future of his company has grown, and being an instrumental part of this and helping to maintain his years-long dream has been one of the most fulfilling things I have ever done. \nI believe that there is something incredibly special about people like those at Rem, who are dedicated to helping small-business owners like my father accomplish their dreams. I hope to join the legacy of the teams at Rem who listen attentively and have genuine care for the stories and struggles of visionary small-business owners, who selflessly give their own time to drive innovation, who are committed to always learning new things to better their own craft and to help clients, and who support one another in Rem-related activities and in their colleagues' personal and professional development. \n", "coreValue": "Community", "valueEssay": "Although the recipient of my accomplishments may only be me, each one reflects the many communities that have invested in me, given me the ability to follow my dreams, and supported my success. \n\tThe various communities I belong to, from the small communities of immediate family and soccer teams to larger communities like my hometown and home state of Kentucky, have shaped me into the person I am today. Using the principles of a strong community, I have consistently sought ways to engage in and enhance various communities that have impacted me. \nIn high school, I heard of a Kindergartener at my elementary school who spoke little English and could not maintain the pace of lessons. Understanding the role of education and my elementary school on me, I seized the opportunity to empower and educate her. After consistent tutoring, she is now exceeding Kentucky education standards, and I have also begun tutoring her brother and parents, helping them adjust to cultural changes, understand the back of medicine labels, and connecting them to free community resources. \nAfter noticing a gap in programs for local youth, I partnered with a Northern Kentucky nonprofit, the Brighton Center, to develop small programs and initiatives to promote prosocial behaviors and end the cycles of drug abuse in my own community. \nIn my scholarship cohort, through my own experience and listening to the stories of my colleagues, I noticed that there was little activity to foster true community among scholars and the greater UF community. So, with the collaboration of my fellow scholars, we are working to instate a big-little program, hosting more community service events, creating panels of distinguished guest speakers, and forging early and meaningful connections with incoming scholars so that our scholar community can be defined by pillars of friendship, service, and learning.\nThrough these experiences of developing and enhancing my communities, I have learned the value and importance of investing in all members of a community, not just the smartest or most wealthy ones. I hope to continue this commitment of fulfilling unmet needs, seeing the purpose and value in everyone, and recognizing the importance of those around me  for the rest of my life, but on even larger scales.  \n", "careerInterests": "Consulting, Non-Profit / Social Impact, Public Policy / Government, Law", "howRemHelps": "I believe that Rem on Campus will help me achieve my ultimate career goal of becoming an attorney because of Rem's overlap with the role of attorneys. \nAttorneys, like consultants, must be creative problem solvers, excellent collaborators, principled advisors, and effective communicators. At Rem, I am confident that I will build all of these skills to be both a successful attorney and consultant. Learning how to develop practical and personalized solutions for clients, craft effective proposals and presentations, and collaborate in teams with individuals of various strengths and specialties are not just skills I will develop through my time at Rem, but the exact skills that will help me become a successful, empathetic, and trustworthy attorney and standout in law school admissions essays. \nFurthermore, as stated previously, individuals who are dedicated to helping others achieve their dreams, sometimes at the expense of themselves, are remarkable and exactly the kind of people I want to surround myself with. I am confident that my fellow members at Rem will become my lifelong friends and constant sources of strength and inspiration that will transcend my years at UF and support my professional growth d accountable for the outcome. Ultimately my goal isn't simply to sit in on strategy but to lead others through the same process I want to begin. I am also very motivated by the community aspect of REM, my time this summer showed me how a smaller, resource-strapped team can benefit from the resilience of all parties involved, and I know that the same effort and results that I accomplished over this summer can benefit a Gainesville business rather than just my own resume. Mostly, I believe REM is a club that fits my goals due to the real stakes, as I have come to learn that I work best under pressure with real stakes, and REM's actual impact provides that motivation that I believe will push me to thrive.", "coreValue": "Resilience", "valueEssay": "Resilience stands out to me because it is the value that I have relied on most when I run into obstacles, no matter the stakes or circumstances, I've learned to treat each misstep as information. Every \"mistake\" results in a process of figuring out what didn't work, adjusting the plan and trying again. This is the same mindset I have employed professionally working at Glacier and SmartStamp, as well as at Founders Fund here at UF. This persistence is exactly why I want to continue testing myself in high-stakes, real-life environments like REM, where willingness to fail, adapt and try again alongside like minded peers is the ultimate goal.", "careerInterests": "Investment Banking / Finance, Data Analytics / Business Intelligence, Entrepreneurship / Startups", "howRemHelps": "Currently, I plan on pursuing a field in either Investment Banking or Commercial Real Estate. Both these fields reward people who can tackle an ambiguous problem, build a rigorous stance, and present your solution or proposal convincingly to those around you. By working directly with local businesses to diagnose real challenges and pitch data-backed recommendations mirrors the same work I have already done in financial modeling and market analysis. By ion to detail, and the ability to understand a business from multiple perspectives. Rem would give me an opportunity to develop these skills through hands-on consulting work while learning from other motivated students.", "coreValue": "Intellectual Growth", "valueEssay": "Intellectual Growth stands out to me because I am motivated by constantly learning how businesses operate, create value, and make strategic decisions. My interest in investment banking has pushed me to look beyond simply understanding financial statements and to think about why companies make certain decisions and how those decisions affect their future growth. Through my academic, technical, and entrepreneurial experiences, I have learned that I enjoy breaking down complex problems and finding practical solutions. I see Rem as an opportunity to continue developing that mindset by working with teammates, learning from different perspectives, and tackling real-world business challenges.", "careerInterests": "Investment Banking / Finance", "howRemHelps": "My long-term goal is to pursue a career in investment banking, and I believe Rem would help me develop several skills that are essential to succeeding in that field. Through client projects, I would gain experience analyzing companies, understanding business models, evaluating strategic decisions, and presenting recommendations. I would also strengthen my ability to work under deadlines, collaborate effectively, and communicate complex information clearly. These experiences would complement my growing interest in financial analysis and valuation while giving me a stronger understanding of how businesses operate beyond what can be learned in a classroom.", "position": "Junior Consulting Strategist", "skills": "Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Business Strategy, Marketing and analytics, Finance and accounting, Ads (Facebook/Instagram)", "accommodations": "", "other": "I am particularly interested in developing the analyti rform best when I am challenged by others, exposed to perspectives different from my own, and working toward a shared goal.\n\nI also believe that the strongest working relationships go beyond simply completing a project together. They are built through trust, cooperation, and a genuine desire to see other people succeed. That is why REM\u2019s emphasis on community resonates with me. I want to grow professionally, but I also want to build meaningful relationships with the students I work alongside and the small businesses we support.\n\nBeing part of an environment where I can learn from others, contribute my own perspective, and see the collective impact of our work is exactly what I am looking for. I see REM as a place where professional development and personal relationships reinforce one another.", "careerInterests": "Consulting, Entrepreneurship / Startups", "howRemHelps": "Joining REM on Campus would help me pursue my interests in consulting and entrepreneurship by giving me hands-on experience solving real business problems for small businesses. In consulting, I am interested in learning how to break down ambiguous challenges, analyze information, develop practical recommendations, and communicate those ideas clearly to clients. REM would allow me to practice those skills in a real-world setting rather than only learning them conceptually.\n\nAt the same time, working directly with small businesses would give me valuable exposure to entrepreneurship. I would gain a better understanding of how businesses make decisions around growth, operations, customers, and strategy, as well as the challenges founders face when building and scaling a company. I believe this combination of client-facing problem solving and exposure to growing businesses would help me become a stronger analytical thinker while giving me a clearer understanding of both consulting and the startup environment.", "position": "Junior Consulting Strategist, Consulting Strategist", "skills": "Business Strategy, Data analysis, Finance and accounting, Python", "accommodations": "", "other": "I am entering this process with a genuine willingness to learn. While I am interested in careers involving consulting and entrepreneurship, I am still exploring where my strengths and interests will ultimately take me. That is one of the reasons REM is particularly appealing to me. It would allow me to gain real client experience, learn from other students, and better understand how analytical thinking translates into meaningful business outcomes.\n\nI would also bring a strong sense of curiosity and ownership to the organization. If I do not understand something, I am willing to ask questions, research it, and put in the work necessary to improve. I would approach REM not simply as another organization to add to my resume, but as an opportunity to contribute to real businesses, learn from the people around me, and become a stronger teammate and problem solver.", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a8_57e3cb9d", "timestamp": "8/24/2026 19:30:47", "name": "Alejandro Diaz", "email": "AlejandroDZ2025@gmail.com", "phone": "321-305-1595", "gender": "Male", "race": "Hispanic or Latino", "linkedin": "www.linkedin.com/in/alejandrodiazzz", "resume": "https://drive.google.com/open?id=16YBUfP1MeRl0XKySO9GjrIuvLiiyB9QA", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Computer Science / Information Systems, Finance", "minor": "Data Science, Other", "gpa": "3.5", "whyRem": "Rem on Campus's core mission to empower local communities is what drives me to becoming a member of this organization. Running my own digital business taught me firsthand the sheer grit it takes to keep going, and I want to bridge my passion for supporting local owners with my love for data-driven problem solving. I'm eager to bring my strong analytical foundation to the Junior Consulting Strategist role to help Gainesville businesses uncover actionable insights and confidently navigate their hurdles. Rem's \"Learning, Applying, Leading\" framework is exactly what I need to transition from building analytical models to delivering client-facing strategies alongside innovative peers.", "coreValue": "Resilience", "valueEssay": "As a first-generation student, resilence allowed me to map my own academic path without a blueprint. This same grit drove my pivot into data analytics within the business world. Embracing that steep learning curve pushed me to engineer complex models for personal projects and research teams. In consulting, setbacks are inevitable. Resilence is what transforms roadblocks into strategic pivots. As a Junior Consulting Strategist, I plan to leverage this perserverance to help Gainesville entrepreneurs navigate their own challenges and build lasting success.", "careerInterests": "Consulting, Investment Banking / Finance, Tech, Data Analytics / Business Intelligence", "howRemHelps": "My goals in consulting, finance, tech, and data analytics center on translating complex information into actionable business strategies. While I possess the technical skills to build predictive models, I need client-facing experience to evolve into a well-rounded advisor. Joining Rem provides the perfect environment to apply my quantitative skills to business problems, and collaborating with local owners will teach me how to effectively communicate impactful insights. This experience in empathy, communication, and strategy execution will build the exact capabilities needed to be successful within different initiatives across my target industries.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Statistics and modelling, Data analysis, Marketing and analytics, Finance and accounting, Communications and copy-writing, Python, Microsoft Office Suite", "accommodations": "N/A", "other": "N/A", "commitment": "Yes", "attendance": {"coffeeChats": [{" , Entrepreneurship / Startups, Product Management, Non-Profit / Social Impact", "howRemHelps": "Joining Rem on Campus is huge for me because it\u2019s where tech, finance, consulting, and building things actually meet real-world impact. As a past entrepreneur, I am familiar with the difficulties a business can experience, and how external help will motivate the owner to think out of the box. Also, it pushes me to think critically about messy problems, build products that genuinely matter, and back up decisions with real data.\n\nMore than just the hard skills, being part of Rem on Campus invites me to step out of my bubble, experience other people\u2019s realities, and understand problems from perspectives totally different from my own. Working alongside a driven team on high-impact challenges is the best way to sharpen how I lead, stay adaptable, and create solutions that actually causes impact.", "position": "Junior Consulting Strategist, Consulting Strategist", "skills": "Business Strategy, Back-end web development, Web design, Data analysis, Social media management, Finance and accounting, Python, Microsoft Office Suite", "accommodations": "No", "other": "I am excited to stop adding value just to myself and to start help other people reach their objectives.", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a10_597717e2", "timestamp": "8/26/2026 11:59:22", "name": "Dhruv Mutha", "email": "muthadhruv@ufl.edu", "phone": "9548038278", "gender": "Male", "race": "Asian or Asian American", "linkedin": "www.linkedin.com/in/dhruvmutha", "resume": "https://drive.google.com/open?id=1Gyy8axYkiBtXqUmXXSn1cL0NlmabPa_y", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Engineering (various disciplines), Finance", "minor": "", "gpa": "4", "whyRem": "I want to be a member of REM to be a part of a community that is committed to using their knowledge to help others. By joining, I'll not only develop my own skills in problem solving, business analytics, and entrepreneurship which align with my future goals to become an entrepreneur, but I'll also be able to make an impact in my community and apply what I learn. Furthermore, I want to be surrounded by likeminded people who care about others and who are driven to push me to reach higher than I ever thought I could alone.", "coreValue": "Empathy", "valueEssay": "Empathy is something I've carried with me throughout my life and has shown up everywhere, even some places where I didn't want it to. I've always tried to view the perspective of those sitting in front of me before making a decision.\n\nMy future aspirations involve working in M&A and the private equity industry, and by almost everyone I've been told that it's a cutthroat industry with little room for caring. However, from the teachings of my late-grandfather and even my personal life experiences, I've always been someone who's believed in there being a win-win strategy in any situation. I firmly believe that the strongest deals aren't at the expense of someone else, and I hope to transform the way people see M&A. Through REM I'll be able to keep this mindset with me by helping local businesses while bolstering my skills to be successful in the real world, a true win-win.", "careerInterests": "Consulting, Investment Banking / Finance, Entrepreneurship / Startups", "howRemHelps": "When working in entrepreneurship and buying and selling companies in M&A transactions, the way one creates value in the company before they sell it off is to improve the business' sales and operations or find ways for others to see more value in it than they did before. In REM, strategists are tasked with solving such problems for small businesses, learning how to find inefficiencies and improve them from the bottom up. Furthermore, by doing this in a team setting, it emulates almost exactly how the process will go in real life, and offer an opportunity to build on my communication and negotiating skills which are essential in the industry. REM would be the perfect club for me to build the hard and soft skills for the M&A industry.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Data analysis, Marketing and analytics, Finance and accounting, Ads (Facebook/Instagram), E-commerce, Brand Development", "accommodations": "", "other": "", "commitment": "Yes", "attendance": {"coffeeChats": [{"timestamp": "2026-09-01T17:12:41.490000", "spokeTo": "Christian, Rachel, Adam, Maria, Sat, Hannah, Sachin, Eli"}], "infoSession": {"timestamp": "2026-09-02T00:21:22.833000", "session": "09/01", "appliedBefore": "No"}, "meetMembers": null}}, {"id": "a11_d5e778be", "timestamp": "8/26/2026 13:36:55", "name": "Tilak Kumar", "email": "tilakk911@gmail.com", "phone": "8135467750", "gender": "Male", "race": "Indian or Indian American", "linkedin": "https://www.linkedin.com/in/tilakratnkumar/", "resume": "https://drive.google.com/open?id=1IUibfbqBLe4k_3feqMKd7B9Ft9RMogPY", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Computer Science / Information Systems, Management", "minor": "", "gpa": "4", "whyRem": "I want to join Rem on Campus because I am passionate about using structured problem-solving to help small businesses and local organizations overcome real operational challenges. In my previous consulting and analyst roles at Stellar Media Group and Advaisori, I saw how much measurable value comes from cleaning up messy processes and turning raw numbers into clear, practical strategies. However, many local businesses do not have access to expensive advisory firms or dedicated technical teams to fix their daily bottlenecks. Rem on Campus provides the exact platform I am looking for to work directly with driven students who care about creating genuine social impact while building practical consulting skills together. ", "coreValue": "Resilience", "valueEssay": "Resilience stands out to me the most because meaningful progress rarely happens without facing roadblocks, unexpected errors, and moments where you have to rethink your approach entirely. During my project management internship at Tampa Electric, I took on the challenge of building an AI automation bot to fix a six-month compliance backlog. Early in the process, I hit major technical barriers and initially believed the bot could not be hosted internally on our SharePoint systems. When my team challenged my conclusion and asked me to keep trying, I did not let frustration take over or walk away from the problem. Instead, I put my pride aside, accepted that my initial setup had mistakes, and spent hours digging back into the architecture to find the root issue. By staying resilient and testing new solutions, I successfully launched the bot internally, ultimately cutting audit prep time by 83%. This journey showed me that resilience is not only about getting through the tough moments; it's also about staying composed when things break, taking ownership of errors, and working towards a solution that will help the entire team succeed. ", "careerInterests": "Consulting", "howRemHelps": "Joining Rem on Campus will help me achieve my goal of building a career in management consulting by giving me direct, hands-on experience guiding real-world clients through complex decisions. While I have built strong technical skills in data modelling, SQL, and Power BI across corporate environments, consulting is fundamentally about understanding people, listening to client needs, and communicating recommendations simply. Working on Rem on Campus project teams will allow me to sharpen how I structure complex problems, conduct root-cause analyses, and pitch actionable solutions directly to business leaders. Additionally, collaborating with peers and receiving direct feedback on client deliverables will teach me how to manage client expectations and adapt strategies under tight deadlines. Ultimately, Rem on Campus will provide the practical advisory experience and teamwork foundation to become a better consultant. ", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Statistics and modelling, Marketing and analytics, Photography, Finance and accounting, Python", "accommodations": "", "other": "", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a12_e9b60abb", "timestamp": "8/27/2026 15:41:58", "name": "Hit Baldha", "email": "hit.baldha@ufl.edu", "phone": "3522191928", "gender": "Male", "race": "Asian or Asian American", "linkedin": "https://www.linkedin.com/in/hit-baldha", "resume": "https://drive.google.com/open?id=1jzYO1X_R7ozkxbWOfYr4v9NYBC3VDbom", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Finance", "minor": "", "gpa": "3.85", "whyRem": "I want to join Rem on Campus because I am interested in consulting and want experience working through real business problems with other motivated students. In the long run, I hope to become an entrepreneur, and I think learning how different businesses operate, what problems they face, and how they make decisions will be valuable for that goal. I have also realized through my past experiences that I enjoy work that requires me to look closely at information and understand why something is happening. As Treasurer for Infinity Council, I managed a $3,000+ budget and had to think carefully about how money was being used, while my equity analyst internship required me to research companies and form conclusions based on both financial and business information. Rem would give me the chance to apply that same mindset to a wider range of business challenges while learning from people who have different experiences and ways of thinking.", "coreValue": "Intellectual Growth", "valueEssay": "Intellectual Growth is the core value that is most important to me because I believe growth starts with understanding yourself and being willing to keep learning. To me, intellectual growth is not just about gaining more knowledge; it is also about recognizing what you are good at, where you need to improve, and being open to changing your perspective when you learn something new. I also think it connects closely with Rem\u2019s other values. The more you learn about people and different perspectives, the easier it becomes to have empathy and contribute to a community. Learning from mistakes helps build resilience, while being curious and willing to challenge your own thinking can lead to more creative ideas and innovation. I want to be in an environment where I am constantly learning from the work I do and from the people around me, and I think Rem would give me that opportunity.", "careerInterests": "Consulting, Investment Banking / Finance, Entrepreneurship / Startups", "howRemHelps": "Joining Rem on Campus would help me move toward both my short-term goal of exploring consulting and my longer-term goal of becoming an entrepreneur. Before I eventually try to build something of my own, I want to understand how successful businesses work and become better at identifying and solving the problems they face. Consulting would give me exposure to different companies and situations rather than only seeing how one business operates. I also want to strengthen skills that I have started developing through my previous experiences, especially analyzing information, paying attention to details, communicating my ideas clearly, and working with others. During my equity analyst internship, for example, I researched companies and turned my findings into investment recommendations, which showed me how much I enjoy understanding a business and making a decision based on what I find. I see Rem as a place where I can continue building those skills through actual experience while also learning what kind of problems and industries interest me most.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Statistics and modelling, Data analysis, Finance and accounting", "accommodations": "", "other": "", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a13_876e7401", "timestamp": "8/27/2026 20:30:35", "name": "Sofia Barnabei Lopez", "email": "sbarnabeilopez@ufl.edu", "phone": "4076136897", "gender": "Female", "race": "Hispanic or Latino", "linkedin": "www.linkedin.com/in/sofiabarnabeilopez", "resume": "https://drive.google.com/open?id=1XXmJxG9JmfQhC_-6EXtVRJCEYk7Gq-3-", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Finance", "minor": "", "gpa": "3.9", "whyRem": "I want to be a member of Rem on Campus because I am always striving to learn more about the different areas of finance and continuing to develop professionally. Having spent the last year strengthening my behavioral skills and networking abilities, I am determined to cultivate the technical skills that will set me up for success in my professional career. As a finance student, I truly believe the most impactful way to learn and gain a deeper understanding of the many industries within finance is by exploring opportunities outside of the classroom. I am also interested in continuing to connect with fellow students and to gaining insights directly from professionals. Overall, I believe Rem on Campus would provide a valuable learning opportunity to build on my foundational knowledge, while creating meaningful connections and growing as a young professional. ", "coreValue": "Intellectual Growth", "valueEssay": "Intellectual growth stands out to me among the core values because I believe there is always more to learn, especially as a young professional. Throughout my academic experience, I have consistently sought out different opportunities to expand my current understanding of finance. As I continue to learn technical, behavioral, and social skills within the professional realm, I recognize that true growth and dedication requires challenging myself with new experiences. This core value connects directly to my own journey, as I am specifically looking to build my knowledge of technical and on-the-job skills. Pursuing intellectual growth will push me to succeed not only in my career, but also in aspects outside of my career, allowing me to always remain open minded. ", "careerInterests": "Brand Strategy, Data Analytics / Business Intelligence, Product Management", "howRemHelps": "Joining Rem on Campus will allow me to explore and learn about different areas of industry within finance while building skills that are directly relevant to my goal of pursuing a career in corporate finance. I am fascinated with learning how different functions of a business work together to drive a companies' financial performance and overall success. To succeed in this field, I believe it is important to truly understand business strategy and how to analyze data to make informed decisions that support a company\u2019s goals. Through Rem on Campus, I will gain firsthand exposure to these areas, while strengthening my technical and analytical skills. Learning from professionals, older students, and even fellow classmates will provide me with a diverse and impactful opportunity to expand my knowledge. Overall, I believe Rem on Campus will help me in my process of becoming a business professional.", "position": "Junior Consulting Strategist", "skills": "Data analysis, Social media management, Communications and copy-writing, Python", "accommodations": "", "other": "", "commitment": "Yes", "attendance": {"coffeeChats": [{"timestamp": "2026-09-01T16:47:01.060000", "spokeTo": "Sachin, Maria, Eli, Christian, Terrence, Cristi, Hannah"}], "infoSession": {"timestamp": "2026-09-02T00:21:21.549000", "session": "09/01", "appliedBefore": "No"}, "meetMembers": null}}, {"id": "a14_f507b296", "timestamp": "8/28/2026 11:48:38", "name": "Milan Verma", "email": "milanverma@ufl.edu", "phone": "7273399128", "gender": "Male", "race": "Indian or Indian American", "linkedin": "https://www.linkedin.com/in/milan-verma/", "resume": "https://drive.google.com/open?id=1zzAc3r_8JnJpkANVt0O8YsHnt-F3_YFg", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Finance", "minor": "", "gpa": "3.91", "whyRem": "This past summer, I interned as an AI Strategy Consultant and enjoyed using problem solving and AI to help businesses save money and become more efficient. I believe Rem on Campus will help me build on these skills and allow me to pursue a career in consulting.", "coreValue": "Resilience", "valueEssay": "Resilience has always stood out to me because it represents the ability to keep moving forward, even when things go off track. Throughout my journey, especially this past summer, it is obvious that success doesn't come without setbacks. Every challenge has taught me to fight back with a stronger attitude and work ethic, allowing me to accomplish several goals. Accomplishments are made by staying disciplined and working through hardships, which is why resilience is most important to me.", "careerInterests": "Consulting, Investment Banking / Finance", "howRemHelps": "Rem on Campus will allow me to work in a hands on setting by solving real business problems and working directly with companies and clients. Rem would also allow me to strengthen my skillset, including communication, analytical thinking, and problem solving skills that are essential to the business world and consulting world alike. I am eager to connect with new and returning members, gaining exposure to different industries and increasing my confidence about pursuing a career in consulting.", "position": "Junior Consulting Strategist, Consulting Strategist", "skills": "Business Strategy, Back-end web development, Web design, Marketing and analytics, Finance and accounting, HTML, AI LLM's (Anthropic, OpenAI, etc.)", "accommodations": "No", "other": "", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a15_1cbeea83", "timestamp": "8/28/2026 14:25:09", "name": "Deandra Kurti", "email": "deandra.kurti@gmail.com", "phone": "8622171901", "gender": "Female", "race": "White or Caucasian", "linkedin": "www.linkedin.com/in/deandra-kurti-7236a23a2", "resume": "https://drive.google.com/open?id=1UufsEFx5IrSjNynZaNOpT4BqW9yXKWAy", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Biological Sciences (e.g. Biology, Chemistry and Physics)", "minor": "Mathematics", "gpa": "4.68 (Highschool), N/A (college)", "whyRem": "Being a member of Rem on Campus is an exciting opportunity to intentionally prepare myself for a consulting career while stepping into UF\u2019s campus life with purpose as a freshman. I\u2019m excited by the chance to work on real projects that mirror the collaborative and fast-paced problem-solving environment of the consulting world. I hope to gain guidance from experienced and ambitious peers who are equally committed to growing professionally and will provide me with a clearer understanding of what meaningful, client-focused work looks like through the utilization of technology. As eager as I am to learn how professionals communicate and deliver impact in Rem on Campus, I am equally motivated to contribute. I bring a leadership style that is centered on inclusivity so the ideas of my peers can flourish among one another. As a committed leader, I believe that the strongest teams are those that emerge from a simultaneously supportive and challenging team culture.", "coreValue": "Community", "valueEssay": "The way I lead and create impact is defined by the value I place in communities. The high school swimming team I joined my freshman year wouldn\u2019t recognize the team that I ended my swimming career with. It lacked more than just the funds and parent association, but a sense of camaraderie that I had just experienced on our state-championship soccer team. Despite being a newcomer, I recognized that our team\u2019s success would be rooted in strengthening our team culture. Drawing from what I\u2019d seen in soccer, I started gathering a few teammates I had just met that week and going to local Starbucks and Shake Shack, asking to partner with them to raise money for upgraded caps, uniforms, and equipment. These early efforts became contagious and grew into team-wide fundraisers coordinated with my coaches that soon funded regular team dinners that became the heart of our team\u2019s traditions and cultures for years to come. By senior year, I was elected captain, but I realized I had stepped into that role long before the title came along. Leading meant creating an environment to be proud of, one focused on accountability that transformed not only our team relationships but performance in the water. The strongest teams emerge united, a belief that I will bring along with me during my time with Rem and Company that makes me eager to contribute in a community that values growth and collective impact.", "careerInterests": "Consulting, Data Analytics / Business Intelligence, Medicine", "howRemHelps": "Joining Rem on Campus will support my goal of pursuing a career at the intersection of medicine and consulting by placing me in a team defined by diverse academic backgrounds and problem-solving approaches. Rem stands out for how intentionally it brings together students from a wide range of majors to strengthen the quality of client-centric decisions. Healthcare consulting requires understanding both the human side of care and the strategic, analytical side of business, and Rem\u2019s interdisciplinary approach mirrors that exact balance. Working alongside peers who think differently will challenge me to approach issues through multiple lenses and prepare me to use technology and data to shape meaningful solutions. Ultimately, Rem on Campus offers the environment I need to grow into a consultant who solves problems through the intersection of varied disciplines and perspectives. ", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Statistics and modelling, Mobile development, Data analysis, Marketing and analytics, Photography, Social media management, Ads (Facebook/Instagram), Brand Development", "accommodations": "", "other": "", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a16_11e9f224", "timestamp": "8/28/2026 14:33:12", "name": "Nathalie Patino", "email": "nathaliepatino456@gmail.com", "phone": "3052195797", "gender": "Female", "race": "Hispanic or Latino", "linkedin": "www.linkedin.com/in/nathaliepatino", "resume": "https://drive.google.com/open?id=1oP1zer0LVV0deEiYXKCGRenL-vieUvmE", "university": "University of Florida", "gradYear": "2028", "classYear": "Junior", "major": "Business Administration, Finance", "minor": "", "gpa": "3.71", "whyRem": "I want to be a member of Rem on Campus because I\u2019m interested in opportunities to apply what I\u2019m learning in the classroom to real business challenges while making a meaningful impact in my community.  What especially stands out to me about Rem is its focus on professional development and the opportunity to work directly with small businesses. Additionally, I especially like how students remained involved past 3 semesters and were committed to REM throughout university. I\u2019m also drawn to learning structure because it provides a clear opportunity to continuously develop my analytical, communication, and leadership skills. I would be excited to contribute my perspective, learn from my teammates, and grow to be someone who can take on greater responsibility within the organization. Most importantly, I want to be part of a team that uses its skills to help local businesses succeed and strengthen the communities around them. ", "coreValue": "Intellectual Growth", "valueEssay": "Intellectual growth is the value that stands out to me the most because while I have learned a great amount through my courses at UF, I believe that some of the most important learning happens through the people you surround yourself with. Learning from people with similar goals, different perspectives, and experience across different industries allows me to think beyond what I already know. As a student, I want to continue developing my understanding of business by learning from others and applying that knowledge to real-world situations and I believe Rem would give me the opportunity to do both.\n", "careerInterests": "Investment Banking / Finance, Wealth/Asset Management ", "howRemHelps": "Joining Rem on Campus would help me achieve my long term career goals by giving me hands-on experience solving real business problems and developing skills that I can apply to any career in finance. While again my coursework at UF has helped me build a strong foundation in business, I want to gain more experience understanding how businesses operate, identifying challenges, and using analytical thinking to develop solutions. I am particularly interested in Wealth and Asset Management because I enjoy understanding businesses, markets, and how financial decisions can create long-term value. Working with real businesses through Rem would allow me to strengthen my problem-solving, communication, and analytical skills. ", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Finance and accounting, Microsoft Office Suite", "accommodations": "N/A", "other": "N/A", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a17_7e1ea93a", "timestamp": "8/28/2026 1:08:49", "name": "Haozhen Yuan", "email": "haozhen292@gmail.com", "phone": "9548306654", "gender": "Male", "race": "Asian or Asian American", "linkedin": "https://www.linkedin.com/in/haozhen-yuan-282bb0395/", "resume": "https://drive.google.com/open?id=1Uo28BUC_9szAudh7Sgjhp2QmaH1X038p", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Management", "minor": "Business Administration", "gpa": "3.8", "whyRem": "I believe Rem on Campus will be a great way to extend my knowledge and gain insight into the professional world. It will also provide an opportunity to build a network and meet eager individuals like me.", "coreValue": "Innovation", "valueEssay": "I believe innovation is the most crucial factor for a company to grow. I believe if I can expand my knowledge on innovation, it would open gateways in my professional journey. Being a useful asset for company growth.", "careerInterests": "Consulting, Marketing, Brand Strategy, Data Analytics / Business Intelligence", "howRemHelps": "I believe Rem on Campus will help me by improving my skills to be efficient while also being effective. Which is a key to streamlining work in the careers in my interest.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Microsoft Office Suite, Brand Development", "accommodations": "N/A", "other": "N/A", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a18_f1339ec8", "timestamp": "8/28/2026 20:50:13", "name": "Justice Martin", "email": "justicemartin@ufl.edu", "phone": "9546654882", "gender": "Male", "race": "White or Caucasian", "linkedin": " https://www.linkedin.com/in/justice-martin-28b292357/", "resume": "https://drive.google.com/open?id=1MElZcDYxCmvcZ_bfRllBJKfM4a09mvQU", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Business Administration", "minor": "", "gpa": "3.73", "whyRem": "I admire how Rem empowers students to use their knowledge to strengthen their local communities. The opportunity to gain hands-on experience while helping organizations solve real problems is especially meaningful to me because it combines professional growth with service and ethical leadership, an aspect of business I believe is often overlooked. I want to join Rem because I know I can commit the time, energy, and work ethic that is necessary and deserved to improve our clients businesses and overall well being.", "coreValue": "Empathy", "valueEssay": "Empathy stands out to me because I believe many of the ethical challenges we see in business stem from a lack of understanding and consideration for others. When leaders genuinely empathize with clients, coworkers, competitors, and the communities they serve, business becomes about creating lasting value rather than simply maximizing profit. I admire that Rem recognizes empathy as a core value because I believe teaching future business leaders to lead with both compassion and integrity is rare, but essential for building stronger organizations and a better society.", "careerInterests": "Brand Strategy, Non-Profit / Social Impact, Public Policy / Government, Music management ", "howRemHelps": "I believe joining Rem on Campus is a step in the right direction toward my career goals because it provides the opportunity to develop professionally while making a meaningful impact. Rather than choosing organizations solely for how they might benefit my resume, I am drawn to opportunities where I genuinely believe in the mission, know the work creates positive change, and feel inspired to give my full effort. I know that when I care deeply about the purpose behind what I'm doing, I contribute at my highest level, and I believe Rem is the kind of organization where I can do exactly that.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Data analysis, Marketing and analytics, Design Thinking, Brand Development", "accommodations": "N/A", "other": "N/A", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a19_b60439c5", "timestamp": "8/28/2026 22:29:07", "name": "Ava Zaragoza", "email": "avazaragoza@ufl.edu", "phone": "7723026784", "gender": "Female", "race": "White or Caucasian", "linkedin": "www.linkedin.com/in/avazaragoza", "resume": "https://drive.google.com/open?id=1_nNITNW_l0NlBnkZxzVoIvncfVXrhD7f", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Finance", "minor": "", "gpa": "3.84", "whyRem": "I want to be a member of Rem on Campus because I am genuinely excited by the opportunity to surround myself with motivated people who present different perspectives and ideas. Whether they be my peers, who vary in major and background, or the business owners who I will have the pleasure of supporting, I grow best by hearing about others' experiences and applying what I learn to my own life. Beyond this, friends have shared their journey with Rem and the invaluable lessons they have gained. From creating lasting relationships with local companies to dedicating long hours on developing strategies and solutions, it is clear they have made a meaningful difference in not only their personal growth but in the growth of our community. These experiences are a testament to the value Rem provides, and I would love the opportunity to continue growing alongside it.", "coreValue": "Empathy", "valueEssay": "Of Rem's core values, empathy stands out to me because I believe it is often undervalued despite being essential to meaningful relationships and communication. Truly understanding someone's situation and putting yourself in their shoes can be difficult as we all naturally view the world through the lens of our own experiences and biases. I consider myself an empathetic person, but I also recognize that it is a skill and can always be strengthened. The opportunity to work closely with local business owners and spend real time developing solutions with them would challenge me to listen deeply and consider perspectives different from my own. I believe understanding is what drives communication to become more effective and strategies to become more impactful, making empathy a skill I hope to continue developing throughout my personal and professional journey. ", "careerInterests": "Investment Banking / Finance, Wealth Management ", "howRemHelps": "As I am pursuing a career in Wealth Management, Rem on Campus will allow me to develop the problem-solving and interpersonal skills necessary to be both efficient and successful in the industry. During my experience in the FPD Wealth Management track, I learned how valuable it is to be thrown into an ambiguous situation and learn how to work through the uncertainty to identify a solution. Rem would allow me to further develop this ability by working with businesses whose challenges may not have the clearest of answers. I am also drawn to the opportunity to develop customized solutions, as every business and, similarly, every wealth management client has special needs and circumstances. Working with different businesses would challenge me to understand their specific needs and communicate recommendations effectively. I am certain these skills will be pertinent to my career and that Rem on Campus will strengthen them. ", "position": "Junior Consulting Strategist", "skills": "Statistics and modelling, Data analysis, Marketing and analytics, Videography, Photography, Finance and accounting, Brand Development", "accommodations": "", "other": "I am truly grateful for the opportunity to apply and the students who put their time and dedication into running Rem on Campus. ", "commitment": "Yes", "attendance": {"coffeeChats": [{"timestamp": "2026-09-01T16:49:14.359000", "spokeTo": "Sachin Mario, Hannah Lockwood, Eli Koon, Aya Aldorri, Maria Lopez, Terrence Smith"}], "infoSession": {"timestamp": "2026-09-02T00:21:25.305000", "session": "09/01", "appliedBefore": "No"}, "meetMembers": null}}, {"id": "a20_71d628d4", "timestamp": "8/29/2026 14:35:45", "name": "Leila Silieti", "email": "leila.silieti@ufl.edu", "phone": "4074134207", "gender": "Female", "race": "White or Caucasian", "linkedin": "www.linkedin.com/in/leilasilieti", "resume": "https://drive.google.com/open?id=12rcvl1vgK1eTLuyAsX-xyICCqLsa-os7", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Engineering (various disciplines)", "minor": "Business Administration", "gpa": "3.67", "whyRem": "In my first year at the University of Florida, I learned that I can be successful in courses such as Physics, which is funny coming from an Engineering major, but is the truth nevertheless. I was originally intimidated by my coursework, but I have become confident in my ability to build my knowledge and understanding in the classroom. Now as I start my second year, I need to transition my focus and instead gain the skills and confidence I need to lead teams strategically and effectively. I am certain Rem on Campus is the outlet for me to gain the experience I am looking for, and I will be a passionate member from the very start of the \"Learning\" phase. As a junior strategist, I will invest my time in Rem on Campus so that I can improve my understanding of what it means to problem-solve in industry. ", "coreValue": "Resilience", "valueEssay": "For me, Resilience is the definition of my college journey. There are two aspects where resilience is most prevalent: in my finances and academics. Coming from a single parent household, I have had to pay for all of my college expenses, and thus I have been employed  by the University since before I even step foot on campus. Through my engineering curriculum I have learned how to bounce back and study harder after a 8/20 on my Physics exam. Additionally, I have been able to manage the stress when these two situations overlap. For instance, picking up extra UF tour shifts the morning of my Calculus exam. I will continue to be resilient and learn how to grow and adapt from experiences in my life, and also professionally when I am involved in industry. ", "careerInterests": "Consulting, Data Analytics / Business Intelligence, Product Management", "howRemHelps": "The strategic model Rem on Campus has for their members is why I believe Rem will guide me to achieving my career goals. From the \"Learning\" to the \"Leading\" phase, I will be able to grow professionally as I gather a strong understanding of what the demands are in a client-facing role. I will also be grateful for the opportunity to be a strategy team member developing deliverables and analyzing solutions for clients. The experiences Rem provides will build my skill base, while also allowing me to become familiar with the objectives professionals aligned with my career goals face.", "position": "Junior Consulting Strategist", "skills": "Statistics and modelling, Data analysis, Python, Microsoft Office Suite", "accommodations": "N/A", "other": "N/A", "commitment": "Yes", "attendance": {"coffeeChats": [{"timestamp": "2026-09-02T18:32:12.191000", "spokeTo": "Kyle, Reese, Eli, Aya, Aarohi, Parker"}], "infoSession": {"timestamp": "2026-09-02T00:21:28.057000", "session": "09/01", "appliedBefore": "No"}, "meetMembers": null}}, {"id": "a21_f7ec1864", "timestamp": "8/29/2026 16:47:55", "name": "Aryan Patel", "email": "adp0419@gmail.com", "phone": "9045320201", "gender": "Male", "race": "Asian or Asian American", "linkedin": "www.linkedin.com/in/adp0419", "resume": "https://drive.google.com/open?id=1HDqvJQoDTvY_AJbaff_Pu9q_N5HV9Im4", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Computer Science / Information Systems", "minor": "Business Administration", "gpa": "3.93", "whyRem": "I understand that I am still new to the industry of consulting, but that is exactly why I want to be a part of Rem on Campus. As a Computer Science major with a Business Administration minor, what draws me to consulting is the same thing that draws me into tech: solving problems. This instance is just in the service of business decisions.\n\nRecently, I completed an externship for Amazon, where I analyzed employee reviews on Glassdoor to i
