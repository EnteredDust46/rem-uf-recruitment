dentify drivers of attrition in their Fulfillment Center warehouses. This was the first time I saw the intersection of tech and business in practice, turning raw qualitative data into numerical metrics a business could act on. I want Rem to help me build on that, and to learn how real client problems get scoped, how findings actually reach a business as strategy, and how to communicate technical work to people who are not engineers.\n\nBeyond the skills, I am also looking for a community I can learn from and eventually contribute to. I may not walk in knowing as much as other applicants, but I will show up ready to help wherever I am needed and to grow into the industry alongside Rem.", "coreValue": "Innovation", "valueEssay": "Only 1.4% of recorded history includes the era of computational technology. Yet in that sliver of time, we have already revolutionized the way we live, from putting supercomputers in everyone's pockets to landing rovers on Mars. Our ancestors going from smashing rocks together to our generation reaching for other planets is one of the most inspirational things ever. That indomitable human spirit, and the constant drive for innovation, is what draws me to software engineering.\n\nI was fascinated by technology from a young age; I built my first computer when I was 13, and from that point I knew I wanted a tech career. It was not an easy decision. Most of my family is in the medical field; my father is a pharmacist, and my sister is in medical school, and as much as I respect that path, I could not picture myself in scrubs. So I continued on my own path, researching the CS industry, building projects, and figuring things out mostly on my own.\n\nOnce I started college, I still felt that same pull to keep building and catching up, joining clubs, becoming a research assistant, and creating more projects, even when it felt like everyone else was ahead. That drive for excellence and innovation kept me pushing rather than settling for where I already am. It is why I want to be a part of Rem, to be around people who share the same hunger to innovate, and to keep growing alongside them.", "careerInterests": "Consulting, Tech, Data Analytics / Business Intelligence, Product Management", "howRemHelps": "I am extremely interested in the intersection of technical skill and business strategy. Right now, most of my experience comes from the technical side: building projects, doing research, and working with data. What I am missing is the exposure to how that technical work translates into business strategy and real business impact. And that is the gap Rem can help me close.\n\nBy connecting with members who are on the same path as me, I can learn firsthand how problems get scoped, analyzed, and delivered as recommendations a business can actually act on. Product management especially lives in that overlap between technical execution and business strategy, and Rem gives me a way to explore it with mentorship.\n\nWhat I am looking for is guidance, real experience, and a community that is willing to help me turn my technical background into a business-facing skill set.", "position": "Junior Consulting Strategist", "skills": "User Experience (UX), Back-end web development, Web design, Data analysis, HTML, Python, Machine Learning", "accommodations": "n/a", "other": "n/a", "commitment": "Yes", "attendance": {"coffeeChats": [{"timestamp": "2026-09-02T18:16:01.435000", "spokeTo": "Maya, Arohi, Eli, Isiah, Reese, Alexandra, Aya"}], "infoSession": {"timestamp": "2026-09-02T00:21:30.377000", "session": "09/01", "appliedBefore": "No"}, "meetMembers": null}}, {"id": "a22_6634e109", "timestamp": "8/30/2026 17:28:09", "name": "Diya Tharun", "email": "d.tharun@ufl.edu", "phone": "8132916167", "gender": "Female", "race": "Indian or Indian American", "linkedin": "www.linkedin.com/in/diya-tharun", "resume": "https://drive.google.com/open?id=12T0gknvqc6pAIkQhwmNC2ufApZ-lF4VR", "university": "University of Florida", "gradYear": "2028", "classYear": "Junior", "major": "Management", "minor": "Other", "gpa": "3.59", "whyRem": "I want to join REM on Campus because it provides a great opportunity to gain hands-on experience solving real-world business challenges. I am excited to work alongside motivated students, collaborate with clients, and contribute to building an organization where members can develop their consulting skills through meaningful projects.  \n\nThrough my previous consulting experience with Enactus Active Consultancy, I developed a strong interest in consulting while working with a charter flight agency in Costa Rica. My team conducted research, evaluated operational challenges, and developed recommendations tailored to the client\u2019s needs. This experience strengthened my skills in research, problem-solving, and teamwork, while also showing me how much I enjoy working through ambiguous problems and developing practical solutions. However, because we were not involved in the implementation process, I did not get to see the long-term impact of our recommendations. \n\nAt REM on Campus, I hope to build on this experience by developing stronger skills in data analysis, strategic thinking, and client communication while gaining a deeper understanding of the consulting process. I am excited by the opportunity to see our efforts come to life in our community.", "coreValue": "Empathy", "valueEssay": "Empathy stands out to me because it is a value I try to practice in my everyday life. I make an effort to consider different perspectives, ensure others feel included, and create space for people to share their ideas and experiences. I also recognize that everyone is navigating circumstances that may not be visible to others, making it especially important to approach people with patience and understanding rather than assumptions. \n\nThis value has also shaped how I approach teamwork and professional experiences. I believe that understanding how others think and what they value leads to stronger collaboration and better outcomes. In consulting, empathy is particularly important because solving a client\u2019s problem requires more than identifying what is wrong. It requires listening carefully, understanding the context behind the challenge, and considering the perspectives of everyone affected by a recommendation. I hope to bring this mindset to REM by being someone who actively listens, values different perspectives, and helps create an environment where everyone feels comfortable contributing.", "careerInterests": "Consulting, Entrepreneurship / Startups, Product Management, Non-Profit / Social Impact", "howRemHelps": "My primary career interest is consulting, and I believe joining REM on Campus would provide me with the practical experience necessary to explore and pursue this career path. I am particularly interested in gaining firsthand experience working with companies to understand their challenges, analyze information, and develop thoughtful, actionable recommendations. While my academic and extracurricular experiences have helped me build a foundation in analytical and critical thinking, I want to strengthen these skills by applying them to real-world business problems. \n\nThrough REM on Campus, I hope to develop a better understanding of the consulting process from beginning to end, including communicating with clients, conducting research, and presenting recommendations. I also believe that working with different companies and industries would expose me to a variety of business challenges and help me determine the areas of consulting that I find most interesting. Equally important, I am excited to build connections with the driven peers within REM. I believe being surrounded by people who are motivated to grow and challenge themselves would push me to improve while allowing me to learn from their diverse perspectives and experiences. Ultimately, I hope to build both the skills and relationships that will help me pursue a successful career in consulting. ", "position": "Junior Consulting Strategist", "skills": "Data analysis, Marketing and analytics, Photography, Social media management, Communications and copy-writing, Microsoft Office Suite", "accommodations": "None", "other": "Super excited for this opportunity!!", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a23_2ed15690", "timestamp": "8/30/2026 9:39:21", "name": "Logan Bartelt", "email": "l.bartelt@ufl.edu", "phone": "239-316-0831", "gender": "Male", "race": "White or Caucasian", "linkedin": "www.linkedin.com/in/logan-bartelt-69276a405", "resume": "https://drive.google.com/open?id=1TW3Jn4SH0CO3TvIkadgvwfdqZ2dcLaNy", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Finance", "minor": "", "gpa": "N/A (First Semester Freshman)", "whyRem": "\tI want to be a member of Rem on Campus because of the ability to learn hard and soft skills that are necessary not only for a future career in finance, but also that help serve the local community here in Gainesville over my next four years here. Alongside learning, surrounding myself with people that are highly ambitious and passionate about the world of finance and applying that knowledge to better the community around them. As a child of parents who have owned small local food businesses, I have seen first hand the amount of work it takes to run a successful small business and the impact that an organization, such as Rem on Campus, can have on such businesses\u2013 helping them to become more efficient and expand to serve as many people as best as they can. Consulting with these small local businesses creates a chain reaction where helping them become more efficient in turn helps the customers have a better experience, bettering the overall community. In four years I would like to look back at the organizations or clubs I have been a part of and the work that I have done and be able to see that I left a positive impact on the lives of people in the community surrounding the place I am lucky to call home for these four years\u2013 and I believe Rem on Campus provides one of, if not the, best opportunity to do that whilst learning the skills I need to do so now and in the future.", "coreValue": "Community", "valueEssay": "\tTo me, community is the most important value because of the impact it has on you and the impact you can have on others. Out of the core values, I believe the root of improvement for all of them stems from community. When you surround yourself with people who are resilient, empathetic, innovative, and want to grow intellectually, you yourself are bound to naturally pick up on those characteristics. In turn, as you improve, the people in the community around you will pick up on your characteristics and begin improving themselves\u2013 and the cycle repeats. In that sense I was referencing the community of Rem on Campus, however, this also applies to the overarching community. Through consulting with businesses in the area, Rem on Campus at UF is able to improve the community in Gainesville by providing businesses with the tools to better serve the people of the community, allowing people more opportunity to grow. \n\tThroughout my life I have tried my best to surround myself with people that will push me to become the best that I can. Whether it was transferring schools, staying connected with friends, or building a relationship, each person in the community around me played a role in building me into who I am today\u2013 with specific impacts that I can point to. For example, the decision in my senior year to switch from football to cross country was, in part, led by the friends who I had made through running sharing goals and characteristics that I had and aspired to reach. It is for this reason that I value community so highly.", "careerInterests": "Consulting, Investment Banking / Finance", "howRemHelps": "\tJoining Rem on Campus would prepare me for careers in consulting and finance as a whole by providing the opportunity to learn the skills necessary for a career in the field and gain experience applying those skills to make a positive impact on the community around me through the \u201cLearning - Applying - Leading\u201d model that Rem on Campus embodies. In addition to gaining the technical skills, soft skills, and experience in the area, being part of this community allows me to meet people who are also driven to learn and serve those around them, allowing us to help and push each other to continue working to achieve the career we desire. By joining Rem on Campus I would be exposed directly to the type of work consulting organizations do, giving me hands-on experience in the field I am looking at a career for\u2013 a field that also has applications to the broader finance industry, such as investment banking, where the skills I learn here will apply no matter which specific sector I enter.", "position": "Junior Consulting Strategist", "skills": "Social media management, Microsoft Office Suite, Currently majoring in Finance.", "accommodations": "No.", "other": "", "commitment": "Yes", "attendance": {"coffeeChats": [{"timestamp": "2026-09-01T16:40:38.003000", "spokeTo": "Sachin Mario, Kyle Morris, Christian Fox, Maria Juliana Lopez"}, {"timestamp": "2026-09-02T18:31:44.096000", "spokeTo": "Aarohi Bali, Mackenzie Kurtz, Parker Whelan"}, {"timestamp": "2026-09-03T16:38:13.742000", "spokeTo": "Colton Swain, Terrence Smith, Brody Power, Pablo Navas, Aya Aldorri"}], "infoSession": null, "meetMembers": null}}, {"id": "a24_07931044", "timestamp": "8/31/2026 15:30:13", "name": "Michelle Lin", "email": "michellelin0715@gmail.com", "phone": "(917) 226-5819", "gender": "Female", "race": "Asian or Asian American", "linkedin": "www.linkedin.com/in/michellelin-", "resume": "https://drive.google.com/open?id=1Spm4dI6idqUkCmwnASJ6mSmjLYkHd4nB", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Business Administration", "minor": "", "gpa": "3.72", "whyRem": "As an individual who constantly strives to challenge herself and become better at what she does, I believe Rem on Campus can help me become the version of myself I have always hoped to become, both personally and professionally.\n\nRem on Campus is filled with ambitious and motivated individuals who want the best for their clients. They are people who strive to provide thoughtful solutions not only because they are proud of their work, but also because they understand the responsibility of someone else\u2019s trust in them as they help better the company. These traits of individuals in Rem truly demonstrates the culture within the organization and what I appreciate. Each individual possesses an indescribable drive and accountability that is admirable. I want to surround myself with individuals like these so that I can be influenced to constantly push myself, stay curious, and be better in general.\n\nProfessionally, Rem on Campus has many individuals that are pursuing the same career I hope to pursue, consulting. As I learn more about the industry, I would be surrounded by individuals who can teach me more about consulting, navigate me through common challenges, and provide insight to their experience. They are able to help develop me professionally, and mentor me as I look for internships and full-time jobs within consulting.  \n\nI want to be a member of Rem on Campus because the organization will teach me all that I need to know about consulting, put that into practice, and become well-versed in the industry. Most of all, this newfound knowledge would allow me to ultimately discover the \u201cwhy\u201d behind my passion for this career. ", "coreValue": "Intellectual Growth", "valueEssay": "When people ask me what my favorite color is, I naturally say yellow and explain that it\u2019s because of Winnie the Pooh. In return, I receive confused looks but my explanation is simple. Yes, I like yellow because it is Winnie the Pooh\u2019s color, but more importantly it is his qualities and character that I associate with this color. Winnie the Pooh is my spirit animal. He is kind, loving, and finds joy in the simplest things, but the trait I love the most about him is his natural curiosity. His curious mind is fueled simply by the world around him and I see a resemblance within myself. My close family and friends know me and my endless \u201cwhys,\u201d sometimes to annoy them (on purpose, of course) but most of the time because I have genuine questions on the way things work or why something is the way it is.\n\nRather than sticking to the hobbies I already know, I have the tendency to always try something new because I live off the thrill of learning new things and stepping outside my comfort zone. This curious mindset has led me to take up golf, learn to do my own nails, fold jars full of paper stars, solve the rubix cube, play pickleball, and pursue many other things. To me, the feeling of starting something with zero idea of how to do it and eventually becoming familiar with it is unmatched. It gives me such a sense of accomplishment that I continue to feed off of this curiosity. Intellectual growth is more than just simply gaining more knowledge. I think that intellectual growth is a process where one continues to challenge themselves to be brave, learn more, and continue this endless pursuit. \n\nI also carry this mindset with me throughout my professional journey. Not even a semester ago, I discovered the career of consulting. The specifics of this path was extremely new to me, like case interviews. However, I found this unfamiliarity to be exciting rather than scary. I seek to grow knowledge within this field, so that one day I could look at a case and easily identify my buckets or work with a client and know what I am doing. With this goal in mind, I will continue to pursue knowledge within the field, starting right now with reading \u201cHacking the Case Interview.\u201d\n\nIntellectual growth also means expanding my views and perspectives to include the entire world rather than limiting it to the culture I live in. Professionally, I hope to be able to travel the world and be an international consultant one day. I have always had an extreme fondness over traveling and discovering other cultures as well as their way of life. With this, I hope to continue to learn about these differences in culture so that I can better approach topics and different things rather holistically than from the lens of what is familiar to me.\n\nUltimately, intellectual growth is a value to me because I have shaped my life around it. Without intellectual growth, I would not be the person I am today, confident and eager to learn about the unknown. It shapes my bravery, confidence, and knowledge which I believe will take me to my goals and beyond that. Like Winnie the Pooh, I will continue to navigate my life to discover the endless new things to learn about the world around me. ", "careerInterests": "Consulting", "howRemHelps": "Growing up, I was always most fond of projects in school, especially the ones where I had to build something like a 3D model of an animal cell. While some people complained that these projects were tedious, I found effectiveness within them. I have never been a pen-to-paper, taking notes during the lecture because that wasn\u2019t how I learned best. I could really understand concepts through hands-on projects, where I saw the application of my knowledge to something tangible.\n\nThe same idea is what piques my interest with Rem on Campus. As someone interested in pursuing consulting, I know that this field relies a lot on solving problems, working through cases, and developing real-world solutions. It is easy to just read \u201cHacking the Case interview\u201d and understand how the job works on paper, but it is another thing to actually apply those concepts in a real-world context. Rem provides the tangibility that I seek as I advance towards my career goals. With Rem, I would have the opportunity to work as a strategist on a team to develop solutions for real companies around me and see how they apply the solutions into their businesses. This provides a tangible impact and experience that would allow me to feel more prepared and confident going into the consulting career field. \n\nIn addition to providing me with a look into what consulting would be like in the real world, Rem on Campus would also help me strengthen various valuable skills in critical thinking, communication, collaboration, and problem-solving. With this knowledge, Rem on Campus helps build a foundation for me as I work to achieve my career goals. ", "position": "Junior Consulting Strategist, Consulting Strategist", "skills": "Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Business Strategy, Web design, Marketing and analytics, Social media management, Microsoft Office Suite", "accommodations": "", "other": "", "commitment": "Yes", "attendance": {"coffeeChats": [{"timestamp": "2026-09-02T16:18:49.143000", "spokeTo": "Brody, Anabella, Max"}], "infoSession": {"timestamp": "2026-09-02T00:21:16.416000", "session": "09/01", "appliedBefore": "No"}, "meetMembers": null}}, {"id": "a25_423e768a", "timestamp": "8/8/2026 19:45:48", "name": "Naomy Torres Contreras", "email": "naomytorrescontr@ufl.edu", "phone": "7866309914", "gender": "Female", "race": "Hispanic or Latino", "linkedin": "www.linkedin.com/in/naomy-torres-contreras", "resume": "https://drive.google.com/open?id=1AuR6F-tqMjCn4Bun5b6JT9M7sfstZ1bf", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Industrial and Systems Engineering", "minor": "", "gpa": "3.2", "whyRem": "I want to join Rem on Campus because it would give me the opportunity to take my growing interest in consulting and develop it through real experience. I am particularly drawn to Rem\u2019s \u201cLearning, Applying, Leading\u201d model because it reflects how I want to grow as a future consultant.\u00a0\n\nI also really value that Rem works directly with local small businesses. The opportunity to work with a real client, understand their challenges, conduct research, and develop recommendations that could actually improve their business is something I find exciting. My experience at Torre Construction & Development showed me that I enjoy looking beyond a problem on the surface and trying to understand why it exists and how a process can be improved. I want to take that mindset into a setting where I can work with other students, learn from different perspectives, and see how consulting works from beginning to end.\n\nUltimately, I see Rem as an opportunity to push myself outside of the classroom while developing skills that I know will be important in my career. I want to become a stronger problem solver and communicator, but more importantly, I want to learn how to approach problems from a client's perspective. Consulting is not just about having the right answer; it is about understanding the people and business behind the problem and working with them to create a solution that is actually useful and adds value. Rem\u2019s focus on learning, community impact, and developing students into leaders strongly aligns with the kind of experience I am looking for and the kind of consultant I hope to become.", "coreValue": "Empathy", "valueEssay": "Empathy stands out to me because I believe it is a fundamental part of being a good consultant. It allows you to put yourself in a client\u2019s shoes and understand a problem from their perspective rather than looking at it as an outsider. Before trying to recommend a solution, I think it is important to understand the people experiencing the problem, what their day to day looks like, and why a process may work the way it does.\n\nI learned the importance of this early in my experience at Torre Construction & Development. I started working there in high school, and if I wanted to understand the business beyond my own responsibilities, I quickly realized I had to learn to see things from everyone else\u2019s perspective. Even something as simple as a manager not having time to explain something to me taught me to be more understanding. It was not necessarily that they did not want to help me, they had their own responsibilities and priorities. Instead of taking that personally, I learned to make the most of the time they could give me and find ways to learn independently.\n\nThat mindset became even more important when I transitioned into operations this summer. To understand and solve operational problems, I had to put myself in the shoes of the people actually experiencing them. This meant understanding the challenges field workers faced with technology, while also looking at the inefficiencies project managers experienced from a completely different perspective. Seeing these differences helped me understand that the same problem can look very different depending on who is experiencing it.\n\nThis is why empathy is the Rem value I connect with most. As I continue exploring consulting, I want to develop the ability to not only identify problems, but to understand them from the perspective of the people affected by them. I believe that is what allows a consultant to move beyond simply giving advice and instead develop solutions that are practical, relevant, and genuinely valuable to the client.", "careerInterests": "Consulting, Data Analytics / Business Intelligence", "howRemHelps": "I believe joining Rem on Campus would help me bridge the gap between my academic background and my growing interest in consulting. As an Industrial and Systems Engineering student, I have developed an interest in using data and analytical thinking to understand how systems work and how they can be improved. My experience at Torre Construction & Development strengthened that interest by giving me the opportunity to work directly with operational and business problems. I realized that I really enjoy looking at a problem, understanding the different factors contributing to it, and thinking about how a process can be made more effective.\n\nRem would allow me to build on that experience in a more structured consulting environment. Working directly with clients would help me develop skills that are difficult to learn in a classroom, especially communicating with clients, asking the right questions, and turning analysis into recommendations that are actually useful. I also think working alongside other students would expose me to different ways of approaching problems and challenge me to become a better teammate and problem solver.\n\nMost importantly, I see Rem as an opportunity to explore consulting while developing the analytical, communication, and leadership skills I will need to pursue it after college. I am still early in my career, so I want to put myself in environments where I can learn by doing, make mistakes, and continue improving. I believe Rem\u2019s hands-on approach would give me that opportunity while allowing me to create meaningful value for the businesses I work with.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Data analysis, Microsoft Office Suite", "accommodations": "", "other": "One thing I would want Rem to know is that I genuinely value putting myself in unfamiliar environments. I believe some of the most meaningful growth comes from being willing to step outside of what is comfortable and learn how to navigate something new. A lot of my growth so far has come from taking on responsibilities before I felt completely prepared for them. From starting at Torre in high school and gradually taking on different roles within the company to becoming more involved in its operations, I have learned how to adapt quickly and contribute in different environments.\n\nThat is the same mindset I would bring to Rem. I am excited by the opportunity to be surrounded by people with different experiences and perspectives and to challenge myself in an environment that is new to me. I am someone who actively seeks opportunities that push me to learn and adapt because I believe that is how I continue to grow. I would be grateful for the opportunity to bring my own perspective to Rem while learning from the people around me and contributing to its community.", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a26_2beb1129", "timestamp": "9/1/2026 0:00:52", "name": "Sergio Acosta", "email": "sergio.acosta@ufl.edu", "phone": "4698231465", "gender": "Male", "race": "Hispanic or Latino", "linkedin": "www.linkedin.com/in/sergiojacosta", "resume": "https://drive.google.com/open?id=1lpPm3a2pY3VyhPFUqr-YRiOKNIZSkpZc", "university": "University of Florida", "gradYear": "2028", "classYear": "Junior", "major": "Business Administration", "minor": "Computer Science / Information Systems, Finance", "gpa": "3.9", "whyRem": "I want hands-on consulting experience with real clients while I'm still in school. Adapting fast and figuring things out with limited support is something I've had to do my whole life; moving across three countries taught me that early. I've since applied that same instinct to project-based work: an operational strategy pitch deck during my Amazon externship, cross-cultural business projects in coursework. But I want to build that into a repeatable skill set on a team, with real accountability, not just one-off assignments. Rem gives me that structure, plus a community of people who take the work seriously.", "coreValue": "Resilience", "valueEssay": "Resilience isn't abstract for me, it's been the constant across three countries. I moved from Venezuela to Mexico at 12, back to Venezuela at 14, then to the U.S. at 15, landing in Dallas right before starting high school. Nobody was there to help me learn English; there was no ESL support waiting for me. I had to teach myself on my own time, outside of class, while still keeping up with schoolwork in a language I didn't speak yet. Making friends and adjusting to an entirely different culture happened at the same time, with no real cushion. Since I was a kid, my father always told me to be resilient and stay constant with the things I want to achieve, and that stuck with me. It's what got me through those moves. I've never given up on something until I found the solution, whatever it took. Resilience isn't a mindset you talk about; it's showing up every day and doing the unglamorous work until you catch up. That's the same standard I hold myself to now, whether it's a difficult class or a client project that isn't going the way I planned.", "careerInterests": "Consulting, Brand Strategy, Data Analytics / Business Intelligence, Non-Profit / Social Impact", "howRemHelps": "Rem sits right at the intersection of these three. Consulting engagements will sharpen my client-facing problem-solving; the analytical rigor consulting projects demand will strengthen my data analytics skills; and working across different client industries will give me exposure to brand and marketing strategy I don't get from coursework alone. I want to leave Rem with a portfolio of real client work I can point to, not just a title.", "position": "Junior Consulting Strategist, Consulting Strategist, Team Lead", "skills": "User Experience (UX), Business Strategy, Web design, Data analysis, Marketing and analytics, Python, Machine Learning", "accommodations": "No", "other": "I'm genuinely excited about the opportunity to contribute to Rem, and I show up consistently for the things I commit to.", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a27_da2475d2", "timestamp": "9/1/2026 11:44:18", "name": "Matias Costantini", "email": "matiascostantini@ufl.edu", "phone": "7865997331", "gender": "Male", "race": "Hispanic or Latino", "linkedin": "www.linkedin.com/in/matias-costantini-b5a32742b", "resume": "https://drive.google.com/open?id=1ThAMRdGMlz7a2K5R9wGPp4jKoUBoDyHz", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Business Administration, Finance", "minor": "", "gpa": "3.9", "whyRem": "Joining Rem on Campus would be a great opportunity for me since I am seeking an experience that could be gained in the course of client facing tasks that cannot be obtained through coursework only. Being a Finance major from the University of Florida, I want to put a lot of time to studying how to analyze certain problems and how to come to my conclusions. However, I need to get some practical experience in doing that.\n\nThe reason why being a Junior Strategist suits me better is that it will allow me to gain certain experience in building up a solid base by learning skills such as design thinking, learning how a strategy team works and, how it prepares its result based on solid data. Rather than jumping right into leading something without having enough practice and experience in that area, I would prefer to see how a senior does that and get used to the way it is done.\n\nWhat is more important for me is the possibility of impacting lives of small businesses and nonprofits in my local community.", "coreValue": "Intellectual Growth", "valueEssay": "Intellectual development stood out to me right away, as it is the one value I have always depended on throughout the activities I have chosen, even without having a term for it yet. A couple of summers ago, for example, I taught myself how stocks and markets work, simply out of intellectual curiosity. This led me to be President of my school's Finance Club, facilitating discussion groups on the fundamentals of investing and group projects analyzing real estate transactions as another way of testing my knowledge by trying to teach others about it.\n\nI have done so in the past as well. I started and analyzed an independent survey study on people's saving and spending behavior simply because I wanted to understand the reasons behind people's everyday spending actions, and I have spent years tutoring children in a variety of subjects such as mathematics or reading comprehension.\n\nThat is exactly what Rem on Campus offers me, an opportunity to continue doing exactly the same, but in a different setting and a different context. Intellectual growth is what I beleive in and I think Rem on Campus can offer me that.", "careerInterests": "Real Estate", "howRemHelps": "I feel joining Rem on Campus will help create the very foundation necessary for a career in real estate, even though the clients not being property investors themselves. Career in the real estate industry thrives and survives based on the ability to interpret the local market, understanding how it moves, conducting a financial analysis based on this information, and making a proper recommendation to a client making an important decision. The skills mentioned above are basically what one acquires being involved in the training program of Rem on Campus, the only difference is that in such a scenario we are not talking about a property but a business or nonprofit organization.\n\nI have already experienced the attraction towards real estate careers by becoming the President of Finance Club of my school and running several projects dealing with the process of conducting transactions in the real estate sphere from the perspectives of both the buyer and seller. However, all of this was only a theory. Joining Rem on Campus will provide me with the opportunity to learn about the practical side of the story. As Junior Strategist, I will be able to observe the ways professionals approach vague issues and how to conduct research.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Marketing and analytics, Social media management, Finance and accounting", "accommodations": "None", "other": "", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a28_0f590130", "timestamp": "9/1/2026 12:46:28", "name": "Cindy Liao", "email": "cindyliao@ufl.edu", "phone": "2566982869", "gender": "Female", "race": "Asian or Asian American", "linkedin": "https://www.linkedin.com/in/cindy-liao-0173i372361/", "resume": "https://drive.google.com/open?id=10fEP2je74LbQ17uslNDN6UuwTClA_M0nKWN1w2K5F2U", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Accounting", "minor": "", "gpa": "3.36", "whyRem": "I want to join Rem on Campus because I hope to pursue consulting in the future, and it would provide an excellent opportunity to gain experience in the field throughout the year. Having just switched from being pre-med the entirety of my freshman year, I have found it hard to find a community of people that have the same goals as me career wise. Additionally, as Rem is more focused than general business clubs, it will provide a group of people with similar consulting aspirations who I will be able to learn from.", "coreValue": "Community", "valueEssay": "Community is huge for me because I firmly believe that everyone is where they are in life because of the people surrounding them. Everyone no matter how smooth their path to whatever they are pursuing will experience setbacks. When it comes to preserving past those setbacks, it is the group of people who support, uplift, and encourage you that allow you to get through it. I really believe that no one can get through life alone, and whether it is people there for you to celebrate your wins, and carry you through losses, I think having a firm community by your side at all times is the most important part of not only having a successful career, but a happy life.\n", "careerInterests": "Consulting, Product Management", "howRemHelps": "Rem on Campus will give me real-world consulting experience, coming from a place with little experience. Especially applying for junior consulting strategist, I will be given enough support to fully learn about the field and skills necessary to succeed, but also given enough autonomy where I will be able to use trial and error to learn. Additionally, the networking opportunities and people I will meet in Rem will be invaluable when it comes to making meaningful connections in the field.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Photography, Social media management, Finance and accounting", "accommodations": "n/a", "other": "n/a", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a29_cad692c6", "timestamp": "9/1/2026 13:41:35", "name": "Diego Lopez Franco", "email": "lopezfrancodiego@ufl.edu", "phone": "3054972336", "gender": "Male", "race": "Hispanic or Latino", "linkedin": "https://www.linkedin.com/in/diego-lopez-franco/", "resume": "https://drive.google.com/open?id=1Rrawtt9x-T13lOHaffy2oxsPgiv-cSvY", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Finance", "minor": "", "gpa": "N/A", "whyRem": "I want to be a member of Rem on Campus because I love that its consulting work is connected to the Gainesville community. I was most attracted to the fact that it supported 38 local small businesses and nonprofits through pro bono consulting in the past year. Rem gives members responsibility over a real client team and a clear path from junior strategist to team lead; this is the best way that I see to learn real consulting concepts. The chance to learn it and then apply it to real life matches my way of learning: building the basics, then putting them into practice until perfection is achieved, and eventually helping others do the same. \n\nI want to learn how to break down complex problems, turn research into action, and communicate it effectively to a client while helping a business grow. I would bring curiosity, ambition, a hunger for learning, and the willingness to contribute wherever the team needs me.", "coreValue": "Empathy", "valueEssay": "Empathy stands out to me because I know that to get the best solution, you need to understand the person you are trying to help. While tutoring underprivileged students at Gibson Charter School, I saw kids learn at different paces and come from very different backgrounds. The same solution didn't work for all of them; I had to listen, understand their needs, and learn to adapt.\n\nThis experience led me to write a children's finance book designed around concepts like saving, budgeting, and investing, and made it very approachable for young students. It taught me that empathy is not only about being a good person, but that it makes you a better problem solver. In consulting, when working with small-business owners who worked hard on what they created, understanding the person who has the problem is the most important thing before coming up with a solution.", "careerInterests": "Consulting, Investment Banking / Finance", "howRemHelps": "Rem would help me build skills I could use in both consulting and finance. Working alongside a small business would help me understand how a company operates, identify what causes problems, analyze qualitative and quantitative information, and turn it into actions the client can use. This skill translates well to consulting, but it's just as valuable in finance, where understanding a business goes far beyond numbers.\n\nThe experience that I would gain communicating recommendations to clients and showing my reasoning is what I'm most interested in. The progression from Junior Strategist to Strategist and, one day, Team Lead would give me greater responsibility and the chance to lead a team. Whatever career I end up pursuing, I would like to leave college understanding businesses, communicating under stress, and contributing effectively on a team.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Marketing and analytics, Social media management, Finance and accounting, Communications and copy-writing, Microsoft Office Suite, Brand Development", "accommodations": "N/A", "other": "As a first-year, I'm very excited to learn with Rem over my four years. I hope to take on greater responsibility as I develop and, one day, be in a position to help new members. I bring an international perspective, having lived in Spain, Brazil, and the U.S., and I am fluent in Spanish, Portuguese, and English. These experiences have made me comfortable adapting to new and different people, perspectives, cultures, and communication styles. I believe all of this would be valuable when working with clients and a team.", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a30_9b69c06c", "timestamp": "9/1/2026 13:47:04", "name": "Maximo Federici", "email": "maximofederici@ufl.edu", "phone": "2026973336", "gender": "Male", "race": "Hispanic or Latino", "linkedin": "www.linkedin.com/in/maximo-federici-3b9048430", "resume": "https://drive.google.com/open?id=1mLIs-SU_g3xV0CqkN-kAL9PdJAlVPmyZ", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Finance", "minor": "", "gpa": "3.907", "whyRem": "During my last years of high school, I learned the fundamentals of finance from inside of real firms. I interned at three different financial firms in which I analyzed markets, researched about global economic trends, and built risk-adjusted portfolios. Those experiences opened the financial world and taught me how capital operates at the top of the market. But the accomplishment that I'm most proud of is the HandsOnFoundation, a nonprofit I founded to connect volunteer tutors with underprivileged students in Argentina.\n\nThis contrast is exactly why I want to be a member of Rem On Campus. I have experienced how large and complex financial institutions can be, but I haven't yet had the chance to apply those learned skills into the small businesses and nonprofits that Rem On helps. Some local companies and entrepreneurs can't afford a consulting firm, but they need it just as much as other large organizations do. I'm also interested in Rem's model of connecting students with real clients under the guidance of industry professionals. It is exactly the kind of hands-on experience that I sought out throughout my high school years. \n\nLastly, I'm drawn towards the \"Learning, Applying, Leading\" structure that Rem holds. Specifically, because I know through experience that the leadership part cannot go missing. I have built teams, coordinate with students and volunteers and held accountability for consequences since I was a freshman in high school. I want to bring those same skill sets into the Rem On team and continue building the goal that has always mattered to me: helping those in need.", "coreValue": "Empathy", "valueEssay": "The value that stands out to me the most is empathy. It has shaped almost everything that I do outside the classroom. When I founded the HandsOnFoundation, I saw many students in Argentina that lacked access to the academic support that most people today take for granted. These students were bright and talented, but were missing the opportunities and resources that could allow them to reach their full potential. Instead of simply accepting that fact, I decided to do something about it. I started by connecting students with volunteer tutors from my area, tutors who had the knowledge needed to help them. Eventually I turned HandsOnFoundation into a real non-profit organization with the goal of making education more accessible to students regardless of the circumstances. \n\nThis experience has taught me everything about empathy. The students we worked with were just as capable and motivated as anyone else. Recognizing that taught me to look beyond someone's circumstances and understand what they actually need to succeed. \n\nNow, my plan is to bring the skills that I learned to Rem. Through empathy and HandsOnFoundation, I understood how to listen to people, and figure out what it is that they need. I learned how to turn an idea into something that can create meaningful change. At Rem, I hope to bring that same mindset into the small businesses we would work with. I want to recognize the challenges that they are facing, and understand them beyond the numbers. But most important, I will provide the same sense of responsibility I felt towards the students we helped in HandsOnFoundation.", "careerInterests": "Consulting, Investment Banking / Finance, Data Analytics / Business Intelligence, Entrepreneurship / Startups, Non-Profit / Social Impact", "howRemHelps": "Finance, consulting, and entrepreneurship are my principal career interests. Rem On Campus is the perfect opportunity for me to explore these areas, while at the same time, gaining actual experience working with businesses. \n\nBy working with small startups and nonprofits, I will be able to expand the range of skills that I have learned. I am eager to learn more about how businesses operate, the challenges that they face, and how a smart consulting team can support and improve them. Also, working with clients will allow me to improve my communication skills and present ideas more clearly and confidently. \n\nI am still in my freshman year of college, so joining Rem On would be a huge opportunity for me. I will have the opportunity to learn from other students and professionals while also figuring out where my career interests take me in life.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Statistics and modelling, Data analysis, Finance and accounting, Communications and copy-writing, Microsoft Office Suite, Brand Development", "accommodations": "No", "other": "I am hoping to come into Rem On Campus with a lot to learn, but also with a strong mindset to work. I would like you to know that I am someone that takes commitments seriously. I understand that when I am surrounded by people who challenge and expect from me, I learn the most. Whether through my internships, my nonprofit, or other projects, I now know that following through on what I commit is just as important as having good ideas. I am ready to learn and contribute in any possible way. ", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a31_208a93f3", "timestamp": "9/1/2026 19:01:24", "name": "Carolina Garmendia ", "email": "cgarmendia@ufl.edu", "phone": "3054969290", "gender": "Female", "race": "Hispanic or Latino", "linkedin": "https://www.linkedin.com/in/carolina-garmendia-77851038b?utm_source=share_via&utm_content=profile&utm_medium=member_ios", "resume": "https://drive.google.com/open?id=18aZTqP-JUUnZ1oB1iQJUULlEB1G9NwaH", "university": "University of Florida", "gradYear": "2028", "classYear": "Junior", "major": "Business Administration", "minor": "Finance", "gpa": "3.84", "whyRem": "To become more involved in campus and in the business world. To learn and grow in the business world, connecting with fellow peers with similar interests ", "coreValue": "Community", "valueEssay": "Growing up in very big, close communities, I have learned how important communities are in your day to day lives. People to help you grow, learn, and have other to lean on", "careerInterests": "Investment Banking / Finance, Marketing", "howRemHelps": "I believe joining Rem will help me learn more about business and help me learn more about how I see my day to day life in the future, in the workforce.", "position": "Junior Consulting Strategist, Consulting Strategist, Team Lead", "skills": "Business Strategy, Photography, Finance and accounting, Communications and copy-writing", "accommodations": "", "other": "", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a32_f220f26f", "timestamp": "9/1/2026 19:03:20", "name": "Isabella Horowitz", "email": "ihorowitz@ufl.edu", "phone": "9178318983", "gender": "Female", "race": "White or Caucasian", "linkedin": "www.linkedin.com/in/isabellahorowitz", "resume": "https://drive.google.com/open?id=13jeyor_jK6jRT0gV2K71baDsysuLfqMw", "university": "University of Florida", "gradYear": "2028", "classYear": "Junior", "major": "Business Administration", "minor": "Economics", "gpa": "3.84", "whyRem": "I want to be a member of Rem on Campus to have the opportunity to give back to small businesses and boost my career by learning skills to become a consultant and applying my past experiences. Joining this organization is important to my professional development because I want to learn more about what is involved in consulting to explore it as a career path. Additionally, my career goals align with Rem on Campus's values. I want to utilize creativity to help people and have the chance to work on a team to improve peoples' lives. Rem on Campus would be one of the best ways to boost my career and develop myself in my personal and professional life.", "coreValue": "Intellectual Growth", "valueEssay": "Intellectual growth stands out to me because college is a time to explore what I want for a career and to take every opportunity to grow my skillset. As someone who aspires to be able to solve business problems as well as everyday problems for all sorts of people, having technical training in college is one of the most valuable ways I can do this. Intellectual growth is a continuous process, but it allows you to expand your horizons to be able to think on a larger scale about the world, which can then be converted into broader problem solving skills. As an aspiring consultant with an interest in nonprofits, developing how I view and approach business problems is a key skill that I will need for success. Intellectual growth comes from challenging oneself, which is something I value that is also important for my career aspirations.", "careerInterests": "Consulting, Entrepreneurship / Startups, Non-Profit / Social Impact, Undecided / Exploring Options", "howRemHelps": "Joining Rem on Campus will boost my career because it focuses on developing consulting skills. While consulting is only one of my potential career paths, learning skills and having training as a consultant, regardless of which path I end up taking, will give me more opportunities throughout college and after graduation. Entrepreneurship and startups can both run into many problems as new companies and/or business concepts, and Rem on Campus would teach me the skills to approach those struggles head-on. It would also train me in relevant areas if I pursue a career in the non-profit/social impact category, because they also face several unique categories of issues that may have more legal restrictions. Rem on Campus would prepare me to face any problem in my own life and in whatever career path I pursue.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Statistics and modelling, Data analysis, Marketing and analytics, Photography, Social media management, Design Thinking, Ads (Facebook/Instagram), Brand Development", "accommodations": "", "other": "", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a33_093e80d3", "timestamp": "9/1/2026 20:25:12", "name": "Sanaya Rai", "email": "Sanaya.rai@gmail.com", "phone": "8473452413", "gender": "Female", "race": "Asian or Asian American", "linkedin": "N/A", "resume": "https://drive.google.com/open?id=109ClAqRWbbTvaNRGGh6DujuaHkF70UlQ", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Finance", "minor": "", "gpa": "N/A", "whyRem": "I want to be a member of REM on Campus because, coming to UF as an out-of-state student, I want to get involved and meet as many people as I can. Through word of mouth, I have heard many great things about REM and the opportunities it provides. Throughout high school, I was heavily involved in business centered clubs. However, none of them were tailored to consulting, which is an area I have been interested in pursuing. The opportunity to give back to local communities while developing my consulting and soft skills is something I believe I could gain a lot from. Additionally, I am excited to connect with the students already involved in REM. As I navigate my path through college, having the opportunity to talk with older students who have been in my shoes and learn from their experiences would be extremely valuable. Overall, I see REM as an opportunity to become more involved at UF as I build meaningful relationships and explore my continuing interest in consulting.", "coreValue": "Resilience", "valueEssay": "Resilience is the value that stands out to me. Throughout high school, I can think back to various times where I felt overwhelmed with stress, my course load, or just mentally drained.  Throughout these times, I kept reminding myself to push forward and get back on my feet. In college, I know I will face similar challenges and I plan to overcome them by being resilient and continuing forward. Being around like minded people in REM will allow me to have a community to rely on and I hope to be someone that people can rely on as well. ", "careerInterests": "Consulting, Investment Banking / Finance, Product Management, Non-Profit / Social Impact", "howRemHelps": "I believe that joining REM on Campus will help me achieve my career goals as it will expose me to different pathways in the business world. While practicing my skills with consulting cases, I can identify my strengths and how I can build upon them, while also recognizing areas that I can improve on. Understanding these strengths and weaknesses will then help narrow down the numerous career fields that are available, allowing me to determine where my skills best fit. Similarly, being able to discuss with other members in REM their career journey and what they have learned will also be a huge helping hand in my journey. As someone who still has a lot to explore within the business world, I believe REM on Campus will provide me with the right guidance and opportunities.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Marketing and analytics, Social media management, Brand Development", "accommodations": "No.", "other": "Im super excited for this opportunity!", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a34_b20efe3d", "timestamp": "9/1/2026 20:35:16", "name": "Chloe Leskovac", "email": "chloeleskovac@ufl.edu", "phone": "3305658426", "gender": "Female", "race": "White or Caucasian", "linkedin": "https://www.linkedin.com/in/chloe-leskovac-a12397433/", "resume": "https://drive.google.com/open?id=19XdclzuNuulnN0awt13_nTrWCVPRouRj", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Finance", "minor": "", "gpa": "3.82", "whyRem": "I want to be part of REM on Campus because I'm interested in consulting and want to gain experience solving real world business problems. I'm especially interested in finance and wealth management. I think consulting would help me develop the analytical communication, and problem solving skills that are important in those fields. I also want to surround myself with motivated students who challenge me to think differently and take advantage of opportunities outside the classroom. I believe REM would give me the opportunity to learn from others, build meaningful connections, and get a better understanding of what a career in consulting can look like.", "coreValue": "Resilience", "valueEssay": "The core value of resilience stands out to me because I've learned that growth usually comes from moments when things don't go exactly planned. Starting college has pushed me outside of my comfort zone, especially as I figure out what I want my future in finance to look like. I've had to become comfortable not having everything figured out but rather pushing myself to pursue opportunities. I think resilience is especially important in consulting because you have to able to adapt, think critically, and stay confident. That is a quality I want to continue developing through REM and carry with me into my career.", "careerInterests": "Consulting, Investment Banking / Finance, Marketing, Tech, Data Analytics / Business Intelligence, Product Management", "howRemHelps": "I believe joining REM on Campus will l help me explore my interests in consulting while building skills that will be valuable in any business career. I want to gain hands on experience working through real problems, learn how to approach cases from different perspectives, and become a stronger communicator. I also think being surrounded by motivated students and professionals will push me outside of my comfort zone and help me better understand which career path is right for me. Ultimately, I see REM as a way to gain experience, build my network, and grow both personally and professionally.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Statistics and modelling, Mobile development, Marketing and analytics, Photography, Communications and copy-writing, Design Thinking, Ads (Facebook/Instagram)", "accommodations": "No", "other": "I am currently in the FPD program. ", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a35_5b7764a0", "timestamp": "9/2/2026 11:09:41", "name": "Zachary Meyerowitz", "email": "zachary@meyerowitzfamily.com", "phone": "4705503339", "gender": "Male", "race": "White or Caucasian", "linkedin": "www.linkedin.com/in/zacharymeyerowitz", "resume": "https://drive.google.com/open?id=1ClxNmOQshfLucPKFFHSoGwTzCEADG0Qf", "university": "University of Florida", "gradYear": "2028", "classYear": "Junior", "major": "Business Administration, International Relations / Global Studies", "minor": "", "gpa": "3.83", "whyRem": "I'm eager to join Rem on Campus for the chance to grow both professionally and intellectually in a challenging, supportive environment. The organization offers hands-on consulting experience in a field I'm genuinely passionate about pursuing, and I look forward to working alongside driven, hard-working peers who will expand my network and push me to raise my professional and personal standards. What excites me most, though, is the opportunity to partner directly with real-world companies to deliver practical solutions with tangible impact.", "coreValue": "Community", "valueEssay": "Hands down, the most important value for me is community. I come from a place where community is everything, everybody knows everybody, and everyone is there for one another. Whenever something bad happens, there are always people willing to lend a helping hand. My community has always pushed me to do better and work harder, and I want to be part of an organization that does the same. That's a big part of why I'm eager to join Rem: I'll gain not only a community of hard-working, driven peers to work alongside on projects, but also a nationwide network of past and present Rem members whose experience I can continue to learn from.", "careerInterests": "Consulting, Undecided / Exploring Options", "howRemHelps": "I believe joining Rem on Campus will help me achieve my career goals because it will expose me to real-world problems and cases while also providing a strong network of people who can be great advocates and supporters. The tasks and projects in Rem will be instrumental to my personal growth, helping me build proficiency in skills and tactics that are essential when dealing with real-world cases, directly preparing me for the consulting cases I may see once I'm in my career. On top of that, Rem offers a network of hard-working, successful peers and mentors who will all be valuable connections to have in the future.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Search Engine Optimization (SEO), Finance and accounting", "accommodations": "NA", "other": "I am really excited about the potential opportunity to be part of Rem. I've heard so many great things from friends and peers about the organization, and I'm eager to be a part of it.", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a36_aa32f18e", "timestamp": "9/2/2026 12:37:41", "name": "Avaneesh Yada ", "email": "avanyada2193@gmail.com", "phone": "9047750388", "gender": "Male", "race": "Asian or Asian American", "linkedin": "| linkedin.com/in/avaneesh-yada-388738431", "resume": "https://drive.google.com/open?id=1MkYYnt2yae_G1mlFnNY73LAYnHfor7Sj", "university": "University of Florida", "gradYear": "2029", "classYear": "Sophomore", "major": "Finance", "minor": "", "gpa": "3.4", "whyRem": "I want to be a member because I can get real world experience with consulting and I'm intrigued to help small businesses and creating real strategies with your community to combat problems. ", "coreValue": "Community", "valueEssay": "This value stands out to me because I watched one of my dad's close friends struggle to keep his Indian restuarant afloat. I saw how he had thin margins, how long it took to keep the place running, and controversies with coworkers and staff. That's when I realize that just knowledge can only take you so far. I'm majoring in finance because I want to be one of those people to fix those type of problems. REM is a perfect opportunity  to where I can be part of a community to help people. ", "careerInterests": "Consulting, Marketing", "howRemHelps": "Consulting and marketing both involve solving real problems, and Rem on Campus gives an opportunity to do that instead of just learning about it in my finance classes. I think about my dad's friend and his restaurant a once in a while, and just wonder how different it could've been if someone helped fix his problems. Rem on campus puts me on real small businesses and would let me get real world experience. ", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Statistics and modelling, Marketing and analytics, Photography", "accommodations": "No accommodations", "other": "N/A", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a37_67d3d9fb", "timestamp": "9/2/2026 12:45:08", "name": "Gabriella Angulo", "email": "gabriella.angulo@ufl.edu", "phone": "8139971580", "gender": "Female", "race": "Hispanic or Latino", "linkedin": "www.linkedin.com/in/gabriella-angulo", "resume": "https://drive.google.com/open?id=1lbVSKheoqHjJgGBULqs_RNreDrVGwD4i", "university": "University of Florida", "gradYear": "2028", "classYear": "Junior", "major": "Engineering (various disciplines)", "minor": "", "gpa": "3.96", "whyRem": "I want to join Rem on Campus because I am looking for real, hands-on experience and hard skills that go far beyond what a textbook can teach. Classroom learning provides a solid foundation, but nothing replaces the growth that comes from solving fast-paced, real-world business challenges. What excites me most is the opportunity to work directly with local business owners and clients. I want to grow my learning in how to diagnose operational bottlenecks, analyze data under realistic constraints, and deliver strategies that genuinely impact a business\u2019s bottom line. Presenting recommendations to real stakeholders will force me to think on my feet and refine my professional communication. Ultimately, I want to bridge the gap between academic theory and real execution. Rem on Campus offers the ideal environment to develop those practical consulting and supply chain skills while delivering meaningful results alongside a high-performing team.", "coreValue": "Resilience", "valueEssay": "Resilience stands out most to me because true growth happens when things do not go according to plan. Early in my academic journey, facing steep challenges in aerospace engineering left me feeling defeated. Instead of letting that setback define me, I chose to pivot toward industrial engineering, turning a difficult moment into a clear path forward that aligned better with my strengths and interests. I put this value into practice again during my time in a case competition last spring. When our project group was suddenly reduced from five members to two, my partner and I were left with a choice: complain or step up. We embraced the extra workload, restructured our approach, and ultimately earned second place. That experience showed me that resilience is more than just enduring a tough situation; it is about taking ownership, staying adaptable, and delivering results despite unexpected obstacles. Joining Rem on Campus would mean bringing this mindset to every project. Whether navigating complex client challenges in supply chain operations or adapting under tight deadlines, I know that maintaining resilience enables me to learn continuously and support my team through any setback.", "careerInterests": "Consulting, Engineering", "howRemHelps": "Joining Rem on Campus feels like the ideal bridge between what I am learning in the classroom and where I ultimately want to take my career. My goal is to work in operations, supply chain, or engineering consulting, and the practical experience Rem on Campus provides is exactly what I need to prepare for those fast-paced environments. For supply chain and operations, having the opportunity to work on real client cases means I can move beyond textbook theories. I want to practice optimizing complex workflows, identifying bottlenecks, and managing logistics challenges as they unfold in real time. On the consulting side, the hands-on project work will help me hone critical skills like breaking down ambiguous technical problems, turning raw data into strategic insights, and presenting polished solutions clearly to stakeholders. Beyond the technical preparation, what excites me most is the collaborative environment. Working alongside a dedicated, high-achieving team will sharpen my cross-functional communication and leadership style. By fully committing to the projects and learning from both my peers and mentors, I know I can build the confidence, adaptability, and sharp business literacy required to hit the ground running in either field after graduation.", "position": "Junior Consulting Strategist", "skills": "Graphic design (Adobe Creative Cloud, Sketch, ProCreate, etc), Web design, Data analysis, Social media management, Python, R, Design Thinking, Microsoft Office Suite", "accommodations": "n/a", "other": "n/a", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a38_7989d3e7", "timestamp": "9/2/2026 14:33:12", "name": "Jake Dalessio", "email": "jakedalessio@ufl.edu", "phone": "914-255-7430", "gender": "Male", "race": "White or Caucasian", "linkedin": "https://www.linkedin.com/in/jake-dalessio-044148231/", "resume": "", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Finance", "minor": "", "gpa": "4", "whyRem": "In high school, I served my community for over 500 hours whereas the graduation requirement was only 100 hours. I find so much enjoyment and satisfaction from giving to others, helping others, and seeing others prosper. When I heard about Rem and how it helps REAL companies and REAL people, I was ecstatic. The fact that I can have a real impact on someone and help them with their business is so beautiful. My goal is to selflessly serve whichever individual and company I can to help them to the best of my ability. Their business is my business, and I'd love to establish a lasting professional relationship with my client. Eventually if I can climb to Team Lead and even further, I would very much be interested in that so I can help and mentor and give back to more aspiring Rem members.", "coreValue": "Community", "valueEssay": "As mentioned earlier, in high school I served my community for over 500 hours whereas the graduation requirement was merely 100 hours. The community value stands out because I understand how our consulting services at Rem genuinely help our clients. I believe this connects to my professional journey because as I pursue Wealth Management, client relationships are incredibly important and the idea of servitude and doing whatever possible for your client, I want to nurture these skills early to enhance them.  ", "careerInterests": "Consulting, Wealth Management", "howRemHelps": "Wealth management is heavily reliant on client relationships, trust, and servitude. I know how with Rem we get to nurture a client relationship with trust and through service. It's genuinely perfect practice and execution for my career goal of building trusting, lasting, powerful relationships with ultra-high net worth clients.", "position": "Junior Consulting Strategist, Consulting Strategist, Team Lead", "skills": "Business Strategy, Data analysis, Marketing and analytics, Social media management, Finance and accounting, Microsoft Office Suite, Public Speaking", "accommodations": "N/A", "other": "In the question \"Please check the position(s) you are applying for\", I selected all of them, but I meant that in a way where I'd pursue them throughout my time in Rem. I cannot immediately jump to Team Lead. My goal is to start as a junior strategist or strategist and eventually move my way up through strong service and passion!", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a39_5c3e4981", "timestamp": "9/2/2026 15:44:56", "name": "Reinaldo Vilchez ", "email": "vilchezreinaldo@ufl.edu", "phone": "3054641779", "gender": "Male", "race": "Hispanic or Latino", "linkedin": "https://www.linkedin.com/in/reinaldo-vilchez-46ba81348/", "resume": "https://drive.google.com/open?id=1tKNV3EmKfTJNWPiB_HplxcaWWpe8S-wl", "university": "University of Florida", "gradYear": "2027", "classYear": "Senior", "major": "Business Administration", "minor": "Business Administration, Other", "gpa": "3.58", "whyRem": "I want to join Rem on Campus to work with real clients and see how small businesses actually grow. That's exactly what I need for my goal of one day starting my own machinery sales company since selling well means understanding what a business really needs. I already have some hands-on business experience from my externship with Beats by Dre and my procurement role at Gourmand but I want more real client-facing work and Rem is the right place to get it.", "coreValue": "Empathy", "valueEssay": "Empathy stands out to me the most. I've always believed that listening to people carefully before jumping in with my own opinion is the best way to actually understand someone. This started with my family and friends, where I learned that people open up more and trust you more when they feel truly heard. I try to carry that same mindset into my professional life, since understanding what a client or a business really needs before offering a solution makes all the difference. That's part of why I'm drawn to Rem on Campus, since consulting for small businesses starts with listening to their challenges before jumping into strategy.", "careerInterests": "Consulting, Marketing, Brand Strategy, Tech, Data Analytics / Business Intelligence, Entrepreneurship / Startups", "howRemHelps": "Joining Rem on Campus will give me the chance to practice talking with real clients, which is something I can't fully get from a classroom. Every conversation with a small business is a chance to practice selling and negotiating, since I'll need to understand their needs, explain my ideas clearly, and get them on board with a solution. That's exactly the kind of practice I need for my goal of one day starting my own machinery sales company. Building those skills now, in a real setting, will help me walk into that future with more confidence and experience.", "position": "Junior Consulting Strategist", "skills": "Business Strategy, Data analysis, Marketing and analytics, Videography, Photography, Python, Brand Development", "accommodations": "No ", "other": "When can I start? ", "commitment": "Yes", "attendance": {"coffeeChats": [], "infoSession": null, "meetMembers": null}}, {"id": "a40_8dd93674", "timestamp": "9/2/2026 15:54:50", "name": "Alex Gerstenfeld", "email": "agerstenfeld@ufl.edu", "phone": "7329155279", "gender": "Male", "race": "White or Caucasian", "linkedin": "https://www.linkedin.com/in/alex-gerstenfeld-456b7b423/", "resume": "https://drive.google.com/open?id=1qdRSYFPcFrFU8VkPWflChD6ItdjOvLja", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Computer Science / Information Systems", "minor": "", "gpa": "N/A (First semester freshman)", "whyRem": "Based on my childhood choice of video games, I knew consulting was a career that fit me perfectly. I always loved factory games, where players have to find bottlenecks in cluttered systems and redesign them. To me, consulting sounded like a similar task. REM is an organization where I can gain experience in the field while pushing local businesses to succeed. Having the ability to help change a small business owner\u2019s life is something I can only do in REM. REM also opens up countless opportunities by connecting me with potential future employers and mentors. Additionally, I hope to gain a new network of not just colleagues, but close friends. In the process, I\u2019m looking to build my teamwork, communication, and problem-solving skills through my work so that I can become the best analyst I can be. I want to continue to learn about consulting and improve on my skills, while helping to push as many businesses as I can to grow and prosper, and REM is where I can do both.", "coreValue": "Intellectual Growth", "valueEssay": "Out of these five values, intellectual growth is the most important to me. Without intellectual growth, society would stop persistently trying to learn more, and as a result, technology, businesses, and communities would stagnate and innovation would cease. This value resonates with me, as I have always had an urge to learn and expand my horizons. In High School, I was part of a specialized program that taught students multiple coding languages. I decided to join this program because I wanted to expand my skillset and knowledge. I had to work for countless hours to even develop a working proficiency in some languages. As a result, I developed a myriad of new skills that I could use to benefit those around me. For example, I coded a fully-functional booking system for my friend\u2019s small business. I\u2019m looking to pursue a similar course of action. My goal is to continue to intellectually grow and learn about consulting, analytics, and decision-making, so that I\u2019m able to help other businesses grow and succeed.", "careerInterests": "Consulting, Tech, Data Analytics / Business Intelligence, Product Management", "howRemHelps": "\nTo break into any of the industries I selected, applicants need knowledge, connections, and skill. REM can help me achieve all three. First, REM on Campus is a massive organization spanning across many college campuses, and is a part of the global giant REM and Company. REM\u2019s size leads to members working at hundreds of prestigious firms. These members are invaluable connections to huge companies I would be fortunate to work for after I graduate. In REM, I\u2019d also connect with older students that are on a path similar to mine that could possibly help me secure an internship or job later. Second, the knowledge I\u2019d gain about the consulting, analytics, and tech industries from doing hands-on work with businesses would be unmatched. I\u2019d begin to understand which implementations can solve certain problems and which can\u2019t. I\u2019d be prepared for any future case interviews I would have to partake in. Third, I\u2019d develop some of the most valuable skills employers look for: teamwork and communication. By working with a team on every project, I\u2019d learn to communicate in a professional setting with those of different backgrounds and with different opinions. This would prepare me to work in a team on a larger scale in a potential future endeavor. Overall, REM would be one of my most powerful assets towards my future career goals.", "position": "Junior Consulting Strategist", "skills": "Back-end web development, Web design, HTML", "accommodations": "N/A", "other": "N/A", "commitment": "Yes", "attendance": {"coffeeChats": [{"timestamp": "2026-09-03T18:20:55.225000", "spokeTo": "Christian, Terrence, Lexi, Isabella, Kyle"}], "infoSession": null, "meetMembers": null}}, {"id": "a41_84f69be7", "timestamp": "9/2/2026 16:00:59", "name": "Vance Byrd", "email": "vancebyrd@ufl.edu", "phone": "2394009036", "gender": "Male", "race": "White or Caucasian", "linkedin": "https://www.linkedin.com/in/vance-byrd-897b693ba/", "resume": "https://drive.google.com/open?id=1ywyNSUC3ntEFQ3VYDhlR_ZdDV5RqHTgm", "university": "University of Florida", "gradYear": "2030", "classYear": "Freshman", "major": "Business Administration", "minor": "", "gpa": "I am a freshman. My high school GPA was 3.98 unweighted.", "whyRem": "I would love to be a member of Rem on Campus because I believe it would be an incredible opportunity to expand my knowledge and develop skills across different areas of the business world. I am especially interested in gaining experience with networking, teamwork, problem-solving, and personal growth while working with others to help real clients.\n\nMy interest in consulting comes from experiences I have already had. Through Model United Nations, I spent years tackling complex global problems, considering different perspectives, working with a team, and presenting solutions. I loved the challenge of taking a complicated issue and figuring out how to approach it, and I was fortunate enough to receive multiple award
